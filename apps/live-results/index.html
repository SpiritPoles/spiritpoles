<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VaultDesk</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0f0f14; --surface:#1a1a24; --card:#22222e; --border:#2e2e3d;
      --accent:#4f7cff; --success:#22c55e; --danger:#ef4444; --warning:#f59e0b;
      --text:#f0f0f0; --muted:#8888aa;
    }
    html,body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; min-height:100vh; overflow-x:hidden; }
    input,select,button { font-family:inherit; }
    input,textarea { color:var(--text); background:var(--card); }
    input::placeholder,textarea::placeholder { color:var(--muted); }
    select option { background:#22222e; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes glow  { 0%,100%{box-shadow:0 0 0 0 rgba(79,124,255,.5)} 60%{box-shadow:0 0 0 8px rgba(79,124,255,0)} }
    .live-pulse { animation:pulse 1.4s ease-in-out infinite; }
    .cur-glow   { animation:glow 2.2s ease-in-out infinite; }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:var(--surface); }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
    .drag-over { outline:2px solid #4f7cff !important; background:rgba(79,124,255,.07) !important; border-radius:10px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback, useEffect, useRef } = React;

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const RULEBOOKS = [
  { key:'WA',   label:'World Athletics / USATF' },
  { key:'NCAA', label:'NCAA' },
  { key:'NFHS', label:'NFHS (High School)' },
];

const C = {
  bg:'#0f0f14', surface:'#1a1a24', card:'#22222e', border:'#2e2e3d',
  accent:'#4f7cff', success:'#22c55e', danger:'#ef4444', warning:'#f59e0b',
  text:'#f0f0f0', muted:'#8888aa',
  clearedBg:'#0a2b0a', missedBg:'#2b0a0a', passedBg:'#0a1a2b',
};

// IOC 3-letter to ISO 2-letter for flagcdn.com
const IOC_ISO = {
  USA:'us',GBR:'gb',AUS:'au',CAN:'ca',GER:'de',FRA:'fr',ITA:'it',ESP:'es',
  JPN:'jp',CHN:'cn',BRA:'br',KEN:'ke',ETH:'et',UKR:'ua',POL:'pl',SWE:'se',
  NOR:'no',FIN:'fi',DEN:'dk',NED:'nl',BEL:'be',SUI:'ch',AUT:'at',POR:'pt',
  GRE:'gr',CZE:'cz',SVK:'sk',HUN:'hu',ROU:'ro',BUL:'bg',SRB:'rs',CRO:'hr',
  SLO:'si',EST:'ee',LAT:'lv',LTU:'lt',RUS:'ru',BLR:'by',ARM:'am',GEO:'ge',
  AZE:'az',KAZ:'kz',UZB:'uz',TUR:'tr',ISR:'il',RSA:'za',NGR:'ng',CMR:'cm',
  GHA:'gh',SEN:'sn',MAR:'ma',ALG:'dz',EGY:'eg',MEX:'mx',ARG:'ar',
  COL:'co',CUB:'cu',JAM:'jm',TTO:'tt',BAH:'bs',CHI:'cl',PER:'pe',VEN:'ve',
  ECU:'ec',URU:'uy',IRL:'ie',NZL:'nz',IND:'in',PAK:'pk',MAS:'my',THA:'th',
  PHI:'ph',INA:'id',KOR:'kr',HKG:'hk',QAT:'qa',UAE:'ae',KSA:'sa',JOR:'jo',
  IRN:'ir',TPE:'tw',SGP:'sg',SRI:'lk',NAM:'na',UGA:'ug',TAN:'tz',ZIM:'zw',
  BOT:'bw',ZAM:'zm',ANG:'ao',MOZ:'mz',MLI:'ml',SLE:'sl',GUI:'gn',BEN:'bj',
  TOG:'tg',BUR:'bf',CHA:'td',SOM:'so',ERI:'er',RWA:'rw',BDI:'bi',MWI:'mw',
  LSO:'ls',SWZ:'sz',LBA:'ly',TUN:'tn',MRT:'mr',SUD:'sd',DJI:'dj',
};

const getFlagUrl = code => {
  if (!code) return null;
  const u = code.toUpperCase().trim();
  const iso = IOC_ISO[u] || (u.length === 2 ? u.toLowerCase() : null);
  return iso ? `https://flagcdn.com/24x18/${iso}.png` : null;
};

// ─── UTILITIES ────────────────────────────────────────────────────────────────
const mToFtIn = m => {
  const ti = m * 39.3701, ft = Math.floor(ti / 12), raw = ti % 12;
  const q = Math.round(raw * 4) / 4, whole = Math.floor(q), frac = q - whole;
  const fs = frac===0?'':frac===0.25?'¼':frac===0.5?'½':'¾';
  return `${ft}'${whole}${fs}"`;
};
const fmtH = (cm, metric) => {
  if (!cm && cm !== 0) return '';
  return metric ? `${(cm/100).toFixed(2)}m` : mToFtIn(cm/100);
};

const hasCleared   = m => Array.isArray(m) && m.includes('O');
const hasPassed    = m => Array.isArray(m) && (m.includes('P') || m.includes('-'));
const hasRetired   = m => Array.isArray(m) && m.includes('R');
const countMisses  = m => Array.isArray(m) ? m.filter(x => x === 'X').length : 0;
const isEliminated = m => countMisses(m) >= 3;

const isDone = (marks, status) =>
  status === 'dns' || status === 'nh' || status === 'retired' ||
  hasCleared(marks) || hasPassed(marks) || isEliminated(marks) || hasRetired(marks);

const showMarks = m => (!m || !m.length) ? '' : m.join('');

const highestClearedIdx = (a, n) => {
  for (let i = n-1; i >= 0; i--) if (hasCleared(a.attempts[i])) return i;
  return -1;
};
const totalMisses = (a, n) => {
  let t = 0;
  for (let i = 0; i < n; i++) t += countMisses(a.attempts[i] || []);
  return t;
};

const calcPlacements = (athletes, heights) => {
  const n = heights.length;
  const dns   = athletes.filter(a => a.status === 'dns');
  const nh    = athletes.filter(a => a.status !== 'dns' && highestClearedIdx(a, n) < 0);
  const withH = athletes.filter(a => highestClearedIdx(a, n) >= 0);
  const sorted = [...withH].sort((a, b) => {
    const ai = highestClearedIdx(a,n), bi = highestClearedIdx(b,n);
    if (bi !== ai) return bi - ai;
    const am = countMisses(a.attempts[ai]||[]), bm = countMisses(b.attempts[bi]||[]);
    if (am !== bm) return am - bm;
    return totalMisses(a,n) - totalMisses(b,n);
  });
  const result = [];
  let place = 1;
  for (let i = 0; i < sorted.length; i++) {
    let p = place;
    if (i > 0) {
      const pr = sorted[i-1], cr = sorted[i];
      const pi = highestClearedIdx(pr,n), ci = highestClearedIdx(cr,n);
      if (pi===ci &&
          countMisses(pr.attempts[pi]||[])===countMisses(cr.attempts[ci]||[]) &&
          totalMisses(pr,n)===totalMisses(cr,n))
        p = result[i-1].placement;
    }
    result.push({ ...sorted[i], placement: p });
    if (result[i].placement === place) place = i + 2;
  }
  for (let i = 0; i < result.length; i++)
    result[i].tied = result.some((r,j) => j !== i && r.placement === result[i].placement);
  return [
    ...result,
    ...nh.map(a  => ({ ...a, placement:null, tied:false })),
    ...dns.map(a => ({ ...a, placement:null, tied:false })),
  ];
};

const nextVaulter = (athletes, hIdx, fromIdx) => {
  const n = athletes.length;
  for (let s = 1; s <= n; s++) {
    const idx = (fromIdx + s) % n;
    if (!isDone(athletes[idx].attempts[hIdx]||[], athletes[idx].status)) return idx;
  }
  return -1;
};
const firstEligible = (athletes, hIdx) => {
  for (let i = 0; i < athletes.length; i++)
    if (!isDone(athletes[i].attempts[hIdx]||[], athletes[i].status)) return i;
  return -1;
};

const genHeights = (startM, incStr) => {
  const startCm = Math.round(parseFloat(startM) * 100);
  if (isNaN(startCm)) return [];
  const rules = [];
  for (const part of incStr.split(',').map(s => s.trim())) {
    const m = part.match(/(\d+(?:\.\d+)?)\s*cm(?:\s*[x×]\s*(\d+))?/i);
    if (m) rules.push({ cm:parseFloat(m[1]), count:m[2]?parseInt(m[2]):999 });
  }
  const hs = [startCm]; let cur = startCm;
  for (const {cm,count} of rules) {
    for (let i = 0; i < count; i++) {
      cur += cm; hs.push(cur);
      if (hs.length > 45) return hs;
    }
  }
  return hs;
};
const parseManual = str =>
  str.split(/[,\s]+/).map(s => parseFloat(s)).filter(n => !isNaN(n)).map(m => Math.round(m*100));

// ─── STYLES ───────────────────────────────────────────────────────────────────
const inp = { background:C.card, border:`1px solid ${C.border}`, borderRadius:8, color:C.text, padding:'10px 12px', fontSize:14, width:'100%', outline:'none' };
const sec = { marginBottom:18, padding:16, background:C.surface, borderRadius:14, border:`1px solid ${C.border}` };
const secTitle = { fontWeight:700, fontSize:11, color:C.muted, textTransform:'uppercase', letterSpacing:1.2, marginBottom:12 };
const btn = (bg, pad='10px 18px', fs=14) => ({
  background:bg, color:'#fff', border:'none', borderRadius:10,
  padding:pad, fontSize:fs, fontWeight:700, cursor:'pointer',
  WebkitTapHighlightColor:'transparent', letterSpacing:0.2,
});

// ─── STORAGE ──────────────────────────────────────────────────────────────────
const LS_KEY = 'vaultdesk_v11';
const loadSaved = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)||'[]'); } catch { return []; } };
const persistComp = comp => {
  try {
    const all = loadSaved().filter(c => c.id !== comp.id);
    localStorage.setItem(LS_KEY, JSON.stringify([comp,...all].slice(0,20)));
  } catch {}
};
const eraseComp = id => {
  try { localStorage.setItem(LS_KEY, JSON.stringify(loadSaved().filter(c => c.id !== id))); } catch {}
};

// ─── ATHLETE FACTORY ──────────────────────────────────────────────────────────
let _aidCtr = 0;
const mkAthlete = order => ({
  id: `a${++_aidCtr}_${Date.now().toString(36)}`,
  order, firstName:'', lastName:'', country:'', affiliation:'',
  pb:'', sb:'', logoUrl:'',
  attempts: Array.from({length:50}, () => []),
  status:'competing',
});

// ─── FLAG / LOGO CELL ─────────────────────────────────────────────────────────
function FlagCell({ athlete, size=26 }) {
  const [err, setErr] = useState(false);
  const flagUrl = !err ? getFlagUrl(athlete.country) : null;
  const src = athlete.logoUrl || flagUrl;
  if (src) return (
    <img src={src} alt={athlete.country||''} onError={() => setErr(true)}
      style={{ width:size, height:Math.round(size*0.75), borderRadius:3, objectFit:'cover', flexShrink:0, background:C.border, display:'block' }} />
  );
  const lbl = athlete.country ? athlete.country.toUpperCase().slice(0,3) : '?';
  return (
    <div style={{ width:size, height:Math.round(size*0.75), borderRadius:3, background:C.border, display:'flex', alignItems:'center', justifyContent:'center', fontSize:size<24?8:9, fontWeight:800, color:C.muted, flexShrink:0, letterSpacing:-0.5 }}>
      {lbl}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function VaultDeskApp() {
  const [screen,   setScreen]   = useState('setup');
  const [editMode, setEditMode] = useState(false);
  const [live,     setLive]     = useState(true);
  const [metric,   setMetric]   = useState(true);
  const [rulebook, setRulebook] = useState('WA');
  const [compId,   setCompId]   = useState(() => `comp_${Date.now().toString(36)}`);

  const [info, setInfo] = useState({
    name:'', date:new Date().toISOString().split('T')[0], venue:'', gender:'M',
  });
  const [athletes,   setAthletes]   = useState([mkAthlete(1)]);
  const [heights,    setHeights]    = useState([]);
  const [curH,       setCurH]       = useState(0);
  const [curA,       setCurA]       = useState(0);
  const [editingId,  setEditingId]  = useState(null);
  const [startH,     setStartH]     = useState('');
  const [incStr,     setIncStr]     = useState('10cm x3, 5cm x3, 2cm');
  const [manualH,    setManualH]    = useState('');
  const [savedComps, setSavedComps] = useState(loadSaved);

  // ── Athlete ops ──
  // Duplicate guard: don't add if last athlete has no name
  const addAthlete = useCallback(() => {
    setAthletes(p => {
      const last = p[p.length-1];
      if (last && !last.firstName && !last.lastName) return p;
      return [...p, mkAthlete(p.length+1)];
    });
  }, []);

  const updAthlete = useCallback((id, ch) =>
    setAthletes(p => p.map(a => a.id===id ? {...a,...ch} : a)), []);

  const delAthlete = useCallback(id =>
    setAthletes(p => p.filter(a => a.id!==id).map((a,i) => ({...a, order:i+1}))), []);

  const moveAthlete = useCallback((id, dir) => setAthletes(p => {
    const i = p.findIndex(a => a.id===id), j = i+dir;
    if (j<0||j>=p.length) return p;
    const arr=[...p]; [arr[i],arr[j]]=[arr[j],arr[i]];
    return arr.map((a,k) => ({...a,order:k+1}));
  }), []);

  const reorderAthletes = useCallback((from, to) => setAthletes(p => {
    if (from===to) return p;
    const arr=[...p]; const [item]=arr.splice(from,1); arr.splice(to,0,item);
    return arr.map((a,k) => ({...a,order:k+1}));
  }), []);

  const setAthleteOrder = useCallback((id, newOrder) => setAthletes(p => {
    const i = p.findIndex(a => a.id===id);
    const target = Math.max(0, Math.min(p.length-1, newOrder-1));
    if (i<0||i===target) return p;
    const arr=[...p]; const [item]=arr.splice(i,1); arr.splice(target,0,item);
    return arr.map((a,k) => ({...a,order:k+1}));
  }), []);

  const doGenHeights = () => {
    const hs = manualH.trim() ? parseManual(manualH) : genHeights(startH, incStr);
    setHeights(hs);
  };

  // ── Record mark ──
  const recordMark = useCallback(mark => {
    setAthletes(prev => {
      const next = prev.map((a, i) => {
        if (i !== curA) return a;
        const att = a.attempts.map((arr, hi) => hi===curH ? [...arr] : arr);

        if (mark==='O') { att[curH].push('O'); return {...a, attempts:att}; }
        if (mark==='X') {
          if (countMisses(att[curH]) < 3) att[curH].push('X');
          return {...a, attempts:att};
        }
        if (mark==='P') {
          // Pass rule: must attempt if previously passed at prior height
          if (curH > 0 && hasPassed(a.attempts[curH-1]||[])) return a;
          att[curH] = ['P'];
          return {...a, attempts:att};
        }
        if (mark==='R') { att[curH]=['R']; return {...a, attempts:att, status:'retired'}; }
        if (mark==='NH')  return {...a, status:'nh'};
        if (mark==='DNS') return {...a, status:'dns'};
        return a;
      });

      const updated = next[curA];
      if (isDone(updated.attempts[curH]||[], updated.status)) {
        const nxt = nextVaulter(next, curH, curA);
        if (nxt === -1) {
          const nextH = curH + 1;
          if (nextH < heights.length) {
            setTimeout(() => {
              setCurH(nextH);
              const fe = firstEligible(next, nextH);
              setCurA(fe===-1 ? 0 : fe);
            }, 50);
          }
        } else {
          setTimeout(() => setCurA(nxt), 50);
        }
      }
      return next;
    });
  }, [curA, curH, heights]);

  const undoMark = useCallback(() => {
    setAthletes(prev => prev.map((a, i) => {
      if (i !== curA) return a;
      const att = a.attempts.map((arr, hi) => hi===curH ? [...arr] : arr);
      if (att[curH].length > 0) att[curH].pop();
      const wasRetired = a.status==='retired' && !att[curH].includes('R');
      const wasNH = a.status==='nh';
      return {...a, attempts:att, status:(wasRetired||wasNH)?'competing':a.status};
    }));
  }, [curA, curH]);

  const ranked = useMemo(() => calcPlacements(athletes, heights), [athletes, heights]);

  const startComp = () => {
    const hs = heights.length ? heights : (manualH.trim() ? parseManual(manualH) : genHeights(startH, incStr));
    if (!hs.length) { alert('Set up heights first.'); return; }
    setHeights(hs);
    const fe = firstEligible(athletes, 0);
    setCurA(fe===-1 ? 0 : fe);
    setCurH(0); setEditMode(false); setScreen('scoring');
  };

  const saveSnapshot = () => {
    const snap = {
      id: compId,
      name: info.name || 'Unnamed Competition',
      date: info.date,
      savedAt: new Date().toISOString(),
      state: { info, rulebook, athletes, heights, curH, curA, metric },
    };
    persistComp(snap);
    setSavedComps(loadSaved());
  };

  const loadSnapshot = snap => {
    const {info:i,rulebook:r,athletes:a,heights:h,curH:ch,curA:ca,metric:m} = snap.state;
    setInfo(i); setRulebook(r); setAthletes(a); setHeights(h);
    setCurH(ch); setCurA(ca); setMetric(m); setCompId(snap.id);
    setScreen('scoring');
  };

  // Pass disabled if athlete passed previous height (must attempt next)
  const passDisabled = curA >= 0 && athletes[curA] && curH > 0
    && hasPassed(athletes[curA].attempts[curH-1]||[]);

  const tabs = [
    {id:'setup',   icon:'⚙️', label:'Setup'},
    {id:'scoring', icon:'🎯', label:'Score'},
    {id:'display', icon:'📺', label:'Display'},
    {id:'history', icon:'🗂️', label:'History'},
  ];

  return (
    <div style={{ background:C.bg, minHeight:'100vh', color:C.text, maxWidth:'100vw', overflowX:'hidden' }}>

      {/* TOP BAR */}
      <header style={{ background:C.surface, borderBottom:`1px solid ${C.border}`, padding:'9px 14px', position:'sticky', top:0, zIndex:200, display:'flex', alignItems:'center', gap:10 }}>
        <div style={{ fontWeight:900, fontSize:17, color:C.accent, letterSpacing:-0.5, flexShrink:0 }}>VaultDesk</div>
        <div style={{ flex:1, fontSize:12, color:C.muted, overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis' }}>
          {info.name||'Pole Vault'}
          {screen==='scoring'&&heights[curH] ? ` · ${fmtH(heights[curH],metric)}` : ''}
        </div>
        <button onClick={() => setMetric(m=>!m)} style={{...btn(C.card,'6px 11px',11), border:`1px solid ${C.border}`}}>
          {metric?'m→ft':'ft→m'}
        </button>
        {screen==='scoring' && <>
          <button onClick={() => setLive(l=>!l)} style={{...btn(live?'#7f1d1d':C.card,'6px 10px',11), border:live?'none':`1px solid ${C.border}`, display:'flex', alignItems:'center', gap:4}}>
            <span className={live?'live-pulse':''} style={{width:7,height:7,borderRadius:'50%',background:live?'#ff4444':C.muted,flexShrink:0}}/>
            {live?'LIVE':'OFF'}
          </button>
          <button onClick={saveSnapshot} style={{...btn('#2d2d50','6px 11px',11), border:`1px solid ${C.border}`}} title="Save competition">💾</button>
          <button onClick={() => setEditMode(e=>!e)} style={btn(editMode?C.warning:C.accent,'6px 11px',11)}>
            {editMode?'✏️ Edit':'🎯 Score'}
          </button>
        </>}
      </header>

      {/* TABS */}
      <div style={{background:C.surface, borderBottom:`1px solid ${C.border}`, display:'flex'}}>
        {tabs.map(t => (
          <button key={t.id}
            onClick={() => {
              if ((t.id==='scoring'||t.id==='display') && !heights.length) return;
              setScreen(t.id);
            }}
            style={{flex:1, padding:'9px 0', background:'none', border:'none', color:screen===t.id?C.accent:C.muted, fontWeight:screen===t.id?700:400, fontSize:11, cursor:'pointer', borderBottom:`2px solid ${screen===t.id?C.accent:'transparent'}`, fontFamily:'inherit', display:'flex', alignItems:'center', justifyContent:'center', gap:3, WebkitTapHighlightColor:'transparent'}}>
            <span>{t.icon}</span><span>{t.label}</span>
          </button>
        ))}
      </div>

      {/* CONTENT */}
      <main style={{paddingBottom:40}}>
        {screen==='setup'   && <SetupScreen info={info} setInfo={setInfo} rulebook={rulebook} setRulebook={setRulebook} athletes={athletes} addAthlete={addAthlete} updAthlete={updAthlete} delAthlete={delAthlete} moveAthlete={moveAthlete} reorderAthletes={reorderAthletes} setAthleteOrder={setAthleteOrder} editingId={editingId} setEditingId={setEditingId} startH={startH} setStartH={setStartH} incStr={incStr} setIncStr={setIncStr} manualH={manualH} setManualH={setManualH} doGenHeights={doGenHeights} heights={heights} metric={metric} startComp={startComp}/>}
        {screen==='scoring' && <ScoringScreen athletes={athletes} ranked={ranked} heights={heights} curH={curH} setCurH={setCurH} curA={curA} setCurA={setCurA} editMode={editMode} metric={metric} recordMark={recordMark} undoMark={undoMark} live={live} passDisabled={passDisabled}/>}
        {screen==='display' && <DisplayScreen athletes={athletes} ranked={ranked} heights={heights} curH={curH} curA={curA} metric={metric} live={live} info={info}/>}
        {screen==='history' && <HistoryScreen savedComps={savedComps} setSavedComps={setSavedComps} loadSnapshot={loadSnapshot} saveSnapshot={saveSnapshot}/>}
      </main>
    </div>
  );
}

// ─── SETUP SCREEN ─────────────────────────────────────────────────────────────
function SetupScreen({ info, setInfo, rulebook, setRulebook, athletes, addAthlete, updAthlete, delAthlete, moveAthlete, reorderAthletes, setAthleteOrder, editingId, setEditingId, startH, setStartH, incStr, setIncStr, manualH, setManualH, doGenHeights, heights, metric, startComp }) {
  const ci = (k,v) => setInfo(p=>({...p,[k]:v}));
  return (
    <div style={{padding:14, maxWidth:640, margin:'0 auto'}}>
      <div style={sec}>
        <div style={secTitle}>Competition Info</div>
        <div style={{display:'grid', gap:10}}>
          <input style={inp} placeholder="Meet / Event Name" value={info.name} onChange={e=>ci('name',e.target.value)}/>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
            <input style={inp} type="date" value={info.date} onChange={e=>ci('date',e.target.value)}/>
            <input style={inp} placeholder="Venue / Location" value={info.venue} onChange={e=>ci('venue',e.target.value)}/>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
            <select style={inp} value={info.gender} onChange={e=>ci('gender',e.target.value)}>
              <option value="M">Men's / Boys'</option>
              <option value="W">Women's / Girls'</option>
              <option value="MX">Mixed</option>
            </select>
            <select style={inp} value={rulebook} onChange={e=>setRulebook(e.target.value)}>
              {RULEBOOKS.map(r=><option key={r.key} value={r.key}>{r.label}</option>)}
            </select>
          </div>
        </div>
      </div>

      <div style={sec}>
        <div style={secTitle}>Height Progression</div>
        <div style={{display:'grid', gap:10}}>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
            <div>
              <div style={{fontSize:11,color:C.muted,marginBottom:5}}>Starting Height (meters)</div>
              <input style={inp} placeholder="e.g. 5.00" value={startH} onChange={e=>setStartH(e.target.value)}/>
            </div>
            <div>
              <div style={{fontSize:11,color:C.muted,marginBottom:5}}>Increment Pattern</div>
              <input style={inp} placeholder="10cm x3, 5cm" value={incStr} onChange={e=>setIncStr(e.target.value)}/>
            </div>
          </div>
          <div>
            <div style={{fontSize:11,color:C.muted,marginBottom:5}}>Or enter heights manually (meters, comma-separated)</div>
            <input style={inp} placeholder="5.00, 5.10, 5.20, 5.25..." value={manualH} onChange={e=>setManualH(e.target.value)}/>
          </div>
          <button onClick={doGenHeights} style={btn(C.accent)}>Generate Heights</button>
          {heights.length > 0 && (
            <div style={{fontSize:12,color:C.muted,background:C.card,borderRadius:8,padding:'8px 12px',border:`1px solid ${C.border}`,lineHeight:1.6}}>
              <span style={{color:C.text,fontWeight:700}}>{heights.length} heights</span>{' '}
              {heights.slice(0,8).map(h=>fmtH(h,metric)).join(' · ')}
              {heights.length>8?` · ... · ${fmtH(heights[heights.length-1],metric)}`:''}
            </div>
          )}
        </div>
      </div>

      <div style={sec}>
        <div style={{display:'flex',alignItems:'center',marginBottom:10}}>
          <div style={{...secTitle,marginBottom:0}}>Athletes ({athletes.length})</div>
          <div style={{flex:1}}/>
          <button onClick={addAthlete} style={{...btn(C.success,'7px 14px',13)}}>+ Add Athlete</button>
        </div>
        <div style={{fontSize:11,color:C.muted,marginBottom:10}}>
          ⠿ drag to reorder · type # to jump to position · 🔍 links to World Athletics
        </div>
        <AthleteList athletes={athletes} editingId={editingId} setEditingId={setEditingId}
          updAthlete={updAthlete} delAthlete={delAthlete} moveAthlete={moveAthlete}
          reorderAthletes={reorderAthletes} setAthleteOrder={setAthleteOrder}/>
        {athletes.length===0 && (
          <div style={{textAlign:'center',padding:20,color:C.muted,fontSize:13}}>No athletes — click + Add Athlete</div>
        )}
      </div>

      <button onClick={startComp} style={{...btn(athletes.length>0&&heights.length>0?C.success:'#2a2a2a'), width:'100%', padding:15, fontSize:16, borderRadius:14, opacity:athletes.length>0&&heights.length>0?1:0.5}}>
        🚀 Start Competition
      </button>
      {(!athletes.length||!heights.length) && (
        <div style={{textAlign:'center',fontSize:12,color:C.muted,marginTop:8}}>
          {!athletes.length?'Add at least one athlete':'Generate heights above'} to start
        </div>
      )}
    </div>
  );
}

// ─── ATHLETE LIST (drag container) ────────────────────────────────────────────
function AthleteList({ athletes, editingId, setEditingId, updAthlete, delAthlete, moveAthlete, reorderAthletes, setAthleteOrder }) {
  const [dragIdx, setDragIdx] = useState(null);
  const [overIdx, setOverIdx] = useState(null);
  const onDragStart = (e, idx) => { setDragIdx(idx); e.dataTransfer.effectAllowed='move'; };
  const onDragOver  = (e, idx) => { e.preventDefault(); setOverIdx(idx); };
  const onDrop = (e, idx) => {
    e.preventDefault();
    if (dragIdx!==null && dragIdx!==idx) reorderAthletes(dragIdx, idx);
    setDragIdx(null); setOverIdx(null);
  };
  const onDragEnd = () => { setDragIdx(null); setOverIdx(null); };

  return (
    <div style={{display:'grid',gap:8}}>
      {athletes.map((a,i) => (
        <div key={a.id} draggable onDragStart={e=>onDragStart(e,i)} onDragOver={e=>onDragOver(e,i)} onDrop={e=>onDrop(e,i)} onDragEnd={onDragEnd}
          className={overIdx===i&&dragIdx!==i?'drag-over':''}>
          <AthleteRow athlete={a} index={i} total={athletes.length}
            isEditing={editingId===a.id}
            onEdit={()=>setEditingId(editingId===a.id?null:a.id)}
            onUpdate={ch=>updAthlete(a.id,ch)} onDelete={()=>delAthlete(a.id)}
            onUp={()=>moveAthlete(a.id,-1)} onDown={()=>moveAthlete(a.id,1)}
            onSetOrder={n=>setAthleteOrder(a.id,n)}/>
        </div>
      ))}
    </div>
  );
}

// ─── ATHLETE ROW ──────────────────────────────────────────────────────────────
function AthleteRow({ athlete, index, total, isEditing, onEdit, onUpdate, onDelete, onUp, onDown, onSetOrder }) {
  const [orderInput, setOrderInput] = useState('');

  const commitOrder = () => {
    const n = parseInt(orderInput);
    if (!isNaN(n)) onSetOrder(n);
    setOrderInput('');
  };

  const waSearch = () => {
    const q = `${athlete.firstName} ${athlete.lastName}`.trim();
    if (!q) { alert('Enter a name first'); return; }
    window.open(`https://worldathletics.org/athletes/search?term=${encodeURIComponent(q)}`, '_blank');
  };

  if (!isEditing) {
    return (
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 12px',background:C.card,borderRadius:10,border:`1px solid ${C.border}`}}>
        <div style={{cursor:'grab',fontSize:16,color:C.muted,flexShrink:0,userSelect:'none'}}>⠿</div>
        <input value={orderInput} onChange={e=>setOrderInput(e.target.value)} onBlur={commitOrder}
          onKeyDown={e=>e.key==='Enter'&&commitOrder()}
          placeholder={String(athlete.order)}
          style={{...inp,padding:'3px 5px',fontSize:12,textAlign:'center',width:32,borderRadius:6}}/>
        <FlagCell athlete={athlete} size={28}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {(athlete.firstName||athlete.lastName) ? `${athlete.firstName} ${athlete.lastName}`.trim() : <span style={{color:C.muted}}>Unnamed Athlete</span>}
          </div>
          <div style={{fontSize:11,color:C.muted,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {[athlete.affiliation,athlete.country].filter(Boolean).join(' · ')||'No affiliation'}
          </div>
        </div>
        <div style={{fontSize:11,color:C.muted,textAlign:'right',flexShrink:0}}>
          {athlete.pb&&<div>PB {athlete.pb}</div>}
          {athlete.sb&&<div>SB {athlete.sb}</div>}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:2,flexShrink:0}}>
          <button onClick={onUp}   disabled={index===0}       style={{...btn(C.border,'2px 7px',11),opacity:index===0?0.25:1}}>↑</button>
          <button onClick={onDown} disabled={index===total-1} style={{...btn(C.border,'2px 7px',11),opacity:index===total-1?0.25:1}}>↓</button>
        </div>
        <button onClick={onEdit}   style={btn(C.accent,'7px 12px',12)}>Edit</button>
        <button onClick={onDelete} style={btn('#7f1d1d','7px 12px',12)}>✕</button>
      </div>
    );
  }

  const fields=[['First Name','firstName'],['Last Name','lastName'],['Country (IOC/ISO)','country'],['Affiliation','affiliation'],['PB (e.g. 5.85m)','pb'],['SB (e.g. 5.60m)','sb']];
  return (
    <div style={{padding:14,background:C.card,borderRadius:10,border:`2px solid ${C.accent}`}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:700,color:C.accent}}>Athlete #{athlete.order}</div>
        <button onClick={waSearch} style={{...btn('#1d3a6b','6px 12px',11),border:`1px solid ${C.accent}44`}}>
          🔍 Search World Athletics
        </button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
        {fields.map(([ph,k])=>(
          <input key={k} style={inp} placeholder={ph} value={athlete[k]} onChange={e=>onUpdate({[k]:e.target.value})}/>
        ))}
      </div>
      {athlete.country && (
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,fontSize:11,color:C.muted}}>
          Flag:&nbsp;<FlagCell athlete={athlete} size={28}/>
          <span style={{color:C.text}}>{athlete.country.toUpperCase()}</span>
          {!getFlagUrl(athlete.country)&&<span style={{color:C.warning}}> — use 2-letter ISO (US) or 3-letter IOC (USA)</span>}
        </div>
      )}
      <input style={{...inp,marginBottom:8}} placeholder="Logo / flag image URL (optional override)" value={athlete.logoUrl} onChange={e=>onUpdate({logoUrl:e.target.value})}/>
      <div style={{fontSize:11,color:C.muted,marginBottom:10}}>
        💡 Search WA → find athlete → note PB, SB, and country code → paste above
      </div>
      <div style={{display:'flex',gap:8}}>
        <button onClick={onEdit}   style={btn(C.success,'8px 16px',13)}>✓ Done</button>
        <button onClick={onDelete} style={btn('#7f1d1d','8px 16px',13)}>Delete</button>
      </div>
    </div>
  );
}

// ─── SCORING SCREEN ───────────────────────────────────────────────────────────
function ScoringScreen({ athletes, ranked, heights, curH, setCurH, curA, setCurA, editMode, metric, recordMark, undoMark, live, passDisabled }) {
  const n = heights.length;
  const curAth   = athletes[curA];
  const curHt    = heights[curH];
  const curMarks = curAth ? (curAth.attempts[curH]||[]) : [];
  const missCount = countMisses(curMarks);
  const alreadyDone = curAth ? isDone(curMarks, curAth.status) : true;
  const nhOk = curAth && curAth.status==='competing' && isEliminated(curMarks);

  const MARKS = [
    {mark:'O',  bg:C.success, emoji:'✓', label:'Clear',  dis:false},
    {mark:'X',  bg:C.danger,  emoji:'✗', label:'Miss',   dis:false},
    {mark:'P',  bg:'#2563eb', emoji:'—', label:'Pass',   dis:passDisabled},
    {mark:'R',  bg:C.warning, emoji:'R', label:'Retire', dis:false},
    {mark:'NH', bg:nhOk?'#6b7280':'#3a3a3a', emoji:'NH', label:'NH', dis:false},
    {mark:'DNS',bg:'#374151', emoji:'—', label:'DNS',    dis:false},
  ];

  const getCellStyle = (marks, hIdx) => {
    if (hasCleared(marks))   return {background:C.clearedBg, color:'#4ade80'};
    if (isEliminated(marks)) return {background:C.missedBg,  color:'#f87171'};
    if (hasPassed(marks))    return {background:C.passedBg,  color:'#60a5fa'};
    if (hasRetired(marks))   return {color:C.warning};
    return {background: hIdx===curH ? C.accent+'0d' : 'transparent'};
  };

  return (
    <div>
      {/* Current vaulter banner */}
      {!editMode && curAth && !alreadyDone && (
        <div style={{background:`linear-gradient(135deg,${C.accent}22 0%,${C.surface} 100%)`, borderBottom:`1px solid ${C.border}`, borderLeft:`4px solid ${C.accent}`, padding:'12px 14px'}}>
          <div style={{fontSize:10,color:C.muted,textTransform:'uppercase',letterSpacing:1.2,marginBottom:6,display:'flex',alignItems:'center',gap:6}}>
            {live&&<span className="live-pulse" style={{width:7,height:7,borderRadius:'50%',background:'#ff4444',display:'inline-block'}}/>}
            Now Vaulting · {fmtH(curHt,metric)}{metric?` · ${fmtH(curHt,false)}`:''}
            <span style={{marginLeft:'auto',color:C.muted,fontWeight:600}}>Jump order #{curAth.order}</span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <FlagCell athlete={curAth} size={50}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:22,fontWeight:800,lineHeight:1.1}}>
                {curAth.firstName}&nbsp;<span style={{color:C.accent}}>{curAth.lastName}</span>
              </div>
              <div style={{fontSize:12,color:C.muted,marginTop:3}}>
                {[curAth.affiliation,curAth.country].filter(Boolean).join(' · ')}
                {curAth.pb?` · PB ${curAth.pb}`:''}
                {curAth.sb?` · SB ${curAth.sb}`:''}
              </div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:13,fontWeight:700,color:missCount===0?C.text:missCount===1?C.warning:C.danger}}>
                Attempt {missCount+1} of 3
              </div>
              <div style={{fontSize:20,letterSpacing:4,marginTop:3}}>
                {'●'.repeat(missCount)}<span style={{color:C.border}}>{'●'.repeat(3-missCount)}</span>
              </div>
            </div>
          </div>
        </div>
      )}

      {!editMode && curAth && alreadyDone && (
        <div style={{background:`${C.warning}18`,borderBottom:`1px solid ${C.warning}33`,padding:'10px 14px',fontSize:13,color:C.warning,fontWeight:600}}>
          ⚠️ All athletes complete at this height. Advance height tab or use Edit mode.
        </div>
      )}

      {/* Mark buttons */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'10px 12px',display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:8}}>
        {MARKS.map(({mark,bg,emoji,label,dis})=>(
          <button key={mark} onClick={()=>!dis&&recordMark(mark)}
            style={{background:dis?'#2a2a2a':bg, color:dis?C.muted:'#fff', border:dis?`1px solid ${C.border}`:'none',
              borderRadius:12, padding:'11px 2px', fontSize:10, fontWeight:700,
              cursor:dis?'not-allowed':'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:3,
              minHeight:58, fontFamily:'inherit', WebkitTapHighlightColor:'transparent', touchAction:'manipulation', opacity:dis?0.45:1}}>
            <span style={{fontSize:18}}>{emoji}</span>
            <span>{label}</span>
            {mark==='P'&&dis&&<span style={{fontSize:8,opacity:0.8,textAlign:'center',lineHeight:1.2,marginTop:1}}>must<br/>attempt</span>}
          </button>
        ))}
      </div>

      {/* Rule reminder + undo */}
      <div style={{padding:'5px 14px',background:C.bg,borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{fontSize:10,color:C.muted}}>NH = 3 misses at same bar · Pass after pass = must attempt next</div>
        <button onClick={undoMark} style={btn('#7c3aed','5px 12px',11)}>↩ Undo</button>
      </div>

      {editMode && (
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'9px 14px',background:`${C.warning}18`,borderBottom:`1px solid ${C.warning}33`}}>
          <div style={{fontSize:12,color:C.warning,fontWeight:600}}>✏️ Edit mode — tap a cell to select athlete & height</div>
        </div>
      )}

      {/* Height tabs */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'8px 10px',display:'flex',gap:6,overflowX:'auto',alignItems:'center',WebkitOverflowScrolling:'touch'}}>
        <span style={{fontSize:10,color:C.muted,flexShrink:0,textTransform:'uppercase',letterSpacing:0.8}}>Heights:</span>
        {heights.map((h,i)=>(
          <button key={i} onClick={()=>setCurH(i)}
            style={{flexShrink:0,background:i===curH?C.accent:C.card,color:i===curH?'#fff':C.muted,
              border:`1px solid ${i===curH?C.accent:C.border}`,borderRadius:20,padding:'4px 11px',fontSize:11,
              fontWeight:i===curH?700:400,cursor:'pointer',fontFamily:'inherit',WebkitTapHighlightColor:'transparent'}}>
            {fmtH(h,metric)}
          </button>
        ))}
      </div>

      {/* Results table */}
      <div style={{overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
        <table style={{borderCollapse:'collapse',fontSize:12,width:'100%',minWidth:Math.max(480,180+n*60)+'px'}}>
          <thead>
            <tr style={{background:C.surface,borderBottom:`2px solid ${C.border}`}}>
              <th style={{position:'sticky',left:0,background:C.surface,padding:'9px 5px',textAlign:'center',color:C.muted,width:28,fontSize:10,zIndex:10}}>Ord</th>
              <th style={{position:'sticky',left:28,background:C.surface,padding:'9px 8px',textAlign:'left',color:C.muted,minWidth:145,fontSize:10,zIndex:10}}>Athlete</th>
              <th style={{padding:'9px 5px',textAlign:'center',color:C.muted,width:44,fontSize:10}}>PB</th>
              <th style={{padding:'9px 5px',textAlign:'center',color:C.muted,width:44,fontSize:10}}>SB</th>
              {heights.map((h,i)=>(
                <th key={i} style={{padding:'9px 3px',textAlign:'center',minWidth:54,color:i===curH?C.accent:C.muted,fontWeight:i===curH?800:400,fontSize:10,background:i===curH?C.accent+'18':C.surface}}>
                  {fmtH(h,metric)}
                </th>
              ))}
              <th style={{padding:'9px 6px',textAlign:'center',color:C.muted,width:50,fontSize:10}}>Place</th>
            </tr>
          </thead>
          <tbody>
            {ranked.map((ath,rowIdx)=>{
              const origIdx = athletes.findIndex(a=>a.id===ath.id);
              const isCurrent = origIdx===curA;
              const rowBg = isCurrent&&!editMode?C.accent+'15':rowIdx%2===0?'transparent':C.surface+'55';
              const stillJumping = !isDone(ath.attempts[curH]||[], ath.status);
              return (
                <tr key={ath.id}
                  onClick={()=>editMode&&(setCurH(curH),setCurA(origIdx))}
                  className={isCurrent&&!editMode?'cur-glow':''}
                  style={{background:rowBg,borderBottom:`1px solid ${C.border}`,cursor:editMode?'pointer':'default',borderLeft:isCurrent&&!editMode?`3px solid ${C.accent}`:'3px solid transparent'}}>

                  <td style={{position:'sticky',left:0,background:rowBg,padding:'9px 5px',textAlign:'center',color:isCurrent?C.accent:C.muted,fontSize:11,fontWeight:isCurrent?800:400}}>
                    {ath.order}
                    {stillJumping&&!isCurrent&&<div style={{width:5,height:5,borderRadius:'50%',background:C.success,margin:'2px auto 0'}}/>}
                  </td>

                  <td style={{position:'sticky',left:28,background:rowBg,padding:'9px 8px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:7}}>
                      <FlagCell athlete={ath} size={22}/>
                      <div style={{minWidth:0}}>
                        <div style={{fontWeight:isCurrent?800:500,fontSize:13,color:isCurrent&&!editMode?C.accent:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:120}}>
                          {isCurrent&&!editMode&&<span style={{fontSize:9,marginRight:3,color:C.accent}}>▶</span>}
                          {ath.firstName} {ath.lastName}
                        </div>
                        <div style={{fontSize:10,color:C.muted,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:120}}>
                          {ath.affiliation||ath.country||''}
                        </div>
                      </div>
                    </div>
                  </td>

                  <td style={{padding:'9px 5px',textAlign:'center',color:C.muted,fontSize:11}}>{ath.pb||'—'}</td>
                  <td style={{padding:'9px 5px',textAlign:'center',color:C.muted,fontSize:11}}>{ath.sb||'—'}</td>

                  {heights.map((h,hIdx)=>{
                    const marks = ath.attempts[hIdx]||[];
                    const cs = getCellStyle(marks,hIdx);
                    const isCurCell = hIdx===curH&&origIdx===curA;
                    let display='';
                    if (ath.status==='dns')     display=hIdx===0?'DNS':'';
                    else if(ath.status==='nh')  display=hIdx===0?'NH':'';
                    else                        display=showMarks(marks);
                    return (
                      <td key={hIdx}
                        onClick={()=>editMode&&(setCurH(hIdx),setCurA(origIdx))}
                        style={{padding:'9px 3px',textAlign:'center',fontWeight:700,fontSize:12,letterSpacing:0.5,outline:isCurCell&&editMode?`2px inset ${C.accent}`:'none',...cs}}>
                        {display}
                      </td>
                    );
                  })}

                  <td style={{padding:'9px 6px',textAlign:'center',fontWeight:800,fontSize:15}}>
                    {ath.placement===1?'🥇':ath.placement===2?'🥈':ath.placement===3?'🥉':
                     ath.placement?<span style={{color:C.muted,fontSize:13}}>{ath.placement}{ath.tied?'=':''}</span>:
                     <span style={{fontSize:10,color:C.muted}}>{ath.status==='dns'?'DNS':ath.status==='nh'?'NH':'—'}</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── DISPLAY SCREEN (spectator) ───────────────────────────────────────────────

  const curHt  = heights[curH];
  const n = heights.length;

  return (
    <div style={{background:C.bg,minHeight:'80vh'}}>
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'14px 20px',textAlign:'center'}}>
        <div style={{fontSize:13,fontWeight:800,color:C.muted,letterSpacing:2,textTransform:'uppercase',marginBottom:4}}>
          {info.name||'Pole Vault'}{info.date?` · ${info.date}`:''}{info.venue?` · ${info.venue}`:''}
        </div>
        {live&&(
          <div style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:11,color:'#ff4444',fontWeight:700,letterSpacing:1}}>
            <span className="live-pulse" style={{width:8,height:8,borderRadius:'50%',background:'#ff4444',display:'inline-block'}}/>
            LIVE
          </div>
        )}
      </div>

      {curAth&&curHt&&(
        <div style={{background:`linear-gradient(180deg,${C.accent}18 0%,${C.bg} 100%)`,padding:'24px 20px 20px',textAlign:'center',borderBottom:`1px solid ${C.border}`}}>
          <div style={{fontSize:11,color:C.muted,textTransform:'uppercase',letterSpacing:2,marginBottom:8}}>Current Bar</div>
          <div style={{fontSize:56,fontWeight:900,color:C.accent,lineHeight:1,marginBottom:4,letterSpacing:-1}}>{fmtH(curHt,metric)}</div>
          {metric&&<div style={{fontSize:16,color:C.muted,marginBottom:20}}>{fmtH(curHt,false)}</div>}
          <div style={{display:'inline-flex',alignItems:'center',gap:14,background:C.surface,borderRadius:16,padding:'14px 22px',border:`1px solid ${C.border}`}}>
            <FlagCell athlete={curAth} size={46}/>
            <div style={{textAlign:'left'}}>
              <div style={{fontSize:11,color:C.muted,textTransform:'uppercase',letterSpacing:1.5,marginBottom:4}}>Now Vaulting</div>
              <div style={{fontSize:28,fontWeight:900,color:C.text,lineHeight:1}}>
                {curAth.firstName}&nbsp;<span style={{color:C.accent}}>{curAth.lastName}</span>
              </div>
              {(curAth.affiliation||curAth.country)&&(
                <div style={{fontSize:13,color:C.muted,marginTop:4}}>
                  {[curAth.affiliation,curAth.country].filter(Boolean).join(' · ')}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      <div style={{overflowX:'auto',padding:'0 0 20px'}}>
        <table style={{borderCollapse:'collapse',fontSize:13,width:'100%',minWidth:Math.max(400,160+n*52)+'px'}}>
          <thead>
            <tr style={{background:C.surface,borderBottom:`2px solid ${C.border}`}}>
              <th style={{position:'sticky',left:0,background:C.surface,padding:'10px 8px',textAlign:'center',color:C.muted,width:34,fontSize:11,zIndex:10}}>#</th>
              <th style={{position:'sticky',left:34,background:C.surface,padding:'10px 10px',textAlign:'left',color:C.muted,minWidth:155,fontSize:11,zIndex:10}}>Athlete</th>
              {heights.map((h,i)=>(
                <th key={i} style={{padding:'10px 4px',textAlign:'center',minWidth:50,color:i===curH?C.accent:C.muted,fontWeight:i===curH?800:400,fontSize:11,background:i===curH?C.accent+'18':C.surface}}>
                  {fmtH(h,metric)}
                </th>
              ))}
              <th style={{padding:'10px 8px',textAlign:'center',color:C.muted,width:54,fontSize:11}}>Place</th>
            </tr>
          </thead>
          <tbody>
            {ranked.map((ath,rowIdx)=>{
              const origIdx = athletes.findIndex(a=>a.id===ath.id);
              const isCurrent = origIdx===curA;
              const bg = isCurrent?C.accent+'15':rowIdx%2===0?'transparent':C.surface+'55';
              return (
                <tr key={ath.id} style={{background:bg,borderBottom:`1px solid ${C.border}`,borderLeft:isCurrent?`4px solid ${C.accent}`:'4px solid transparent'}}>
                  <td style={{position:'sticky',left:0,padding:'10px 8px',textAlign:'center',color:isCurrent?C.accent:C.muted,fontSize:12,fontWeight:isCurrent?800:400,background:bg}}>
                    {ath.order}
                  </td>
                  <td style={{position:'sticky',left:34,padding:'10px 10px',background:bg}}>
                    <div style={{display:'flex',alignItems:'center',gap:9}}>
                      <FlagCell athlete={ath} size={26}/>
                      <div>
                        <div style={{fontWeight:isCurrent?800:600,fontSize:14,color:isCurrent?C.accent:C.text}}>
                          {isCurrent&&<span style={{fontSize:10,marginRight:3,color:C.accent}}>▶</span>}
                          {ath.firstName} {ath.lastName}
                        </div>
                        {(ath.affiliation||ath.country)&&(
                          <div style={{fontSize:11,color:C.muted}}>{[ath.affiliation,ath.country].filter(Boolean).join(' · ')}</div>
                        )}
                      </div>
                    </div>
                  </td>
                  {heights.map((h,hIdx)=>{
                    const marks = ath.attempts[hIdx]||[];
                    let display='',color=C.muted,bg2='transparent';
                    if (ath.status==='dns')       {display=hIdx===0?'DNS':'';}
                    else if(ath.status==='nh')    {display=hIdx===0?'NH':'';}
                    else if(hasCleared(marks))    {display=showMarks(marks);color='#4ade80';bg2=C.clearedBg;}
                    else if(isEliminated(marks))  {display=showMarks(marks);color='#f87171';bg2=C.missedBg;}
                    else if(hasPassed(marks))     {display=showMarks(marks);color='#60a5fa';bg2=C.passedBg;}
                    else                          {display=showMarks(marks);}
                    return (
                      <td key={hIdx} style={{padding:'10px 4px',textAlign:'center',fontWeight:700,fontSize:12,color,background:hIdx===curH?bg2||C.accent+'0d':bg2}}>
                        {display}
                      </td>
                    );
                  })}
                  <td style={{padding:'10px 8px',textAlign:'center',fontWeight:800,fontSize:16}}>
                    {ath.placement===1?'🥇':ath.placement===2?'🥈':ath.placement===3?'🥉':
                     ath.placement?<span style={{color:C.muted,fontSize:13}}>{ath.placement}{ath.tied?'=':''}</span>:
                     <span style={{fontSize:11,color:C.muted}}>{ath.status==='dns'?'DNS':ath.status==='nh'?'NH':'—'}</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── HISTORY SCREEN ───────────────────────────────────────────────────────────
function HistoryScreen({ savedComps, setSavedComps, loadSnapshot, saveSnapshot }) {
  const refresh = () => setSavedComps(loadSaved());
  const handleDelete = id => {
    if (!confirm('Delete this saved competition?')) return;
    eraseComp(id); refresh();
  };
  const fmtDate = iso => {
    try { return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
    catch { return iso; }
  };
  return (
    <div style={{padding:14,maxWidth:640,margin:'0 auto'}}>
      <div style={sec}>
        <div style={{display:'flex',alignItems:'center',marginBottom:12}}>
          <div style={{...secTitle,marginBottom:0}}>Saved Competitions</div>
          <div style={{flex:1}}/>
          <button onClick={saveSnapshot} style={btn(C.accent,'7px 14px',13)}>💾 Save Current</button>
        </div>
        {savedComps.length===0&&(
          <div style={{textAlign:'center',padding:'30px 20px',color:C.muted,fontSize:13}}>
            No saved competitions.<br/>
            <span style={{fontSize:12,marginTop:6,display:'block'}}>Hit 💾 during scoring to save a snapshot.</span>
          </div>
        )}
        <div style={{display:'grid',gap:10}}>
          {savedComps.map(comp=>(
            <div key={comp.id} style={{background:C.card,borderRadius:12,border:`1px solid ${C.border}`,padding:'12px 14px'}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14,color:C.text,marginBottom:3}}>{comp.name}</div>
                  <div style={{fontSize:11,color:C.muted}}>
                    {comp.date}{comp.state?.info?.venue?` · ${comp.state.info.venue}`:''}
                  </div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2}}>
                    Saved {fmtDate(comp.savedAt)}
                    {comp.state?.athletes?` · ${comp.state.athletes.length} athletes`:''}
                    {comp.state?.heights?` · ${comp.state.heights.length} heights`:''}
                  </div>
                </div>
                <div style={{display:'flex',gap:6,flexShrink:0}}>
                  <button onClick={()=>loadSnapshot(comp)} style={btn(C.accent,'7px 12px',12)}>▶ Resume</button>
                  <button onClick={()=>handleDelete(comp.id)} style={btn('#7f1d1d','7px 12px',12)}>✕</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
      <div style={{...sec,background:`${C.warning}10`,border:`1px solid ${C.warning}30`}}>
        <div style={{...secTitle,color:C.warning}}>Storage Note</div>
        <div style={{fontSize:12,color:C.muted,lineHeight:1.6}}>
          Saved to browser local storage — persists between sessions on this device.
          Up to 20 competitions stored. Clearing browser data removes them.
        </div>
      </div>
    </div>
  );
}

// ─── MOUNT ────────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<VaultDeskApp/>);
</script>
</body>
