function VaultDeskApp(){
  const saved_=useMemo(()=>{try{const s=JSON.parse(localStorage.getItem(LS_CUR)||'{}');return s;}catch{return{}};},[]);
  const[screen,setScreen]=useState(()=>{const s=saved_.screen;return(s==='scoring'||s==='display')?'live':s||'setup';});
  // primaryMetric: true = metric displayed larger, false = imperial displayed larger
  // Auto-set by rulebook (NFHS → imperial, WA/NCAA → metric), can also init from saved state
  const[primaryMetric,setPrimaryMetric]=useState(saved_.primaryMetric!==undefined?saved_.primaryMetric:true);
  const[su,setSu]=useState(()=>{const d=mkSu();const s=saved_.su;if(!s)return d;return{...d,...s,athletes:Array.isArray(s.athletes)&&s.athletes.length?s.athletes:d.athletes,heights:Array.isArray(s.heights)?s.heights:d.heights,info:{...d.info,...(s.info||{})}};});
  const[sc,setSc]=useState(()=>{if(!saved_.sc)return null;const s=saved_.sc;return{...s,athletes:Array.isArray(s.athletes)?s.athletes:[],heights:Array.isArray(s.heights)?s.heights:[]};});
  const[showEdit,setShowEdit]=useState(false);
  const[showImport,setShowImport]=useState(false);
  const[showPhotoImport,setShowPhotoImport]=useState(false);
  const[showSave,setShowSave]=useState(false);
  const[showShare,setShowShare]=useState(false);
  const[liveCompKey,setLiveCompKey]=useState(null);
  const[liveSubTab,setLiveSubTab]=useState('score');
  const[savedComps,setSavedComps]=useState(loadSaved);
  const[sbLoading,setSbLoading]=useState(ROUTE.mode!=='admin');
  const[routeSlug,setRouteSlug]=useState(ROUTE.slug||'');
  // Auth
  const[authUser,setAuthUser]=useState(null);
  const[authLoading,setAuthLoading]=useState(ROUTE.mode==='admin');
  const[adminProfile,setAdminProfile]=useState(null);
  const isSuperAdmin=authUser?.email===SUPER_ADMIN_EMAIL;
  const[sbError,setSbError]=useState(null);
  const suRef=useRef(su);const scRef=useRef(sc);
  useEffect(()=>{suRef.current=su;},[su]);
  useEffect(()=>{scRef.current=sc;},[sc]);

  // Auto-set primaryMetric when rulebook changes
  useEffect(()=>{setPrimaryMetric(su.rulebook!=='NFHS');},[su.rulebook]);

  // Scorer / Display: load competition from Supabase on mount, and re-load when hash changes
  useEffect(()=>{
    if(ROUTE.mode==='admin'||!routeSlug)return;
    setSbLoading(true);setSbError(null);
    (async()=>{
      try{
        const r=parseRoute();
        const{sc:loaded}=await loadCompFromSupabase(routeSlug);
        if(r.mode==='scorer'&&r.token)loaded.scorerToken=r.token;
        setSc(loaded);
        if(r.mode==='scorer'){setScreen('live');setLiveSubTab('score');}else{setScreen('display');}
      }catch(e){setSbError(e.message||'Failed to load competition');}
      finally{setSbLoading(false);}
    })();
  },[routeSlug]);
  // Listen for hash changes (display/scorer: navigating to a different competition link)
  useEffect(()=>{
    if(ROUTE.mode==='admin')return;
    const onHash=()=>{const r=parseRoute();setRouteSlug(r.slug||'');};
    window.addEventListener('hashchange',onHash);
    return()=>window.removeEventListener('hashchange',onHash);
  },[]);

  // Display: subscribe to realtime updates
  useEffect(()=>{
    if(ROUTE.mode!=='display'||!sc?.supabaseCompId)return;
    const compId=sc.supabaseCompId;
    const reload=async()=>{
      try{const{sc:f}=await loadCompFromSupabase(sc.compId);setSc(f);}
      catch(e){console.warn('Realtime reload failed:',e);}
    };
    const ch=sb.channel(`comp:${compId}`)
      .on('postgres_changes',{event:'*',schema:'public',table:'attempts',filter:`comp_id=eq.${compId}`},reload)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'competitions',filter:`id=eq.${compId}`},reload)
      .subscribe();
    return()=>{sb.removeChannel(ch);};
  },[sc?.supabaseCompId]);

  const updSu=useCallback(patch=>setSu(p=>({...p,...patch})),[]);
  const updSc=useCallback(patch=>setSc(p=>p?{...p,...patch}:p),[]);

  useEffect(()=>{saveCurrent({screen,primaryMetric,su,sc});},[screen,primaryMetric,su,sc]);

  // ── Auth init (admin mode only) ──
  useEffect(()=>{
    if(ROUTE.mode!=='admin')return;
    sb.auth.getSession().then(({data:{session}})=>{
      setAuthUser(session?.user??null);
      setAuthLoading(false);
      if(session?.user)initAdminProfile(session.user);
    });
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      setAuthUser(session?.user??null);
      if(session?.user)initAdminProfile(session.user);
      else setAdminProfile(null);
    });
    return()=>subscription.unsubscribe();
  },[]);

  const initAdminProfile=useCallback(async(user)=>{
    const role=user.email===SUPER_ADMIN_EMAIL?'super_admin':'admin';
    try{
      await sb.from('admin_profiles').upsert({
        id:user.id,email:user.email,
        display_name:user.user_metadata?.display_name||user.email.split('@')[0],
        role,last_active:new Date().toISOString(),
      },{onConflict:'id'});
      const{data}=await sb.from('admin_profiles').select('*').eq('id',user.id).single();
      setAdminProfile(data);
    }catch(e){console.warn('Profile init failed:',e);}
  },[]);

  // Setup helpers
  const setInfo=useCallback(fn=>updSu({info:fn(suRef.current.info)}),[]);
  const setRulebook=useCallback(rb=>{updSu({rulebook:rb});setPrimaryMetric(rb!=='NFHS');},[]);
  const setStartH=useCallback(v=>updSu({startH:v}),[]);
  const setIncStr=useCallback(v=>updSu({incStr:v}),[]);
  const setManualH=useCallback(v=>updSu({manualH:v}),[]);
  const setDirEmail=useCallback(v=>updSu({dirEmail:v}),[]);
  const doGenHeights=useCallback(()=>{
    const s=suRef.current;
    if(s.manualH.trim()){updSu({heights:parseManual(s.manualH)});return;}
    const hs=genHeights(s.startH,s.incStr,6); // cap at 6 for initial generation
    if(hs.length)updSu({heights:hs});
  },[]);
  // Height editing — CRITICAL: setHeights receives array, not functional updater
  const setHeights=useCallback(h=>updSu({heights:h}),[]);
  const updateHeight=useCallback((i,v)=>{const cm=Math.round(parseFloat(v)*100);if(!isNaN(cm))setSu(p=>({...p,heights:p.heights.map((h,j)=>j===i?cm:h)}));},[]);
  const addAthlete=useCallback(()=>{const a=mkAthlete(suRef.current.athletes.length+1);updSu({athletes:[...suRef.current.athletes,a]});},[]);
  const updAthlete=useCallback((id,ch)=>updSu({athletes:suRef.current.athletes.map(a=>a.id===id?{...a,...ch}:a)}),[]);
  const delAthlete=useCallback(id=>updSu({athletes:suRef.current.athletes.filter(a=>a.id!==id)}),[]);
  const moveAthlete=useCallback((id,dir)=>{const arr=[...suRef.current.athletes];const idx=arr.findIndex(a=>a.id===id);const nIdx=idx+dir;if(nIdx<0||nIdx>=arr.length)return;[arr[idx],arr[nIdx]]=[arr[nIdx],arr[idx]];updSu({athletes:arr});},[]);
  const reorder=useCallback((from,to)=>{const arr=[...suRef.current.athletes];const[m]=arr.splice(from,1);arr.splice(to,0,m);updSu({athletes:arr});},[]);
  const setOrder=useCallback((id,n)=>updSu({athletes:suRef.current.athletes.map(a=>a.id===id?{...a,order:n}:a)}),[]);
  const setEditingId=useCallback(id=>updSu({editingId:id}),[]);

  // Start competition — publishes to Supabase, falls back to offline if network fails
  const startComp=useCallback(async()=>{
    const s=suRef.current;
    const validAthletes=s.athletes.filter(a=>(a.firstName||'').trim()||(a.lastName||'').trim());
    if(!validAthletes.length||!s.heights.length)return;
    const orderedAthletes=validAthletes.map((a,i)=>({...a,order:i+1}));
    const newSc={
      ...s,athletes:orderedAthletes,compStatus:'active',metric:primaryMetric,
      curH:0,curA:firstEligible(orderedAthletes,0),
      compId:s.compId||`c_${Date.now().toString(36)}`,
      origHeightCount:s.heights.length,
    };
    let finalSc=newSc;
    try{
      const ids=await publishCompetition(s,newSc);
      finalSc={...newSc,...ids};
    }catch(e){console.warn('Supabase publish failed (offline mode):',e);}
    // Stash any current active comp so it stays in the Live list
    const prevSc=scRef.current;
    if(prevSc&&prevSc.compStatus==='active'){
      const all=loadSaved();
      if(!all.some(c=>(c.sc?.compId||c.compId)===prevSc.compId)){saveAll([...all,prevSc]);}
    }
    setSc(finalSc);updSu(mkSu());setSavedComps(loadSaved());setScreen('live');setLiveCompKey(finalSc.compId);setLiveSubTab('score');
  },[primaryMetric]);

  // Mark recording
  const recordMark=useCallback(mark=>{
    const c=scRef.current;if(!c||c.compStatus!=='active')return;
    const{athletes,heights,curH,curA,isJumpOff=false,jumpOffIds=[]}=c;
    if(curA<0||curA>=athletes.length)return;
    const ath=athletes[curA];

    // DNS — set status, advance rotation, sync
    if(mark==='DNS'){
      const newAthletes=athletes.map((a,i)=>i===curA?{...a,status:'dns'}:a);
      const nA=isJumpOff?nextVaulterJO(newAthletes,curH,curA,jumpOffIds):nextVaulter(newAthletes,curH,curA);
      updSc({athletes:newAthletes,curA:nA});
      syncState(c,curH,nA,'active').catch(e=>console.warn('syncState failed:',e));
      return;
    }

    // Record the mark
    const newMarks=[...(ath.attempts[curH]||[]),mark];
    const newAthletes=athletes.map((a,i)=>{
      if(i!==curA)return a;
      const newAtt=[...a.attempts];newAtt[curH]=newMarks;
      let status=a.status;
      if(mark==='R')status='retired';
      if(!newAtt.some(hasCleared)&&totalConsecutiveMisses(newAtt)>=3)status='nh';
      return{...a,attempts:newAtt,status};
    });
    updSc({athletes:newAthletes});
    syncMark(c,ath.id,curH,newMarks).catch(e=>console.warn('syncMark failed:',e));

    // ── JUMP-OFF MODE ──────────────────────────────────────────────────────────
    if(isJumpOff){
      // In JO each athlete gets exactly 1 attempt. P/R = concede (treated as fail)
      const nA_jo=nextVaulterJO(newAthletes,curH,curA,jumpOffIds);
      if(nA_jo!==-1){
        updSc({curA:nA_jo});
        syncState(c,curH,nA_jo,'active').catch(e=>console.warn('syncState failed:',e));
        return;
      }
      // All JO athletes have had their 1 attempt at this height — evaluate
      const joActive=newAthletes.filter(a=>jumpOffIds.includes(a.id)&&!TERMINAL.includes(a.status));
      const jo_cleared=joActive.filter(a=>hasCleared(a.attempts[curH]||[]));
      const jo_failed=joActive.filter(a=>!hasCleared(a.attempts[curH]||[]));

      const addJOHeight=async(heightCm,finalAthletes,newJOIds,newStatus)=>{
        const newHeights=[...heights,heightCm];
        const nH_idx=newHeights.length-1;
        const nA2=firstJO(finalAthletes,newJOIds);
        updSc({athletes:finalAthletes,heights:newHeights,curH:nH_idx,curA:nA2,jumpOffIds:newJOIds,isJumpOff:newStatus});
        syncState(c,nH_idx,nA2,'active').catch(e=>console.warn('syncState failed:',e));
        // Insert new JO height into Supabase
        if(c.supabaseCompId&&c.scorerToken){
          sb.from('heights').insert({comp_id:c.supabaseCompId,height_cm:heightCm,sort_order:nH_idx}).select()
            .then(({data})=>{if(data?.[0]){const cur=scRef.current;updSc({heightIds:{...cur?.heightIds,[nH_idx]:data[0].id}});}})
            .catch(e=>console.warn('JO height sync failed:',e));
        }
      };

      if(jo_cleared.length===1&&jo_failed.length>0){
        // Exactly one cleared — JO winner decided
        const final=newAthletes.map(a=>jo_failed.find(f=>f.id===a.id)?{...a,status:'retired'}:a);
        updSc({athletes:final,curA:-1,isJumpOff:false});
        syncState(c,curH,-1,'active').catch(e=>console.warn('syncState failed:',e));
        return;
      }
      if(jo_cleared.length>1&&jo_failed.length>0){
        // Mix — eliminate failures, continue with cleared athletes at next height up
        const newJOIds=jo_cleared.map(a=>a.id);
        const final=newAthletes.map(a=>jo_failed.find(f=>f.id===a.id)?{...a,status:'retired'}:a);
        addJOHeight(heights[curH]+5,final,newJOIds,true);
        return;
      }
      if(jo_failed.length===joActive.length){
        // All failed → lower bar 5cm
        addJOHeight(heights[curH]-5,newAthletes,jumpOffIds,true);
        return;
      }
      // All cleared → raise bar 5cm
      addJOHeight(heights[curH]+5,newAthletes,jumpOffIds,true);
      return;
    }

    // ── REGULAR COMPETITION ROTATION ───────────────────────────────────────────
    const nA=nextVaulter(newAthletes,curH,curA);
    if(nA!==-1){
      updSc({curA:nA});
      syncState(c,curH,nA,'active').catch(e=>console.warn('syncState failed:',e));
      return;
    }
    // No one left at this height — advance height
    let nH=curH+1;
    while(nH<heights.length&&firstEligible(newAthletes,nH)===-1)nH++;
    if(nH<heights.length){
      const nA2=firstEligible(newAthletes,nH);
      updSc({curH:nH,curA:nA2});
      syncState(c,nH,nA2,'active').catch(e=>console.warn('syncState failed:',e));
    }else{
      updSc({curA:-1});
      syncState(c,curH,-1,'active').catch(e=>console.warn('syncState failed:',e));
    }
  },[]);

  const undoMark=useCallback(()=>{
    const c=scRef.current;if(!c)return;
    const{athletes}=c;
    let{curH,curA}=c;
    // If curA=-1 (meet over or between heights), find the last athlete who made an attempt at curH
    if(curA<0||curA>=athletes.length){
      let found=-1;
      for(let i=athletes.length-1;i>=0;i--){if((athletes[i].attempts[curH]||[]).length>0){found=i;break;}}
      // If nothing at curH, try curH-1
      if(found===-1&&curH>0){
        curH=curH-1;
        for(let i=athletes.length-1;i>=0;i--){if((athletes[i].attempts[curH]||[]).length>0){found=i;break;}}
      }
      if(found===-1)return;
      curA=found;
    }
    const ath=athletes[curA];
    const marks=[...(ath.attempts[curH]||[])];
    if(!marks.length)return;
    marks.pop();
    const newAtt=[...ath.attempts];newAtt[curH]=marks;
    // Recalculate status from full attempt history
    let newStatus='competing';
    if(newAtt.some(m=>hasRetired(m)))newStatus='retired';
    else if(!newAtt.some(hasCleared)&&totalConsecutiveMisses(newAtt)>=3)newStatus='nh';
    const newAthletes=athletes.map((a,i)=>i!==curA?a:{...a,attempts:newAtt,status:newStatus});
    updSc({athletes:newAthletes,curA,curH});
  },[]);

  const startJumpOff=useCallback(()=>{
    const c=scRef.current;if(!c)return;
    const{athletes,heights}=c;
    const n=heights.length;
    const ranked=calcPlacements(athletes,heights);
    const tiedFirst=ranked.filter(r=>r.placement===1&&r.tied);
    const jumpOffIds=tiedFirst.map(a=>a.id);
    if(jumpOffIds.length<2)return;
    // JO starts 5cm above the last competition height
    const jumpOffH=(heights[n-1]||50000)+5;
    const newHeights=[...heights,jumpOffH];
    const nH_idx=newHeights.length-1;
    // Only JO athletes remain active; others become 'retired' (unless already dns/nh/retired)
    const updatedAthletes=athletes.map(a=>{
      if(TERMINAL.includes(a.status))return a;
      if(jumpOffIds.includes(a.id))return a;
      return{...a,status:'retired'};
    });
    const nA=firstJO(updatedAthletes,jumpOffIds);
    updSc({heights:newHeights,curH:nH_idx,athletes:updatedAthletes,compStatus:'active',isJumpOff:true,jumpOffIds,curA:nA});
    syncState(c,nH_idx,nA,'active').catch(e=>console.warn('syncState failed:',e));
    // Insert JO height into Supabase
    if(c.supabaseCompId&&c.scorerToken){
      sb.from('heights').insert({comp_id:c.supabaseCompId,height_cm:jumpOffH,sort_order:nH_idx}).select()
        .then(({data})=>{if(data?.[0]){const cur=scRef.current;updSc({heightIds:{...cur?.heightIds,[nH_idx]:data[0].id}});}})
        .catch(e=>console.warn('JO height sync failed:',e));
    }
  },[]);

  const endCompetition=useCallback(()=>{
    const c=scRef.current;
    updSc({compStatus:'complete-pending'});
    syncState(c,c?.curH??0,c?.curA??-1,'complete-pending').catch(e=>console.warn('syncState failed:',e));
  },[]);
  const restartComp=useCallback(()=>{
    const c=scRef.current;if(!c)return;
    // Trim back to original heights (before any JO heights were appended)
    const origHeightCount=c.origHeightCount||c.heights.length;
    const origHeights=c.heights.slice(0,origHeightCount);
    const resetAthletes=c.athletes.map(a=>({...a,attempts:Array.from({length:10},()=>[]),status:'competing'}));
    updSc({heights:origHeights,athletes:resetAthletes,curH:0,curA:firstEligible(resetAthletes,0),compStatus:'active',isJumpOff:false,jumpOffIds:[]});
  },[]);
  const verifyOfficial=useCallback(()=>{
    const c=scRef.current;if(!c)return;
    const snap={...c,compStatus:'official',savedAt:new Date().toISOString()};
    const all=loadSaved();
    const filtered=all.filter(s=>(s.id||s.compId)!==(c.compId));
    saveAll([...filtered,snap]);setSavedComps(loadSaved());
    updSc({compStatus:'official'});
    // Sync official status to Supabase so super-admin view reflects it
    if(c.compId)sb.from('competitions').update({status:'official'}).eq('slug',c.compId).then(()=>{}).catch(()=>{});
    setShowSave(true);
  },[]);

  const setCurH=useCallback(i=>updSc({curH:i,curA:firstEligible(scRef.current?.athletes||[],i)}),[]);
  const setCurA=useCallback(i=>updSc({curA:i}),[]);
  const onImport=useCallback(rows=>{const newAthletes=rows.map((r,i)=>({...mkAthlete(suRef.current.athletes.length+i+1),...r}));updSu({athletes:[...suRef.current.athletes,...newAthletes]});setShowImport(false);},[]);
  const onPhotoImport=useCallback(rows=>{const newAthletes=rows.map((r,i)=>({...mkAthlete(suRef.current.athletes.length+i+1),...r}));updSu({athletes:[...suRef.current.athletes,...newAthletes]});setShowPhotoImport(false);},[]);

  const sc_ranked=sc?calcPlacements(sc.athletes||[],sc.heights||[]):[];
  const live=sc?sc.curA:-1;
  const onDeck=sc&&sc.compStatus==='active'?(sc.isJumpOff?nextVaulterJO(sc.athletes||[],sc.curH||0,live,sc.jumpOffIds||[]):nextVaulter(sc.athletes||[],sc.curH||0,live)):-1;
  const inHole=sc&&sc.compStatus==='active'&&onDeck!==-1?(sc.isJumpOff?nextVaulterJO(sc.athletes||[],sc.curH||0,onDeck,sc.jumpOffIds||[]):nextVaulter(sc.athletes||[],sc.curH||0,onDeck)):-1;

  const TABS=[
    {id:'setup',label:'Setup',icon:'⚙️'},
    {id:'live',label:'Live',icon:'📡'},
    {id:'history',label:'History',icon:'🕐'},
    ...(authUser?[{id:'mycomps',label:'My Comps',icon:'🗂️'}]:[]),
    {id:'rules',label:'Rules',icon:'📋'},
    ...(isSuperAdmin?[{id:'admin',label:'Admin',icon:'🔐'}]:[]),
  ];

  // Auth gate (admin mode only)
  if(ROUTE.mode==='admin'&&authLoading)return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',gap:14,color:C.muted,fontSize:14}}>
      <span className="live-dot" style={{width:10,height:10,borderRadius:'50%',background:C.accent,display:'inline-block'}}/>
      Loading…
    </div>
  );
  if(ROUTE.mode==='admin'&&!authUser)return<LoginScreen/>;

  // Supabase loading / error screens for scorer + display modes
  if(sbLoading)return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',gap:16,color:C.muted,fontSize:14}}>
      <span className="live-dot" style={{width:10,height:10,borderRadius:'50%',background:C.accent,display:'inline-block'}}/>
      Loading competition…
    </div>
  );
  if(sbError)return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',gap:16,padding:24,textAlign:'center'}}>
      <div style={{fontSize:32}}>⚠️</div>
      <div style={{fontWeight:800,fontSize:16}}>Unable to load competition</div>
      <div style={{fontSize:13,color:C.muted,maxWidth:320}}>{sbError}</div>
      <button onClick={()=>window.location.hash=''}
        style={{...btn(C.accent,'10px 20px',14),marginTop:8}}>← Back to VaultDesk</button>
    </div>
  );

  return(
    <div style={{maxWidth:700,margin:'0 auto',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      {/* HEADER */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'10px 14px',display:'flex',alignItems:'center',gap:10,position:'sticky',top:0,zIndex:100}}>
        <div style={{fontWeight:900,fontSize:17,letterSpacing:-.5,flex:1}}>
          <span style={{color:C.accent}}>Vault</span>Desk
          {ROUTE.mode!=='admin'&&<span style={{fontSize:10,color:C.muted,fontWeight:500,marginLeft:8,letterSpacing:.6,textTransform:'uppercase'}}>{ROUTE.mode==='scorer'?'· Scorer':'· Display'}</span>}
        </div>
        {sc&&sc.compStatus==='complete-pending'&&<button onClick={verifyOfficial} style={btn(C.success,'6px 12px',12)}>Verify Official</button>}
        {sc?.supabaseCompId&&ROUTE.mode==='admin'&&(
          <button onClick={()=>setShowShare(true)} style={{...btn(C.card,'6px 12px',12),border:`1px solid ${C.border}`}}>🔗 Share</button>
        )}
        {authUser&&ROUTE.mode==='admin'&&(
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span style={{fontSize:10,color:C.muted,maxWidth:90,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{adminProfile?.display_name||authUser.email.split('@')[0]}</span>
            <button onClick={()=>sb.auth.signOut()} style={{...btn(C.card,'4px 8px',10),border:`1px solid ${C.border}`,color:C.muted}}>Sign Out</button>
          </div>
        )}
      </div>

      {/* TOP NAV — hidden in scorer/display mode (single-purpose views) */}
      {ROUTE.mode==='admin'&&(
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,display:'flex'}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setScreen(t.id)}
            style={{...btn(C.surface,'8px 0',10),flex:1,borderRadius:0,border:'none',flexDirection:'column',gap:2,padding:'7px 0',borderBottom:screen===t.id?`2px solid ${C.accent}`:'2px solid transparent',color:screen===t.id?C.accent:C.muted}}>
            <span style={{fontSize:16}}>{t.icon}</span>
            <span style={{fontSize:9,letterSpacing:.3,fontWeight:700}}>{t.label}</span>
          </button>
        ))}
      </div>
      )}

      {/* ACTIVE COMP BANNER (in setup, if a comp is scoring) */}
      {screen==='setup'&&sc&&sc.compStatus==='active'&&(
        <div style={{background:`${C.accent}18`,borderBottom:`1px solid ${C.accent}44`,padding:'8px 14px',display:'flex',alignItems:'center',gap:10}}>
          <span className="live-dot" style={{width:6,height:6,borderRadius:'50%',background:C.accent,display:'inline-block',flexShrink:0}}/>
          <span style={{fontSize:13,fontWeight:700,color:C.accent,flex:1}}>Scoring: {sc.info?.name||'Competition'}</span>
          <button onClick={()=>{setScreen('live');setLiveCompKey(sc.compId);setLiveSubTab('score');}} style={btn(C.accent,'5px 12px',12)}>Resume →</button>
        </div>
      )}

      {/* CONTENT */}
      <div style={{flex:1,overflowY:'auto'}}>
        {screen==='setup'&&(
          <SetupScreen
            info={su.info} setInfo={setInfo}
            rulebook={su.rulebook} setRulebook={setRulebook}
            athletes={su.athletes} addAthlete={addAthlete}
            updAthlete={updAthlete} delAthlete={delAthlete}
            moveAthlete={moveAthlete} reorder={reorder} setOrder={setOrder}
            editingId={su.editingId} setEditingId={setEditingId}
            startH={su.startH} setStartH={setStartH}
            incStr={su.incStr} setIncStr={setIncStr}
            manualH={su.manualH} setManualH={setManualH}
            doGenHeights={doGenHeights}
            heights={su.heights} setHeights={setHeights} updateHeight={updateHeight}
            primaryMetric={primaryMetric}
            startComp={startComp}
            dirEmail={su.dirEmail} setDirEmail={setDirEmail}
            onImport={()=>setShowImport(true)}
            onPhotoImport={()=>setShowPhotoImport(true)}
          />
        )}
        {screen==='live'&&(
          <LiveDashboard
            savedComps={savedComps} sc={sc} primaryMetric={primaryMetric}
            liveCompKey={liveCompKey} setLiveCompKey={setLiveCompKey}
            liveSubTab={liveSubTab} setLiveSubTab={setLiveSubTab}
            onResumeComp={comp=>{const cur=scRef.current;if(cur&&cur.compStatus==='active'){const all=loadSaved();if(!all.some(c=>(c.sc?.compId||c.compId)===cur.compId)){saveAll([...all,cur]);}}setSc({...comp,...(comp.sc||{})});setSavedComps(loadSaved());}}
            onDeleteComp={(compId,isCur)=>{if(isCur){setSc(null);setLiveCompKey(null);setScreen('setup');}deleteComp(compId);setSavedComps(loadSaved());}}
            athletes={sc?.athletes||[]} ranked={sc_ranked} heights={sc?.heights||[]}
            curH={sc?.curH||0} setCurH={setCurH} curA={sc?.curA??-1} setCurA={setCurA}
            recordMark={recordMark} undoMark={undoMark}
            live={live} onDeck={onDeck} inHole={inHole}
            compStatus={sc?.compStatus||'active'} info={sc?.info||{}} rulebook={sc?.rulebook||'WA'}
            isJumpOff={sc?.isJumpOff||false} startJumpOff={startJumpOff} onEnd={endCompetition}
            onEditSetup={()=>setShowEdit(true)} onRestart={restartComp} updSc={updSc}
          />
        )}
        {screen==='display'&&sc&&<DisplayScreen sc={sc} primaryMetric={primaryMetric} updSc={updSc}/>}
        {screen==='rules'&&<RulesTab/>}
        {screen==='mycomps'&&authUser&&<MyCompsScreen authUser={authUser}/>}
        {screen==='admin'&&isSuperAdmin&&<SuperAdminScreen/>}
        {screen==='history'&&(
          <HistoryScreen
            saved={savedComps}
            primaryMetric={primaryMetric}
            onResume={comp=>{setSc({...comp,...(comp.sc||{})});setScreen('live');setLiveCompKey((comp.sc||comp).compId);setLiveSubTab('score');}}
            onReview={comp=>{setSc({...comp,...(comp.sc||{})});setScreen('live');setLiveCompKey((comp.sc||comp).compId);setLiveSubTab('display');}}
            onDelete={id=>{deleteComp(id);setSavedComps(loadSaved());}}
          />
        )}
      </div>

      {/* MODALS */}
      {showEdit&&sc&&<EditOverlay sc={sc} updSc={updSc} onClose={()=>setShowEdit(false)}/>}
      {showImport&&<ImportDialog onImport={onImport} onClose={()=>setShowImport(false)} existingAthletes={su.athletes}/>}
      {showPhotoImport&&<PhotoImportDialog onImport={onPhotoImport} onClose={()=>setShowPhotoImport(false)} existingAthletes={su.athletes}/>}
      {showSave&&sc&&<SaveResultsDialog athletes={sc.athletes} heights={sc.heights} ranked={sc_ranked} info={sc.info} primaryMetric={primaryMetric} onClose={()=>setShowSave(false)}/>}
      {showShare&&sc&&<SharePanel sc={sc} onClose={()=>setShowShare(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<VaultDeskApp/>);
</script>
</body>
</html>
