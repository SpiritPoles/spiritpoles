  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f0f14;--surface:#1a1a24;--card:#22222e;--border:#2e2e3d;--accent:#4f7cff;--success:#22c55e;--danger:#ef4444;--warn:#f59e0b;--text:#f0f0f0;--muted:#8888aa}
    html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
    input,select,button,textarea{font-family:inherit}
    input,select,textarea{color:var(--text);background:var(--card)}
    input::placeholder,textarea::placeholder{color:var(--muted)}
    select option{background:#22222e}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    .live-dot{animation:blink 1.4s ease-in-out infinite}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:var(--surface)}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    .vd-dragging{opacity:.12;border:2px dashed rgba(79,124,255,.35)!important;border-radius:10px;background:transparent!important;pointer-events:none}
    .vd-drag-over{position:relative}
    .vd-drag-over::before{content:'';position:absolute;top:-5px;left:10px;right:10px;height:3px;background:#4f7cff;border-radius:3px;z-index:20}
    input[type=number]{-moz-appearance:textfield}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    /* ── VaultDesk Display ── */
    @keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(79,124,255,.5)}70%{box-shadow:0 0 0 8px rgba(79,124,255,0)}100%{box-shadow:0 0 0 0 rgba(79,124,255,0)}}
    .vd-now-bar{background:linear-gradient(135deg,rgba(79,124,255,.18) 0%,rgba(79,124,255,.06) 100%);border-bottom:1px solid rgba(79,124,255,.25)}
    .vd-hero-ht{font-size:56px;font-weight:900;color:#fff;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
    .vd-hero-ht-alt{font-size:14px;font-weight:600;color:var(--muted);margin-top:4px}
    .vd-hero-name{font-size:26px;font-weight:900;color:#fff;letter-spacing:-.5px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .vd-hero-lastname{text-transform:uppercase;letter-spacing:.5px}
    .vd-attempt-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;display:inline-block}
    .vd-tbl-row{transition:background .12s}
    .vd-tbl-row:hover{background:rgba(79,124,255,.07)!important}
    .vd-mark{font-size:13px;font-weight:900;letter-spacing:.5px}
    .vd-mark-o{color:#22c55e}
    .vd-mark-x{color:#f87171}
    .vd-mark-p{color:#f59e0b}
    .vd-mark-ip{color:#93c5fd}
    .vd-lb-card{border-radius:12px;overflow:hidden;margin-bottom:7px;transition:transform .1s}
    .vd-lb-card:active{transform:scale(.99)}
    /* Mobile */
    @media (max-width:520px){
      .vd-hero-ht{font-size:38px!important;letter-spacing:-2px!important}
      .vd-hero-ht-alt{font-size:11px!important}
      .vd-hero-name{font-size:19px!important}
      .vd-hide-mobile{display:none!important}
      .vd-tbl-wrap{font-size:10.5px!important}
      .vd-banner-title{font-size:15px!important;white-space:normal!important}
      .vd-sub-tab{padding:10px 0!important;font-size:11px!important}
      .vd-ondeck{font-size:11px!important}
    }
    @media (min-width:521px) and (max-width:768px){
      .vd-hero-ht{font-size:46px!important}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useCallback,useEffect,useRef}=React;

// ─── SUPABASE ─────────────────────────────────────────────────────────────────
const SUPABASE_URL='https://oicczjlbmxxoylkbuxzy.supabase.co';
const SUPABASE_KEY='sb_publishable_jf648alt67vbmJRYviMR7g_IH0fSk1O';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SUPER_ADMIN_EMAIL='think4sport@gmail.com';

// URL routing: #/score/SLUG/TOKEN → scorer mode, #/display/SLUG → display mode
const parseRoute=()=>{
  const h=window.location.hash;
  const sm=h.match(/^#\/score\/([^/]+)\/([^/]+)$/);if(sm)return{mode:'scorer',slug:sm[1],token:sm[2]};
  const dm=h.match(/^#\/display\/([^/]+)$/);if(dm)return{mode:'display',slug:dm[1]};
  return{mode:'admin'};
};
const ROUTE=parseRoute();

// Publish a competition to Supabase (called from startComp)
const publishCompetition=async(su,sc)=>{
  let{data:{session}}=await sb.auth.getSession();
  if(!session)throw new Error('Not signed in. Please log in to create a competition.');
  const userId=session?.user?.id;
  const slug=sc.compId||`c_${Date.now().toString(36)}`;
  const{data:comp,error:compErr}=await sb.from('competitions').upsert({
    slug,owner_id:userId,name:su.info?.name||'',date:su.info?.date||null,
    venue:su.info?.venue||'',gender:su.info?.gender||null,rulebook:su.rulebook||'WA',
    status:'active',cur_height_idx:0,cur_athlete_idx:sc.curA??-1,
    inc_str:su.incStr||'',start_h:su.startH||'',
  },{onConflict:'slug'}).select().single();
  if(compErr)throw compErr;
  const compId=comp.id;const scorerToken=comp.scorer_token;
  // Heights
  await sb.from('heights').delete().eq('comp_id',compId);
  const{data:heights,error:hErr}=await sb.from('heights')
    .insert(sc.heights.map((h,i)=>({comp_id:compId,height_cm:h,sort_order:i}))).select();
  if(hErr)throw hErr;
  // Athletes
  await sb.from('athletes').delete().eq('comp_id',compId);
  const{data:athletes,error:aErr}=await sb.from('athletes').insert(sc.athletes.map((a,i)=>({
    comp_id:compId,athlete_key:a.id,first_name:a.firstName||'',last_name:a.lastName||'',
    affiliation:a.affiliation||'',country:a.country||'',bib:a.bib||'',pb:a.pb||'',sb:a.sb||'',
    status:a.status||'competing',sort_order:i,
  }))).select();
  if(aErr)throw aErr;
  const athIds={};athletes.forEach(r=>{athIds[r.athlete_key]=r.id;});
  const heightIds={};heights.forEach(r=>{heightIds[r.sort_order]=r.id;});
  return{supabaseCompId:compId,scorerToken,athIds,heightIds};
};

// Sync a mark to Supabase via SECURITY DEFINER RPC
const syncMark=async(sc,athLocalId,hIdx,marks)=>{
  if(!sc?.supabaseCompId||!sc?.scorerToken)return;
  const athId=sc.athIds?.[athLocalId];const hId=sc.heightIds?.[hIdx];
  if(!athId||!hId)return;
  const{error}=await sb.rpc('record_mark',{
    p_comp_id:sc.supabaseCompId,p_athlete_id:athId,p_height_id:hId,
    p_marks:marks,p_scorer_token:sc.scorerToken,
  });
  if(error)throw error;
};

// Sync competition state (curH, curA, status) via SECURITY DEFINER RPC
const syncState=async(sc,curH,curA,status)=>{
  if(!sc?.supabaseCompId||!sc?.scorerToken)return;
  const{error}=await sb.rpc('advance_competition_state',{
    p_comp_id:sc.supabaseCompId,p_cur_height_idx:curH??0,
    p_cur_athlete_idx:curA??-1,p_status:status||'active',
    p_scorer_token:sc.scorerToken,
  });
  if(error)throw error;
};

// Load competition from Supabase by slug
const loadCompFromSupabase=async(slug)=>{
  const{data:comp,error}=await sb.from('competitions').select().eq('slug',slug).single();
  if(error||!comp)throw new Error('Competition not found: '+slug);
  const[{data:hRows},{data:aRows},{data:attRows}]=await Promise.all([
    sb.from('heights').select().eq('comp_id',comp.id).order('sort_order'),
    sb.from('athletes').select().eq('comp_id',comp.id).order('sort_order'),
    sb.from('attempts').select().eq('comp_id',comp.id),
  ]);
  const heightCms=(hRows||[]).map(h=>h.height_cm);
  const heightIds={};(hRows||[]).forEach(h=>{heightIds[h.sort_order]=h.id;});
  const athIds={};
  const localAthletes=(aRows||[]).map(a=>{
    athIds[a.athlete_key]=a.id;
    const athAttempts=Array.from({length:heightCms.length},()=>[]);
    (attRows||[]).filter(att=>att.athlete_id===a.id).forEach(att=>{
      const hRow=(hRows||[]).find(h=>h.id===att.height_id);
      if(hRow)athAttempts[hRow.sort_order]=att.marks||[];
    });
    return{id:a.athlete_key,firstName:a.first_name,lastName:a.last_name,
      affiliation:a.affiliation||'',country:a.country||'',bib:a.bib||'',
      pb:a.pb||'',sb:a.sb||'',status:a.status||'competing',
      order:a.sort_order+1,attempts:athAttempts};
  });
  return{sc:{
    info:{name:comp.name||'',date:comp.date||'',venue:comp.venue||'',gender:comp.gender||''},
    rulebook:comp.rulebook||'WA',heights:heightCms,athletes:localAthletes,
    curH:comp.cur_height_idx||0,curA:comp.cur_athlete_idx??-1,
    compStatus:comp.status||'active',compId:comp.slug,
    supabaseCompId:comp.id,scorerToken:comp.scorer_token,athIds,heightIds,
  }};
};

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const RULEBOOKS=[{key:'WA',label:'World Athletics / USATF'},{key:'NCAA',label:'NCAA'},{key:'NFHS',label:'NFHS (High School)'}];

const RULEBOOK_CFG={
  WA:{minIncCm:5,jumpOffRequired:true,jumpOffNote:'Jump-off required — WA Rule 26.8.4',tieLabel:'Tie for 1st · Jump-Off Required'},

  NFHS:{minIncCm:null,jumpOffRequired:false,jumpOffNote:'Co-Champions by default; jump-off optional by mutual consent — NFHS Rule 6-3 Art.2',tieLabel:'Tie for 1st · Co-Champions (NFHS)'},
};

// RULES_DATA — categorized for all three rulebooks
const RULES_DATA={

        {title:'Failed Attempt — Pole Vault',rule:'Rule 28.2',text:'A vault is failed if: (a) the bar is dislodged by the athlete\'s body or pole; (b) the athlete steadies the bar during the attempt; (c) any part of the body or pole touches the ground or landing area beyond the vertical plane of the inside edge of the top of the vaulting box before the bar is cleared; or (d) the athlete moves the upper hand higher on the pole, or raises the lower hand above the upper hand, during the vault.'},

        {title:'Jump-Off Starting Height',rule:'Rule 26.9',text:'The jump-off starts at the next height in the original competition progression above the last cleared height. If the tie occurred outside the normal progression, the bar is set 5 cm above the last cleared height. Minimum increment in the jump-off is 5 cm.'},

      {name:'Equipment — Poles',icon:'🏋️',sections:[
        {title:'Pole Material & Dimensions',rule:'Rule 28.3.1',text:'A vaulting pole may be made of any material or combination of materials and may be of any length or diameter. There is no restriction on the mass (weight) of the pole.'},
        {title:'Pole Grip Tape',rule:'Rule 28.3.2',text:'The pole may have a binding of adhesive tape or any other material at the grip end and at the bottom. The grip tape must be of uniform texture and not built up in a way that produces raised rings or ridges that would allow the athlete to gain a grip advantage.'},

        {title:'Uprights / Standards Height Range',rule:'Rule 28.5',text:'The uprights shall be rigidly fixed and may be of any construction provided they are rigid and stable. They must allow the crossbar to be set at heights from at least 3.71 m to at least 6.21 m above the ground (or above the landing area if the landing area is higher). Higher ranges are required for elite competitions.'},

const parsePaste=text=>{const r={};const pb=text.match(/(?:PB|PR|Personal\s+(?:Best|Record))[:\s]+([0-9]+[''\-.][0-9]*(?:\s*[0-9]+\/[0-9]+)?(?:m|in)?)/i);const sb=text.match(/(?:SB|Season(?:al)?\s+(?:Best|Record))[:\s]+([0-9]+[''\-.][0-9]*(?:\s*[0-9]+\/[0-9]+)?(?:m|in)?)/i);const cc=text.match(/\b([A-Z]{3})\b/g);if(pb)r.pb=pb[1].trim();if(sb)r.sb=sb[1].trim();if(cc){const k=cc.find(c=>IOC_ISO[c]);if(k)r.country=k;}return r};
const mToFtIn=m=>{const ti=m*39.3701,ft=Math.floor(ti/12),raw=ti%12;const q=Math.round(raw*4)/4,whole=Math.floor(q),frac=q-whole;return`${ft}'${whole}${frac===0?'':frac===.25?'¼':frac===.5?'½':'¾'}"`};
const fmtH=(cm,metric)=>{if(!cm&&cm!==0)return'';return metric?`${(cm/100).toFixed(2)}m`:mToFtIn(cm/100)};

// parseHeight: accepts "5.00" (meters), "11-6" or "11'6" (feet-inches), or "500" (cm>=100)
const parseHeight=str=>{
  if(!str)return NaN;
  str=String(str).trim();
  const ftIn=str.match(/^(\d+)[-' ]\s*(\d+)/);
  if(ftIn)return Math.round((parseInt(ftIn[1])*12+parseInt(ftIn[2]))*2.54);
  const n=parseFloat(str);
  if(!isNaN(n)&&n>=100)return Math.round(n); // assume cm
  if(!isNaN(n)&&n<20)return Math.round(n*100); // assume meters
  return NaN;
};

const hasCleared=m=>Array.isArray(m)&&m.includes('O');
const hasRetired=m=>Array.isArray(m)&&m.includes('R');
const hasPassed=m=>Array.isArray(m)&&m.includes('P');
const countMisses=m=>Array.isArray(m)?m.filter(x=>x==='X').length:0;
const TERMINAL=['dns','retired','nh'];
const isDone=(marks,status)=>TERMINAL.includes(status)||hasCleared(marks)||countMisses(marks)>=3||hasRetired(marks)||hasPassed(marks);
const isNH=marks=>countMisses(marks)>=3&&!hasCleared(marks);

const highestClearedIdx=(a,n)=>{for(let i=n-1;i>=0;i--)if(hasCleared(a.attempts[i]))return i;return-1};
const totalMisses=(a,n)=>{let t=0;for(let i=0;i<n;i++)t+=countMisses(a.attempts[i]||[]);return t};

const calcPlacements=(athletes,heights)=>{
  const n=heights.length;
  const dns=athletes.filter(a=>a.status==='dns');
  // out = definitively eliminated with no clears (NH/retired confirmed)
  const out=athletes.filter(a=>a.status!=='dns'&&highestClearedIdx(a,n)<0&&(TERMINAL.includes(a.status)||totalConsecutiveMisses(a.attempts)>=3));
  // pending = still competing, no clears yet — don't show as NH during live comp
  const pending=athletes.filter(a=>a.status!=='dns'&&highestClearedIdx(a,n)<0&&!TERMINAL.includes(a.status)&&totalConsecutiveMisses(a.attempts)<3);
  const withH=athletes.filter(a=>highestClearedIdx(a,n)>=0);
  const sorted=[...withH].sort((a,b)=>{
    const ai=highestClearedIdx(a,n),bi=highestClearedIdx(b,n);
    if(bi!==ai)return bi-ai;
    const am=countMisses(a.attempts[ai]||[]),bm=countMisses(b.attempts[bi]||[]);
    if(am!==bm)return am-bm;
    return totalMisses(a,n)-totalMisses(b,n);
  });
  const result=[];let place=1;
  for(let i=0;i<sorted.length;i++){
    let p=place;
    if(i>0){
      const pr=sorted[i-1],cr=sorted[i];
      const pi=highestClearedIdx(pr,n),ci=highestClearedIdx(cr,n);
      if(pi===ci&&countMisses(pr.attempts[pi]||[])===countMisses(cr.attempts[ci]||[])&&totalMisses(pr,n)===totalMisses(cr,n))p=result[i-1].placement;
    }
    result.push({...sorted[i],placement:p});
    place=Math.max(place,i+2);
  }
  for(let i=0;i<result.length;i++)result[i].tied=result.some((r,j)=>j!==i&&r.placement===result[i].placement);
  return[...result,...out.map(a=>({...a,placement:null,tied:false})),...pending.map(a=>({...a,placement:null,tied:false})),...dns.map(a=>({...a,placement:null,tied:false}))];
};

const plLabel=p=>p===1?'1st':p===2?'2nd':p===3?'3rd':`${p}th`;
// Consecutive misses across all heights: O resets, P preserves, X increments
const totalConsecutiveMisses=attempts=>{let c=0;for(const m of attempts){if(!m||!m.length)continue;if(hasCleared(m)){c=0;continue;}c+=countMisses(m);}return c;};
// Athlete is out of competition if terminal status OR 3 consecutive misses (carries across heights when passing)
const isEliminatedFromComp=a=>TERMINAL.includes(a.status)||totalConsecutiveMisses(a.attempts)>=3;
const nextVaulter=(athletes,hIdx,fromIdx)=>{const n=athletes.length;for(let s=1;s<=n;s++){const idx=(fromIdx+s)%n;const a=athletes[idx];if(!isEliminatedFromComp(a)&&!isDone(a.attempts[hIdx]||[],a.status))return idx;}return-1};
const firstEligible=(athletes,hIdx)=>{for(let i=0;i<athletes.length;i++){const a=athletes[i];if(!isEliminatedFromComp(a)&&!isDone(a.attempts[hIdx]||[],a.status))return i;}return-1};
// Jump-off helpers — jIds = array of athlete IDs participating in the JO
const firstJO=(athletes,jIds)=>{for(let i=0;i<athletes.length;i++){const a=athletes[i];if(jIds.includes(a.id)&&!TERMINAL.includes(a.status))return i;}return-1};
// Next JO athlete who hasn't yet attempted curH (each athlete gets exactly 1 attempt in JO)
const nextVaulterJO=(athletes,hIdx,fromIdx,jIds)=>{const n=athletes.length;for(let s=1;s<=n;s++){const idx=(fromIdx+s)%n;const a=athletes[idx];if(!jIds.includes(a.id)||TERMINAL.includes(a.status)||(a.attempts[hIdx]||[]).length>=1)continue;return idx;}return-1};

// genHeights — maxH=6 by default (expandable to 10 in editor)
const genHeights=(startStr,incStr,maxH=6)=>{
  const startCm=parseHeight(startStr);
  if(isNaN(startCm))return[];
  const rules=[];
  for(const part of incStr.split(',').map(s=>s.trim())){
    const m=part.match(/(\d+(?:\.\d+)?)\s*cm(?:\s*[x×]\s*(\d+))?/i);
    if(m)rules.push({cm:parseFloat(m[1]),count:m[2]?parseInt(m[2]):99});
  }
  const hs=[startCm];let cur=startCm;
  for(const{cm,count}of rules){for(let i=0;i<count;i++){cur+=cm;hs.push(cur);if(hs.length>=maxH)return hs;}}
  return hs;
};
const parseManual=str=>str.split(/[,\s]+/).map(s=>parseHeight(s)).filter(n=>!isNaN(n)).slice(0,10);

const parseAthleteCSV=text=>{
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return[];
  const first=lines[0].toLowerCase();
  const hasHeader=first.includes('name')||first.includes('first')||first.includes('last')||first.includes('country');
  const dataLines=hasHeader?lines.slice(1):lines;
  return dataLines.map(line=>{
    const cols=line.split(/[,\t;]/).map(c=>c.trim().replace(/^["']|["']$/g,''));
    if(cols.length>=2){
      let idx=0;if(!isNaN(cols[0]))idx=1;
      const firstName=cols[idx]||'';const lastName=cols[idx+1]||'';
      const country=cols.find(c=>IOC_ISO[c.toUpperCase()])?cols.find(c=>IOC_ISO[c.toUpperCase()]).toUpperCase():'';
      const affiliation=cols[idx+2]&&!IOC_ISO[cols[idx+2].toUpperCase()]?cols[idx+2]:'';
      const heightCols=cols.filter(c=>/^\d+[\.''-]/.test(c)&&c!==firstName&&c!==lastName);
      let pb='',sb='';
      if(heightCols.length===1){sb=heightCols[0];}
      else if(heightCols.length>=2){
        const sorted=[...heightCols].sort((a,b)=>{const pa=parseHeight(a),pb_=parseHeight(b);return(isNaN(pa)?0:pa)-(isNaN(pb_)?0:pb_);});
        sb=sorted[0];pb=sorted[sorted.length-1];
      }
      return{firstName,lastName,country,affiliation,pb,sb};
    }
    return null;
  }).filter(Boolean);
};

const buildResultsCSV=(athletes,heights,ranked,info,primaryMetric)=>{
  const n=heights.length;
  const headers=['Order','Place','First','Last','Country','Affiliation','PB','SB','Best',...heights.map((h,i)=>`H${i+1} ${fmtH(h,primaryMetric)}`)];
  const rows=[...ranked].sort((a,b)=>{
    if(a.placement&&b.placement)return a.placement-b.placement;
    if(a.placement)return-1;if(b.placement)return 1;
    return(a.order||0)-(b.order||0);
  }).map(ath=>{
    const best=highestClearedIdx(ath,n);
    const pl=ath.placement?(ath.tied?ath.placement+'=':ath.placement):(ath.status==='dns'?'DNS':'NH');
    return[ath.order,pl,ath.firstName,ath.lastName,ath.country,ath.affiliation,ath.pb,ath.sb,
      best>=0?fmtH(heights[best],primaryMetric):'',
      ...heights.map((_,hi)=>(ath.attempts[hi]||[]).join('')||'')];
  });
  const q=v=>`"${String(v||'').replace(/"/g,'""')}"`;
  return[headers,...rows].map(r=>r.map(q).join(',')).join('\n');
};

// ─── DUAL HEIGHT DISPLAY ──────────────────────────────────────────────────────
// Shows both units: primary (large) and secondary (small below). No toggle needed.
function DualH({cm,primaryMetric=true,pSize=14,sSize=11,style={}}){
  if(!cm&&cm!==0)return<span style={{color:C.muted}}>—</span>;
  return(
    <div style={{display:'flex',flexDirection:'column',gap:1,...style}}>
      <span style={{fontWeight:700,fontSize:pSize}}>{fmtH(cm,primaryMetric)}</span>
      <span style={{fontSize:sSize,color:C.muted}}>{fmtH(cm,!primaryMetric)}</span>
    </div>
  );
}

// ─── FLAG CELL ───────────────────────────────────────────────────────────────
function FlagCell({athlete,size=26}){

  const src=athlete.logoUrl||(!err&&getFlagUrl(athlete.country))||null;
  if(src)return<img src={src} alt={athlete.country||''} onError={()=>setErr(true)} style={{width:size,height:Math.round(size*.75),borderRadius:3,objectFit:'cover',flexShrink:0,background:C.border,display:'block'}}/>;
  const lbl=athlete.country?athlete.country.toUpperCase().slice(0,3):'?';

}

// ─── COUNTRY INPUT ───────────────────────────────────────────────────────────
function CountryInput({value,onChange,compact=false}){
  const[sugg,setSugg]=useState([]);

  const handleChange=e=>{const v=e.target.value;onChange(v);setSugg(getCountrySuggestions(v));setOpen(true);};
  const pick=code=>{onChange(code);setSugg([]);setOpen(false);};
  const handleBlur=()=>setTimeout(()=>setOpen(false),150);
  const style=compact?{...inp,padding:'6px 8px',fontSize:13}:inp;
  return(
    <div style={{position:'relative'}}>
      <input style={style} placeholder={compact?"Country (USA)":"Country — IOC code (USA) or name (Sweden)"} value={value} onChange={handleChange} onFocus={()=>value.length>=2&&setOpen(true)} onBlur={handleBlur}/>
      {open&&sugg.length>0&&(
        <div style={{position:'absolute',top:'100%',left:0,right:0,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,zIndex:200,overflow:'hidden',boxShadow:'0 4px 20px rgba(0,0,0,.4)'}}>
          {sugg.map((s,i)=>(

// ─── IMPORT DIALOG ───────────────────────────────────────────────────────────
function ImportDialog({onImport,onClose,existingAthletes=[]}){
  const[dragOver,setDragOver]=useState(false);
  const[preview,setPreview]=useState([]);
  const[error,setError]=useState('');
  const[raw,setRaw]=useState('');
  const nameKey=a=>`${(a.firstName||'').trim()} ${(a.lastName||'').trim()}`.trim().toLowerCase();
  const existingKeys=useMemo(()=>new Set(existingAthletes.filter(a=>nameKey(a)).map(nameKey)),[existingAthletes]);
  const processText=text=>{setRaw(text);const rows=parseAthleteCSV(text);if(rows.length>0){setPreview(rows);setError('');}else setError('Could not parse. Make sure columns include First Name, Last Name, Country (IOC code or full name).');};
  const handleDrop=e=>{e.preventDefault();setDragOver(false);const file=e.dataTransfer.files[0];if(file)file.text().then(processText);};
  const handleFile=e=>{const file=e.target.files[0];if(file)file.text().then(processText);};
  const handlePaste=e=>{const text=e.clipboardData.getData('text');if(text){e.preventDefault();processText(text);}};
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:700,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px 10px'}} onClick={onClose}>
      <div style={{background:C.surface,borderRadius:16,padding:20,width:'100%',maxWidth:560,maxHeight:'85vh',overflowY:'auto',border:`1px solid ${C.border}`}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:16,flex:1}}>Import Athletes</div>
          <button onClick={onClose} style={btn('#333','7px 14px',13)}>✕</button>
        </div>
        <div style={{fontSize:13,color:C.muted,marginBottom:12,lineHeight:1.7,background:C.card,borderRadius:8,padding:'10px 12px',border:`1px solid ${C.border}`}}>
          <strong style={{color:C.text}}>Three ways to import:</strong><br/>
          1. <strong style={{color:C.text}}>Paste from Spreadsheet</strong> — select cells and paste below or type data manually<br/>
          2. Drop or select a <strong style={{color:C.text}}>CSV / TXT file</strong><br/>
          <span style={{color:C.muted,fontSize:11}}>Expected columns: First · Last · Country (IOC code or name) · Affiliation · PB · SB</span>
        </div>
        {/* Manual entry — dotted box, above the drop zone */}
        <div style={{border:`2px dashed ${C.border}`,borderRadius:12,padding:'12px 14px',marginBottom:12}}>
          <div style={{fontSize:12,color:C.muted,marginBottom:6,fontWeight:700}}>Paste or type athlete data:</div>
          <textarea value={raw} onChange={e=>processText(e.target.value)} onPaste={handlePaste} placeholder={"John\tSmith\tUSA\tUniversity of Oregon\t5.45m"} style={{...inp,height:70,resize:'vertical',fontSize:13,display:'block'}}/>
        </div>
        {/* Drop zone — smaller */}
        <div onDrop={handleDrop} onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)}
          style={{border:`1px dashed ${dragOver?C.accent:C.border}`,borderRadius:10,padding:'10px 14px',marginBottom:14,background:dragOver?`${C.accent}11`:'transparent',transition:'all .2s',display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:18}}>📂</span>
          <span style={{fontSize:13,color:C.muted,flex:1}}>Drop CSV / TXT file here</span>
          <label style={{display:'inline-block',flexShrink:0}}>
            <span style={{...btn(C.card,'5px 12px',12),cursor:'pointer',border:`1px solid ${C.border}`}}>Browse</span>
            <input type="file" accept=".csv,.txt,.tsv" onChange={handleFile} style={{display:'none'}}/>
          </label>
        </div>
        {error&&<div style={{fontSize:12,color:C.danger,marginBottom:10}}>{error}</div>}
        {preview.length>0&&(
          <div>
            <div style={{fontSize:12,fontWeight:700,color:C.success,marginBottom:8}}>Found {preview.length} athlete{preview.length!==1?'s':''}:</div>
            <div style={{background:C.card,borderRadius:8,padding:'8px 0',marginBottom:14,maxHeight:180,overflowY:'auto'}}>
              {preview.map((a,i)=>{
                const isDupe=existingKeys.has(nameKey(a));
                return(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 12px',fontSize:13,borderBottom:i<preview.length-1?`1px solid ${C.border}`:'none',opacity:isDupe?.45:1}}>
                    <FlagCell athlete={a} size={18}/>
                    <span style={{fontWeight:600}}>{a.firstName} {a.lastName}</span>
                    {a.country&&<span style={{color:C.muted,fontSize:11}}>{a.country}</span>}
                    {a.affiliation&&<span style={{color:C.muted,fontSize:11}}>{a.affiliation}</span>}
                    {a.pb&&<span style={{color:C.accent,fontSize:11}}>PB {a.pb}</span>}
                    {a.sb&&<span style={{color:C.success,fontSize:11}}>SB {a.sb}</span>}
                    {isDupe&&<span style={{fontSize:10,color:C.warn,background:`${C.warn}18`,borderRadius:4,padding:'1px 6px',flexShrink:0,marginLeft:'auto',border:`1px solid ${C.warn}33`}}>duplicate</span>}
                  </div>
                );
              })}
            </div>
            {(()=>{const fresh=preview.filter(a=>!existingKeys.has(nameKey(a)));const dc=preview.length-fresh.length;return(
              <button onClick={()=>onImport(fresh)} disabled={!fresh.length}
                style={{...btn(fresh.length?C.success:'#374151','10px 20px',14),width:'100%',opacity:fresh.length?1:.5}}>
                {fresh.length?`Import ${fresh.length} Athlete${fresh.length!==1?'s':''}${ dc?` · ${dc} duplicate${dc!==1?'s':''} skipped`:''}`:'All duplicates — nothing new to import'}
              </button>
            );})()}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── INCREMENT STEP BUILDER (Advanced mode) ───────────────────────────────────
// ─── PHOTO IMPORT DIALOG ──────────────────────────────────────────────────────
function PhotoImportDialog({onImport,onClose,existingAthletes=[]}){
  const[step,setStep]=useState('upload'); // upload | ready | scanning | review | error
  const[imgUrl,setImgUrl]=useState(null);
  const[imgFile,setImgFile]=useState(null);
  const[progress,setProgress]=useState(0);
  const[progressMsg,setProgressMsg]=useState('');
  const[candidates,setCandidates]=useState([]);
  const fileRef=useRef(null);

  const toTitle=s=>s?s.toLowerCase().replace(/(?:^|\s|-|')\S/g,c=>c.toUpperCase()):'';

  const parseLine=line=>{
    // Strip leading bib/rank numbers
    let clean=line.replace(/^\s*\d+\.?\s+/,'').trim();
    // Strip trailing marks, heights, times
    clean=clean.replace(/\s+\d[\d.,:/'½¼¾\s]*(m|ft|cm|s|min)?.*$/i,'').trim();
    // Strip isolated 3-letter IOC country codes
    clean=clean.replace(/\b[A-Z]{3}\b/g,'').replace(/\s{2,}/g,' ').trim();
    if(clean.length<3)return null;
    const parts=clean.split(/\s+/).filter(Boolean);
    if(!parts.length)return null;
    // "SMITH, John" — comma format
    const commaM=clean.match(/^([A-Z][A-Z'\-\s]+),\s*(.+)$/);
    if(commaM)return{firstName:toTitle(commaM[2].trim()),lastName:toTitle(commaM[1].trim())};
    // "SMITH John" — all-caps surname first
    if(parts.length>=2&&parts[0]===parts[0].toUpperCase()&&/^[A-Z'-]+$/.test(parts[0])&&parts[0].length>1){
      return{firstName:toTitle(parts.slice(1).join(' ')),lastName:toTitle(parts[0])};
    }
    // "John Smith" — normal order
    if(parts.length===1)return{firstName:toTitle(parts[0]),lastName:''};
    return{firstName:toTitle(parts[0]),lastName:toTitle(parts.slice(1).join(' '))};
  };

  const handleFile=e=>{
    const file=e.target.files?.[0];if(!file)return;
    setImgFile(file);setImgUrl(URL.createObjectURL(file));setStep('ready');
  };

  const scan=async()=>{
    if(!imgFile)return;
    if(!window.Tesseract){alert('OCR library still loading — try again in a moment.');return;}
    setStep('scanning');setProgress(0);setProgressMsg('Initializing…');
    try{
      const{data:{text}}=await window.Tesseract.recognize(imgFile,'eng',{
        logger:m=>{
          if(m.status==='recognizing text'){setProgress(Math.round(m.progress*100));setProgressMsg('Reading text…');}
          else setProgressMsg((m.status||'').replace(/_/g,' '));
        }
      });
      const SKIP=new Set(['name','athlete','athletes','affiliation','club','team','country','nation','bib','heat','flight','group','event','result','mark','height','place','rank','pos','position','dnf','dns','nh','nm','nr','pb','sb','wind','qual','qualification','final','finals','start','list','entry','entries','men','women','boys','girls','pole','vault','high','long','triple','jump','round','attempt']);
      const lines=text.split('\n')
        .map(l=>l.trim())
        .filter(l=>l.length>=4&&/[a-zA-Z]{2,}/.test(l))
        .filter(l=>!/^[\d\s.,:/'½¾\-]+$/.test(l))
        .filter(l=>{const ws=l.toLowerCase().split(/\s+/);return!ws.every(w=>SKIP.has(w));});
      const parsed=lines.map((line,i)=>{
        const r=parseLine(line);if(!r)return null;
        return{id:i,raw:line,firstName:r.firstName,lastName:r.lastName,affiliation:'',checked:!!(r.firstName||r.lastName)};
      }).filter(Boolean);
      setCandidates(parsed);setStep('review');
    }catch(e){setProgressMsg('Scan failed: '+(e.message||'Unknown error'));setStep('error');}
  };

  const toggle=id=>setCandidates(cs=>cs.map(c=>c.id===id?{...c,checked:!c.checked}:c));
  const upd=(id,f,v)=>setCandidates(cs=>cs.map(c=>c.id===id?{...c,[f]:v}:c));
  const rem=id=>setCandidates(cs=>cs.filter(c=>c.id!==id));

  const nameKey=a=>`${(a.firstName||'').trim()} ${(a.lastName||'').trim()}`.trim().toLowerCase();
  const exKeys=useMemo(()=>new Set(existingAthletes.filter(a=>nameKey(a)).map(nameKey)),[existingAthletes]);
  const selected=candidates.filter(c=>c.checked&&(c.firstName||c.lastName));
  const fresh=selected.filter(a=>!exKeys.has(nameKey(a)));
  const dupes=selected.length-fresh.length;

  const confirm=()=>onImport(fresh.map(c=>({firstName:c.firstName,lastName:c.lastName,affiliation:c.affiliation})));

  const overlayStyle={position:'fixed',inset:0,background:'rgba(0,0,0,.85)',zIndex:700,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px 10px'};
  const panelStyle={background:C.surface,borderRadius:16,padding:20,width:'100%',maxWidth:520,maxHeight:'92vh',overflowY:'auto',border:`1px solid ${C.border}`};

  return(
    <div style={overlayStyle} onClick={onClose}>
      <div style={panelStyle} onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',marginBottom:16}}>
          <div style={{fontWeight:800,fontSize:16,flex:1}}>📷 Scan Athlete List</div>
          <button onClick={onClose} style={btn('#333','7px 14px',13)}>✕</button>
        </div>

        {/* UPLOAD / READY */}
        {(step==='upload'||step==='ready')&&(
          <div>
            <label style={{display:'block',cursor:'pointer'}}>
              {step==='upload'?(
                <div style={{border:`2px dashed ${C.border}`,borderRadius:12,padding:'36px 20px',textAlign:'center',color:C.muted,transition:'border-color .2s'}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor=C.accent}
                  onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                  <div style={{fontSize:44,marginBottom:10}}>📷</div>
                  <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:6}}>Take a photo or choose from library</div>
                  <div style={{fontSize:12,lineHeight:1.6}}>Start list · heat sheet · registration printout<br/>Camera, photo library, or file — any format</div>
                </div>
              ):(
                <img src={imgUrl} style={{width:'100%',borderRadius:10,border:`1px solid ${C.border}`,display:'block',maxHeight:300,objectFit:'contain',background:'#000'}}/>
              )}
              <input type="file" accept="image/*" onChange={handleFile} style={{display:'none'}} ref={fileRef}/>
            </label>
            {step==='ready'&&(
              <div style={{display:'flex',gap:8,marginTop:12}}>
                <button onClick={()=>{setStep('upload');setImgUrl(null);setImgFile(null);}} style={{...btn(C.card,'9px 14px',13),border:`1px solid ${C.border}`,flex:1}}>↩ Change Photo</button>
                <button onClick={scan} style={{...btn(C.accent,'9px 14px',13),flex:2}}>Scan for Names →</button>
              </div>
            )}
            {step==='upload'&&<div style={{fontSize:11,color:C.muted,textAlign:'center',marginTop:10}}>Works with printed heat sheets, phone screenshots, or photos of posted start lists</div>}
          </div>
        )}

        {/* SCANNING */}
        {step==='scanning'&&(
          <div>
            <img src={imgUrl} style={{width:'100%',borderRadius:10,border:`1px solid ${C.border}`,display:'block',maxHeight:220,objectFit:'contain',background:'#000',opacity:.45,marginBottom:18}}/>
            <div style={{fontSize:13,color:C.muted,textAlign:'center',marginBottom:12,fontStyle:'italic'}}>{progressMsg||'Starting…'}</div>
            <div style={{background:C.card,borderRadius:999,height:8,overflow:'hidden',border:`1px solid ${C.border}`}}>
              <div style={{height:'100%',background:C.accent,borderRadius:999,width:`${progress}%`,transition:'width .25s ease'}}/>
            </div>
            <div style={{fontSize:11,color:C.muted,textAlign:'center',marginTop:6}}>{progress}%</div>
          </div>
        )}

        {/* ERROR */}
        {step==='error'&&(
          <div style={{textAlign:'center',padding:'24px 0'}}>
            <div style={{fontSize:36,marginBottom:10}}>⚠️</div>
            <div style={{color:C.danger,fontSize:13,marginBottom:20,maxWidth:320,margin:'0 auto 20px'}}>{progressMsg}</div>
            <button onClick={()=>setStep('ready')} style={btn(C.accent,'9px 20px',13)}>Try Again</button>
          </div>
        )}

        {/* REVIEW */}
        {step==='review'&&(
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
              <div style={{fontSize:13,flex:1}}>
                <strong>{candidates.length}</strong> line{candidates.length!==1?'s':''} detected — check each name, uncheck anything that's not an athlete.
              </div>
              <button onClick={()=>{setStep('ready');setCandidates([]);}} style={{...btn(C.card,'5px 10px',11),border:`1px solid ${C.border}`,color:C.muted,flexShrink:0}}>↩ Rescan</button>
            </div>
            {/* Column headers */}
            <div style={{display:'flex',gap:8,padding:'4px 10px',fontSize:10,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:.5,marginBottom:2}}>
              <div style={{width:20}}/>
              <div style={{flex:1}}>First Name</div>
              <div style={{flex:1}}>Last Name</div>
              <div style={{width:22}}/>
            </div>
            <div style={{border:`1px solid ${C.border}`,borderRadius:10,overflow:'hidden',maxHeight:340,overflowY:'auto',marginBottom:12}}>
              {candidates.length===0&&(
                <div style={{padding:24,textAlign:'center',color:C.muted,fontSize:13}}>No text detected — try a clearer or higher-contrast photo.</div>
              )}
              {candidates.map((c,i)=>{
                const isDupe=exKeys.has(nameKey(c));
                return(
                  <div key={c.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',borderBottom:i<candidates.length-1?`1px solid ${C.border}`:'none',background:c.checked?'transparent':C.card+'66',opacity:c.checked?1:.5,transition:'opacity .15s'}}>
                    <input type="checkbox" checked={c.checked} onChange={()=>toggle(c.id)} style={{width:16,height:16,flexShrink:0,accentColor:C.accent,cursor:'pointer'}}/>
                    <input value={c.firstName} onChange={e=>upd(c.id,'firstName',e.target.value)} placeholder="First" style={{...inp,padding:'5px 8px',fontSize:13,flex:1,minWidth:0}}/>
                    <input value={c.lastName} onChange={e=>upd(c.id,'lastName',e.target.value)} placeholder="Last" style={{...inp,padding:'5px 8px',fontSize:13,flex:1,minWidth:0}}/>
                    {isDupe&&c.checked&&<span style={{fontSize:9,color:C.warn,flexShrink:0,fontWeight:700}}>DUP</span>}
                    <button onClick={()=>rem(c.id)} style={{...btn(C.card,'3px 7px',11),flexShrink:0,color:C.muted,border:`1px solid ${C.border}`}}>✕</button>
                  </div>
                );
              })}
            </div>
            {/* Select all / none */}
            <div style={{display:'flex',gap:6,marginBottom:12}}>
              <button onClick={()=>setCandidates(cs=>cs.map(c=>({...c,checked:true})))} style={{...btn(C.card,'5px 10px',11),border:`1px solid ${C.border}`}}>Select All</button>
              <button onClick={()=>setCandidates(cs=>cs.map(c=>({...c,checked:false})))} style={{...btn(C.card,'5px 10px',11),border:`1px solid ${C.border}`}}>None</button>
              <div style={{flex:1}}/>
              <span style={{fontSize:11,color:C.muted,alignSelf:'center'}}>{selected.length} selected</span>
            </div>
            <button onClick={confirm} disabled={fresh.length===0}
              style={{...btn(fresh.length>0?C.success:C.card,'11px',14),width:'100%',opacity:fresh.length===0?.5:1,border:fresh.length===0?`1px solid ${C.border}`:'none'}}>
              {fresh.length>0
                ?`Import ${fresh.length} Athlete${fresh.length!==1?'s':''}${dupes>0?` · ${dupes} dupe${dupes!==1?'s':''} skipped`:''}`
                :'No new athletes selected'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function IncStepBuilder({incStr,setIncStr,primaryMetric=true}){
  // Metric: 4 standard options matching the simple picker
  const CM_STEPS=[5,10,15,20];
  // Imperial step options (stored as cm internally, displayed as inches)
  const IMP_STEPS=[
    {cm:7.62,l:'3"'},{cm:10.16,l:'4"'},{cm:15.24,l:'6"'},
    {cm:20.32,l:'8"'},{cm:22.86,l:'9"'},{cm:30.48,l:'12"'},
  ];
  const PRESETS_M=[
    {label:'Standard',str:'10cm x3, 5cm x3, 2cm'},
    {label:'Collegiate',str:'10cm x2, 5cm x3, 2cm'},
    {label:'HS Indoor',str:'10cm x3, 5cm'},
    {label:'5cm Flat',str:'5cm'},
  ];
  const PRESETS_I=[
    {label:'HS Standard',str:'15.24cm x3, 7.62cm x3'},
    {label:'HS Indoor',str:'15.24cm x3, 7.62cm'},
    {label:'3" Flat',str:'7.62cm'},
    {label:'6" Flat',str:'15.24cm'},
  ];
  const PRESETS=primaryMetric?PRESETS_M:PRESETS_I;
  const toSteps=s=>{const r=[];for(const p of(s||'').split(',').map(x=>x.trim())){const m=p.match(/(\d+(?:\.\d+)?)\s*cm(?:\s*[x×]\s*(\d+))?/i);if(m)r.push({cm:parseFloat(m[1]),count:m[2]?parseInt(m[2]):null});}return r.length?r:[{cm:primaryMetric?10:7.62,count:3}]};
  const toStr=steps=>steps.map(s=>`${s.cm}cm${s.count?' x'+s.count:''}`).join(', ');
  const[steps,setSteps]=useState(()=>toSteps(incStr));
  const[manualEntry,setManualEntry]=useState('');
  // Per-step Other input values
  const[stepOtherVals,setStepOtherVals]=useState(()=>steps.map(()=>''));
  const update=ns=>{setSteps(ns);setIncStr(toStr(ns));};
  const addStep=()=>{update([...steps,{cm:primaryMetric?5:7.62,count:null}]);setStepOtherVals(v=>[...v,'']);};
  const removeStep=i=>{update(steps.filter((_,j)=>j!==i));setStepOtherVals(v=>v.filter((_,j)=>j!==i));};
  const setCm=(i,v)=>update(steps.map((s,j)=>j===i?{...s,cm:v}:s));
  const setCount=(i,v)=>update(steps.map((s,j)=>j===i?{...s,count:v}:s));
  const applyStepOther=(i)=>{
    const raw=stepOtherVals[i];if(!raw)return;
    const v=parseFloat(raw);if(isNaN(v)||v<=0)return;
    // inches if value < 36 and imperial mode, otherwise cm
    const cm=(!primaryMetric&&v<36)?parseFloat((v*2.54).toFixed(2)):v;
    setCm(i,cm);
    setStepOtherVals(vals=>vals.map((x,j)=>j===i?'':x));
  };
  // Display label for a cm value — inches when imperial mode
  const getStepLabel=cm=>{
    if(!primaryMetric){
      const match=IMP_STEPS.find(o=>Math.abs(o.cm-cm)<0.1);
      if(match)return match.l;
      return`${parseFloat((cm/2.54).toFixed(2))}"`;
    }
    return`${cm}cm`;
  };
  // Manual entry: convert inch notation → cm ("3" x3" → "7.62cm x3")
  const parseIncEntry=str=>str.replace(/(\d+(?:\.\d+)?)\s*["'']/g,(_,n)=>`${parseFloat((parseFloat(n)*2.54).toFixed(2))}cm`);
  const applyManual=()=>{
    if(!manualEntry.trim())return;
    const converted=parseIncEntry(manualEntry.trim());
    const ns=toSteps(converted);
    if(ns.length)update(ns);
    setManualEntry('');
  };
  const stepOpts=primaryMetric?CM_STEPS.map(c=>({cm:c})):IMP_STEPS;
  return(
    <div>
      <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:10}}>
        {PRESETS.map(p=>(
          <button key={p.label} onClick={()=>{setIncStr(p.str);setSteps(toSteps(p.str));}}
            style={{...btn(C.card,'5px 11px',11),border:`1px solid ${C.border}`}}>{p.label}</button>
        ))}
      </div>
      <div style={{display:'grid',gap:6}}>
        {steps.map((s,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:6,background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:'8px 10px',flexWrap:'wrap'}}>
            <span style={{fontSize:11,color:C.muted,width:18,flexShrink:0}}>#{i+1}</span>
            <div style={{display:'flex',gap:3,flexWrap:'wrap',flex:1,alignItems:'center'}}>
              <span style={{fontSize:11,color:C.muted,marginRight:2}}>Inc:</span>
              {stepOpts.map(o=>(
                <button key={o.cm} onClick={()=>setCm(i,o.cm)}
                  style={{...btn(Math.abs(s.cm-o.cm)<0.1?C.accent:C.surface,'3px 8px',11),border:`1px solid ${Math.abs(s.cm-o.cm)<0.1?C.accent:C.border}`,minWidth:34}}>
                  {getStepLabel(o.cm)}
                </button>
              ))}
              <input style={{...inp,padding:'3px 7px',fontSize:11,width:68}}
                placeholder={primaryMetric?'Other cm':'Other in'}
                value={stepOtherVals[i]||''} onChange={e=>setStepOtherVals(v=>v.map((x,j)=>j===i?e.target.value:x))}
                onBlur={()=>applyStepOther(i)} onKeyDown={e=>{if(e.key==='Enter')applyStepOther(i);}}/>
            </div>
            <div style={{display:'flex',gap:3,alignItems:'center',flexShrink:0}}>
              <span style={{fontSize:11,color:C.muted,marginRight:2}}>×</span>
              {[1,2,3,4,5,null].map(c=>(
                <button key={String(c)} onClick={()=>setCount(i,c)}
                  style={{...btn(s.count===c?C.accent:C.surface,'3px 7px',11),border:`1px solid ${s.count===c?C.accent:C.border}`}}>
                  {c===null?'∞':c}
                </button>
              ))}
            </div>
            {steps.length>1&&<button onClick={()=>removeStep(i)} style={{...btn('#7f1d1d','3px 8px',11),flexShrink:0}}>×</button>}
          </div>
        ))}
      </div>
      {/* Manual entry + Add Step */}
      <div style={{display:'flex',gap:6,alignItems:'center',marginTop:8}}>
        <input style={{...inp,padding:'6px 10px',fontSize:12,flex:1}}
          placeholder={primaryMetric?'Type e.g. 5cm x3, 2cm':'Type e.g. 3" x3, 6" x2'}
          value={manualEntry} onChange={e=>setManualEntry(e.target.value)}
          onBlur={applyManual} onKeyDown={e=>{if(e.key==='Enter')applyManual();}}/>
        <button onClick={addStep} style={{...btn(C.card,'6px 12px',12),border:`1px solid ${C.border}`,flexShrink:0}}>+ Step</button>
      </div>
      <div style={{marginTop:5}}>
        <span style={{fontSize:10,color:C.muted}}>Stored as: {toStr(steps)||'—'}</span>
      </div>
    </div>
  );
}

// ─── SIMPLE INCREMENT PICKER ──────────────────────────────────────────────────
// Both rows always visible; primary row first depends on rulebook (NFHS → imperial first)
function SimpleIncPicker({incStr,setIncStr,primaryMetric}){
  const METRIC_OPTS=[{v:5,l:'5cm'},{v:10,l:'10cm'},{v:15,l:'15cm'},{v:20,l:'20cm'}];
  const IMP_OPTS=[{v:7.62,l:'3"'},{v:15.24,l:'6"'},{v:22.86,l:'9"'},{v:30.48,l:'12"'}];
  const[showAdv,setShowAdv]=useState(false);
  const[other,setOther]=useState('');
  const cmMatch=(incStr||'').match(/^(\d+(?:\.\d+)?)\s*cm$/i);
  const curCm=cmMatch?parseFloat(cmMatch[1]):null;
  const isSelected=v=>curCm!==null&&Math.abs(curCm-v)<0.1;
  const pick=cm=>{setIncStr(`${cm}cm`);setOther('');};
  const applyOther=()=>{
    const v=parseFloat(other);
    if(!isNaN(v)&&v>0){
      // When imperial primary (NFHS), values < 36 assumed inches; otherwise cm
      const cm=(!primaryMetric&&v<36)?v*2.54:v;
      setIncStr(`${parseFloat(cm.toFixed(2))}cm`);
    }
  };
  const rowStyle={display:'flex',gap:5,alignItems:'center',marginBottom:5};
  const lblStyle={fontSize:10,color:C.muted,width:22,flexShrink:0,fontWeight:700};
  // NFHS: imperial row on top; WA/NCAA: metric row on top
  const[topOpts,topLbl,botOpts,botLbl]=primaryMetric
    ?[METRIC_OPTS,'m',IMP_OPTS,'in']
    :[IMP_OPTS,'in',METRIC_OPTS,'m'];
  return(
    <div>
      <div style={rowStyle}>
        <span style={lblStyle}>{topLbl}</span>
        {topOpts.map(o=>(
          <button key={o.v} onClick={()=>pick(o.v)}
            style={{...btn(isSelected(o.v)?C.accent:C.card,'7px 14px',13),border:`1px solid ${isSelected(o.v)?C.accent:C.border}`,minWidth:48}}>
            {o.l}
          </button>
        ))}
      </div>
      <div style={{...rowStyle,marginBottom:8}}>
        <span style={lblStyle}>{botLbl}</span>
        {botOpts.map(o=>(
          <button key={o.v} onClick={()=>pick(o.v)}
            style={{...btn(isSelected(o.v)?C.accent:C.card,'7px 14px',13),border:`1px solid ${isSelected(o.v)?C.accent:C.border}`,minWidth:48}}>
            {o.l}
          </button>
        ))}
        <input style={{...inp,padding:'6px 9px',fontSize:12,flex:1,minWidth:80}}
          placeholder={primaryMetric?'Other (cm)':'Other (in or cm)'}
          value={other} onChange={e=>setOther(e.target.value)}
          onBlur={applyOther}
          onKeyDown={e=>{if(e.key==='Enter')applyOther();}}/>
      </div>
      <div style={{fontSize:10,color:C.muted,marginBottom:6}}>Heights stored in cm · 3"=7.62 · 6"=15.24 · 9"=22.86 · 12"=30.48</div>
      <div>
        <button onClick={()=>setShowAdv(a=>!a)}
          style={{...btn(showAdv?C.card:'#1e2a1e','6px 13px',12),border:`1px solid ${showAdv?C.border:'#22c55e55'}`,color:showAdv?C.muted:C.success}}>
          {showAdv?'↑ Hide Advanced Steps':'⚙ Advanced Stepped Increments'}
        </button>
        {!showAdv&&curCm!==null&&<span style={{fontSize:11,color:C.muted,marginLeft:8}}>({curCm}cm uniform)</span>}
      </div>
      {showAdv&&<div style={{marginTop:10}}><IncStepBuilder incStr={incStr} setIncStr={setIncStr} primaryMetric={primaryMetric}/></div>}
    </div>
  );
}

// ─── HEIGHT INPUT — local edit state to allow mid-value typing ────────────────
function HeightInput({h,idx,updateHeight}){
  const[val,setVal]=useState(()=>(h/100).toFixed(2));
  const[editing,setEditing]=useState(false);
  useEffect(()=>{if(!editing)setVal((h/100).toFixed(2));},[h,editing]);
  const commit=()=>{setEditing(false);updateHeight(idx,val);};
  return(
    <input type="text" value={val}
      onChange={e=>{setVal(e.target.value);setEditing(true);}}
      onFocus={()=>setEditing(true)}
      onBlur={commit}
      onKeyDown={e=>{if(e.key==='Enter')commit();}}
      style={{...inp,padding:'5px 8px',fontSize:15,width:90,fontWeight:700}}/>
  );
}

// ─── ATHLETE LIST (pointer-capture drag) ─────────────────────────────────────
function AthleteList({athletes,editingId,setEditingId,updAthlete,delAthlete,moveAthlete,reorder,setOrder,rulebook}){
  const[dragIdx,setDragIdx]=useState(null);
  const[overIdx,setOverIdx]=useState(null);
  const containerRef=useRef(null);
  const dragStateRef=useRef({active:false,from:-1,to:-1});

  const findRowAt=clientY=>{
    const rows=containerRef.current?.querySelectorAll('[data-row-idx]');
    if(!rows)return -1;
    for(const row of rows){const r=row.getBoundingClientRect();if(clientY>=r.top&&clientY<=r.bottom)return parseInt(row.dataset.rowIdx);}
    return -1;
  };
  const onHandlePointerDown=(e,idx)=>{
    e.preventDefault();
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}
    dragStateRef.current={active:true,from:idx,to:idx};
    setDragIdx(idx);
  };
  const onHandlePointerMove=e=>{
    if(!dragStateRef.current.active)return;
    const found=findRowAt(e.clientY);
    if(found!==-1&&found!==dragStateRef.current.to){dragStateRef.current.to=found;setOverIdx(found);}
  };
  const onHandlePointerUp=e=>{
    const{active,from,to}=dragStateRef.current;
    dragStateRef.current={active:false,from:-1,to:-1};
    if(active&&from!==-1&&to!==-1&&from!==to)reorder(from,to);
    setDragIdx(null);setOverIdx(null);
  };

  return(
    <div ref={containerRef} style={{display:'grid',gap:6}}>
      {athletes.map((a,i)=>(
        <div key={a.id} data-row-idx={i}
          draggable onContextMenu={e=>e.preventDefault()}
          onDragStart={e=>{setDragIdx(i);e.dataTransfer.effectAllowed='move';}}
          onDragOver={e=>{e.preventDefault();setOverIdx(i);}}
          onDrop={e=>{e.preventDefault();if(dragIdx!==null&&dragIdx!==i)reorder(dragIdx,i);setDragIdx(null);setOverIdx(null);}}
          onDragEnd={()=>{setDragIdx(null);setOverIdx(null);}}
          className={overIdx===i&&dragIdx!==i?'vd-drag-over':dragIdx===i?'vd-dragging':''}>
          <AthleteRow athlete={a} index={i} total={athletes.length} rulebook={rulebook}
            isEditing={editingId===a.id}
            onEdit={()=>setEditingId(editingId===a.id?null:a.id)}
            onUpdate={ch=>updAthlete(a.id,ch)}
            onDelete={()=>delAthlete(a.id)}
            onUp={()=>moveAthlete(a.id,-1)}
            onDown={()=>moveAthlete(a.id,1)}
            onSetOrder={n=>setOrder(a.id,n)}
            onHandlePointerDown={e=>onHandlePointerDown(e,i)}
            onHandlePointerMove={onHandlePointerMove}
            onHandlePointerUp={onHandlePointerUp}
          />
        </div>
      ))}
    </div>
  );
}

// ─── LOOKUP DIALOG ────────────────────────────────────────────────────────────

          <a href={url} target="_blank" rel="noreferrer" style={{...btn(C.accent,'8px 14px',13),textDecoration:'none'}}>Open {SEARCH_LABEL[rulebook]}</a>
          <a href={googleUrl} target="_blank" rel="noreferrer" style={{...btn('#1d2b3a','8px 14px',13),border:`1px solid ${C.border}`,textDecoration:'none'}}>Google Search</a>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
          <div><div style={{fontSize:12,color:C.muted,marginBottom:4}}>Entry PR / PB</div><input style={inp} value={manualPB} onChange={e=>setManualPB(e.target.value)} placeholder="5.45m"/></div>
          <div><div style={{fontSize:12,color:C.muted,marginBottom:4}}>Season Best</div><input style={inp} value={manualSB} onChange={e=>setManualSB(e.target.value)} placeholder="5.32m"/></div>
        </div>
        {(manualPB||manualSB)&&<button onClick={()=>onApply({pb:manualPB,sb:manualSB})} style={{...btn(C.success,'8px 18px',13),marginBottom:14}}>Apply</button>}
        <div style={{fontSize:12,color:C.muted,marginBottom:6}}>Or paste profile text from {SEARCH_LABEL[rulebook]}:</div>
        <textarea value={paste} onChange={e=>setPaste(e.target.value)} placeholder={`Paste from ${SEARCH_LABEL[rulebook]}...`} style={{...inp,height:70,resize:'vertical',marginBottom:10,display:'block',fontSize:13}}/>
        {parsed&&Object.keys(parsed).length>0&&(
          <div style={{background:C.card,borderRadius:8,padding:'10px 14px',marginBottom:12,border:`1px solid ${C.success}44`}}>
            <div style={{fontSize:11,color:C.success,fontWeight:700,marginBottom:6}}>Extracted</div>
            {parsed.pb&&<div style={{fontSize:13,marginBottom:3}}>PB: <strong>{parsed.pb}</strong></div>}
            {parsed.sb&&<div style={{fontSize:13,marginBottom:3}}>SB: <strong>{parsed.sb}</strong></div>}
            {parsed.country&&<div style={{fontSize:13}}>Country: <strong>{parsed.country}</strong></div>}
            <button onClick={()=>onApply(parsed)} style={{...btn(C.success,'7px 16px',13),marginTop:10}}>Apply</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── SAVE RESULTS DIALOG ──────────────────────────────────────────────────────
function SaveResultsDialog({athletes,heights,ranked,info,primaryMetric,onClose}){
  const[saving,setSaving]=useState(false);
  const[saved,setSaved]=useState(false);
  const doSave=async()=>{
    setSaving(true);
    const csv=buildResultsCSV(athletes,heights,ranked,info,primaryMetric);
    const name=(info.name||'results').replace(/[^a-z0-9]/gi,'_');
    const filename=`${name}_${info.date||'results'}.csv`;
    const blob=new Blob([csv],{type:'text/csv'});
    try{
      if(window.showSaveFilePicker){
        const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'CSV File',accept:{'text/csv':['.csv']}}]});
        const w=await handle.createWritable();await w.write(blob);await w.close();setSaved(true);
      }else throw new Error('fallback');
    }catch(err){
      if(err.name!=='AbortError'){
        const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);setSaved(true);
      }
    }
    setSaving(false);
  };
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:700,display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={onClose}>
      <div style={{background:C.surface,borderRadius:16,padding:24,width:'100%',maxWidth:400,border:`1px solid ${C.border}`}} onClick={e=>e.stopPropagation()}>
        <div style={{fontWeight:800,fontSize:17,marginBottom:8}}>Save Official Results</div>
        <div style={{fontSize:13,color:C.muted,marginBottom:20,lineHeight:1.6}}>Saves a CSV with final results, placements, and all attempts.</div>
        {saved
          ?<div style={{background:`${C.success}22`,borderRadius:10,padding:'12px 16px',marginBottom:16,border:`1px solid ${C.success}44`,fontSize:14,color:C.success,fontWeight:700}}>Results saved successfully</div>
          :<button onClick={doSave} disabled={saving} style={{...btn(C.success,'12px 20px',15),width:'100%',marginBottom:12,opacity:saving?.6:1}}>{saving?'Saving...':'Download Results CSV'}</button>
        }
        <button onClick={onClose} style={{...btn(C.card,'10px 20px',14),width:'100%',border:`1px solid ${C.border}`}}>{saved?'Close':'Cancel'}</button>
      </div>
    </div>
  );
}

// ─── SHARE PANEL ─────────────────────────────────────────────────────────────
function SharePanel({sc,onClose}){
  const slug=sc?.compId;const token=sc?.scorerToken;
  if(!slug||!token)return null;
  const base=window.location.origin+window.location.pathname;
  const scoreUrl=`${base}#/score/${slug}/${token}`;
  const dispUrl=`${base}#/display/${slug}`;
  const[copied,setCopied]=useState('');
  const copy=async(text,key)=>{
    try{await navigator.clipboard.writeText(text);}
    catch(_){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
    setCopied(key);setTimeout(()=>setCopied(''),2500);
  };
  const scoreQR=useRef(null);const dispQR=useRef(null);
  useEffect(()=>{
    const opts={width:150,height:150,colorDark:'#e0e0f0',colorLight:'#1a1a24'};
    if(window.QRCode&&scoreQR.current){scoreQR.current.innerHTML='';try{new window.QRCode(scoreQR.current,{...opts,text:scoreUrl});}catch(_){}}
    if(window.QRCode&&dispQR.current){dispQR.current.innerHTML='';try{new window.QRCode(dispQR.current,{...opts,text:dispUrl});}catch(_){}}
  },[scoreUrl,dispUrl]);
  const urlCard=(label,color,url,key,qrRef)=>(
    <div style={{background:C.card,borderRadius:10,border:`1px solid ${C.border}`,padding:'12px 14px',marginBottom:12}}>
      <div style={{fontSize:10,fontWeight:800,color,letterSpacing:.8,textTransform:'uppercase',marginBottom:8}}>{label}</div>
      <div ref={qrRef} style={{display:'flex',justifyContent:'center',marginBottom:10}}/>
      <div style={{fontSize:10,color:C.muted,wordBreak:'break-all',lineHeight:1.5,marginBottom:8,background:C.surface,borderRadius:6,padding:'6px 8px'}}>{url}</div>
      <button onClick={()=>copy(url,key)} style={{...btn(copied===key?C.success:C.accent,'7px 14px',12),width:'100%'}}>
        {copied===key?'✓ Copied!':key==='score'?'Copy Scorer Link':'Copy Display Link'}
      </button>
    </div>
  );
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.88)',zIndex:700,display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={onClose}>
      <div style={{background:C.surface,borderRadius:16,padding:20,width:'100%',maxWidth:420,border:`1px solid ${C.border}`,maxHeight:'90vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
        <div style={{fontWeight:800,fontSize:16,marginBottom:4}}>Share Competition</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:16}}>{sc.info?.name||'Competition'} · live sync enabled</div>
        {urlCard('📊 Scorer URL · Private — share with scorer only',C.warn,scoreUrl,'score',scoreQR)}
        {urlCard('📺 Display URL · Public — post to website or screen',C.accent,dispUrl,'disp',dispQR)}
        <button onClick={onClose} style={{...btn(C.card,'10px 20px',14),width:'100%',border:`1px solid ${C.border}`}}>Done</button>
      </div>
    </div>
  );
}

// ─── RESULTS TABLE ────────────────────────────────────────────────────────────
function ResultsTable({athletes,ranked,heights,curH,curA,primaryMetric,setCurA,setCurH,compact=false,isActive=true}){
  const n=heights.length;
  if(!n)return<div style={{padding:'16px',textAlign:'center',color:C.muted,fontSize:13,background:C.surface,borderRadius:10,border:`1px solid ${C.border}`}}>No heights defined — results will appear here once heights are added.</div>;
  const placementOf=useMemo(()=>{const map={};ranked.forEach(r=>{map[r.id]={pl:r.placement,tied:r.tied};});return map;},[ranked]);
  const displayAthletes=useMemo(()=>{
    if(!isActive)return[...ranked];
    const n=athletes.length;
    const getSort=a=>{
      const i=athletes.findIndex(x=>x.id===a.id);
      if(i===curA)return[0,0];
      if(a.status==='dns')return[4,i];
      // Eliminated: 3 misses at any height (may still have 'competing' status if had prior clears)
      const out=isEliminatedFromComp(a)||isDone(a.attempts[curH]||[],a.status);
      if(!out)return[1,(i-curA+n)%n];
      if(a.status==='nh')return[3,(i-curA+n)%n];
      // Placed athletes: sort ascending by placement (1st near top, last near NH)
      const plInfo=placementOf[a.id]||{pl:null};
      return[2,plInfo.pl||999];
    };
    return[...athletes].sort((a,b)=>{const[ag,ao]=getSort(a);const[bg,bo]=getSort(b);if(ag!==bg)return ag-bg;return ao-bo;});
  },[athletes,ranked,curH,isActive]);
  const getCellContent=(ath,hIdx)=>{
    const m=ath.attempts[hIdx]||[];
    if(ath.status==='dns')return{text:'—',color:C.muted,bg:'transparent'};
    if(!m.length)return{text:'',color:C.muted,bg:'transparent'};
    const text=m.join('');
    if(hasCleared(m))return{text,color:'#4ade80',bg:'rgba(34,197,94,.08)'};
    if(countMisses(m)>=3&&!hasCleared(m))return{text,color:'#f87171',bg:'rgba(239,68,68,.08)'};
    if(hasPassed(m)&&!hasCleared(m))return{text,color:'#d97706',bg:'rgba(217,119,6,.08)'};
    return{text,color:'#93c5fd',bg:'transparent'};
  };
  const bestResult=ath=>{const idx=highestClearedIdx(ath,n);return idx>=0?heights[idx]:null};
  const HDR='#0d0d18';
  const HDR2='#111120';
  const markClass=text=>{
    if(!text)return'';
    if(text==='O'||text.endsWith('O'))return'vd-mark vd-mark-o';
    if(/^X+$/.test(text))return'vd-mark vd-mark-x';
    if(text.includes('P'))return'vd-mark vd-mark-p';
    return'vd-mark vd-mark-ip';
  };
  return(
    <div className="vd-tbl-wrap" style={{overflowX:'auto',WebkitOverflowScrolling:'touch',borderTop:`1px solid ${C.border}`}}>
      <table style={{borderCollapse:'collapse',fontSize:compact?11:12,width:'100%',minWidth:Math.max(340,266+n*54)+'px'}}>
        <thead>
          <tr style={{background:HDR,borderBottom:`1px solid rgba(255,255,255,.1)`}}>
            <th style={{position:'sticky',left:0,background:HDR,padding:'10px 5px',textAlign:'center',color:'rgba(255,255,255,.35)',width:28,fontSize:8,fontWeight:700,letterSpacing:.8,zIndex:10,textTransform:'uppercase'}}>#</th>
            <th style={{position:'sticky',left:28,background:HDR,padding:'10px 5px',textAlign:'center',color:'rgba(255,255,255,.5)',width:34,fontSize:8,fontWeight:700,letterSpacing:.8,zIndex:10,textTransform:'uppercase'}}>PL</th>
            <th style={{position:'sticky',left:62,background:HDR,padding:'10px 10px',textAlign:'left',color:'rgba(255,255,255,.5)',minWidth:162,fontSize:8,fontWeight:700,letterSpacing:.8,zIndex:10,textTransform:'uppercase'}}>ATHLETE</th>
            <th style={{position:'sticky',left:224,background:HDR,padding:'10px 5px',textAlign:'center',color:'rgba(255,255,255,.5)',width:62,fontSize:8,fontWeight:700,letterSpacing:.8,zIndex:10,textTransform:'uppercase'}}>BEST</th>
            {heights.map((h,i)=>{
              const isCH=i===curH&&isActive;
              return(
              <th key={i} style={{padding:'8px 4px',textAlign:'center',minWidth:54,background:isCH?`rgba(79,124,255,.2)`:HDR,borderLeft:isCH?`2px solid ${C.accent}`:'none',borderRight:isCH?`2px solid ${C.accent}`:'none'}}>
                <div style={{color:isCH?'#c7d7ff':'rgba(255,255,255,.5)',fontWeight:isCH?800:600,fontSize:9,whiteSpace:'nowrap',letterSpacing:.2}}>{fmtH(h,primaryMetric)}</div>
                <div style={{fontSize:7.5,color:isCH?`rgba(199,215,255,.6)`:'rgba(255,255,255,.22)',marginTop:1}}>{fmtH(h,!primaryMetric)}</div>
              </th>
              );
            })}
          </tr>
        </thead>
        <tbody>
          {displayAthletes.map((ath,rowIdx)=>{
            const origIdx=athletes.findIndex(a=>a.id===ath.id);
            const isCur=isActive&&origIdx===curA;
            const plInfo=placementOf[ath.id]||{pl:null,tied:false};
            const best=bestResult(ath);
            const isOut=isEliminatedFromComp(ath);
            const rowBg=isCur?'rgba(79,124,255,.09)':rowIdx%2===0?C.bg:`rgba(26,26,36,.6)`;
            const isDoneHere=isDone(ath.attempts[curH]||[],ath.status);
            return(
              <tr key={ath.id} className="vd-tbl-row" style={{background:rowBg,borderBottom:`1px solid rgba(46,46,61,.7)`,borderLeft:isCur?`3px solid ${C.accent}`:'3px solid transparent'}}>
                <td style={{position:'sticky',left:0,background:rowBg,padding:'8px 5px',textAlign:'center',fontWeight:600,fontSize:11,color:isDoneHere?'rgba(136,136,170,.4)':'rgba(136,136,170,.7)'}}>{ath.order}</td>
                <td style={{position:'sticky',left:28,background:rowBg,padding:'8px 5px',textAlign:'center',fontWeight:800,fontSize:compact?13:15,lineHeight:1}}>
                  {plInfo.pl===1?'🥇':plInfo.pl===2?'🥈':plInfo.pl===3?'🥉':plInfo.pl
                    ?<span style={{color:C.muted,fontSize:11,fontWeight:700}}>{plInfo.pl}{plInfo.tied?'=':''}</span>
                    :<span style={{fontSize:8,color:'rgba(136,136,170,.4)',letterSpacing:.3}}>{ath.status==='dns'?'DNS':isOut&&!best?'NH':''}</span>}
                </td>
                <td style={{position:'sticky',left:62,background:rowBg,padding:'7px 10px',minWidth:162}}>
                  <div style={{display:'flex',alignItems:'center',gap:7}}>
                    <FlagCell athlete={ath} size={18}/>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:isCur?800:700,fontSize:13,color:isCur?'#ffffff':isOut?'rgba(136,136,170,.5)':C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:132,textDecoration:ath.status==='dns'?'line-through':'none',display:'flex',alignItems:'center',gap:4}}>
                        {isCur&&<span style={{width:5,height:5,borderRadius:'50%',background:C.accent,display:'inline-block',flexShrink:0,animation:'pulse-ring 1.5s ease-out infinite'}}/>}
                        <span>{ath.firstName} <span style={{textTransform:'uppercase',letterSpacing:.2}}>{ath.lastName}</span></span>
                      </div>
                      <div style={{fontSize:9,color:'rgba(136,136,170,.55)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:132,marginTop:1}}>
                        {ath.affiliation&&<span>{ath.affiliation}</span>}
                        {(ath.pb||ath.sb)&&<span style={{marginLeft:ath.affiliation?4:0}}>
                          {ath.pb&&<span style={{color:'rgba(147,197,253,.7)'}}>PB {ath.pb}</span>}
                          {ath.pb&&ath.sb&&<span> · </span>}
                          {ath.sb&&<span style={{color:'rgba(74,222,128,.7)'}}>SB {ath.sb}</span>}
                        </span>}
                        {ath.status==='retired'&&<span style={{color:C.warn}}> RET</span>}
                      </div>
                    </div>
                  </div>
                </td>
                <td style={{position:'sticky',left:224,background:rowBg,padding:'8px 5px',textAlign:'center',width:62}}>
                  {best?<DualH cm={best} primaryMetric={primaryMetric} pSize={12} sSize={9} style={{alignItems:'center'}}/>
                       :<span style={{fontSize:9,color:'rgba(136,136,170,.4)'}}>{ath.status==='dns'?'DNS':isOut&&!best?'NH':''}</span>}
                </td>
                {heights.map((h,hIdx)=>{
                  const{text,color,bg}=getCellContent(ath,hIdx);
                  const isCH=isActive&&hIdx===curH;
                  const isCurCell=isCH&&origIdx===curA;
                  const clickable=ath.status!=='dns'&&ath.status!=='nh';
                  return(
                    <td key={hIdx}
                      onClick={()=>{if(setCurH)setCurH(hIdx);if(clickable&&isActive&&setCurA)setCurA(origIdx);}}
                      style={{padding:'8px 3px',textAlign:'center',background:isCH?`rgba(79,124,255,.07)`:isCurCell?`rgba(79,124,255,.14)`:'transparent',cursor:clickable&&isActive&&setCurA?'pointer':'default',borderLeft:isCH?`2px solid rgba(79,124,255,.4)`:'none',borderRight:isCH?`2px solid rgba(79,124,255,.4)`:'none'}}>
                      <span className={markClass(text)} style={{color:!text?undefined:color}}>{text||''}</span>
                    </td>
                  );
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function SetupScreen({info,setInfo,rulebook,setRulebook,athletes,addAthlete,updAthlete,delAthlete,moveAthlete,reorder,setOrder,editingId,setEditingId,startH,setStartH,incStr,setIncStr,manualH,setManualH,doGenHeights,heights,setHeights,updateHeight,primaryMetric,startComp,dirEmail,setDirEmail,onImport,onPhotoImport}){
