<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VaultDesk</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0f0f14; --surface:#1a1a24; --card:#22222e; --border:#2e2e3d;
      --accent:#4f7cff; --success:#22c55e; --danger:#ef4444; --warn:#f59e0b;
      --text:#f0f0f0; --muted:#8888aa;
    }
    html,body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; min-height:100vh; overflow-x:hidden; }
    input,select,button,textarea { font-family:inherit; }
    input,select,textarea { color:var(--text); background:var(--card); }
    input::placeholder,textarea::placeholder { color:var(--muted); }
    select option { background:#22222e; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
    @keyframes sweep { 0%{left:-60%} 100%{left:130%} }
    .live-dot { animation:blink 1.4s ease-in-out infinite; }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:var(--surface); }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
    .drag-over { outline:2px solid #4f7cff !important; background:rgba(79,124,255,.07) !important; border-radius:10px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback, useEffect, useRef } = React;

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const RULEBOOKS = [
  { key:'WA',   label:'World Athletics / USATF' },
  { key:'NCAA', label:'NCAA' },
  { key:'NFHS', label:'NFHS (High School)' },
];

const C = {
  bg:'#0f0f14', surface:'#1a1a24', card:'#22222e', border:'#2e2e3d',
  accent:'#4f7cff', success:'#22c55e', danger:'#ef4444', warn:'#f59e0b',
  text:'#f0f0f0', muted:'#8888aa',
  cleared:'#0a2b0a', missed:'#2b0a0a', passed:'#0a1a2b',
};

// Full IOC NOC → ISO 3166-1 alpha-2 (all 206 Olympic nations)
const IOC_ISO = {
  AFG:'af',ALB:'al',ALG:'dz',AND:'ad',ANG:'ao',ANT:'ag',ARG:'ar',ARM:'am',
  ARU:'aw',ASA:'as',AUS:'au',AUT:'at',AZE:'az',BAH:'bs',BAN:'bd',BAR:'bb',
  BDI:'bi',BEL:'be',BEN:'bj',BER:'bm',BHU:'bt',BIH:'ba',BIZ:'bz',BLR:'by',
  BOL:'bo',BOT:'bw',BRA:'br',BRN:'bh',BRU:'bn',BUL:'bg',BUR:'bf',CAF:'cf',
  CAM:'kh',CAN:'ca',CAY:'ky',CGO:'cg',CHA:'td',CHI:'cl',CHN:'cn',CIV:'ci',
  CMR:'cm',COD:'cd',COK:'ck',COL:'co',COM:'km',CPV:'cv',CRC:'cr',CRO:'hr',
  CUB:'cu',CYP:'cy',CZE:'cz',DEN:'dk',DJI:'dj',DMA:'dm',DOM:'do',ECU:'ec',
  EGY:'eg',ERI:'er',ESA:'sv',ESP:'es',EST:'ee',ETH:'et',FIJ:'fj',FIN:'fi',
  FRA:'fr',FSM:'fm',GAB:'ga',GAM:'gm',GBR:'gb',GBS:'gw',GEO:'ge',GEQ:'gq',
  GER:'de',GHA:'gh',GRE:'gr',GRN:'gd',GUA:'gt',GUI:'gn',GUM:'gu',GUY:'gy',
  HAI:'ht',HKG:'hk',HON:'hn',HUN:'hu',INA:'id',IND:'in',IRI:'ir',IRL:'ie',
  IRQ:'iq',ISL:'is',ISR:'il',ISV:'vi',ITA:'it',IVB:'vg',JAM:'jm',JOR:'jo',
  JPN:'jp',KAZ:'kz',KEN:'ke',KGZ:'kg',KIR:'ki',KOR:'kr',KSA:'sa',KUW:'kw',
  LAO:'la',LAT:'lv',LBA:'ly',LBN:'lb',LBR:'lr',LCA:'lc',LES:'ls',LIE:'li',
  LTU:'lt',LUX:'lu',MAD:'mg',MAR:'ma',MAS:'my',MAW:'mw',MDA:'md',MEX:'mx',
  MGL:'mn',MKD:'mk',MLI:'ml',MLT:'mt',MNE:'me',MON:'mc',MOZ:'mz',MRI:'mu',
  MRT:'mr',MYA:'mm',NAM:'na',NCA:'ni',NED:'nl',NEP:'np',NGR:'ng',NIG:'ne',
  NOR:'no',NRU:'nr',NZL:'nz',OMA:'om',PAK:'pk',PAN:'pa',PAR:'py',PER:'pe',
  PHI:'ph',PLE:'ps',PLW:'pw',PNG:'pg',POL:'pl',POR:'pt',PRK:'kp',PUR:'pr',
  QAT:'qa',ROC:'tw',RSA:'za',ROU:'ro',RUS:'ru',RWA:'rw',SAM:'ws',SEN:'sn',
  SEY:'sc',SGP:'sg',SKN:'kn',SLE:'sl',SLO:'si',SMR:'sm',SOL:'sb',SOM:'so',
  SRB:'rs',SRI:'lk',SSD:'ss',STP:'st',SUD:'sd',SUI:'ch',SUR:'sr',SVK:'sk',
  SWE:'se',SWZ:'sz',SYR:'sy',TAN:'tz',TGA:'to',THA:'th',TJK:'tj',TKM:'tm',
  TLS:'tl',TOG:'tg',TPE:'tw',TTO:'tt',TUN:'tn',TUR:'tr',TUV:'tv',UAE:'ae',
  UGA:'ug',UKR:'ua',URU:'uy',USA:'us',UZB:'uz',VAN:'vu',VEN:'ve',VIE:'vn',
  VIN:'vc',YEM:'ye',ZAM:'zm',ZIM:'zw',
};
const getFlagUrl = code => {
  if (!code) return null;
  const u = code.toUpperCase().trim();
  const iso = IOC_ISO[u] || (u.length===2 ? u.toLowerCase() : null);
  return iso ? `https://flagcdn.com/24x18/${iso}.png` : null;
};

// Search URLs per rulebook
const SEARCH_URL = (name, rb) => ({
  WA:   `https://worldathletics.org/athletes/search?term=${encodeURIComponent(name)}`,
  NCAA: `https://www.tfrrs.org/search?q=${encodeURIComponent(name)}`,
  NFHS: `https://www.milesplit.com/search?q=${encodeURIComponent(name)}&type=athlete`,
}[rb] || `https://worldathletics.org/athletes/search?term=${encodeURIComponent(name)}`);

const SEARCH_LABEL = { WA:'World Athletics', NCAA:'TFRRS', NFHS:'MileSplit' };

// Paste parser: extract PB/SB/country from copy-pasted athlete profile text
const parsePaste = text => {
  const result = {};
  const pbM = text.match(/(?:PB|PR|Personal\s+(?:Best|Record))[:\s]+([0-9]+['\-.]?[0-9]*(?:\s*[0-9]+\/[0-9]+)?(?:m|"|')?)/i);
  const sbM = text.match(/(?:SB|Season(?:al)?\s+(?:Best|Record))[:\s]+([0-9]+['\-.]?[0-9]*(?:\s*[0-9]+\/[0-9]+)?(?:m|"|')?)/i);
  const ccM = text.match(/\b([A-Z]{3})\b/g);
  if (pbM) result.pb = pbM[1].trim();
  if (sbM) result.sb = sbM[1].trim();
  if (ccM) {
    const known = ccM.find(c => IOC_ISO[c]);
    if (known) result.country = known;
  }
  return result;
};

// ─── UTILITIES ────────────────────────────────────────────────────────────────
const mToFtIn = m => {
  const ti = m * 39.3701, ft = Math.floor(ti/12), raw = ti%12;
  const q = Math.round(raw*4)/4, whole = Math.floor(q), frac = q-whole;
  return `${ft}'${whole}${frac===0?'':frac===.25?'¼':frac===.5?'½':'¾'}"`;
};
const fmtH = (cm, metric) => {
  if (!cm && cm!==0) return '';
  return metric ? `${(cm/100).toFixed(2)}m` : mToFtIn(cm/100);
};

const hasCleared   = m => Array.isArray(m) && m.includes('O');
const hasPassed    = m => Array.isArray(m) && m.some(x => x==='P'||x==='-');
const hasRetired   = m => Array.isArray(m) && m.includes('R');
const countMisses  = m => Array.isArray(m) ? m.filter(x=>x==='X').length : 0;

// Done at height: cleared OR used all 3 attempts (any combo O/X/P) OR terminal status
const isDone = (marks, status) =>
  status==='dns' || status==='retired' || status==='nh' ||
  hasCleared(marks) || marks.length>=3 || hasRetired(marks);

const showMarks = m => (!m||!m.length) ? '' : m.join('');

const highestClearedIdx = (a, n) => {
  for (let i=n-1; i>=0; i--) if (hasCleared(a.attempts[i])) return i;
  return -1;
};
const totalMisses = (a, n) => {
  let t=0;
  for (let i=0; i<n; i++) t += countMisses(a.attempts[i]||[]);
  return t;
};

const calcPlacements = (athletes, heights) => {
  const n = heights.length;
  const dns   = athletes.filter(a => a.status==='dns');
  const nh    = athletes.filter(a => a.status!=='dns' && highestClearedIdx(a,n)<0);
  const withH = athletes.filter(a => highestClearedIdx(a,n)>=0);
  const sorted = [...withH].sort((a,b) => {
    const ai=highestClearedIdx(a,n), bi=highestClearedIdx(b,n);
    if (bi!==ai) return bi-ai;
    const am=countMisses(a.attempts[ai]||[]), bm=countMisses(b.attempts[bi]||[]);
    if (am!==bm) return am-bm;
    return totalMisses(a,n)-totalMisses(b,n);
  });
  const result=[]; let place=1;
  for (let i=0; i<sorted.length; i++) {
    let p=place;
    if (i>0) {
      const pr=sorted[i-1], cr=sorted[i];
      const pi=highestClearedIdx(pr,n), ci=highestClearedIdx(cr,n);
      if (pi===ci && countMisses(pr.attempts[pi]||[])===countMisses(cr.attempts[ci]||[]) &&
          totalMisses(pr,n)===totalMisses(cr,n)) p=result[i-1].placement;
    }
    result.push({...sorted[i], placement:p});
    if (result[i].placement===place) place=i+2;
  }
  for (let i=0; i<result.length; i++)
    result[i].tied = result.some((r,j)=>j!==i&&r.placement===result[i].placement);
  return [
    ...result,
    ...nh.map(a=>({...a,placement:null,tied:false})),
    ...dns.map(a=>({...a,placement:null,tied:false})),
  ];
};

const nextVaulter = (athletes, hIdx, fromIdx) => {
  const n=athletes.length;
  for (let s=1; s<=n; s++) {
    const idx=(fromIdx+s)%n;
    if (!isDone(athletes[idx].attempts[hIdx]||[], athletes[idx].status)) return idx;
  }
  return -1;
};
const firstEligible = (athletes, hIdx) => {
  for (let i=0; i<athletes.length; i++)
    if (!isDone(athletes[i].attempts[hIdx]||[], athletes[i].status)) return i;
  return -1;
};

const genHeights = (startM, incStr) => {
  const startCm=Math.round(parseFloat(startM)*100);
  if (isNaN(startCm)) return [];
  const rules=[];
  for (const part of incStr.split(',').map(s=>s.trim())) {
    const m=part.match(/(\d+(?:\.\d+)?)\s*cm(?:\s*[x×]\s*(\d+))?/i);
    if (m) rules.push({cm:parseFloat(m[1]),count:m[2]?parseInt(m[2]):99});
  }
  const hs=[startCm]; let cur=startCm;
  for (const {cm,count} of rules) {
    for (let i=0; i<count; i++) {
      cur+=cm; hs.push(cur);
      if (hs.length>=10) return hs;   // max 10 heights
    }
  }
  return hs;
};
const parseManual = str =>
  str.split(/[,\s]+/).map(s=>parseFloat(s)).filter(n=>!isNaN(n)).map(m=>Math.round(m*100)).slice(0,10);

// ─── STYLE HELPERS ────────────────────────────────────────────────────────────
const inp = {background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text,padding:'10px 12px',fontSize:14,width:'100%',outline:'none'};
const sec = {marginBottom:18,padding:16,background:C.surface,borderRadius:14,border:`1px solid ${C.border}`};
const secTit = {fontWeight:700,fontSize:11,color:C.muted,textTransform:'uppercase',letterSpacing:1.2,marginBottom:12};
const btn = (bg,pad='10px 18px',fs=14) => ({
  background:bg,color:'#fff',border:'none',borderRadius:10,
  padding:pad,fontSize:fs,fontWeight:700,cursor:'pointer',
  WebkitTapHighlightColor:'transparent',letterSpacing:.2,
});

// ─── STORAGE ──────────────────────────────────────────────────────────────────
const LS_CUR = 'vaultdesk_current_v12';
const LS_ALL = 'vaultdesk_saved_v12';
const loadCurrent = () => { try { return JSON.parse(localStorage.getItem(LS_CUR)); } catch { return null; } };
const loadSaved   = () => { try { return JSON.parse(localStorage.getItem(LS_ALL)||'[]'); } catch { return []; } };
const saveAll = comps => { try { localStorage.setItem(LS_ALL, JSON.stringify(comps.slice(0,20))); } catch {} };
const saveCurrent = state => { try { localStorage.setItem(LS_CUR, JSON.stringify(state)); } catch {} };
const deleteComp = id => saveAll(loadSaved().filter(c=>c.id!==id));

// ─── ATHLETE FACTORY ──────────────────────────────────────────────────────────
let _ctr=0;
const mkAthlete = order => ({
  id:`a${++_ctr}_${Date.now().toString(36)}`,
  order, bib:'', firstName:'', lastName:'', country:'', affiliation:'',
  pb:'', sb:'', logoUrl:'',
  attempts:Array.from({length:10},()=>[]),
  status:'competing',
});

// ─── FLAG / LOGO CELL ─────────────────────────────────────────────────────────
function FlagCell({athlete, size=26}) {
  const [err,setErr]=useState(false);
  const src = athlete.logoUrl || (!err && getFlagUrl(athlete.country)) || null;
  if (src) return (
    <img src={src} alt={athlete.country||''} onError={()=>setErr(true)}
      style={{width:size,height:Math.round(size*.75),borderRadius:3,objectFit:'cover',flexShrink:0,background:C.border,display:'block'}}/>
  );
  const lbl=athlete.country?athlete.country.toUpperCase().slice(0,3):'?';
  return (
    <div style={{width:size,height:Math.round(size*.75),borderRadius:3,background:C.border,display:'flex',alignItems:'center',justifyContent:'center',fontSize:size<24?8:9,fontWeight:800,color:C.muted,flexShrink:0,letterSpacing:-.5}}>
      {lbl}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function VaultDeskApp() {
  const saved = useMemo(loadCurrent, []);

  const [screen,      setScreen]      = useState(saved?.screen||'setup');
  const [metric,      setMetric]      = useState(saved?.metric??true);
  const [rulebook,    setRulebook]    = useState(saved?.rulebook||'WA');
  const [live,        setLive]        = useState(true);
  const [editMode,    setEditMode]    = useState(false);
  const [showEdit,    setShowEdit]    = useState(false);
  const [compId,      setCompId]      = useState(()=>saved?.compId||`c_${Date.now().toString(36)}`);
  const [compStatus,  setCompStatus]  = useState(saved?.compStatus||'active');
  const [dirEmail,    setDirEmail]    = useState(saved?.dirEmail||'');
  const [editingId,   setEditingId]   = useState(null);
  const [savedComps,  setSavedComps]  = useState(loadSaved);

  const [info, setInfo] = useState(saved?.info || {
    name:'', date:new Date().toISOString().split('T')[0], venue:'', gender:'M',
  });
  const [athletes, setAthletes] = useState(() => {
    if (saved?.athletes?.length) return saved.athletes;
    return [mkAthlete(1)];
  });
  const [heights, setHeights] = useState(saved?.heights||[]);
  const [curH,    setCurH]    = useState(saved?.curH??0);
  const [curA,    setCurA]    = useState(saved?.curA??0);
  const [startH,  setStartH]  = useState('');
  const [incStr,  setIncStr]  = useState('10cm x3, 5cm x3, 2cm');
  const [manualH, setManualH] = useState('');

  // Auto-save on every meaningful state change
  useEffect(() => {
    if (heights.length>0 || athletes.some(a=>a.firstName||a.lastName)) {
      saveCurrent({screen,metric,rulebook,compId,compStatus,dirEmail,info,athletes,heights,curH,curA});
    }
  }, [screen,metric,rulebook,compId,compStatus,info,athletes,heights,curH,curA]);

  // ── Athlete ops ──
  const addAthlete = useCallback(() => setAthletes(p => {
    const last=p[p.length-1];
    if (last&&!last.firstName&&!last.lastName) return p;
    return [...p, mkAthlete(p.length+1)];
  }), []);
  const updAthlete = useCallback((id,ch) => setAthletes(p=>p.map(a=>a.id===id?{...a,...ch}:a)),[]);
  const delAthlete = useCallback(id => setAthletes(p=>p.filter(a=>a.id!==id).map((a,i)=>({...a,order:i+1}))),[]);
  const moveAthlete = useCallback((id,dir) => setAthletes(p => {
    const i=p.findIndex(a=>a.id===id), j=i+dir;
    if (j<0||j>=p.length) return p;
    const arr=[...p]; [arr[i],arr[j]]=[arr[j],arr[i]];
    return arr.map((a,k)=>({...a,order:k+1}));
  }),[]);
  const reorder = useCallback((from,to) => setAthletes(p => {
    if (from===to) return p;
    const arr=[...p]; const [item]=arr.splice(from,1); arr.splice(to,0,item);
    return arr.map((a,k)=>({...a,order:k+1}));
  }),[]);
  const setOrder = useCallback((id,n) => setAthletes(p => {
    const i=p.findIndex(a=>a.id===id);
    const t=Math.max(0,Math.min(p.length-1,n-1));
    if (i<0||i===t) return p;
    const arr=[...p]; const [item]=arr.splice(i,1); arr.splice(t,0,item);
    return arr.map((a,k)=>({...a,order:k+1}));
  }),[]);

  const doGenHeights = () => {
    const hs=manualH.trim()?parseManual(manualH):genHeights(startH,incStr);
    setHeights(hs);
  };

  // ── Record mark ──
  const recordMark = useCallback(mark => {
    setAthletes(prev => {
      const next=prev.map((a,i) => {
        if (i!==curA) return a;
        const marks=a.attempts[curH]||[];
        // Don't record if already done at this height
        if (isDone(marks, a.status)) return a;
        if (mark==='O') {
          const att=a.attempts.map((arr,hi)=>hi===curH?[...arr,'O']:arr);
          return {...a,attempts:att};
        }
        if (mark==='X') {
          const att=a.attempts.map((arr,hi)=>hi===curH?[...arr,'X']:arr);
          return {...a,attempts:att};
        }
        if (mark==='P') {
          const att=a.attempts.map((arr,hi)=>hi===curH?[...arr,'P']:arr);
          return {...a,attempts:att};
        }
        if (mark==='R') {
          const att=a.attempts.map((arr,hi)=>hi===curH?[...arr,'R']:arr);
          return {...a,attempts:att,status:'retired'};
        }
        if (mark==='DNS') return {...a,status:'dns'};
        return a;
      });

      const updated=next[curA];
      const updMarks=updated.attempts[curH]||[];
      if (isDone(updMarks, updated.status)) {
        const nxt=nextVaulter(next,curH,curA);
        if (nxt===-1) {
          const nextH=curH+1;
          if (nextH<heights.length) {
            setTimeout(()=>{
              setCurH(nextH);
              const fe=firstEligible(next,nextH);
              setCurA(fe===-1?0:fe);
            },50);
          }
        } else {
          setTimeout(()=>setCurA(nxt),50);
        }
      }
      return next;
    });
  },[curA,curH,heights]);

  const undoMark = useCallback(() => {
    setAthletes(prev=>prev.map((a,i)=>{
      if (i!==curA) return a;
      const att=a.attempts.map((arr,hi)=>hi===curH?[...arr]:arr);
      if (att[curH].length>0) att[curH].pop();
      const wasR=a.status==='retired'&&!att[curH].includes('R');
      const wasNH=a.status==='nh';
      return {...a,attempts:att,status:(wasR||wasNH)?'competing':a.status};
    }));
  },[curA,curH]);

  const ranked = useMemo(()=>calcPlacements(athletes,heights),[athletes,heights]);

  const startComp = () => {
    const hs=heights.length?heights:(manualH.trim()?parseManual(manualH):genHeights(startH,incStr));
    if (!hs.length){alert('Set up heights first.');return;}
    setHeights(hs);
    const fe=firstEligible(athletes,0);
    setCurA(fe===-1?0:fe); setCurH(0); setEditMode(false); setScreen('scoring');
  };

  const endCompetition = () => {
    if (!confirm('End this competition? Results will be marked as pending verification.')) return;
    setCompStatus('complete-pending');
    // Auto-save to history
    const snap={id:compId,name:info.name||'Unnamed',date:info.date,savedAt:new Date().toISOString(),compStatus:'complete-pending',state:{info,rulebook,athletes,heights,curH,curA,metric}};
    const all=loadSaved().filter(c=>c.id!==snap.id);
    saveAll([snap,...all]); setSavedComps(loadSaved());
  };
  const verifyOfficial = () => setCompStatus('official');

  const saveSnapshot = useCallback(() => {
    const snap={id:compId,name:info.name||'Unnamed',date:info.date,savedAt:new Date().toISOString(),compStatus,state:{info,rulebook,athletes,heights,curH,curA,metric}};
    const all=loadSaved().filter(c=>c.id!==snap.id);
    saveAll([snap,...all]); setSavedComps(loadSaved());
  },[compId,info,rulebook,athletes,heights,curH,curA,metric,compStatus]);

  const loadSnapshot = snap => {
    const {info:i,rulebook:r,athletes:a,heights:h,curH:ch,curA:ca,metric:m}=snap.state;
    setInfo(i);setRulebook(r);setAthletes(a);setHeights(h);
    setCurH(ch);setCurA(ca);setMetric(m);setCompId(snap.id);setCompStatus(snap.compStatus||'active');
    setScreen('scoring');
  };

  // Compute on-deck and in-hole
  const onDeckIdx  = heights.length ? nextVaulter(athletes,curH,curA) : -1;
  const inHoleIdx  = onDeckIdx!==-1 ? nextVaulter(athletes,curH,onDeckIdx) : -1;
  const onDeck     = onDeckIdx!==-1 && onDeckIdx!==curA ? athletes[onDeckIdx] : null;
  const inHole     = inHoleIdx!==-1 && inHoleIdx!==curA && inHoleIdx!==onDeckIdx ? athletes[inHoleIdx] : null;

  const TABS = [
    {id:'setup',  icon:'⚙️', label:'Setup'},
    {id:'scoring',icon:'🎯', label:'Score'},
    {id:'display',icon:'📺', label:'Display'},
    {id:'history',icon:'🗂️', label:'History'},
  ];

  return (
    <div style={{background:C.bg,minHeight:'100vh',color:C.text,maxWidth:'100vw',overflowX:'hidden'}}>

      {/* TOP BAR */}
      <header style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'9px 14px',position:'sticky',top:0,zIndex:300,display:'flex',alignItems:'center',gap:8}}>
        <div style={{fontWeight:900,fontSize:16,color:C.accent,letterSpacing:-.5,flexShrink:0}}>VaultDesk</div>
        <div style={{flex:1,fontSize:11,color:C.muted,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>
          {info.name||'Pole Vault'}
          {screen==='scoring'&&heights[curH]?` · ${fmtH(heights[curH],metric)}`:''}
        </div>
        <button onClick={()=>setMetric(m=>!m)} style={{...btn(C.card,'5px 9px',10),border:`1px solid ${C.border}`}}>
          {metric?'m→ft':'ft→m'}
        </button>
        {screen==='scoring' && <>
          <button onClick={()=>setLive(l=>!l)} style={{...btn(live?'#7f1d1d':C.card,'5px 8px',10),border:live?'none':`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:3}}>
            <span className={live?'live-dot':''} style={{width:6,height:6,borderRadius:'50%',background:live?'#ff4444':C.muted,flexShrink:0}}/>
            {live?'LIVE':'OFF'}
          </button>
          <button onClick={()=>setShowEdit(true)} style={{...btn(editMode?C.warn:C.card,'5px 9px',10),border:`1px solid ${editMode?C.warn:C.border}`}}>✏️ Edit</button>
          {compStatus==='active' && (
            <button onClick={endCompetition} style={{...btn('#374151','5px 9px',10),border:`1px solid ${C.border}`}}>End</button>
          )}
        </>}
      </header>

      {/* COMP STATUS BANNER */}
      {compStatus!=='active' && (
        <div style={{background:compStatus==='official'?`${C.success}22`:`${C.warn}22`,borderBottom:`1px solid ${compStatus==='official'?C.success:C.warn}44`,padding:'8px 16px',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <div style={{fontSize:12,fontWeight:700,color:compStatus==='official'?C.success:C.warn,flex:1}}>
            {compStatus==='official'?'✓ Official Results — Verified & Accepted':'⏳ Final Results — Pending Official Verification'}
          </div>
          {compStatus==='complete-pending' && (
            <button onClick={verifyOfficial} style={btn(C.success,'5px 12px',11)}>✓ Verify Official</button>
          )}
          {compStatus==='complete-pending' && dirEmail && (
            <a href={`mailto:${dirEmail}?subject=Competition Results Ready for Verification: ${info.name}&body=The ${info.name} pole vault competition results are ready for your review and official verification.`}
              style={{...btn('#2d3748','5px 12px',11),textDecoration:'none'}}>✉ Notify Director</a>
          )}
        </div>
      )}

      {/* TABS */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,display:'flex'}}>
        {TABS.map(t=>(
          <button key={t.id}
            onClick={()=>{if((t.id==='scoring'||t.id==='display')&&!heights.length)return;setScreen(t.id);}}
            style={{flex:1,padding:'8px 0',background:'none',border:'none',color:screen===t.id?C.accent:C.muted,fontWeight:screen===t.id?700:400,fontSize:11,cursor:'pointer',borderBottom:`2px solid ${screen===t.id?C.accent:'transparent'}`,fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:3,WebkitTapHighlightColor:'transparent'}}>
            <span>{t.icon}</span><span>{t.label}</span>
          </button>
        ))}
      </div>

      {/* CONTENT */}
      <main>
        {screen==='setup'   && <SetupScreen info={info} setInfo={setInfo} rulebook={rulebook} setRulebook={setRulebook} athletes={athletes} addAthlete={addAthlete} updAthlete={updAthlete} delAthlete={delAthlete} moveAthlete={moveAthlete} reorder={reorder} setOrder={setOrder} editingId={editingId} setEditingId={setEditingId} startH={startH} setStartH={setStartH} incStr={incStr} setIncStr={setIncStr} manualH={manualH} setManualH={setManualH} doGenHeights={doGenHeights} heights={heights} metric={metric} startComp={startComp} dirEmail={dirEmail} setDirEmail={setDirEmail}/>}
        {screen==='scoring' && <ScoringScreen athletes={athletes} ranked={ranked} heights={heights} curH={curH} setCurH={setCurH} curA={curA} setCurA={setCurA} metric={metric} recordMark={recordMark} undoMark={undoMark} live={live} onDeck={onDeck} inHole={inHole} compStatus={compStatus}/>}
        {screen==='display' && <DisplayScreen athletes={athletes} ranked={ranked} heights={heights} curH={curH} curA={curA} metric={metric} live={live} info={info} onDeck={onDeck} inHole={inHole}/>}
        {screen==='history' && <HistoryScreen savedComps={savedComps} setSavedComps={setSavedComps} loadSnapshot={loadSnapshot} saveSnapshot={saveSnapshot}/>}
      </main>

      {/* EDIT OVERLAY (accessible from scoring) */}
      {showEdit && (
        <EditOverlay
          onClose={()=>setShowEdit(false)}
          athletes={athletes} addAthlete={addAthlete} updAthlete={updAthlete}
          delAthlete={delAthlete} moveAthlete={moveAthlete} reorder={reorder} setOrder={setOrder}
          editingId={editingId} setEditingId={setEditingId}
          rulebook={rulebook}
          heights={heights} setHeights={setHeights} metric={metric}
          startH={startH} setStartH={setStartH} incStr={incStr} setIncStr={setIncStr}
          manualH={manualH} setManualH={setManualH} doGenHeights={doGenHeights}
        />
      )}
    </div>
  );
}

// ─── SETUP SCREEN ─────────────────────────────────────────────────────────────
function SetupScreen({info,setInfo,rulebook,setRulebook,athletes,addAthlete,updAthlete,delAthlete,moveAthlete,reorder,setOrder,editingId,setEditingId,startH,setStartH,incStr,setIncStr,manualH,setManualH,doGenHeights,heights,metric,startComp,dirEmail,setDirEmail}) {
  const ci=(k,v)=>setInfo(p=>({...p,[k]:v}));
  return (
    <div style={{padding:14,maxWidth:640,margin:'0 auto',paddingBottom:40}}>
      <div style={sec}>
        <div style={secTit}>Competition Info</div>
        <div style={{display:'grid',gap:10}}>
          <input style={inp} placeholder="Meet / Event Name" value={info.name} onChange={e=>ci('name',e.target.value)}/>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <input style={inp} type="date" value={info.date} onChange={e=>ci('date',e.target.value)}/>
            <input style={inp} placeholder="Venue / Location" value={info.venue} onChange={e=>ci('venue',e.target.value)}/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <select style={inp} value={info.gender} onChange={e=>ci('gender',e.target.value)}>
              <option value="M">Men's / Boys'</option>
              <option value="W">Women's / Girls'</option>
              <option value="MX">Mixed</option>
            </select>
            <select style={inp} value={rulebook} onChange={e=>setRulebook(e.target.value)}>
              {RULEBOOKS.map(r=><option key={r.key} value={r.key}>{r.label}</option>)}
            </select>
          </div>
          <input style={inp} placeholder="Meet Director email (for results notification)" value={dirEmail} onChange={e=>setDirEmail(e.target.value)}/>
        </div>
      </div>

      <div style={sec}>
        <div style={secTit}>Height Progression <span style={{color:C.muted,fontWeight:400,fontSize:10,letterSpacing:0}}>(max 10 heights)</span></div>
        <div style={{display:'grid',gap:10}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div>
              <div style={{fontSize:11,color:C.muted,marginBottom:5}}>Starting Height (m)</div>
              <input style={inp} placeholder="e.g. 5.00" value={startH} onChange={e=>setStartH(e.target.value)}/>
            </div>
            <div>
              <div style={{fontSize:11,color:C.muted,marginBottom:5}}>Increments</div>
              <input style={inp} placeholder="10cm x3, 5cm" value={incStr} onChange={e=>setIncStr(e.target.value)}/>
            </div>
          </div>
          <div>
            <div style={{fontSize:11,color:C.muted,marginBottom:5}}>Or enter manually (meters, comma-separated, max 10)</div>
            <input style={inp} placeholder="5.00, 5.10, 5.20..." value={manualH} onChange={e=>setManualH(e.target.value)}/>
          </div>
          <button onClick={doGenHeights} style={btn(C.accent)}>Generate Heights</button>
          {heights.length>0 && (
            <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:'10px 14px'}}>
              {heights.map((h,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'4px 0',borderBottom:i<heights.length-1?`1px solid ${C.border}`:'none'}}>
                  <div style={{width:24,fontSize:11,color:C.muted,fontWeight:700}}>{i+1}</div>
                  <div style={{fontWeight:600,fontSize:13,color:C.text}}>{fmtH(h,metric)}</div>
                  <div style={{fontSize:11,color:C.muted}}>{fmtH(h,!metric)}</div>
                </div>
              ))}
              <div style={{fontSize:11,color:C.muted,marginTop:8}}>{heights.length} height{heights.length!==1?'s':''} · max 10</div>
            </div>
          )}
        </div>
      </div>

      <div style={sec}>
        <div style={{display:'flex',alignItems:'center',marginBottom:10}}>
          <div style={{...secTit,marginBottom:0}}>Athletes ({athletes.length})</div>
          <div style={{flex:1}}/>
          <button onClick={addAthlete} style={btn(C.success,'7px 14px',13)}>+ Add</button>
        </div>
        <div style={{fontSize:11,color:C.muted,marginBottom:10}}>⠿ drag to reorder · type # to jump · lookup searches {SEARCH_LABEL[rulebook]||'World Athletics'}</div>
        <AthleteList athletes={athletes} editingId={editingId} setEditingId={setEditingId} updAthlete={updAthlete} delAthlete={delAthlete} moveAthlete={moveAthlete} reorder={reorder} setOrder={setOrder} rulebook={rulebook}/>
        {!athletes.length&&<div style={{textAlign:'center',padding:20,color:C.muted,fontSize:13}}>No athletes — click + Add</div>}
      </div>

      <button onClick={startComp} style={{...btn(athletes.length>0&&heights.length>0?C.success:'#2a2a2a'),width:'100%',padding:15,fontSize:16,borderRadius:14,opacity:athletes.length>0&&heights.length>0?1:.5}}>
        🚀 Start Competition
      </button>
      {(!athletes.length||!heights.length)&&(
        <div style={{textAlign:'center',fontSize:12,color:C.muted,marginTop:8}}>
          {!athletes.length?'Add at least one athlete':'Generate heights above'} to start
        </div>
      )}
    </div>
  );
}

// ─── ATHLETE LIST ─────────────────────────────────────────────────────────────
function AthleteList({athletes,editingId,setEditingId,updAthlete,delAthlete,moveAthlete,reorder,setOrder,rulebook}) {
  const [dragIdx,setDragIdx]=useState(null);
  const [overIdx,setOverIdx]=useState(null);
  return (
    <div style={{display:'grid',gap:8}}>
      {athletes.map((a,i)=>(
        <div key={a.id} draggable
          onDragStart={e=>{setDragIdx(i);e.dataTransfer.effectAllowed='move';}}
          onDragOver={e=>{e.preventDefault();setOverIdx(i);}}
          onDrop={e=>{e.preventDefault();if(dragIdx!==null&&dragIdx!==i)reorder(dragIdx,i);setDragIdx(null);setOverIdx(null);}}
          onDragEnd={()=>{setDragIdx(null);setOverIdx(null);}}
          className={overIdx===i&&dragIdx!==i?'drag-over':''}>
          <AthleteRow athlete={a} index={i} total={athletes.length} rulebook={rulebook}
            isEditing={editingId===a.id}
            onEdit={()=>setEditingId(editingId===a.id?null:a.id)}
            onUpdate={ch=>updAthlete(a.id,ch)} onDelete={()=>delAthlete(a.id)}
            onUp={()=>moveAthlete(a.id,-1)} onDown={()=>moveAthlete(a.id,1)}
            onSetOrder={n=>setOrder(a.id,n)}/>
        </div>
      ))}
    </div>
  );
}

// ─── ATHLETE ROW ──────────────────────────────────────────────────────────────
function AthleteRow({athlete,index,total,isEditing,onEdit,onUpdate,onDelete,onUp,onDown,onSetOrder,rulebook}) {
  const [orderInput,setOrderInput]=useState('');
  const [showLookup,setShowLookup]=useState(false);
  const commitOrder=()=>{const n=parseInt(orderInput);if(!isNaN(n))onSetOrder(n);setOrderInput('');};

  if (!isEditing) return (
    <div style={{display:'flex',alignItems:'center',gap:7,padding:'10px 12px',background:C.card,borderRadius:10,border:`1px solid ${C.border}`}}>
      <div style={{cursor:'grab',fontSize:15,color:C.muted,flexShrink:0,userSelect:'none'}}>⠿</div>
      <input value={orderInput} onChange={e=>setOrderInput(e.target.value)} onBlur={commitOrder}
        onKeyDown={e=>e.key==='Enter'&&commitOrder()}
        placeholder={String(athlete.order)}
        style={{...inp,padding:'3px 5px',fontSize:11,textAlign:'center',width:30,borderRadius:6}}/>
      <FlagCell athlete={athlete} size={26}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:600,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {(athlete.firstName||athlete.lastName)?`${athlete.firstName} ${athlete.lastName}`.trim():<span style={{color:C.muted}}>Unnamed</span>}
          {athlete.bib&&<span style={{fontSize:10,color:C.muted,marginLeft:5}}>[{athlete.bib}]</span>}
        </div>
        <div style={{fontSize:11,color:C.muted,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {[athlete.affiliation,athlete.country].filter(Boolean).join(' · ')||'No affiliation'}
          {(athlete.pb||athlete.sb)&&` · ${[athlete.pb&&'PB '+athlete.pb,athlete.sb&&'SB '+athlete.sb].filter(Boolean).join(', ')}`}
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:2,flexShrink:0}}>
        <button onClick={onUp}   disabled={index===0}       style={{...btn(C.border,'2px 6px',10),opacity:index===0?.25:1}}>↑</button>
        <button onClick={onDown} disabled={index===total-1} style={{...btn(C.border,'2px 6px',10),opacity:index===total-1?.25:1}}>↓</button>
      </div>
      <button onClick={onEdit}   style={btn(C.accent,'6px 11px',11)}>Edit</button>
      <button onClick={onDelete} style={btn('#7f1d1d','6px 11px',11)}>✕</button>
    </div>
  );

  const fields=[['First Name','firstName'],['Last Name','lastName'],['Country (IOC/ISO)','country'],['Affiliation','affiliation'],['Bib #','bib'],['Entry PR / PB','pb'],['Season Best','sb']];
  return (
    <div style={{padding:14,background:C.card,borderRadius:10,border:`2px solid ${C.accent}`}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:700,color:C.accent}}>Athlete #{athlete.order}</div>
        <button onClick={()=>setShowLookup(true)} style={{...btn('#1d3a6b','6px 12px',11),border:`1px solid ${C.accent}55`}}>
          🔍 Lookup {SEARCH_LABEL[rulebook]||'WA'}
        </button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
        {fields.map(([ph,k])=>(
          <input key={k} style={inp} placeholder={ph} value={athlete[k]||''} onChange={e=>onUpdate({[k]:e.target.value})}/>
        ))}
      </div>
      {athlete.country&&(
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,fontSize:11,color:C.muted}}>
          Flag:&nbsp;<FlagCell athlete={athlete} size={26}/>
          <span style={{color:C.text}}>{athlete.country.toUpperCase()}</span>
          {!getFlagUrl(athlete.country)&&<span style={{color:C.warn}}> — use 2-letter ISO or 3-letter IOC</span>}
        </div>
      )}
      <input style={{...inp,marginBottom:10}} placeholder="Custom logo / flag URL (optional)" value={athlete.logoUrl||''} onChange={e=>onUpdate({logoUrl:e.target.value})}/>
      <div style={{display:'flex',gap:8}}>
        <button onClick={onEdit} style={btn(C.success,'8px 14px',13)}>✓ Done</button>
        <button onClick={onDelete} style={btn('#7f1d1d','8px 14px',13)}>Delete</button>
      </div>
      {showLookup&&<LookupDialog athlete={athlete} rulebook={rulebook} onApply={ch=>{onUpdate(ch);setShowLookup(false);}} onClose={()=>setShowLookup(false)}/>}
    </div>
  );
}

// ─── LOOKUP DIALOG ────────────────────────────────────────────────────────────
function LookupDialog({athlete,rulebook,onApply,onClose}) {
  const [paste,setPaste]=useState('');
  const [parsed,setParsed]=useState(null);
  const name=`${athlete.firstName||''} ${athlete.lastName||''}`.trim()||'athlete';
  const url=SEARCH_URL(name,rulebook);

  useEffect(()=>{
    if (paste.length>20) setParsed(parsePaste(paste));
    else setParsed(null);
  },[paste]);

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',zIndex:600,display:'flex',alignItems:'flex-end',justifyContent:'center'}} onClick={onClose}>
      <div style={{background:C.surface,borderRadius:'16px 16px 0 0',padding:20,width:'100%',maxWidth:560,maxHeight:'70vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:15,flex:1}}>Lookup: {name}</div>
          <button onClick={onClose} style={{...btn('#333','7px 14px',13)}}>✕ Close</button>
        </div>
        <div style={{fontSize:12,color:C.muted,marginBottom:12,lineHeight:1.5}}>
          Auto-fetch is unavailable (browser security blocks cross-site requests).
          Open {SEARCH_LABEL[rulebook]}, find the athlete, then paste their profile text below — PB, SB, and country will be extracted automatically.
        </div>
        <a href={url} target="_blank" rel="noreferrer"
          style={{...btn(C.accent,'9px 18px',13),textDecoration:'none',display:'inline-block',marginBottom:14}}>
          ↗ Open {SEARCH_LABEL[rulebook]} Search
        </a>
        <textarea
          value={paste}
          onChange={e=>setPaste(e.target.value)}
          placeholder={`Paste copied text from ${SEARCH_LABEL[rulebook]} here...\n\nLook for: PB/PR, SB, country code`}
          style={{...inp,height:90,resize:'vertical',marginBottom:10,display:'block'}}
        />
        {parsed && (Object.keys(parsed).length>0) && (
          <div style={{background:C.card,borderRadius:8,padding:'10px 14px',marginBottom:12,border:`1px solid ${C.success}44`}}>
            <div style={{fontSize:11,color:C.success,fontWeight:700,marginBottom:6}}>✓ Extracted</div>
            {parsed.pb&&<div style={{fontSize:12,marginBottom:3}}>PB / Entry PR: <strong>{parsed.pb}</strong></div>}
            {parsed.sb&&<div style={{fontSize:12,marginBottom:3}}>Season Best: <strong>{parsed.sb}</strong></div>}
            {parsed.country&&<div style={{fontSize:12}}>Country: <strong>{parsed.country}</strong></div>}
            <button onClick={()=>onApply(parsed)} style={{...btn(C.success,'7px 16px',12),marginTop:10}}>Apply</button>
          </div>
        )}
        {paste.length>20 && !parsed?.pb && !parsed?.sb && (
          <div style={{fontSize:11,color:C.warn,marginBottom:10}}>Nothing recognized — try pasting more of the profile page or enter manually above.</div>
        )}
      </div>
    </div>
  );
}

// ─── SCORING SCREEN ───────────────────────────────────────────────────────────
function ScoringScreen({athletes,ranked,heights,curH,setCurH,curA,setCurA,metric,recordMark,undoMark,live,onDeck,inHole,compStatus}) {
  const n=heights.length;
  const curAth=athletes[curA];
  const curHt=heights[curH];
  const curMarks=curAth?(curAth.attempts[curH]||[]):[];
  const attemptNum=curMarks.length+1;   // which attempt is next (1-3)
  const missCount=countMisses(curMarks);
  const alreadyDone=curAth?isDone(curMarks,curAth.status):true;

  const MARKS=[
    {mark:'O',  bg:C.success, emoji:'✓', label:'Clear'},
    {mark:'X',  bg:C.danger,  emoji:'✗', label:'Miss'},
    {mark:'P',  bg:'#2563eb', emoji:'—', label:'Pass'},
    {mark:'R',  bg:C.warn,    emoji:'R', label:'Retire'},
    {mark:'DNS',bg:'#374151', emoji:'—', label:'DNS'},
  ];

  const getCellStyle=(marks,hIdx)=>{
    if (hasCleared(marks))              return {background:C.cleared,color:'#4ade80'};
    if (marks.length>=3&&!hasCleared(marks)) return {background:C.missed, color:'#f87171'};
    if (hasPassed(marks)&&!hasCleared(marks)&&marks.length>=3) return {background:C.passed,color:'#60a5fa'};
    return {background:hIdx===curH?C.accent+'0d':'transparent'};
  };

  // Attempt indicator dots (3 total, X=red, P=blue, unused=dim)
  const AttemptDots=()=>{
    const dots=Array.from({length:3},(_,i)=>{
      const m=curMarks[i];
      if (!m) return <span key={i} style={{width:12,height:12,borderRadius:'50%',border:`2px solid ${C.border}`,display:'inline-block',margin:'0 3px'}}/>;
      if (m==='O') return <span key={i} style={{width:12,height:12,borderRadius:'50%',background:C.success,display:'inline-block',margin:'0 3px'}}/>;
      if (m==='X') return <span key={i} style={{width:12,height:12,borderRadius:'50%',background:C.danger,display:'inline-block',margin:'0 3px'}}/>;
      return <span key={i} style={{width:12,height:12,borderRadius:'50%',background:'#2563eb',display:'inline-block',margin:'0 3px'}}/>;
    });
    return <div style={{display:'flex',alignItems:'center',justifyContent:'center',marginTop:6}}>{dots}</div>;
  };

  return (
    <div>
      {/* VAULTER HERO */}
      {curAth && !alreadyDone ? (
        <div style={{background:`linear-gradient(160deg,${C.accent}25 0%,${C.surface} 100%)`,borderBottom:`1px solid ${C.border}`,borderLeft:`4px solid ${C.accent}`,padding:'14px 16px'}}>
          <div style={{fontSize:9,fontWeight:800,letterSpacing:2.5,color:C.accent,textTransform:'uppercase',marginBottom:10,display:'flex',alignItems:'center',gap:6}}>
            {live&&<span className="live-dot" style={{width:7,height:7,borderRadius:'50%',background:'#ff4444',display:'inline-block'}}/>}
            Now Vaulting
            <span style={{marginLeft:'auto',color:C.muted,letterSpacing:.5}}>Jump #{curAth.order} · Attempt {attemptNum} of 3</span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:14}}>
            <FlagCell athlete={curAth} size={52}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:26,fontWeight:900,lineHeight:1.1,letterSpacing:-.5}}>
                {curAth.firstName&&<span style={{color:C.muted,fontSize:22}}>{curAth.firstName} </span>}
                <span style={{color:C.text}}>{curAth.lastName||curAth.firstName||'—'}</span>
              </div>
              <div style={{fontSize:12,color:C.muted,marginTop:3}}>
                {[curAth.affiliation,curAth.country].filter(Boolean).join(' · ')}
                {curAth.pb?` · PB ${curAth.pb}`:''}
              </div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:24,fontWeight:900,color:C.accent,lineHeight:1}}>{fmtH(curHt,metric)}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:2}}>{fmtH(curHt,!metric)}</div>
              <AttemptDots/>
            </div>
          </div>
        </div>
      ) : (
        <div style={{background:`${C.warn}18`,borderBottom:`1px solid ${C.warn}33`,padding:'10px 16px',fontSize:12,color:C.warn,fontWeight:600}}>
          ⚠️ All athletes complete at {fmtH(curHt,metric)}. Tap a height tab to advance.
        </div>
      )}

      {/* ON DECK / IN THE HOLE */}
      {(onDeck||inHole) && (
        <div style={{display:'flex',borderBottom:`1px solid ${C.border}`,background:C.surface}}>
          {onDeck && (
            <div style={{flex:1,padding:'8px 14px',borderRight:inHole?`1px solid ${C.border}`:undefined}}>
              <div style={{fontSize:9,fontWeight:800,letterSpacing:2,color:C.muted,textTransform:'uppercase',marginBottom:4}}>On Deck</div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <FlagCell athlete={onDeck} size={20}/>
                <div style={{fontWeight:700,fontSize:12,color:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {onDeck.firstName} {onDeck.lastName}
                </div>
                <div style={{fontSize:10,color:C.muted,flexShrink:0}}>#{onDeck.order}</div>
              </div>
            </div>
          )}
          {inHole && (
            <div style={{flex:1,padding:'8px 14px'}}>
              <div style={{fontSize:9,fontWeight:800,letterSpacing:2,color:C.muted,textTransform:'uppercase',marginBottom:4}}>In the Hole</div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <FlagCell athlete={inHole} size={20}/>
                <div style={{fontWeight:700,fontSize:12,color:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {inHole.firstName} {inHole.lastName}
                </div>
                <div style={{fontSize:10,color:C.muted,flexShrink:0}}>#{inHole.order}</div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* HEIGHT TABS */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'7px 10px',display:'flex',gap:5,overflowX:'auto',alignItems:'center',WebkitOverflowScrolling:'touch'}}>
        <span style={{fontSize:9,color:C.muted,flexShrink:0,textTransform:'uppercase',letterSpacing:.8}}>Bar:</span>
        {heights.map((h,i)=>(
          <button key={i} onClick={()=>setCurH(i)}
            style={{flexShrink:0,background:i===curH?C.accent:C.card,color:i===curH?'#fff':C.muted,
              border:`1px solid ${i===curH?C.accent:C.border}`,borderRadius:18,padding:'3px 10px',fontSize:10,
              fontWeight:i===curH?700:400,cursor:'pointer',fontFamily:'inherit',WebkitTapHighlightColor:'transparent'}}>
            {fmtH(h,metric)}
          </button>
        ))}
      </div>

      {/* MARK BUTTONS */}
      <div style={{background:C.bg,borderBottom:`1px solid ${C.border}`,padding:'10px 12px',display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:7}}>
        {MARKS.map(({mark,bg,emoji,label})=>(
          <button key={mark} onClick={()=>recordMark(mark)}
            style={{background:bg,color:'#fff',border:'none',borderRadius:12,padding:'11px 2px',fontSize:10,fontWeight:700,
              cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3,
              minHeight:56,fontFamily:'inherit',WebkitTapHighlightColor:'transparent',touchAction:'manipulation'}}>
            <span style={{fontSize:17}}>{emoji}</span>
            <span>{label}</span>
          </button>
        ))}
        <button onClick={undoMark}
          style={{background:'#4c1d95',color:'#fff',border:'none',borderRadius:12,padding:'11px 2px',fontSize:10,fontWeight:700,
            cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3,
            minHeight:56,fontFamily:'inherit',WebkitTapHighlightColor:'transparent'}}>
          <span style={{fontSize:17}}>↩</span>
          <span>Undo</span>
        </button>
      </div>

      {/* RESULTS TABLE — USATF style */}
      <ResultsTable athletes={athletes} ranked={ranked} heights={heights} curH={curH} curA={curA} metric={metric} setCurA={setCurA} setCurH={setCurH}/>
    </div>
  );
}

// ─── RESULTS TABLE ────────────────────────────────────────────────────────────
function ResultsTable({athletes,ranked,heights,curH,curA,metric,setCurA,setCurH,compact=false}) {
  const n=heights.length;
  if (!n) return null;

  const getCellContent=(ath,hIdx)=>{
    const m=ath.attempts[hIdx]||[];
    if (ath.status==='dns') return {text:'—',color:C.muted,bg:'transparent'};
    if (!m.length) return {text:'',color:C.muted,bg:'transparent'};
    const text=m.join('');
    if (hasCleared(m)) return {text,color:'#4ade80',bg:C.cleared};
    if (m.length>=3&&!hasCleared(m)) return {text,color:'#f87171',bg:C.missed};
    return {text,color:C.muted,bg:'transparent'};
  };

  const bestResult=(ath)=>{
    const idx=highestClearedIdx(ath,n);
    if (idx<0) return null;
    return heights[idx];
  };

  return (
    <div style={{overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
      <table style={{borderCollapse:'collapse',fontSize:compact?11:12,width:'100%',minWidth:Math.max(400,160+n*52)+'px'}}>
        <thead>
          <tr style={{background:C.surface,borderBottom:`2px solid ${C.border}`}}>
            <th style={{position:'sticky',left:0,background:C.surface,padding:'8px 6px',textAlign:'center',color:C.muted,width:34,fontSize:9,fontWeight:800,letterSpacing:.5,zIndex:10}}>PL</th>
            <th style={{position:'sticky',left:34,background:C.surface,padding:'8px 10px',textAlign:'left',color:C.muted,minWidth:140,fontSize:9,fontWeight:800,letterSpacing:.5,zIndex:10}}>ATHLETE</th>
            <th style={{padding:'8px 6px',textAlign:'center',color:C.muted,width:50,fontSize:9,fontWeight:800,letterSpacing:.5}}>BEST</th>
            {heights.map((h,i)=>(
              <th key={i} style={{padding:'8px 4px',textAlign:'center',minWidth:48,color:i===curH?C.accent:C.muted,fontWeight:i===curH?800:600,fontSize:9,letterSpacing:.3,background:i===curH?C.accent+'18':C.surface}}>
                {fmtH(h,metric)}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {ranked.map((ath,rowIdx)=>{
            const origIdx=athletes.findIndex(a=>a.id===ath.id);
            const isCur=origIdx===curA;
            const best=bestResult(ath);
            const rowBg=isCur?C.accent+'12':rowIdx%2===0?'transparent':C.surface+'60';
            return (
              <tr key={ath.id}
                style={{background:rowBg,borderBottom:`1px solid ${C.border}`,borderLeft:isCur?`3px solid ${C.accent}`:'3px solid transparent'}}>
                <td style={{position:'sticky',left:0,background:rowBg,padding:'8px 6px',textAlign:'center',fontWeight:800,fontSize:compact?13:15}}>
                  {ath.placement===1?'🥇':ath.placement===2?'🥈':ath.placement===3?'🥉':
                   ath.placement?<span style={{color:C.muted,fontSize:11}}>{ath.placement}{ath.tied?'=':''}</span>:
                   <span style={{fontSize:9,color:C.muted}}>{ath.status==='dns'?'DNS':ath.status==='nh'?'NH':'—'}</span>}
                </td>
                <td style={{position:'sticky',left:34,background:rowBg,padding:'8px 10px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:7}}>
                    <FlagCell athlete={ath} size={20}/>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:isCur?800:600,fontSize:13,color:isCur?C.accent:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:110}}>
                        {isCur&&<span style={{fontSize:9,marginRight:3}}>▶</span>}
                        {ath.firstName} {ath.lastName}
                        {ath.bib&&<span style={{fontSize:9,color:C.muted,marginLeft:3}}>[{ath.bib}]</span>}
                      </div>
                      <div style={{fontSize:9,color:C.muted,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:110}}>
                        {ath.affiliation||ath.country||''}
                      </div>
                    </div>
                  </div>
                </td>
                <td style={{padding:'8px 6px',textAlign:'center'}}>
                  {best ? (
                    <div>
                      <div style={{fontSize:11,fontWeight:800,color:C.success}}>{fmtH(best,metric)}</div>
                      <div style={{fontSize:9,color:C.muted}}>{fmtH(best,!metric)}</div>
                    </div>
                  ) : (
                    <span style={{fontSize:10,color:C.muted}}>{ath.status==='dns'?'DNS':ath.status==='nh'?'NH':'—'}</span>
                  )}
                </td>
                {heights.map((h,hIdx)=>{
                  const {text,color,bg}=getCellContent(ath,hIdx);
                  const isCurCell=hIdx===curH&&origIdx===curA;
                  return (
                    <td key={hIdx}
                      onClick={()=>{setCurH(hIdx);setCurA(origIdx);}}
                      style={{padding:'8px 4px',textAlign:'center',fontWeight:700,fontSize:11,
                        letterSpacing:.3,color,background:isCurCell?bg||C.accent+'0d':bg,
                        cursor:'pointer',outline:isCurCell?`2px inset ${C.accent}55`:'none'}}>
                      {text}
                    </td>
                  );
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ─── EDIT OVERLAY ─────────────────────────────────────────────────────────────
function EditOverlay({onClose,athletes,addAthlete,updAthlete,delAthlete,moveAthlete,reorder,setOrder,editingId,setEditingId,rulebook,heights,setHeights,metric,startH,setStartH,incStr,setIncStr,manualH,setManualH,doGenHeights}) {
  const [tab,setTab]=useState('athletes');
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:500,display:'flex',flexDirection:'column',justifyContent:'flex-end'}} onClick={onClose}>
      <div style={{background:C.surface,borderRadius:'18px 18px 0 0',maxHeight:'80vh',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',padding:'14px 16px 10px',borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
          <div style={{fontWeight:800,fontSize:16,flex:1}}>Edit Competition</div>
          <button onClick={onClose} style={btn(C.success,'7px 16px',13)}>✓ Done</button>
        </div>
        <div style={{display:'flex',borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
          <button onClick={()=>setTab('athletes')} style={{flex:1,padding:'8px 0',background:'none',border:'none',color:tab==='athletes'?C.accent:C.muted,fontWeight:tab==='athletes'?700:400,fontSize:12,cursor:'pointer',borderBottom:`2px solid ${tab==='athletes'?C.accent:'transparent'}`,fontFamily:'inherit'}}>Athletes</button>
          <button onClick={()=>setTab('heights')}  style={{flex:1,padding:'8px 0',background:'none',border:'none',color:tab==='heights'?C.accent:C.muted,fontWeight:tab==='heights'?700:400,fontSize:12,cursor:'pointer',borderBottom:`2px solid ${tab==='heights'?C.accent:'transparent'}`,fontFamily:'inherit'}}>Heights</button>
        </div>
        <div style={{overflowY:'auto',padding:14,flex:1}}>
          {tab==='athletes' && <>
            <div style={{display:'flex',alignItems:'center',marginBottom:10}}>
              <div style={{fontSize:12,color:C.muted}}>Drag ⠿ to reorder · type # field to move</div>
              <div style={{flex:1}}/>
              <button onClick={addAthlete} style={btn(C.success,'6px 12px',12)}>+ Add</button>
            </div>
            <AthleteList athletes={athletes} editingId={editingId} setEditingId={setEditingId} updAthlete={updAthlete} delAthlete={delAthlete} moveAthlete={moveAthlete} reorder={reorder} setOrder={setOrder} rulebook={rulebook}/>
          </>}
          {tab==='heights' && <>
            <div style={{fontSize:12,color:C.muted,marginBottom:12}}>Modifying heights clears attempts for any removed heights. Max 10.</div>
            <div style={{display:'grid',gap:10,marginBottom:10}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <div>
                  <div style={{fontSize:11,color:C.muted,marginBottom:5}}>Start (m)</div>
                  <input style={inp} placeholder="e.g. 5.00" value={startH} onChange={e=>setStartH(e.target.value)}/>
                </div>
                <div>
                  <div style={{fontSize:11,color:C.muted,marginBottom:5}}>Increments</div>
                  <input style={inp} placeholder="10cm x3, 5cm" value={incStr} onChange={e=>setIncStr(e.target.value)}/>
                </div>
              </div>
              <div>
                <div style={{fontSize:11,color:C.muted,marginBottom:5}}>Or manual (m, comma-sep, max 10)</div>
                <input style={inp} placeholder="5.00, 5.10, 5.20..." value={manualH} onChange={e=>setManualH(e.target.value)}/>
              </div>
              <button onClick={doGenHeights} style={btn(C.accent)}>Update Heights</button>
            </div>
            {heights.map((h,i)=>(
              <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'6px 10px',background:C.card,borderRadius:8,marginBottom:6,border:`1px solid ${C.border}`}}>
                <div style={{width:20,fontSize:11,color:C.muted,fontWeight:700}}>{i+1}</div>
                <div style={{fontWeight:600,fontSize:13,flex:1}}>{fmtH(h,metric)}</div>
                <div style={{fontSize:11,color:C.muted}}>{fmtH(h,!metric)}</div>
                <button onClick={()=>setHeights(p=>p.filter((_,j)=>j!==i))} style={{...btn('#7f1d1d','4px 10px',11)}}>✕</button>
              </div>
            ))}
          </>}
        </div>
      </div>
    </div>
  );
}

// ─── DISPLAY SCREEN ───────────────────────────────────────────────────────────
function DisplayScreen({athletes,ranked,heights,curH,curA,metric,live,info,onDeck,inHole}) {
  const curAth=athletes[curA], curHt=heights[curH];
  const n=heights.length;
  return (
    <div style={{background:C.bg,minHeight:'80vh',paddingBottom:30}}>
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'12px 20px',textAlign:'center'}}>
        <div style={{fontSize:12,fontWeight:800,color:C.muted,letterSpacing:2,textTransform:'uppercase',marginBottom:3}}>
          {info.name||'Pole Vault'}{info.date?` · ${info.date}`:''}{info.venue?` · ${info.venue}`:''}
        </div>
        {live&&<div style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:11,color:'#ff4444',fontWeight:700,letterSpacing:1}}>
          <span className="live-dot" style={{width:7,height:7,borderRadius:'50%',background:'#ff4444',display:'inline-block'}}/>LIVE
        </div>}
      </div>
      {curAth&&curHt&&(
        <div style={{background:`linear-gradient(180deg,${C.accent}18 0%,${C.bg} 100%)`,padding:'24px 20px 18px',textAlign:'center',borderBottom:`1px solid ${C.border}`}}>
          <div style={{fontSize:11,color:C.muted,textTransform:'uppercase',letterSpacing:2,marginBottom:6}}>Current Bar</div>
          <div style={{fontSize:60,fontWeight:900,color:C.accent,lineHeight:1,letterSpacing:-2}}>{fmtH(curHt,metric)}</div>
          {metric&&<div style={{fontSize:16,color:C.muted,marginBottom:18}}>{fmtH(curHt,false)}</div>}
          <div style={{display:'inline-flex',alignItems:'center',gap:14,background:C.surface,borderRadius:16,padding:'14px 22px',border:`1px solid ${C.border}`}}>
            <FlagCell athlete={curAth} size={46}/>
            <div style={{textAlign:'left'}}>
              <div style={{fontSize:9,color:C.muted,textTransform:'uppercase',letterSpacing:2,marginBottom:4}}>Now Vaulting</div>
              <div style={{fontSize:28,fontWeight:900,color:C.text,lineHeight:1.1}}>{curAth.firstName} <span style={{color:C.accent}}>{curAth.lastName}</span></div>
              {(curAth.affiliation||curAth.country)&&<div style={{fontSize:12,color:C.muted,marginTop:3}}>{[curAth.affiliation,curAth.country].filter(Boolean).join(' · ')}</div>}
            </div>
          </div>
          {(onDeck||inHole)&&(
            <div style={{display:'flex',justifyContent:'center',gap:16,marginTop:14}}>
              {onDeck&&<div style={{fontSize:12,color:C.muted}}>On Deck: <strong style={{color:C.text}}>{onDeck.firstName} {onDeck.lastName}</strong></div>}
              {inHole&&<div style={{fontSize:12,color:C.muted}}>In the Hole: <strong style={{color:C.text}}>{inHole.firstName} {inHole.lastName}</strong></div>}
            </div>
          )}
        </div>
      )}
      <ResultsTable athletes={athletes} ranked={ranked} heights={heights} curH={curH} curA={curA} metric={metric} setCurA={()=>{}} setCurH={()=>{}} compact/>
    </div>
  );
}

// ─── HISTORY SCREEN ───────────────────────────────────────────────────────────
function HistoryScreen({savedComps,setSavedComps,loadSnapshot,saveSnapshot}) {
  const refresh=()=>setSavedComps(loadSaved());
  const handleDel=id=>{if(!confirm('Delete this competition?'))return;deleteComp(id);refresh();};
  const fmtDate=iso=>{try{return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return iso;}};
  return (
    <div style={{padding:14,maxWidth:640,margin:'0 auto',paddingBottom:40}}>
      <div style={sec}>
        <div style={{display:'flex',alignItems:'center',marginBottom:12}}>
          <div style={{...secTit,marginBottom:0}}>Saved Competitions</div>
          <div style={{flex:1}}/>
          <button onClick={saveSnapshot} style={btn(C.accent,'7px 14px',13)}>💾 Save Current</button>
        </div>
        {!savedComps.length&&<div style={{textAlign:'center',padding:'28px 20px',color:C.muted,fontSize:13}}>No saved competitions.<br/><span style={{fontSize:11,marginTop:6,display:'block'}}>Auto-saved during scoring, or tap 💾 above.</span></div>}
        <div style={{display:'grid',gap:10}}>
          {savedComps.map(comp=>(
            <div key={comp.id} style={{background:C.card,borderRadius:12,border:`1px solid ${C.border}`,padding:'12px 14px'}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14,color:C.text,marginBottom:2}}>{comp.name}</div>
                  <div style={{fontSize:11,color:C.muted}}>{comp.date}{comp.state?.info?.venue?` · ${comp.state.info.venue}`:''}</div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2}}>
                    {fmtDate(comp.savedAt)}
                    {comp.state?.athletes?` · ${comp.state.athletes.length} athletes`:''}
                    {comp.compStatus==='official'?<span style={{color:C.success}}> · ✓ Official</span>:comp.compStatus==='complete-pending'?<span style={{color:C.warn}}> · Pending verification</span>:''}
                  </div>
                </div>
                <div style={{display:'flex',gap:6,flexShrink:0}}>
                  <button onClick={()=>loadSnapshot(comp)} style={btn(C.accent,'6px 11px',11)}>▶ Resume</button>
                  <button onClick={()=>handleDel(comp.id)} style={btn('#7f1d1d','6px 11px',11)}>✕</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
      <div style={{...sec,background:`${C.warn}10`,border:`1px solid ${C.warn}30`}}>
        <div style={{...secTit,color:C.warn}}>Auto-Save</div>
        <div style={{fontSize:12,color:C.muted,lineHeight:1.6}}>VaultDesk saves your active competition to browser storage automatically after every mark. If you refresh or leave, you'll return exactly where you left off. Up to 20 historical competitions stored.</div>
      </div>
    </div>
  );
}

// ─── MOUNT ────────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<VaultDeskApp/>);
</script>
</body>
