const {useState,useMemo,useCallback,useEffect,useRef}=React;

const RULEBOOKS=[{key:'WA',label:'World Athletics / USATF'},{key:'NCAA',label:'NCAA'},{key:'NFHS',label:'NFHS (High School)'}];

const SEARCH_URL=(name,rb)=>({WA:`https://worldathletics.org/athletes/search?term=${encodeURIComponent(name)}`,NCAA:`https://www.tfrrs.org/search?q=${encodeURIComponent(name)}`,NFHS:`https://www.milesplit.com/search?q=${encodeURIComponent(name)}&type=athlete`}[rb]||`https://worldathletics.org/athletes/search?term=${encodeURIComponent(name)}`);
const SEARCH_LABEL={WA:'World Athletics',NCAA:'TFRRS',NFHS:'MileSplit'};

const C={bg:'#0f0f14',surface:'#1a1a24',card:'#22222e',border:'#2e2e3d',accent:'#4f7cff',success:'#22c55e',danger:'#ef4444',warn:'#f59e0b',text:'#f0f0f0',muted:'#8888aa',cleared:'#0a2b0a',missed:'#2b0a0a'};

const COUNTRY_NAMES={'afghanistan':'AFG','albania':'ALB','algeria':'ALG','andorra':'AND','angola':'ANG','antigua':'ANT','antigua and barbuda':'ANT','argentina':'ARG','armenia':'ARM','aruba':'ARU','american samoa':'ASA','australia':'AUS','austria':'AUT','azerbaijan':'AZE','bahamas':'BAH','bangladesh':'BAN','barbados':'BAR','burundi':'BDI','belgium':'BEL','benin':'BEN','bermuda':'BER','bhutan':'BHU','bosnia':'BIH','bosnia and herzegovina':'BIH','belize':'BIZ','belarus':'BLR','bolivia':'BOL','botswana':'BOT','brazil':'BRA','bahrain':'BRN','brunei':'BRU','bulgaria':'BUL','burkina faso':'BUR','central african republic':'CAF','cambodia':'CAM','canada':'CAN','cayman islands':'CAY','congo':'CGO','republic of congo':'CGO','chad':'CHA','chile':'CHI','china':'CHN',"cote d'ivoire":'CIV','ivory coast':'CIV','cameroon':'CMR','dr congo':'COD','democratic republic of congo':'COD','cook islands':'COK','colombia':'COL','comoros':'COM','cape verde':'CPV','costa rica':'CRC','croatia':'CRO','cuba':'CUB','cyprus':'CYP','czech republic':'CZE','czechia':'CZE','denmark':'DEN','djibouti':'DJI','dominica':'DMA','dominican republic':'DOM','ecuador':'ECU','egypt':'EGY','eritrea':'ERI','el salvador':'ESA','spain':'ESP','estonia':'EST','ethiopia':'ETH','fiji':'FIJ','finland':'FIN','france':'FRA','micronesia':'FSM','gabon':'GAB','gambia':'GAM','great britain':'GBR','united kingdom':'GBR','uk':'GBR','guinea-bissau':'GBS','georgia':'GEO','equatorial guinea':'GEQ','germany':'GER','ghana':'GHA','greece':'GRE','grenada':'GRN','guatemala':'GUA','guinea':'GUI','guam':'GUM','guyana':'GUY','haiti':'HAI','hong kong':'HKG','honduras':'HON','hungary':'HUN','indonesia':'INA','india':'IND','iran':'IRI','ireland':'IRL','iraq':'IRQ','iceland':'ISL','israel':'ISR','us virgin islands':'ISV','italy':'ITA','british virgin islands':'IVB','jamaica':'JAM','jordan':'JOR','japan':'JPN','kazakhstan':'KAZ','kenya':'KEN','kyrgyzstan':'KGZ','kiribati':'KIR','south korea':'KOR','korea':'KOR','saudi arabia':'KSA','kuwait':'KUW','laos':'LAO','latvia':'LAT','libya':'LBA','lebanon':'LBN','liberia':'LBR','saint lucia':'LCA','lesotho':'LES','liechtenstein':'LIE','lithuania':'LTU','luxembourg':'LUX','madagascar':'MAD','morocco':'MAR','malaysia':'MAS','malawi':'MAW','moldova':'MDA','mexico':'MEX','mongolia':'MGL','north macedonia':'MKD','macedonia':'MKD','mali':'MLI','malta':'MLT','montenegro':'MNE','monaco':'MON','mozambique':'MOZ','mauritius':'MRI','mauritania':'MRT','myanmar':'MYA','namibia':'NAM','nicaragua':'NCA','netherlands':'NED','holland':'NED','nepal':'NEP','nigeria':'NGR','niger':'NIG','norway':'NOR','nauru':'NRU','new zealand':'NZL','oman':'OMA','pakistan':'PAK','panama':'PAN','paraguay':'PAR','peru':'PER','philippines':'PHI','palestine':'PLE','palau':'PLW','papua new guinea':'PNG','poland':'POL','portugal':'POR','north korea':'PRK','puerto rico':'PUR','qatar':'QAT','chinese taipei':'ROC','taiwan':'ROC','south africa':'RSA','romania':'ROU','russia':'RUS','rwanda':'RWA','samoa':'SAM','senegal':'SEN','seychelles':'SEY','singapore':'SGP','saint kitts':'SKN','saint kitts and nevis':'SKN','sierra leone':'SLE','slovenia':'SLO','san marino':'SMR','solomon islands':'SOL','somalia':'SOM','serbia':'SRB','sri lanka':'SRI','south sudan':'SSD','sao tome and principe':'STP','sudan':'SUD','switzerland':'SUI','suriname':'SUR','slovakia':'SVK','sweden':'SWE','eswatini':'SWZ','swaziland':'SWZ','syria':'SYR','tanzania':'TAN','tonga':'TGA','thailand':'THA','tajikistan':'TJK','turkmenistan':'TKM','east timor':'TLS','timor-leste':'TLS','togo':'TOG','tuvalu':'TUV','trinidad':'TTO','trinidad and tobago':'TTO','tunisia':'TUN','turkey':'TUR','uae':'UAE','united arab emirates':'UAE','uganda':'UGA','ukraine':'UKR','uruguay':'URU','usa':'USA','united states':'USA','us':'USA','united states of america':'USA','uzbekistan':'UZB','vanuatu':'VAN','venezuela':'VEN','vietnam':'VIE','saint vincent':'VIN','saint vincent and the grenadines':'VIN','yemen':'YEM','zambia':'ZAM','zimbabwe':'ZIM'};

const getFlagUrl=code=>{if(!code)return null;const u=code.toUpperCase().trim();const iso=IOC_ISO[u]||(u.length===2?u.toLowerCase():null);return iso?`https://flagcdn.com/24x18/${iso}.png`:null};
const resolveCountry=input=>{if(!input)return null;const u=input.toUpperCase().trim();if(IOC_ISO[u])return u;const lower=input.toLowerCase().trim();if(COUNTRY_NAMES[lower])return COUNTRY_NAMES[lower];const match=Object.keys(COUNTRY_NAMES).find(k=>k.startsWith(lower));return match?COUNTRY_NAMES[match]:null};
const getCountrySuggestions=q=>{if(!q||q.length<2)return[];const lower=q.toLowerCase().trim();const upper=q.toUpperCase().trim();const results=[];Object.keys(IOC_ISO).filter(k=>k.startsWith(upper)).slice(0,3).forEach(k=>results.push({code:k,label:k}));Object.keys(COUNTRY_NAMES).filter(k=>k.startsWith(lower)&&!results.find(r=>r.code===COUNTRY_NAMES[k])).slice(0,5).forEach(k=>results.push({code:COUNTRY_NAMES[k],label:k}));return results.slice(0,6)};

const parsePaste=text=>{const r={};const pb=text.match(/(?:PB|PR|Personal\s+(?:Best|Record))[:\s]+([0-9]+[''\-.][0-9]*(?:\s*[0-9]+\/[0-9]+)?(?:m|in)?)/i);const sb=text.match(/(?:SB|Season(?:al)?\s+(?:Best|Record))[:\s]+([0-9]+[''\-.][0-9]*(?:\s*[0-9]+\/[0-9]+)?(?:m|in)?)/i);const cc=text.match(/\b([A-Z]{3})\b/g);if(pb)r.pb=pb[1].trim();if(sb)r.sb=sb[1].trim();if(cc){const k=cc.find(c=>IOC_ISO[c]);if(k)r.country=k;}return r};

const mToFtIn=m=>{const ti=m*39.3701,ft=Math.floor(ti/12),raw=ti%12;const q=Math.round(raw*4)/4,whole=Math.floor(q),frac=q-whole;return`${ft}'${whole}${frac===0?'':frac===.25?'¼':frac===.5?'½':'¾'}"`};
const fmtH=(cm,metric)=>{if(!cm&&cm!==0)return'';return metric?`${(cm/100).toFixed(2)}m`:mToFtIn(cm/100)};

const hasCleared=m=>Array.isArray(m)&&m.includes('O');
const hasRetired=m=>Array.isArray(m)&&m.includes('R');
const hasPassed=m=>Array.isArray(m)&&m.includes('P');
const countMisses=m=>Array.isArray(m)?m.filter(x=>x==='X'||x==='R').length:0;
// TERMINAL statuses — out of rotation entirely
const TERMINAL=['dns','retired','nh'];
// done at current height (won't jump again at this height)
const isDone=(marks,status)=>TERMINAL.includes(status)||hasCleared(marks)||marks.length>=3||hasRetired(marks)||hasPassed(marks);
// 3 misses with no clear = NH
const isNH=(marks)=>marks.length>=3&&!hasCleared(marks);

const highestClearedIdx=(a,n)=>{for(let i=n-1;i>=0;i--)if(hasCleared(a.attempts[i]))return i;return-1};
const totalMisses=(a,n)=>{let t=0;for(let i=0;i<n;i++)t+=countMisses(a.attempts[i]||[]);return t};

const calcPlacements=(athletes,heights)=>{
  const n=heights.length;
  const dns=athletes.filter(a=>a.status==='dns');
  const out=athletes.filter(a=>a.status!=='dns'&&highestClearedIdx(a,n)<0);
  const withH=athletes.filter(a=>highestClearedIdx(a,n)>=0);
  const sorted=[...withH].sort((a,b)=>{
    const ai=highestClearedIdx(a,n),bi=highestClearedIdx(b,n);
    if(bi!==ai)return bi-ai;
    const am=countMisses(a.attempts[ai]||[]),bm=countMisses(b.attempts[bi]||[]);
    if(am!==bm)return am-bm;
    return totalMisses(a,n)-totalMisses(b,n);
  });
  const result=[];let place=1;
  for(let i=0;i<sorted.length;i++){
    let p=place;
    if(i>0){const pr=sorted[i-1],cr=sorted[i];const pi=highestClearedIdx(pr,n),ci=highestClearedIdx(cr,n);if(pi===ci&&countMisses(pr.attempts[pi]||[])===countMisses(cr.attempts[ci]||[])&&totalMisses(pr,n)===totalMisses(cr,n))p=result[i-1].placement;}
    result.push({...sorted[i],placement:p});
    if(result[i].placement===place)place=i+2;
  }
  for(let i=0;i<result.length;i++)result[i].tied=result.some((r,j)=>j!==i&&r.placement===result[i].placement);
  return[...result,...out.map(a=>({...a,placement:null,tied:false})),...dns.map(a=>({...a,placement:null,tied:false}))];
};

// athletes still to jump at hIdx (in jump order)
const nextVaulter=(athletes,hIdx,fromIdx)=>{const n=athletes.length;for(let s=1;s<=n;s++){const idx=(fromIdx+s)%n;if(!isDone(athletes[idx].attempts[hIdx]||[],athletes[idx].status))return idx;}return-1};
const firstEligible=(athletes,hIdx)=>{for(let i=0;i<athletes.length;i++)if(!isDone(athletes[i].attempts[hIdx]||[],athletes[i].status))return i;return-1};

const genHeights=(startM,incStr)=>{const startCm=Math.round(parseFloat(startM)*100);if(isNaN(startCm))return[];const rules=[];for(const part of incStr.split(',').map(s=>s.trim())){const m=part.match(/(\d+(?:\.\d+)?)\s*cm(?:\s*[x×]\s*(\d+))?/i);if(m)rules.push({cm:parseFloat(m[1]),count:m[2]?parseInt(m[2]):99});}const hs=[startCm];let cur=startCm;for(const{cm,count}of rules){for(let i=0;i<count;i++){cur+=cm;hs.push(cur);if(hs.length>=10)return hs;}}return hs};
const parseManual=str=>str.split(/[,\s]+/).map(s=>parseFloat(s)).filter(n=>!isNaN(n)).map(m=>Math.round(m*100)).slice(0,10);

// parse CSV text into athlete rows
const parseAthleteCSV=text=>{
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return[];
  // detect header
  const first=lines[0].toLowerCase();
  const hasHeader=first.includes('name')||first.includes('first')||first.includes('last')||first.includes('country');
  const dataLines=hasHeader?lines.slice(1):lines;
  return dataLines.map(line=>{
    const cols=line.split(/[,\t;]/).map(c=>c.trim().replace(/^["']|["']$/g,''));
    // try to detect columns
    if(cols.length>=2){
      // heuristic: if first col is a number it's order/bib, skip it
      let idx=0;
      if(!isNaN(cols[0]))idx=1;
      const firstName=cols[idx]||'';
      const lastName=cols[idx+1]||'';
      // find country (3-letter IOC code)
      const country=cols.find(c=>IOC_ISO[c.toUpperCase()])?cols.find(c=>IOC_ISO[c.toUpperCase()]).toUpperCase():'';
      // find affiliation (non-country string after names)
      const affiliation=cols[idx+2]&&!IOC_ISO[cols[idx+2].toUpperCase()]?cols[idx+2]:'';
      const pb=cols.find(c=>/^\d+[\.''-]/.test(c)&&c!==firstName&&c!==lastName)||'';
      return{firstName,lastName,country,affiliation,pb,sb:''};
    }
    return null;
  }).filter(Boolean);
};

// CSV export for results
const buildResultsCSV=(athletes,heights,ranked,info,metric)=>{
  const n=heights.length;
  const headers=['Order','Place','First','Last','Country','Affiliation','PB','SB','Best',...heights.map((h,i)=>`H${i+1} ${fmtH(h,metric)}`)];
  const rows=[...ranked].sort((a,b)=>{
    if(a.placement&&b.placement)return a.placement-b.placement;
    if(a.placement)return-1;if(b.placement)return 1;
    return(a.order||0)-(b.order||0);
  }).map(ath=>{
    const best=highestClearedIdx(ath,n);
    const pl=ath.placement?(ath.tied?ath.placement+'=':ath.placement):(ath.status==='dns'?'DNS':'NH');
    return[ath.order,pl,ath.firstName,ath.lastName,ath.country,ath.affiliation,ath.pb,ath.sb,
      best>=0?fmtH(heights[best],metric):'',
      ...heights.map((_,hi)=>(ath.attempts[hi]||[]).join('')||'')];
  });
  const q=v=>`"${String(v||'').replace(/"/g,'""')}"`;
  return[headers,...rows].map(r=>r.map(q).join(',')).join('\n');
};

// ─── FLAG CELL ───────────────────────────────────────────────────────────────
function FlagCell({athlete,size=26}){
  const[err,setErr]=useState(false);
  const src=athlete.logoUrl||(!err&&getFlagUrl(athlete.country))||null;
  if(src)return<img src={src} alt={athlete.country||''} onError={()=>setErr(true)} style={{width:size,height:Math.round(size*.75),borderRadius:3,objectFit:'cover',flexShrink:0,background:C.border,display:'block'}}/>;
  const lbl=athlete.country?athlete.country.toUpperCase().slice(0,3):'?';
  return<div style={{width:size,height:Math.round(size*.75),borderRadius:3,background:C.border,display:'flex',alignItems:'center',justifyContent:'center',fontSize:size<24?8:9,fontWeight:800,color:C.muted,flexShrink:0,letterSpacing:-.5}}>{lbl}</div>;
}

// ─── COUNTRY INPUT ───────────────────────────────────────────────────────────
function CountryInput({value,onChange}){
  const[sugg,setSugg]=useState([]);
  const[open,setOpen]=useState(false);
  const handleChange=e=>{const v=e.target.value;onChange(v);setSugg(getCountrySuggestions(v));setOpen(true);};
  const pick=code=>{onChange(code);setSugg([]);setOpen(false);};
  const handleBlur=()=>setTimeout(()=>setOpen(false),150);
  return(
    <div style={{position:'relative'}}>
      <input style={inp} placeholder="Country — IOC code (USA) or name (Sweden)" value={value} onChange={handleChange} onFocus={()=>value.length>=2&&setOpen(true)} onBlur={handleBlur}/>
      {open&&sugg.length>0&&(
        <div style={{position:'absolute',top:'100%',left:0,right:0,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,zIndex:200,overflow:'hidden',boxShadow:'0 4px 20px rgba(0,0,0,.4)'}}>
          {sugg.map((s,i)=>(
            <div key={i} onMouseDown={()=>pick(s.code)} style={{padding:'9px 12px',cursor:'pointer',fontSize:14,display:'flex',alignItems:'center',gap:10,borderBottom:i<sugg.length-1?`1px solid ${C.border}`:'none'}}>
              <span style={{fontWeight:800,color:C.accent,width:36,flexShrink:0}}>{s.code}</span>
              <span style={{color:C.muted,textTransform:'capitalize',flex:1}}>{s.label}</span>
              <FlagCell athlete={{country:s.code}} size={18}/>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── IMPORT DIALOG ───────────────────────────────────────────────────────────
function ImportDialog({onImport,onClose}){
  const[dragOver,setDragOver]=useState(false);
  const[preview,setPreview]=useState([]);
  const[error,setError]=useState('');
  const[raw,setRaw]=useState('');

  const processText=text=>{
    setRaw(text);
    const rows=parseAthleteCSV(text);
    if(rows.length>0){setPreview(rows);setError('');}
    else setError('Could not parse athletes. Paste CSV with First, Last, Country columns.');
  };

  const handleDrop=e=>{e.preventDefault();setDragOver(false);const file=e.dataTransfer.files[0];if(file)file.text().then(processText);};
  const handleFile=e=>{const file=e.target.files[0];if(file)file.text().then(processText);};

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:700,display:'flex',alignItems:'flex-end',justifyContent:'center'}} onClick={onClose}>
      <div style={{background:C.surface,borderRadius:'16px 16px 0 0',padding:20,width:'100%',maxWidth:560,maxHeight:'85vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:16,flex:1}}>Import Athletes</div>
          <button onClick={onClose} style={btn('#333','7px 14px',13)}>x</button>
        </div>
        <div style={{fontSize:13,color:C.muted,marginBottom:14,lineHeight:1.6}}>
          Drop or select a CSV/TXT file, or paste data below.<br/>
          Columns: <strong style={{color:C.text}}>First, Last, Country (IOC), Affiliation, PB</strong>
        </div>
        {/* Drop zone */}
        <div
          onDrop={handleDrop}
          onDragOver={e=>{e.preventDefault();setDragOver(true);}}
          onDragLeave={()=>setDragOver(false)}
          style={{border:`2px dashed ${dragOver?C.accent:C.border}`,borderRadius:12,padding:'20px 16px',textAlign:'center',marginBottom:14,background:dragOver?`${C.accent}11`:'transparent',cursor:'pointer',transition:'all .2s'}}>
          <div style={{fontSize:28,marginBottom:6}}>📂</div>
          <div style={{fontSize:13,color:C.muted}}>Drop CSV / TXT file here</div>
          <label style={{display:'inline-block',marginTop:8}}>
            <span style={{...btn(C.accent,'6px 12px',12),cursor:'pointer'}}>Browse</span>
            <input type="file" accept=".csv,.txt,.tsv" onChange={handleFile} style={{display:'none'}}/>
          </label>
        </div>
        {/* Paste area */}
        <div style={{fontSize:12,color:C.muted,marginBottom:6}}>Or paste data directly:</div>
        <textarea value={raw} onChange={e=>processText(e.target.value)} placeholder="John,Smith,USA,University of Oregon,5.45m" style={{...inp,height:80,resize:'vertical',marginBottom:10,fontSize:13,display:'block'}}/>
        {error&&<div style={{fontSize:12,color:C.danger,marginBottom:10}}>{error}</div>}
        {preview.length>0&&(
          <div>
            <div style={{fontSize:12,fontWeight:700,color:C.success,marginBottom:8}}>Found {preview.length} athlete{preview.length!==1?'s':''}:</div>
            <div style={{background:C.card,borderRadius:8,padding:'8px 0',marginBottom:14,maxHeight:180,overflowY:'auto'}}>
              {preview.map((a,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 12px',fontSize:13,borderBottom:i<preview.length-1?`1px solid ${C.border}`:'none'}}>
                  <FlagCell athlete={a} size={18}/>
                  <span style={{fontWeight:600}}>{a.firstName} {a.lastName}</span>
                  {a.country&&<span style={{color:C.muted,fontSize:11}}>{a.country}</span>}
                  {a.affiliation&&<span style={{color:C.muted,fontSize:11}}>{a.affiliation}</span>}
                  {a.pb&&<span style={{color:C.accent,fontSize:11}}>PB {a.pb}</span>}
                </div>
              ))}
            </div>
            <button onClick={()=>onImport(preview)} style={{...btn(C.success,'10px 20px',14),width:'100%'}}>Import {preview.length} Athletes</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
function VaultDeskApp(){
  const[screen,setScreen]=useState(()=>{try{return JSON.parse(localStorage.getItem(LS_CUR))?.screen||'setup';}catch{return'setup';}});
  const[metric,setMetric]=useState(()=>{try{return JSON.parse(localStorage.getItem(LS_CUR))?.metric??true;}catch{return true;}});
  const[live,setLive]=useState(true);
  const[showEdit,setShowEdit]=useState(false);
  const[showImport,setShowImport]=useState(false);
  const[showSave,setShowSave]=useState(false);
  const[savedComps,setSavedComps]=useState(loadSaved);

  // ── SETUP SLOT (fresh competition being built) ──────────────────────────
  const[su,setSu]=useState(()=>{try{return JSON.parse(localStorage.getItem(LS_CUR))?.su||mkSu();}catch{return mkSu();}});
  const suRef=useRef(su);
  useEffect(()=>{suRef.current=su;},[su]);
  const updSu=useCallback(patch=>setSu(p=>({...p,...patch})),[]);

  // ── SCORING SLOT (active competition being scored) ──────────────────────
  const[sc,setSc]=useState(()=>{try{return JSON.parse(localStorage.getItem(LS_CUR))?.sc||null;}catch{return null;}});
  const scRef=useRef(sc);
  useEffect(()=>{scRef.current=sc;},[sc]);
  const updSc=useCallback(patch=>setSc(p=>p?({...p,...patch}):p),[]);

  // ── PERSIST ─────────────────────────────────────────────────────────────
  useEffect(()=>{saveCurrent({screen,metric,su,sc});},[screen,metric,su,sc]);

  // ── SETUP CALLBACKS ──────────────────────────────────────────────────────
  const addAthlete=useCallback(()=>{
    const current=suRef.current.athletes;
    const last=current[current.length-1];
    if(last&&!last.firstName&&!last.lastName){updSu({editingId:last.id});return;}
    const newAth=mkAthlete(current.length+1);
    setSu(p=>({...p,athletes:[...p.athletes,newAth],editingId:newAth.id}));
  },[]);

  const updAthlete=useCallback((id,ch)=>setSu(p=>({...p,athletes:p.athletes.map(a=>a.id===id?{...a,...ch}:a)})),[]);
  const delAthlete=useCallback(id=>setSu(p=>({...p,athletes:p.athletes.filter(a=>a.id!==id).map((a,i)=>({...a,order:i+1}))})),[]);
  const moveAthlete=useCallback((id,dir)=>setSu(p=>{const i=p.athletes.findIndex(a=>a.id===id),j=i+dir;if(j<0||j>=p.athletes.length)return p;const arr=[...p.athletes];[arr[i],arr[j]]=[arr[j],arr[i]];return{...p,athletes:arr.map((a,k)=>({...a,order:k+1}))}}),[]);
  const reorder=useCallback((from,to)=>setSu(p=>{if(from===to)return p;const arr=[...p.athletes];const[item]=arr.splice(from,1);arr.splice(to,0,item);return{...p,athletes:arr.map((a,k)=>({...a,order:k+1}))}}),[]);
  const setOrder=useCallback((id,n)=>setSu(p=>{const i=p.athletes.findIndex(a=>a.id===id);const t=Math.max(0,Math.min(p.athletes.length-1,n-1));if(i<0||i===t)return p;const arr=[...p.athletes];const[item]=arr.splice(i,1);arr.splice(t,0,item);return{...p,athletes:arr.map((a,k)=>({...a,order:k+1}))}}),[]);

  const importAthletes=useCallback(rows=>{
    setSu(p=>{const existing=p.athletes.filter(a=>a.firstName||a.lastName);const newOnes=rows.map((r,i)=>({...mkAthlete(existing.length+i+1),...r}));return{...p,athletes:[...existing,...newOnes].map((a,i)=>({...a,order:i+1}))};});
    setShowImport(false);
  },[]);
  const doGenHeights=()=>{const hs=su.manualH.trim()?parseManual(su.manualH):genHeights(su.startH,su.incStr);updSu({heights:hs});};
  const updateHeight=(idx,v)=>{const n=parseFloat(v);if(!isNaN(n))setSu(p=>({...p,heights:p.heights.map((h,i)=>i===idx?Math.round(n*100):h)}));};

  // ── SCORING CALLBACKS ─────────────────────────────────────────────────────
  const addAthleteScoring=useCallback(()=>{
    const current=scRef.current?.athletes||[];
    const last=current[current.length-1];
    if(last&&!last.firstName&&!last.lastName){updSc({editingId:last.id});return;}
    const a=mkAthlete(current.length+1);
    setSc(p=>p?{...p,athletes:[...p.athletes,a],editingId:a.id}:p);
  },[]);
  const updAthleteScoring=useCallback((id,ch)=>setSc(p=>p?{...p,athletes:p.athletes.map(a=>a.id===id?{...a,...ch}:a)}:p),[]);
  const delAthleteScoring=useCallback(id=>setSc(p=>p?{...p,athletes:p.athletes.filter(a=>a.id!==id).map((a,i)=>({...a,order:i+1}))}:p),[]);
  const moveAthleteScoring=useCallback((id,dir)=>setSc(p=>{if(!p)return p;const i=p.athletes.findIndex(a=>a.id===id),j=i+dir;if(j<0||j>=p.athletes.length)return p;const arr=[...p.athletes];[arr[i],arr[j]]=[arr[j],arr[i]];return{...p,athletes:arr.map((a,k)=>({...a,order:k+1}))}}),[]);
  const reorderScoring=useCallback((from,to)=>setSc(p=>{if(!p||from===to)return p;const arr=[...p.athletes];const[item]=arr.splice(from,1);arr.splice(to,0,item);return{...p,athletes:arr.map((a,k)=>({...a,order:k+1}))}}),[]);
  const setOrderScoring=useCallback((id,n)=>setSc(p=>{if(!p)return p;const i=p.athletes.findIndex(a=>a.id===id);const t=Math.max(0,Math.min(p.athletes.length-1,n-1));if(i<0||i===t)return p;const arr=[...p.athletes];const[item]=arr.splice(i,1);arr.splice(t,0,item);return{...p,athletes:arr.map((a,k)=>({...a,order:k+1}))}}),[]);
  const updateHeightScoring=(idx,v)=>{const n=parseFloat(v);if(!isNaN(n))setSc(p=>p?{...p,heights:p.heights.map((h,i)=>i===idx?Math.round(n*100):h)}:p);};
  const doGenHeightsScoring=()=>{if(!sc)return;const hs=sc.manualH?.trim()?parseManual(sc.manualH):genHeights(sc.startH||'',sc.incStr||'');if(hs.length)updSc({heights:hs});};

  // ── RECORD MARK ──────────────────────────────────────────────────────────
  const recordMark=useCallback(mark=>{
    const prev=scRef.current;
    if(!prev)return;
    const{athletes:aths,curH,curA,heights}=prev;
    const next=aths.map((a,i)=>{
      if(i!==curA)return a;
      const marks=a.attempts[curH]||[];
      if(isDone(marks,a.status))return a;
      if(mark==='DNS')return{...a,status:'dns'};
      if(mark==='R'){const att=a.attempts.map((ar,hi)=>hi===curH?[...ar,'R']:ar);return{...a,attempts:att,status:'retired'};}
      const att=a.attempts.map((ar,hi)=>hi===curH?[...ar,mark]:ar);
      return{...a,attempts:att,status:isNH(att[curH])?'nh':a.status};
    });
    let nextCurA=-1,nextCurH=curH;
    const nxt=nextVaulter(next,curH,curA);
    if(nxt===-1){const nh=curH+1;if(nh<heights.length){nextCurH=nh;const fe=firstEligible(next,nh);nextCurA=fe>=0?fe:0;}}
    else{nextCurA=nxt;}
    setSc(p=>p?{...p,athletes:next,...(nextCurA!==-1?{curA:nextCurA}:{}),curH:nextCurH}:p);
  },[]);

  const undoMark=useCallback(()=>{
    setSc(p=>{
      if(!p)return p;
      const{athletes:aths,curH,curA}=p;
      const next=aths.map((a,i)=>{
        if(i!==curA)return a;
        if(a.status==='dns')return{...a,status:'competing'};
        const att=a.attempts.map((ar,hi)=>hi===curH?[...ar]:ar);
        if(att[curH].length>0)att[curH].pop();
        const wasRetired=a.status==='retired'&&!att[curH].includes('R');
        const wasNH=a.status==='nh'&&!isNH(att[curH]);
        return{...a,attempts:att,status:(wasRetired||wasNH)?'competing':a.status};
      });
      return{...p,athletes:next};
    });
  },[]);

  // ── COMPETITION LIFECYCLE ─────────────────────────────────────────────────
  const startComp=()=>{
    const hs=su.heights.length?su.heights:(su.manualH.trim()?parseManual(su.manualH):genHeights(su.startH,su.incStr));
    if(!hs.length){alert('Set up heights first.');return;}
    const fe=firstEligible(su.athletes,0);
    const newSc={id:su.compId,info:su.info,rulebook:su.rulebook,athletes:su.athletes,heights:hs,
      curH:0,curA:fe>=0?fe:0,compStatus:'active',dirEmail:su.dirEmail,metric,
      startH:su.startH,incStr:su.incStr,manualH:su.manualH,editingId:null};
    setSc(newSc);
    const snap={id:su.compId,name:su.info.name||'Unnamed',date:su.info.date,savedAt:new Date().toISOString(),compStatus:'active',state:newSc};
    const all=loadSaved().filter(c=>c.id!==snap.id);
    saveAll([snap,...all]);setSavedComps(loadSaved());
    setSu(mkSu());
    setScreen('scoring');
  };

  const endCompetition=()=>{
    if(!confirm('End this competition? Results will be marked as pending verification.'))return;
    if(!sc)return;
    setLive(false);
    const upd={...sc,compStatus:'complete-pending'};
    setSc(upd);
    const snap={id:sc.id,name:sc.info.name||'Unnamed',date:sc.info.date,savedAt:new Date().toISOString(),compStatus:'complete-pending',state:upd};
    const all=loadSaved().filter(c=>c.id!==snap.id);
    saveAll([snap,...all]);setSavedComps(loadSaved());
  };

  const verifyOfficial=()=>{
    if(!sc)return;
    const upd={...sc,compStatus:'official'};
    setSc(upd);
    const snap={id:sc.id,name:sc.info.name||'Unnamed',date:sc.info.date,savedAt:new Date().toISOString(),compStatus:'official',state:upd};
    const all=loadSaved().filter(c=>c.id!==snap.id);
    saveAll([snap,...all]);setSavedComps(loadSaved());
  };

  const startJumpOff=useCallback(()=>{
    if(!sc)return;
    const ranked_now=calcPlacements(sc.athletes,sc.heights);
    const tiedFirst=ranked_now.filter(r=>r.placement===1&&r.tied);
    if(!tiedFirst.length)return;
    const lastH=sc.heights[sc.heights.length-1]||50000;
    const jumpOffH=lastH+5;
    const newHIdx=sc.heights.length;
    const newAthletes=sc.athletes.map(a=>{
      const isTied=tiedFirst.some(t=>t.id===a.id);
      if(!isTied)return a;
      return{...a,status:'competing'};
    });
    updSc({
      heights:[...sc.heights,jumpOffH],
      athletes:newAthletes,
      curH:newHIdx,
      curA:newAthletes.findIndex(a=>tiedFirst.some(t=>t.id===a.id)),
      compStatus:'active',
    });
    setLive(true);
  },[sc,updSc]);

  const saveSnapshot=useCallback(()=>{
    if(!sc)return;
    const snap={id:sc.id,name:sc.info.name||'Unnamed',date:sc.info.date,savedAt:new Date().toISOString(),compStatus:sc.compStatus,state:sc};
    const all=loadSaved().filter(c=>c.id!==snap.id);
    saveAll([snap,...all]);setSavedComps(loadSaved());
  },[sc]);

  const loadSnapshot=snap=>{
    const s=snap.state;
    setSc({id:snap.id,info:s.info,rulebook:s.rulebook||'WA',athletes:s.athletes,heights:s.heights,
      curH:s.curH||0,curA:s.curA||0,compStatus:snap.compStatus||'active',
      dirEmail:s.dirEmail||'',metric:s.metric??true,editingId:null,
      startH:s.startH||'',incStr:s.incStr||'10cm x3, 5cm x3, 2cm',manualH:s.manualH||''});
    setMetric(s.metric??true);
    setScreen('scoring');
  };

  // ── DERIVED ───────────────────────────────────────────────────────────────
  const ranked=useMemo(()=>sc?calcPlacements(sc.athletes,sc.heights):[],[sc]);
  const onDeckIdx=sc?nextVaulter(sc.athletes,sc.curH,sc.curA):-1;
  const inHoleIdx=onDeckIdx!==-1?nextVaulter(sc.athletes,sc.curH,onDeckIdx):-1;
  const onDeck=sc&&onDeckIdx!==-1&&onDeckIdx!==sc.curA?sc.athletes[onDeckIdx]:null;
  const inHole=sc&&inHoleIdx!==-1&&inHoleIdx!==sc.curA&&inHoleIdx!==onDeckIdx?sc.athletes[inHoleIdx]:null;

  const TABS=[{id:'setup',icon:'⚙️',label:'Setup'},{id:'scoring',icon:'🎯',label:'Score'},{id:'display',icon:'📺',label:'Display'},{id:'history',icon:'🗂️',label:'History'}];

  return(
    <div style={{background:C.bg,minHeight:'100vh',color:C.text,maxWidth:'100vw',overflowX:'hidden'}}>
      <header style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'9px 14px',position:'sticky',top:0,zIndex:300,display:'flex',alignItems:'center',gap:8}}>
        <div style={{fontWeight:900,fontSize:16,color:C.accent,letterSpacing:-.5,flexShrink:0}}>VaultDesk</div>
        <div style={{flex:1,fontSize:11,color:C.muted,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{sc?.info?.name||'Pole Vault'}{screen==='scoring'&&sc?.heights[sc.curH]?` · ${fmtH(sc.heights[sc.curH],metric)}`:''}</div>
        <button onClick={()=>setMetric(m=>!m)} style={{...btn(C.card,'5px 9px',10),border:`1px solid ${C.border}`}}>{metric?'m→ft':'ft→m'}</button>
        {screen==='scoring'&&sc&&<>
          <button onClick={()=>setLive(l=>!l)} style={{...btn(live?'#7f1d1d':C.card,'5px 8px',10),border:live?'none':`1px solid ${C.border}`}}>
            <span className={live?'live-dot':''} style={{width:6,height:6,borderRadius:'50%',background:live?'#ff4444':C.muted,flexShrink:0,display:'inline-block'}}/>
            {live?'LIVE':'OFF'}
          </button>
          <button onClick={()=>setShowEdit(true)} style={{...btn(C.card,'5px 9px',10),border:`1px solid ${C.border}`}}>Edit</button>
          {sc.compStatus==='active'&&<button onClick={endCompetition} style={{...btn('#374151','5px 9px',10),border:`1px solid ${C.border}`}}>End</button>}
        </>}
      </header>
      {sc&&sc.compStatus!=='active'&&(
        <div style={{background:sc.compStatus==='official'?`${C.success}22`:`${C.warn}22`,borderBottom:`1px solid ${sc.compStatus==='official'?C.success:C.warn}44`,padding:'8px 16px',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <div style={{fontSize:12,fontWeight:700,color:sc.compStatus==='official'?C.success:C.warn,flex:1}}>{sc.compStatus==='official'?'Official Results':'Pending Verification'}</div>
          {sc.compStatus==='complete-pending'&&<button onClick={verifyOfficial} style={btn(C.success,'5px 12px',11)}>Verify Official</button>}
          {sc.compStatus==='official'&&<button onClick={()=>setShowSave(true)} style={btn(C.accent,'5px 12px',11)}>Save Results</button>}
          {sc.compStatus==='complete-pending'&&sc.dirEmail&&<a href={`mailto:${sc.dirEmail}?subject=Results: ${sc.info.name}`} style={{...btn('#2d3748','5px 12px',11),textDecoration:'none'}}>Email Director</a>}
        </div>
      )}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,display:'flex'}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>{if((t.id==='scoring'||t.id==='display')&&!sc?.heights?.length)return;setScreen(t.id);}}
            style={{flex:1,padding:'8px 0',background:'none',border:'none',color:screen===t.id?C.accent:C.muted,fontWeight:screen===t.id?700:400,fontSize:11,cursor:'pointer',borderBottom:`2px solid ${screen===t.id?C.accent:'transparent'}`,fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:3,WebkitTapHighlightColor:'transparent',position:'relative'}}>
            <span>{t.icon}</span><span>{t.label}</span>
            {t.id==='scoring'&&sc&&sc.compStatus==='active'&&<span style={{position:'absolute',top:3,right:4,width:6,height:6,borderRadius:'50%',background:'#ff4444'}}/>}
          </button>
        ))}
      </div>
      <main>
        {screen==='setup'&&(
          <>
            {sc&&<div style={{background:`${C.accent}12`,borderBottom:`1px solid ${C.accent}33`,padding:'8px 16px',display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:12,color:C.accent,fontWeight:700,flex:1}}>⚡ Scoring: {sc.info.name||'Unnamed'}</span>
              <button onClick={()=>setScreen('scoring')} style={{...btn(C.accent,'4px 10px',11)}}>Resume →</button>
            </div>}
            <SetupScreen info={su.info} setInfo={v=>setSu(p=>({...p,info:typeof v==='function'?v(p.info):v}))} rulebook={su.rulebook} setRulebook={v=>updSu({rulebook:v})} athletes={su.athletes} addAthlete={addAthlete} updAthlete={updAthlete} delAthlete={delAthlete} moveAthlete={moveAthlete} reorder={reorder} setOrder={setOrder} editingId={su.editingId} setEditingId={id=>updSu({editingId:id})} startH={su.startH} setStartH={v=>updSu({startH:v})} incStr={su.incStr} setIncStr={v=>updSu({incStr:v})} manualH={su.manualH} setManualH={v=>updSu({manualH:v})} doGenHeights={doGenHeights} heights={su.heights} setHeights={h=>updSu({heights:h})} updateHeight={updateHeight} metric={metric} startComp={startComp} dirEmail={su.dirEmail} setDirEmail={v=>updSu({dirEmail:v})} onImport={()=>setShowImport(true)}/>
          </>
        )}
        {screen==='scoring'&&sc&&<ScoringScreen athletes={sc.athletes} ranked={ranked} heights={sc.heights} curH={sc.curH} setCurH={h=>updSc({curH:h})} curA={sc.curA} setCurA={a=>updSc({curA:a})} metric={metric} recordMark={recordMark} undoMark={undoMark} live={live} onDeck={onDeck} inHole={inHole} compStatus={sc.compStatus} info={sc.info} rulebook={sc.rulebook} startJumpOff={startJumpOff} onEnd={endCompetition}/>}
        {screen==='display'&&sc&&<DisplayScreen athletes={sc.athletes} ranked={ranked} heights={sc.heights} curH={sc.curH} curA={sc.curA} metric={metric} live={live} info={sc.info} onDeck={onDeck} inHole={inHole} compStatus={sc.compStatus}/>}
        {screen==='history'&&<HistoryScreen savedComps={savedComps} setSavedComps={setSavedComps} loadSnapshot={loadSnapshot} saveSnapshot={saveSnapshot}/>}
      </main>

// ─── INCREMENT STEP BUILDER ──────────────────────────────────────────────────
function IncStepBuilder({incStr,setIncStr}){
  const CM_OPTS=[2,3,4,5,6,7,8,10,12,15,20];
  const PRESETS=[
    {label:'Standard',str:'10cm x3, 5cm x3, 2cm'},
    {label:'Collegiate',str:'10cm x2, 5cm x3, 2cm'},
    {label:'HS Indoor',str:'10cm x3, 5cm'},
    {label:'5cm Flat',str:'5cm'},
  ];
  const toSteps=s=>{const r=[];for(const p of(s||'').split(',').map(x=>x.trim())){const m=p.match(/(\d+(?:\.\d+)?)\s*cm(?:\s*[x×]\s*(\d+))?/i);if(m)r.push({cm:parseInt(m[1]),count:m[2]?parseInt(m[2]):null});}return r.length?r:[{cm:10,count:3}]};
  const toStr=steps=>steps.map(s=>`${s.cm}cm${s.count?' x'+s.count:''}`).join(', ');
  const[steps,setSteps]=useState(()=>toSteps(incStr));
  const update=ns=>{setSteps(ns);setIncStr(toStr(ns));};
  const addStep=()=>update([...steps,{cm:5,count:null}]);
  const removeStep=i=>update(steps.filter((_,j)=>j!==i));
  const setCm=(i,v)=>update(steps.map((s,j)=>j===i?{...s,cm:v}:s));
  const setCount=(i,v)=>update(steps.map((s,j)=>j===i?{...s,count:v}:s));
  return(
    <div>
      <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:10}}>
        {PRESETS.map(p=>(
          <button key={p.label} onClick={()=>{setIncStr(p.str);setSteps(toSteps(p.str));}}
            style={{...btn(C.card,'5px 11px',11),border:`1px solid ${C.border}`}}>{p.label}</button>
        ))}
      </div>
      <div style={{display:'grid',gap:6}}>
        {steps.map((s,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:6,background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:'8px 10px',flexWrap:'wrap'}}>
            <span style={{fontSize:11,color:C.muted,width:18,flexShrink:0}}>#{i+1}</span>
            <div style={{display:'flex',gap:3,flexWrap:'wrap',flex:1,alignItems:'center'}}>
              <span style={{fontSize:11,color:C.muted,marginRight:2}}>Inc:</span>
              {CM_OPTS.map(c=>(
                <button key={c} onClick={()=>setCm(i,c)}
                  style={{...btn(s.cm===c?C.accent:C.surface,'3px 8px',11),border:`1px solid ${s.cm===c?C.accent:C.border}`,minWidth:34}}>{c}cm</button>
              ))}
            </div>
            <div style={{display:'flex',gap:3,alignItems:'center',flexShrink:0}}>
              <span style={{fontSize:11,color:C.muted,marginRight:2}}>×</span>
              {[1,2,3,4,5,null].map(c=>(
                <button key={String(c)} onClick={()=>setCount(i,c)}
                  style={{...btn(s.count===c?C.accent:C.surface,'3px 7px',11),border:`1px solid ${s.count===c?C.accent:C.border}`}}>
                  {c===null?'∞':c}
                </button>
              ))}
            </div>
            {steps.length>1&&<button onClick={()=>removeStep(i)} style={{...btn('#7f1d1d','3px 8px',11),flexShrink:0}}>×</button>}
          </div>
        ))}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,marginTop:6}}>
        <button onClick={addStep} style={{...btn(C.card,'5px 12px',12),border:`1px solid ${C.border}`}}>+ Step</button>
        <span style={{fontSize:10,color:C.muted,flex:1}}>{toStr(steps)||'—'}</span>
      </div>
    </div>
  );
}

// ─── ATHLETE LIST (with touch drag) ─────────────────────────────────────────
function AthleteList({athletes,editingId,setEditingId,updAthlete,delAthlete,moveAthlete,reorder,setOrder,rulebook}){
  const[dragIdx,setDragIdx]=useState(null);
  const[overIdx,setOverIdx]=useState(null);
  const containerRef=useRef(null);
  const dragStateRef=useRef({active:false,from:-1,to:-1});

  const findRowAt=clientY=>{
    const rows=containerRef.current?.querySelectorAll('[data-row-idx]');
    if(!rows)return -1;
    for(const row of rows){const r=row.getBoundingClientRect();if(clientY>=r.top&&clientY<=r.bottom)return parseInt(row.dataset.rowIdx);}
    return -1;
  };

  const onHandlePointerDown=(e,idx)=>{
    e.preventDefault();
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}
    dragStateRef.current={active:true,from:idx,to:idx};
    setDragIdx(idx);
  };

  const onHandlePointerMove=(e)=>{
    if(!dragStateRef.current.active)return;
    const found=findRowAt(e.clientY);
    if(found!==-1&&found!==dragStateRef.current.to){dragStateRef.current.to=found;setOverIdx(found);}
  };

  const onHandlePointerUp=(e)=>{
    const{active,from,to}=dragStateRef.current;
    dragStateRef.current={active:false,from:-1,to:-1};
    if(active&&from!==-1&&to!==-1&&from!==to)reorder(from,to);
    setDragIdx(null);setOverIdx(null);
  };

  return(
    <div ref={containerRef} style={{display:'grid',gap:8}}>
      {athletes.map((a,i)=>(
        <div key={a.id}
          data-row-idx={i}
          draggable
          onContextMenu={e=>e.preventDefault()}
          onDragStart={e=>{setDragIdx(i);e.dataTransfer.effectAllowed='move';}}
          onDragOver={e=>{e.preventDefault();setOverIdx(i);}}
          onDrop={e=>{e.preventDefault();if(dragIdx!==null&&dragIdx!==i)reorder(dragIdx,i);setDragIdx(null);setOverIdx(null);}}
          onDragEnd={()=>{setDragIdx(null);setOverIdx(null);}}
          className={overIdx===i&&dragIdx!==i?'vd-drag-over':dragIdx===i?'vd-dragging':''}>
          <AthleteRow
            athlete={a} index={i} total={athletes.length} rulebook={rulebook}
            isEditing={editingId===a.id}
            onEdit={()=>setEditingId(editingId===a.id?null:a.id)}
            onUpdate={ch=>updAthlete(a.id,ch)}
            onDelete={()=>delAthlete(a.id)}
            onUp={()=>moveAthlete(a.id,-1)}
            onDown={()=>moveAthlete(a.id,1)}
            onSetOrder={n=>setOrder(a.id,n)}
            onHandlePointerDown={e=>onHandlePointerDown(e,i)}
            onHandlePointerMove={onHandlePointerMove}
            onHandlePointerUp={onHandlePointerUp}
          />
        </div>
      ))}
    </div>
  );
}

    const blob=new Blob([csv],{type:'text/csv'});
    try{
      if(window.showSaveFilePicker){
        const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'CSV File',accept:{'text/csv':['.csv']}}]});
        const w=await handle.createWritable();
        await w.write(blob);await w.close();
        setSaved(true);
      }else throw new Error('fallback');
    }catch(err){
      if(err.name!=='AbortError'){
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=url;a.download=filename;a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
        setSaved(true);
      }
    }
    setSaving(false);
  };

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:700,display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={onClose}>
      <div style={{background:C.surface,borderRadius:16,padding:24,width:'100%',maxWidth:400,border:`1px solid ${C.border}`}} onClick={e=>e.stopPropagation()}>
        <div style={{fontWeight:800,fontSize:17,marginBottom:8}}>Save Official Results</div>
        <div style={{fontSize:13,color:C.muted,marginBottom:20,lineHeight:1.6}}>
          Saves a CSV file with final results, placements, and all attempts.
        </div>
        {saved?(
          <div style={{background:`${C.success}22`,borderRadius:10,padding:'12px 16px',marginBottom:16,border:`1px solid ${C.success}44`,fontSize:14,color:C.success,fontWeight:700}}>
            Results saved successfully
          </div>
        ):(
          <button onClick={doSave} disabled={saving} style={{...btn(C.success,'12px 20px',15),width:'100%',marginBottom:12,opacity:saving?.6:1}}>
            {saving?'Saving...':'Download Results CSV'}
          </button>
        )}
        <button onClick={onClose} style={{...btn(C.card,'10px 20px',14),width:'100%',border:`1px solid ${C.border}`}}>
          {saved?'Close':'Cancel'}
        </button>
      </div>
    </div>
  );
}

// ─── SCORING SCREEN ───────────────────────────────────────────────────────────
function ScoringScreen({athletes,ranked,heights,curH,setCurH,curA,setCurA,metric,recordMark,undoMark,live,onDeck,inHole,compStatus,info,rulebook,startJumpOff,onEnd}){
  const isActive=compStatus==='active';
  const rbCfg=RULEBOOK_CFG[rulebook]||RULEBOOK_CFG.WA;
  const tiedFirst=ranked.filter(r=>r.placement===1&&r.tied);
  const hasFirstTie=tiedFirst.length>=2;
  const showJumpOffBanner=!isActive&&hasFirstTie;
  const curAth=athletes[curA];
  // Meet-over: no eligible vaulter at any remaining height
  const meetOver=useMemo(()=>{
    if(!isActive||!heights.length)return false;
    for(let h=curH;h<heights.length;h++){if(firstEligible(athletes,h)!==-1)return false;}
    return true;
  },[athletes,heights,curH,isActive]);
  const curHt=heights[curH];
  const curMarks=curAth?(curAth.attempts[curH]||[]):[];
  const attemptNum=curMarks.length+1;
  const alreadyDone=curAth?isDone(curMarks,curAth.status):true;

  const AttemptDots=()=>{
    const dots=Array.from({length:3},(_,i)=>{
      const m=curMarks[i];
      const bg=!m?'transparent':m==='O'?C.success:m==='X'?C.danger:'#2563eb';
      return<span key={i} style={{width:13,height:13,borderRadius:'50%',border:`2px solid ${!m?C.border:bg}`,background:bg,display:'inline-block'}}/>;
    });
    return<div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:5,marginTop:6}}>{dots}</div>;
  };

  const MARKS=[
    {mark:'O',bg:C.success,symbol:'✓',label:'Clear'},
    {mark:'X',bg:C.danger, symbol:'✗',label:'Miss'},
    {mark:'P',bg:'#2563eb',symbol:'P',      label:'Pass'},
    {mark:'R',bg:C.warn,   symbol:'R',      label:'Retire'},
    {mark:'DNS',bg:'#374151',symbol:'-',    label:'DNS'},
  ];

  return(
    <div style={{paddingBottom:20}}>
      {/* ── HERO ── */}
      <div style={{background:`linear-gradient(180deg,${C.accent}1a 0%,${C.bg} 100%)`,borderBottom:`1px solid ${C.border}`,padding:'16px 16px 14px',textAlign:'center'}}>
        {info.name&&<div style={{fontSize:10,color:C.muted,letterSpacing:1.5,textTransform:'uppercase',marginBottom:6}}>{info.name}{info.venue?` · ${info.venue}`:''}</div>}
        <div style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:9,color:C.muted,background:C.card,borderRadius:6,padding:'2px 8px',marginBottom:4,border:`1px solid ${C.border}`,letterSpacing:.5}}>{RULEBOOKS.find(r=>r.key===rulebook)?.label||rulebook}</div>
        {live&&isActive&&(
          <div style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:9,color:'#ff4444',fontWeight:700,letterSpacing:1,textTransform:'uppercase',marginBottom:6}}>
            <span className="live-dot" style={{width:6,height:6,borderRadius:'50%',background:'#ff4444',display:'inline-block'}}/>LIVE
          </div>
        )}
        {!isActive&&<div style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:11,color:C.warn,fontWeight:700,letterSpacing:.5,marginBottom:6,background:`${C.warn}18`,borderRadius:8,padding:'3px 10px'}}>
          {compStatus==='official'?'Official Results':'Pending Verification'}
        </div>}
        {/* Big height — only show when active */}
        {isActive&&<>
          <div style={{fontSize:11,color:C.muted,textTransform:'uppercase',letterSpacing:2,marginBottom:4}}>Current Bar</div>
          <div style={{fontSize:54,fontWeight:900,color:C.accent,lineHeight:1,letterSpacing:-2}}>{curHt?fmtH(curHt,metric):'—'}</div>
          {curHt&&<div style={{fontSize:14,color:C.muted,marginBottom:14}}>{fmtH(curHt,!metric)}</div>}
          {/* Current vaulter card */}
          {curAth&&!alreadyDone?(
            <div style={{display:'inline-flex',alignItems:'center',gap:14,background:C.surface,borderRadius:16,padding:'12px 18px',border:`2px solid ${C.accent}`,textAlign:'left',maxWidth:'100%'}}>
              <FlagCell athlete={curAth} size={48}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:9,color:C.accent,textTransform:'uppercase',letterSpacing:2,marginBottom:4,fontWeight:700}}>Now Vaulting · Attempt {attemptNum}/3</div>
                <div style={{fontSize:24,fontWeight:900,color:C.text,lineHeight:1.1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {curAth.firstName&&<span style={{color:C.muted,fontSize:20}}>{curAth.firstName} </span>}
                  <span>{curAth.lastName||curAth.firstName||'—'}</span>
                </div>
                {(curAth.affiliation||curAth.country||curAth.pb)&&(
                  <div style={{fontSize:11,color:C.muted,marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {[curAth.affiliation,curAth.country].filter(Boolean).join(' · ')}
                    {curAth.pb&&` · PB ${curAth.pb}`}
                  </div>
                )}
                <AttemptDots/>
              </div>
            </div>
          ):(isActive&&(
            <div style={{background:`${C.warn}18`,borderRadius:12,padding:'10px 16px',display:'inline-block',border:`1px solid ${C.warn}44`,fontSize:13,color:C.warn,fontWeight:600}}>
              {alreadyDone&&curAth?.status==='dns'
                ?`${curAth.firstName||'Athlete'} DNS — tap Undo or select another vaulter`
                :'All athletes done at this height — advance to next height'}
            </div>
          ))}
        </>}
      </div>

      {/* ── ON DECK / IN THE HOLE (active only) ── */}
      {isActive&&(onDeck||inHole)&&(
        <div style={{display:'flex',background:C.surface,borderBottom:`1px solid ${C.border}`}}>
          {onDeck&&(
            <div style={{flex:1,padding:'8px 14px',borderRight:inHole?`1px solid ${C.border}`:undefined}}>
              <div style={{fontSize:9,fontWeight:800,letterSpacing:2,color:C.muted,textTransform:'uppercase',marginBottom:3}}>On Deck</div>
              <div style={{display:'flex',alignItems:'center',gap:7}}>
                <FlagCell athlete={onDeck} size={18}/>
                <span style={{fontWeight:700,fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{onDeck.firstName} {onDeck.lastName}</span>
                <span style={{fontSize:10,color:C.muted}}>#{onDeck.order}</span>
              </div>
            </div>
          )}
          {inHole&&(
            <div style={{flex:1,padding:'8px 14px'}}>
              <div style={{fontSize:9,fontWeight:800,letterSpacing:2,color:C.muted,textTransform:'uppercase',marginBottom:3}}>In the Hole</div>
              <div style={{display:'flex',alignItems:'center',gap:7}}>
                <FlagCell athlete={inHole} size={18}/>
                <span style={{fontWeight:700,fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{inHole.firstName} {inHole.lastName}</span>
                <span style={{fontSize:10,color:C.muted}}>#{inHole.order}</span>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── MEET OVER BANNER ── */}
      {meetOver&&(
        <div style={{background:`${C.success}18`,border:`1px solid ${C.success}55`,margin:'12px 14px',borderRadius:14,padding:'16px 18px',textAlign:'center'}}>
          <div style={{fontSize:18,marginBottom:6}}>🏆</div>
          <div style={{fontWeight:800,fontSize:16,color:C.success,marginBottom:4}}>Competition Complete</div>
          <div style={{fontSize:13,color:C.muted,marginBottom:14}}>All athletes have finished. Ready to end and verify results.</div>
          <button onClick={onEnd} style={{...btn(C.success,'10px 24px',14),width:'100%',maxWidth:240}}>End Competition</button>
        </div>
      )}

      {/* ── JUMP-OFF BANNER ── */}
      {showJumpOffBanner&&(
        <div style={{margin:'12px 14px',background:'#1a1a00',border:`1px solid ${C.warn}`,borderRadius:14,padding:'14px 16px'}}>
          <div style={{fontSize:13,fontWeight:800,color:C.warn,marginBottom:4}}>{rbCfg.tieLabel}</div>
          <div style={{fontSize:11,color:C.muted,marginBottom:10,lineHeight:1.6}}>{rbCfg.jumpOffNote}<br/>Tied: {tiedFirst.map(a=>a.lastName||a.firstName||`#${a.order}`).join(' · ')}</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button onClick={startJumpOff} style={btn(C.warn,'8px 16px',12)}>Start Jump-Off (+5cm)</button>
            {!rbCfg.jumpOffRequired&&<div style={{fontSize:11,color:C.muted,alignSelf:'center'}}>or declare co-champions above</div>}
          </div>
        </div>
      )}

      {/* ── MARK BUTTONS (active only) ── */}
      {isActive&&!meetOver&&(
        <div style={{padding:'10px 10px',display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:6,background:C.bg,borderBottom:`1px solid ${C.border}`}}>
          {MARKS.map(({mark,bg,symbol,label})=>(
            <button key={mark} onClick={()=>recordMark(mark)}
              style={{background:bg,color:'#fff',border:'none',borderRadius:12,padding:'10px 2px',fontSize:10,fontWeight:700,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3,minHeight:54,fontFamily:'inherit',WebkitTapHighlightColor:'transparent',touchAction:'manipulation'}}>
              <span style={{fontSize:20}}>{symbol}</span><span>{label}</span>
            </button>
          ))}
          <button onClick={undoMark}
            style={{background:'#4c1d95',color:'#fff',border:'none',borderRadius:12,padding:'10px 2px',fontSize:10,fontWeight:700,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3,minHeight:54,fontFamily:'inherit',WebkitTapHighlightColor:'transparent'}}>
            <span style={{fontSize:20}}>{'↩'}</span><span>Undo</span>
          </button>
        </div>
      )}

      {/* ── HEIGHT TABS (active only) ── */}
      {isActive&&(
        <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'6px 10px',display:'flex',gap:5,overflowX:'auto',alignItems:'center',WebkitOverflowScrolling:'touch'}}>
          <span style={{fontSize:9,color:C.muted,flexShrink:0,textTransform:'uppercase',letterSpacing:.8}}>Bar:</span>
          {heights.map((h,i)=>(
            <button key={i} onClick={()=>setCurH(i)}
              style={{flexShrink:0,background:i===curH?C.accent:C.card,color:i===curH?'#fff':C.muted,border:`1px solid ${i===curH?C.accent:C.border}`,borderRadius:18,padding:'3px 10px',fontSize:10,fontWeight:i===curH?700:400,cursor:'pointer',fontFamily:'inherit',WebkitTapHighlightColor:'transparent'}}>
              {fmtH(h,metric)}
            </button>
          ))}
        </div>
      )}

      {/* ── RESULTS TABLE ── */}
      <ResultsTable athletes={athletes} ranked={ranked} heights={heights} curH={curH} curA={curA} metric={metric} setCurA={setCurA} setCurH={setCurH} isActive={isActive}/>
    </div>
  );
}

// ─── RESULTS TABLE ───────────────────────────────────────────────────────────
function ResultsTable({athletes,ranked,heights,curH,curA,metric,setCurA,setCurH,compact=false,isActive=true}){
  const n=heights.length;
  if(!n)return null;

  // Build placement lookup from ranked array
  const placementOf=useMemo(()=>{
    const map={};
    ranked.forEach(r=>{map[r.id]={pl:r.placement,tied:r.tied};});
    return map;
  },[ranked]);

  // During active competition: sort by jump order, with active athletes first
  // After competition: sort by placement
  const displayAthletes=useMemo(()=>{
    if(!isActive){
      // sort by placement (same as ranked order)
      return [...ranked];
    }
    // Sort: active at current height first (by order), then passed/cleared, then NH, then DNS
    const getSort=a=>{
      const marks=a.attempts[curH]||[];
      const done=isDone(marks,a.status);
      const isNHStatus=a.status==='nh';
      const isDNS=a.status==='dns';
      return[isDNS?3:isNHStatus?2:done?1:0, a.order];
    };
    return [...athletes].sort((a,b)=>{
      const [ag,ao]=getSort(a);
      const [bg,bo]=getSort(b);
      if(ag!==bg)return ag-bg;
      return ao-bo;
    });
  },[athletes,ranked,curH,isActive]);

  const getCellContent=(ath,hIdx)=>{
    const m=ath.attempts[hIdx]||[];
    if(ath.status==='dns')return{text:'- -',color:C.muted,bg:'transparent'};
    if(!m.length)return{text:'',color:C.muted,bg:'transparent'};
    const text=m.join('');
    if(hasCleared(m))return{text,color:'#4ade80',bg:C.cleared};
    if(m.length>=3&&!hasCleared(m))return{text,color:'#f87171',bg:C.missed};
    return{text,color:hasPassed(m)?'#60a5fa':C.muted,bg:'transparent'};
  };

  const bestResult=ath=>{const idx=highestClearedIdx(ath,n);return idx>=0?heights[idx]:null};

  return(
    <div style={{overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
      <table style={{borderCollapse:'collapse',fontSize:compact?11:12,width:'100%',minWidth:Math.max(400,220+n*52)+'px'}}>
        <thead>
          <tr style={{background:C.surface,borderBottom:`2px solid ${C.border}`}}>
            <th style={{position:'sticky',left:0,background:C.surface,padding:'7px 5px',textAlign:'center',color:C.muted,width:30,fontSize:9,fontWeight:800,letterSpacing:.5,zIndex:10}}>#</th>
            <th style={{position:'sticky',left:30,background:C.surface,padding:'7px 6px',textAlign:'center',color:C.muted,width:36,fontSize:9,fontWeight:800,letterSpacing:.5,zIndex:10}}>PL</th>
            <th style={{position:'sticky',left:66,background:C.surface,padding:'7px 10px',textAlign:'left',color:C.muted,minWidth:130,fontSize:9,fontWeight:800,letterSpacing:.5,zIndex:10}}>ATHLETE</th>
            <th style={{padding:'7px 5px',textAlign:'center',color:C.muted,width:52,fontSize:9,fontWeight:800,letterSpacing:.5}}>PB</th>
            <th style={{padding:'7px 5px',textAlign:'center',color:C.muted,width:52,fontSize:9,fontWeight:800,letterSpacing:.5}}>SB</th>
            <th style={{padding:'7px 5px',textAlign:'center',color:C.muted,width:54,fontSize:9,fontWeight:800,letterSpacing:.5}}>BEST</th>
            {heights.map((h,i)=>(
              <th key={i} style={{padding:'7px 4px',textAlign:'center',minWidth:46,color:i===curH&&isActive?C.accent:C.muted,fontWeight:i===curH&&isActive?800:600,fontSize:9,letterSpacing:.3,background:i===curH&&isActive?`${C.accent}18`:C.surface}}>
                {fmtH(h,metric)}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {displayAthletes.map((ath,rowIdx)=>{
            const origIdx=athletes.findIndex(a=>a.id===ath.id);
            const isCur=isActive&&origIdx===curA;
            const plInfo=placementOf[ath.id]||{pl:null,tied:false};
            const best=bestResult(ath);
            const isOut=TERMINAL.includes(ath.status);
            const rowBg=isCur?`${C.accent}12`:rowIdx%2===0?'transparent':`${C.surface}60`;
            const isPassed=a=>hasPassed(a.attempts[curH]||[]);
            const isDoneHere=isDone(ath.attempts[curH]||[],ath.status);
            return(
              <tr key={ath.id} style={{background:rowBg,borderBottom:`1px solid ${C.border}`,borderLeft:isCur?`3px solid ${C.accent}`:'3px solid transparent',opacity:ath.status==='dns'?.55:isOut&&!hasCleared({attempts:ath.attempts})?1:1}}>
                {/* Jump order */}
                <td style={{position:'sticky',left:0,background:rowBg,padding:'7px 5px',textAlign:'center',fontWeight:700,fontSize:12,color:isDoneHere?C.muted:C.text}}>{ath.order}</td>
                {/* Placement */}
                <td style={{position:'sticky',left:30,background:rowBg,padding:'7px 6px',textAlign:'center',fontWeight:800,fontSize:compact?13:14}}>
                  {plInfo.pl===1?'🥇':plInfo.pl===2?'🥈':plInfo.pl===3?'🥉':plInfo.pl?
                    <span style={{color:C.muted,fontSize:11}}>{plInfo.pl}{plInfo.tied?'=':''}</span>:
                    <span style={{fontSize:9,color:C.muted}}>{ath.status==='dns'?'DNS':best?'':'NH'}</span>}
                </td>
                {/* Athlete */}
                <td style={{position:'sticky',left:66,background:rowBg,padding:'7px 10px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <FlagCell athlete={ath} size={18}/>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:isCur?800:600,fontSize:13,color:isCur?C.accent:isOut?C.muted:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:100,textDecoration:ath.status==='dns'?'line-through':'none'}}>
                        {isCur&&<span style={{fontSize:9,marginRight:3}}>&#9658;</span>}
                        {ath.firstName} {ath.lastName}
                      </div>
                      {(ath.affiliation||ath.status==='nh'||ath.status==='retired')&&(
                        <div style={{fontSize:9,color:C.muted,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:100}}>
                          {ath.affiliation||''}
                          {ath.status==='nh'&&<span style={{color:C.danger}}> NH</span>}
                          {ath.status==='retired'&&<span style={{color:C.warn}}> RET</span>}
                        </div>
                      )}
                    </div>
                  </div>
                </td>
                {/* PB */}
                <td style={{padding:'7px 4px',textAlign:'center',fontSize:10,color:C.muted}}>{ath.pb||'—'}</td>
                {/* SB */}
                <td style={{padding:'7px 4px',textAlign:'center',fontSize:10,color:C.muted}}>{ath.sb||'—'}</td>
                {/* Best */}
                <td style={{padding:'7px 4px',textAlign:'center'}}>
                  {best?<div><div style={{fontSize:11,fontWeight:800,color:C.success}}>{fmtH(best,metric)}</div></div>
                      :<span style={{fontSize:9,color:C.muted}}>{ath.status==='dns'?'DNS':'NH'}</span>}
                </td>
                {/* Height cells */}
                {heights.map((h,hIdx)=>{
                  const{text,color,bg}=getCellContent(ath,hIdx);
                  const isCurCell=isActive&&hIdx===curH&&origIdx===curA;
                  const clickable=ath.status!=='dns'&&ath.status!=='nh';
                  return(
                    <td key={hIdx}
                      onClick={()=>{setCurH(hIdx);if(clickable&&isActive)setCurA(origIdx);}}
                      style={{padding:'7px 4px',textAlign:'center',fontWeight:700,fontSize:11,letterSpacing:.3,color,background:isCurCell?bg||`${C.accent}0d`:bg,cursor:clickable&&isActive?'pointer':'default',outline:isCurCell?`2px inset ${C.accent}55`:'none'}}>
                      {text}
                    </td>
                  );
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ─── EDIT OVERLAY ────────────────────────────────────────────────────────────
function EditOverlay({onClose,athletes,addAthlete,updAthlete,delAthlete,moveAthlete,reorder,setOrder,editingId,setEditingId,rulebook,heights,setHeights,updateHeight,metric,startH,setStartH,incStr,setIncStr,manualH,setManualH,doGenHeights}){
  const[tab,setTab]=useState('athletes');
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:500,display:'flex',flexDirection:'column',justifyContent:'flex-end'}} onClick={onClose}>
      <div style={{background:C.surface,borderRadius:'18px 18px 0 0',maxHeight:'82vh',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>

          <button onClick={()=>setTab('heights')} style={{flex:1,padding:'8px 0',background:'none',border:'none',color:tab==='heights'?C.accent:C.muted,fontWeight:tab==='heights'?700:400,fontSize:12,cursor:'pointer',borderBottom:`2px solid ${tab==='heights'?C.accent:'transparent'}`,fontFamily:'inherit'}}>Heights</button>
        </div>
        <div style={{overflowY:'auto',padding:14,flex:1}}>
          {tab==='athletes'&&<>
            <div style={{display:'flex',alignItems:'center',marginBottom:10}}>
              <div style={{fontSize:12,color:C.muted}}>Drag to reorder</div>
              <div style={{flex:1}}/>
              <button onClick={addAthlete} style={btn(C.success,'6px 12px',12)}>+ Add</button>
            </div>
            <AthleteList athletes={athletes} editingId={editingId} setEditingId={setEditingId} updAthlete={updAthlete} delAthlete={delAthlete} moveAthlete={moveAthlete} reorder={reorder} setOrder={setOrder} rulebook={rulebook}/>
