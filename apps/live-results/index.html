                ⚠ {rulebook} Rule: minimum 5cm increments required. One or more gaps are below 5cm.
              </div>
            )}
          </div>
        )}
      </div>

      <div style={sec}>
        <div style={{display:'flex',alignItems:'center',marginBottom:10}}>
          <div style={{...secTit,marginBottom:0}}>Athletes ({athletes.length})</div>
          <div style={{flex:1}}/>
          <button onClick={onPhotoImport} style={{...btn(C.card,'7px 12px',12),border:`1px solid ${C.border}`,marginRight:6}} title="Scan a photo of a start list">📷 Scan</button>
          <button onClick={onImport} style={{...btn(C.card,'7px 12px',12),border:`1px solid ${C.border}`,marginRight:6}}>CSV</button>
          <button onClick={addAthlete} style={btn(C.success,'7px 14px',13)}>+ Add</button>
        </div>
        <div style={{fontSize:11,color:C.muted,marginBottom:8}}>Type directly in each row. <strong style={{color:C.text}}>Edit</strong> for advanced options (affiliation, photo). <strong style={{color:C.text}}>↑↓</strong> jumping order. <strong style={{color:C.text}}>☰</strong> drag to reorder. <strong style={{color:C.text}}>✕</strong> delete.</div>
        {/* Column headers */}
        <div style={{display:'flex',alignItems:'center',gap:6,padding:'0 12px',marginBottom:4}}>
          <span style={{width:18,fontSize:10,color:C.muted,fontWeight:700,flexShrink:0}}>#</span>
          <span style={{width:24,flexShrink:0}}/>
          <span style={{flex:'1.5',minWidth:50,fontSize:10,color:C.muted,fontWeight:700}}>First</span>
          <span style={{flex:2,minWidth:60,fontSize:10,color:C.muted,fontWeight:700}}>Last</span>
          <span style={{width:40,fontSize:10,color:C.muted,fontWeight:700,textAlign:'center',flexShrink:0}}>Nat.</span>
          <span style={{width:52,fontSize:10,color:C.accent,fontWeight:700,textAlign:'center',flexShrink:0}}>PB</span>
          <span style={{width:52,fontSize:10,color:C.success,fontWeight:700,textAlign:'center',flexShrink:0}}>SB</span>
          <span style={{fontSize:10,color:C.muted,fontWeight:700,padding:'0 8px',flexShrink:0}}>Edit</span>
          <span style={{fontSize:10,color:C.muted,width:36,textAlign:'center',flexShrink:0}}>↑↓</span>
          <span style={{fontSize:10,color:C.muted,width:20,textAlign:'center',flexShrink:0}}>☰</span>
          <span style={{fontSize:10,color:C.muted,width:20,textAlign:'center',flexShrink:0}}>✕</span>
        </div>
        <AthleteList athletes={athletes} editingId={editingId} setEditingId={setEditingId} updAthlete={updAthlete} delAthlete={delAthlete} moveAthlete={moveAthlete} reorder={reorder} setOrder={setOrder} rulebook={rulebook}/>
        {!athletes.length&&<div style={{textAlign:'center',padding:20,color:C.muted,fontSize:14}}>No athletes — tap + Add</div>}
      </div>

      {blankCount>0&&namedAthletes.length>0&&<div style={{fontSize:12,color:C.warn,marginBottom:8,textAlign:'center'}}>{blankCount} blank row{blankCount!==1?'s':''} will be skipped at start.</div>}
      {athletes.length>0&&namedAthletes.length===0&&<div style={{fontSize:12,color:C.danger,marginBottom:8,textAlign:'center'}}>Fill in athlete names before starting.</div>}
      <button onClick={startComp}
        style={{...btn(ready?C.success:'#2a2a2a'),width:'100%',padding:15,fontSize:16,borderRadius:14,opacity:ready?1:.45}}>
        {ready?'Start Competition →':'Add athletes and heights to begin'}
      </button>
    </div>
  );
}

// ─── SCORING SCREEN ───────────────────────────────────────────────────────────
function ScoringScreen({athletes,ranked,heights,curH,setCurH,curA,setCurA,primaryMetric,recordMark,undoMark,live,onDeck,inHole,compStatus,info,rulebook,isJumpOff,startJumpOff,onEnd,onEditSetup,onRestart}){
  const isActive=compStatus==='active';
  const rbCfg=RULEBOOK_CFG[rulebook]||RULEBOOK_CFG.WA;
  const meetOver=useMemo(()=>{
    if(!isActive||!heights.length)return false;
    for(let h=curH;h<heights.length;h++){if(firstEligible(athletes,h)!==-1)return false;}
    return true;
  },[athletes,heights,curH,isActive]);
  const tiedFirst=ranked.filter(r=>r.placement===1&&r.tied);
  const hasFirstTie=tiedFirst.length>=2;
  const showJumpOffBanner=(meetOver||compStatus==='complete-pending')&&hasFirstTie&&!isJumpOff;
  const curAth=athletes[curA];
  const curHt=heights[curH];
  const curMarks=curAth?(curAth.attempts[curH]||[]):[];
  const alreadyDone=curAth?isDone(curMarks,curAth.status):true;
  const attemptNum=alreadyDone?curMarks.length:curMarks.length+1;
  const curAthRank=ranked.find(r=>r.id===curAth?.id);
  const curPlace=curAthRank?.placement??null;
  const curTied=curAthRank?.tied??false;

  const[confirmRestart,setConfirmRestart]=useState(false);
  const[confirmEnd,setConfirmEnd]=useState(false);

  const MARKS=[
    {mark:'O',bg:C.success,symbol:'O',label:'Make'},
    {mark:'X',bg:C.danger,symbol:'✗',label:'Miss'},
    {mark:'P',bg:'#2563eb',symbol:'P',label:'Pass'},
    {mark:'R',bg:C.warn,symbol:'R',label:'Retire'},
    {mark:'DNS',bg:'#374151',symbol:'—',label:'DNS'},
  ];

  return(
    <div style={{paddingBottom:20}}>
      {/* COMPETITION HEADER */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'8px 14px'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
          <div style={{minWidth:0}}>
            {info.name&&<div style={{fontWeight:800,fontSize:14,color:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{info.name}</div>}
            <div style={{fontSize:10,color:C.muted,marginTop:1,display:'flex',gap:6,flexWrap:'wrap'}}>
              {info.date&&<span>{info.date}</span>}
              {info.startTime&&<span>· {info.startTime}</span>}
              {info.venue&&<span>· {info.venue}</span>}
              {rulebook&&<span>· {RULEBOOKS.find(r=>r.key===rulebook)?.label}</span>}
              {info.gender&&<span>· {info.gender==='M'?"Men's":info.gender==='W'?"Women's":'Mixed'}</span>}
              <span style={{display:'inline-flex',alignItems:'center',gap:3}}>
                · <span className={isActive?'live-dot':''} style={{width:5,height:5,borderRadius:'50%',background:isActive?C.success:C.muted,display:'inline-block'}}/>
                {isActive?'LIVE':compStatus==='complete-pending'?'PENDING':'OFFICIAL'}
              </span>
            </div>
          </div>
          <button onClick={onEditSetup} style={{...btn(C.card,'6px 12px',11),border:`1px solid ${C.border}`,flexShrink:0}}>✏ Edit</button>
        </div>
      </div>

      {/* HERO */}
      <div style={{background:'linear-gradient(135deg,#0b1829 0%,#0e1e38 55%,#0d1520 100%)',borderBottom:`1px solid rgba(79,124,255,.25)`,padding:'16px 16px 14px'}}>

        {/* Status bar */}
        <div style={{fontSize:10,color:isJumpOff?'rgba(245,158,11,.85)':'rgba(79,124,255,.7)',fontWeight:700,letterSpacing:.9,textTransform:'uppercase',marginBottom:12}}>
          {isActive&&curAth?`${isJumpOff?'⚡ JUMP-OFF · ':''}Now vaulting · Attempt ${attemptNum}${curMarks.length>0?' · '+curMarks.join(''):''}`:isActive?'Waiting…':''}
        </div>

        {/* Main row: height left | divider | athlete right */}
        <div style={{display:'flex',alignItems:'flex-start',gap:0}}>
          {/* Left: large height */}
          <div style={{textAlign:'center',flexShrink:0,paddingRight:16,minWidth:96}}>
            {curHt?(
              <>
                <div style={{fontSize:40,fontWeight:900,color:'#ffffff',letterSpacing:-2,lineHeight:1}}>{fmtH(curHt,primaryMetric)}</div>
                <div style={{fontSize:16,color:'rgba(136,136,170,.8)',fontWeight:700,marginTop:5}}>{fmtH(curHt,!primaryMetric)}</div>
              </>
            ):<div style={{fontSize:14,color:C.muted,paddingTop:16}}>—</div>}
          </div>
          {/* Divider */}
          <div style={{width:1,alignSelf:'stretch',background:'rgba(79,124,255,.3)',flexShrink:0,marginRight:16,minHeight:56}}/>
          {/* Right: athlete */}
          {isActive&&curAth?(
            <div style={{flex:1,minWidth:0}}>
              {/* Attempt badge inline top-right */}
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8,marginBottom:6}}>
                <div style={{display:'flex',alignItems:'center',gap:9,minWidth:0}}>
                  <FlagCell athlete={curAth} size={28}/>
                  <span style={{fontWeight:900,fontSize:24,color:'#ffffff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',letterSpacing:-.5,lineHeight:1.1}}>{curAth.firstName} {curAth.lastName}</span>
                </div>
                <div style={{flexShrink:0,background:'rgba(0,0,0,.5)',border:`1px solid rgba(79,124,255,.3)`,borderRadius:8,padding:'4px 10px',textAlign:'center',minWidth:40}}>
                  <div style={{fontSize:8,color:'rgba(136,136,170,.65)',fontWeight:700,letterSpacing:.5,textTransform:'uppercase',lineHeight:1,marginBottom:2}}>Att.</div>
                  <div style={{fontSize:20,fontWeight:900,color:'#ffffff',lineHeight:1}}>{attemptNum}</div>
                </div>
              </div>
              {/* Standing + affiliation row */}
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:5}}>
                {curPlace&&<div style={{display:'inline-flex',alignItems:'center',background:'rgba(251,191,36,.12)',border:'1px solid rgba(251,191,36,.35)',borderRadius:6,padding:'2px 8px',fontSize:10,fontWeight:800,color:'#fbbf24',whiteSpace:'nowrap',flexShrink:0}}>{curTied?'T-':''}{plLabel(curPlace)}</div>}
                {curAth.affiliation&&<div style={{fontSize:11,color:'rgba(136,136,170,.65)'}}>{curAth.affiliation}</div>}
              </div>
              {/* PB/SB + compact jump history chips on same row */}
              <div style={{display:'flex',alignItems:'center',gap:8,overflowX:'auto',WebkitOverflowScrolling:'touch',paddingBottom:2}}>
                {(curAth.pb||curAth.sb)&&(
                  <div style={{display:'flex',gap:10,fontSize:11,flexShrink:0}}>
                    {curAth.pb&&<span style={{color:'rgba(136,136,170,.75)',whiteSpace:'nowrap'}}>PB <span style={{color:'#93c5fd',fontWeight:800}}>{curAth.pb}</span></span>}
                    {curAth.sb&&<span style={{color:'rgba(136,136,170,.75)',whiteSpace:'nowrap'}}>SB <span style={{color:C.success,fontWeight:800}}>{curAth.sb}</span></span>}
                  </div>
                )}
                {heights.length>0&&(
                  <div style={{display:'flex',gap:4,flexShrink:0}}>
                    {heights.map((h,i)=>{
                      const m=curAth.attempts[i]||[];
                      const isCurH=i===curH;
                      const cleared=hasCleared(m);
                      const missed3=countMisses(m)>=3&&!cleared;
                      const markStr=m.join('');
                      return(
                        <div key={i} style={{
                          textAlign:'center',padding:'3px 6px',borderRadius:6,flexShrink:0,
                          background:isCurH?'rgba(79,124,255,.28)':cleared?'rgba(74,222,128,.13)':missed3?'rgba(248,113,113,.13)':'rgba(255,255,255,.04)',
                          border:isCurH?'1px solid rgba(79,124,255,.6)':cleared?'1px solid rgba(74,222,128,.28)':missed3?'1px solid rgba(248,113,113,.25)':'1px solid rgba(255,255,255,.07)',
                          boxShadow:isCurH?'0 0 8px rgba(79,124,255,.18)':'none'
                        }}>
                          <div style={{fontSize:8,fontWeight:700,color:isCurH?'rgba(147,197,253,.85)':cleared?'rgba(74,222,128,.7)':missed3?'rgba(248,113,113,.7)':'rgba(136,136,170,.4)',whiteSpace:'nowrap'}}>{fmtH(h,primaryMetric)}</div>
                          <div style={{fontSize:11,fontWeight:900,color:cleared?'#4ade80':missed3?'#f87171':markStr?'#93c5fd':isCurH?'rgba(255,255,255,.35)':'rgba(136,136,170,.2)'}}>{markStr||(isCurH?'…':'—')}</div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          ):<div style={{flex:1,color:C.muted,fontSize:13,paddingTop:10}}>No active vaulter</div>}
        </div>
      </div>

      {/* ROTATION — On Deck / In Hole (below hero) */}
      {isActive&&live!==null&&(
        <div style={{padding:'7px 14px',background:C.surface,borderBottom:`1px solid ${C.border}`}}>
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
            {onDeck!==null&&athletes[onDeck]&&<div style={{fontSize:11,color:C.warn,background:`${C.warn}10`,borderRadius:7,padding:'3px 9px',border:`1px solid ${C.warn}30`}}>On deck: {athletes[onDeck].firstName} {athletes[onDeck].lastName}</div>}
            {inHole!==null&&athletes[inHole]&&<div style={{fontSize:11,color:'#f87171',background:'rgba(248,113,113,.1)',borderRadius:7,padding:'3px 9px',border:'1px solid rgba(248,113,113,.28)'}}>On hold: {athletes[inHole].firstName} {athletes[inHole].lastName}</div>}
          </div>
        </div>
      )}

      {/* JUMP-OFF IN PROGRESS */}
      {isJumpOff&&isActive&&(
        <div style={{margin:'8px 14px 0',background:'rgba(245,158,11,.12)',borderRadius:12,padding:'10px 14px',border:'1px solid rgba(245,158,11,.4)'}}>
          <div style={{fontWeight:800,fontSize:13,color:C.warn,marginBottom:3}}>⚡ Jump-Off In Progress</div>
          <div style={{fontSize:11,color:C.muted}}>{rbCfg.jumpOffNote} · One attempt per height per athlete · Bar raises 5cm if all clear, lowers 5cm if all fail</div>
        </div>
      )}

      {/* JUMP-OFF BANNER */}
      {showJumpOffBanner&&(
        <div style={{margin:'8px 14px 0',background:`${C.warn}15`,borderRadius:12,padding:'12px 14px',border:`1px solid ${C.warn}44`}}>
          <div style={{fontWeight:800,fontSize:14,color:C.warn,marginBottom:4}}>{rbCfg.tieLabel}</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:10}}>{rbCfg.jumpOffNote}</div>
          {rbCfg.jumpOffRequired&&<button onClick={startJumpOff} style={btn(C.warn,'8px 16px',13)}>Start Jump-Off</button>}
        </div>
      )}

      {/* MEET OVER */}
      {meetOver&&(
        <div style={{margin:'8px 14px 0',background:`${C.success}15`,borderRadius:12,padding:'12px 14px',border:`1px solid ${C.success}44`}}>
          <div style={{fontWeight:800,fontSize:14,color:C.success,marginBottom:6}}>Competition Complete</div>
          <button onClick={onEnd} style={btn(C.success,'8px 16px',13)}>Finalize Results</button>
        </div>
      )}

      {/* MARK BUTTONS */}
      {isActive&&(
        <div style={{padding:'10px 14px 0'}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:7}}>
            {MARKS.map(({mark,bg,symbol,label})=>(
              <button key={mark} onClick={()=>recordMark(mark)} disabled={alreadyDone&&mark!=='DNS'}
                style={{...btn(bg,'10px 0',13),borderRadius:12,flexDirection:'column',gap:2,padding:'12px 0',opacity:alreadyDone&&mark!=='DNS'?.35:1,minHeight:60}}>
                <span style={{fontSize:22,lineHeight:1}}>{symbol}</span>
                <span style={{fontSize:9,letterSpacing:.5,fontWeight:700}}>{label}</span>
              </button>
            ))}
          </div>
          <div style={{display:'flex',gap:8,marginTop:8}}>
            <button onClick={undoMark} style={{...btn(C.card,'8px 14px',13),border:`1px solid ${C.border}`,flex:1}}>↩ Undo</button>
            <button onClick={onEditSetup} style={{...btn(C.card,'8px 12px',11),border:`1px solid ${C.border}`,flex:'0 0 auto',color:C.muted,whiteSpace:'nowrap'}}>✎ Edit Fields</button>
          </div>
        </div>
      )}

      {/* RESULTS TABLE */}
      <div style={{padding:'16px 14px 0'}}>
        <ResultsTable athletes={athletes} ranked={ranked} heights={heights} curH={curH} curA={curA} primaryMetric={primaryMetric} setCurA={isActive?setCurA:null} setCurH={isActive?setCurH:null} isActive={isActive}/>
      </div>

      {/* FINALIZE */}
      {isActive&&!meetOver&&(
        <div style={{padding:'10px 14px 0'}}>
          {!confirmEnd?(
            <button onClick={()=>setConfirmEnd(true)} style={{...btn(C.success,'9px 16px',13),width:'100%'}}>End Competition / Finalize</button>
          ):(
            <div style={{background:`${C.success}10`,border:`1px solid ${C.success}44`,borderRadius:10,padding:'12px 14px'}}>
              <div style={{fontSize:13,fontWeight:700,color:C.success,marginBottom:4}}>Thank you — you are about to submit these results for Official Verification.</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Once submitted, scoring will be locked pending review.</div>
              <div style={{display:'flex',gap:8}}>
                <button onClick={()=>{onEnd();setConfirmEnd(false);}} style={{...btn(C.success,'8px 16px',13),flex:1}}>Submit</button>
                <button onClick={()=>setConfirmEnd(false)} style={{...btn(C.card,'8px 16px',13),border:`1px solid ${C.border}`,flex:1}}>Cancel</button>
              </div>
            </div>
          )}
        </div>
      )}

      {/* CLEAR & RESTART */}
      <div style={{padding:'8px 14px 20px'}}>
        {!confirmRestart?(
          <button onClick={()=>setConfirmRestart(true)}
            style={{...btn(C.card,'7px 14px',12),border:`1px solid ${C.border}`,width:'100%',color:C.muted}}>
            ↺ Clear &amp; Restart Competition
          </button>
        ):(
          <div style={{background:'rgba(239,68,68,.08)',border:'1px solid rgba(239,68,68,.3)',borderRadius:10,padding:'12px 14px'}}>
            <div style={{fontSize:13,fontWeight:700,color:'#f87171',marginBottom:4}}>Clear all scores and restart?</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:10}}>All attempt marks will be erased. Athletes and heights are kept.</div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>{onRestart();setConfirmRestart(false);}}
                style={{...btn('#dc2626','8px 16px',13),flex:1}}>Yes, clear &amp; restart</button>
              <button onClick={()=>setConfirmRestart(false)}
                style={{...btn(C.card,'8px 16px',13),border:`1px solid ${C.border}`,flex:1}}>Cancel</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── DISPLAY SCREEN ───────────────────────────────────────────────────────────
function DisplayScreen({sc,primaryMetric,updSc}){
  if(!sc)return<div style={{padding:30,textAlign:'center',color:C.muted}}>No active competition — set one up in the Setup tab.</div>;
  const{athletes,heights,info,curH,curA,compStatus,rulebook}=sc;
  const ranked=calcPlacements(athletes,heights);
  const curHt=heights[curH];
  const isActive=compStatus==='active';
  const curAth=isActive&&curA>=0?athletes[curA]:null;
  const curMarks=curAth?(curAth.attempts[curH]||[]):[];
  const alreadyDoneDisplay=curAth?isDone(curMarks,curAth.status):true;
  const attemptNum=alreadyDoneDisplay?curMarks.length:curMarks.length+1;
  const curAthRankD=ranked.find(r=>r.id===curAth?.id);
  const curPlaceD=curAthRankD?.placement??null;
  const curTiedD=curAthRankD?.tied??false;
  const winners=ranked.filter(r=>r.placement===1);
  const winnerBestIdx=winners.length?highestClearedIdx(winners[0],heights.length):-1;
  const winnerBestH=winnerBestIdx>=0?heights[winnerBestIdx]:null;
  const onDeckIdx=isActive&&curA>=0?(sc.isJumpOff?nextVaulterJO(athletes,curH,curA,sc.jumpOffIds||[]):nextVaulter(athletes,curH,curA)):-1;
  const inHoleIdx=onDeckIdx>=0?(sc.isJumpOff?nextVaulterJO(athletes,curH,onDeckIdx,sc.jumpOffIds||[]):nextVaulter(athletes,curH,onDeckIdx)):-1;
  const rbLabel=RULEBOOKS.find(r=>r.key===rulebook)?.label||rulebook||'';
  const genderLabel=info.gender==='M'?"Men's":info.gender==='W'?"Women's":info.gender?'Mixed':'';

  const [dispSubTab,setDispSubTab]=useState('live');
  const handleLogo=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>updSc({info:{...info,logoUrl:ev.target.result}});r.readAsDataURL(f);};

  return(
    <div style={{paddingBottom:30}}>

      {/* ── COMPETITION BANNER ── */}
      <div style={{background:'linear-gradient(135deg,#0f0f1e 0%,#141425 100%)',borderBottom:`1px solid rgba(79,124,255,.18)`,padding:'14px 16px'}}>
        <div style={{display:'flex',alignItems:'center',gap:14}}>

          {/* Logo slot */}
          <div style={{flexShrink:0,position:'relative'}}>
            {info.logoUrl
              ?<img src={info.logoUrl} alt="logo" style={{width:52,height:52,objectFit:'contain',borderRadius:10,border:`1px solid rgba(79,124,255,.25)`}}/>
              :<div style={{width:52,height:52,borderRadius:10,border:`1px dashed rgba(79,124,255,.22)`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'rgba(79,124,255,.04)'}}>
                <span style={{fontSize:20,opacity:.3}}>🏆</span>
              </div>
            }
            <label title="Upload logo" style={{position:'absolute',bottom:-5,right:-5,cursor:'pointer',background:'#1a1a2e',border:`1px solid ${C.border}`,borderRadius:6,padding:'3px 5px',fontSize:9,color:C.muted,lineHeight:1}}>
              📷<input type="file" accept="image/*" onChange={handleLogo} style={{display:'none'}}/>
            </label>
          </div>

          {/* Name + meta */}
          <div style={{flex:1,minWidth:0}}>
            <div className="vd-banner-title" style={{fontWeight:900,fontSize:18,color:'#ffffff',lineHeight:1.1,marginBottom:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{info.name||'Competition'}</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:'2px 8px',fontSize:10.5,color:'rgba(136,136,170,.65)'}}>
              {genderLabel&&<span style={{color:'rgba(199,215,255,.7)',fontWeight:600}}>{genderLabel}</span>}
              {info.venue&&<span>· {info.venue}</span>}
              {info.date&&<span>· {info.date}</span>}
              {rbLabel&&<span>· {rbLabel}</span>}
            </div>
          </div>

          {/* Live / status badge */}
          <div style={{flexShrink:0}}>
            {isActive
              ?<div style={{display:'inline-flex',alignItems:'center',gap:5,padding:'5px 11px',borderRadius:20,background:'rgba(239,68,68,.12)',border:'1px solid rgba(239,68,68,.4)'}}>
                 <span className="live-dot" style={{width:7,height:7,borderRadius:'50%',background:'#ef4444',display:'inline-block',flexShrink:0}}/>
                 <span style={{fontSize:10,fontWeight:800,letterSpacing:1,color:'#ef4444'}}>LIVE</span>
               </div>
              :<div style={{display:'inline-flex',alignItems:'center',gap:5,padding:'5px 11px',borderRadius:20,background:'rgba(136,136,170,.1)',border:'1px solid rgba(136,136,170,.25)'}}>
                 <span style={{fontSize:10,fontWeight:700,letterSpacing:.7,color:'rgba(136,136,170,.7)'}}>{compStatus==='complete-pending'?'PENDING':'OFFICIAL'}</span>
               </div>
            }
          </div>
        </div>
      </div>

      {/* ── DISPLAY SUB-TABS ── */}
      <div style={{display:'flex',background:'#0a0a14',borderBottom:`1px solid rgba(255,255,255,.07)`}}>
        {[['live','▶ Live View'],['leaderboard','☰ Leaderboard']].map(([k,label])=>(
          <button key={k} onClick={()=>setDispSubTab(k)} className="vd-sub-tab" style={{flex:1,padding:'11px 0',fontSize:12,fontWeight:700,color:dispSubTab===k?'#ffffff':C.muted,background:'transparent',border:'none',borderBottom:dispSubTab===k?`2px solid ${C.accent}`:'2px solid transparent',cursor:'pointer',letterSpacing:.3,transition:'color .15s'}}>
            {label}
          </button>
        ))}
      </div>

      {dispSubTab==='live'&&<>
      {/* ── HERO (read-only mirror of Score tab) ── */}
      {isActive&&(
        <div className="vd-now-bar" style={{borderBottom:`1px solid rgba(79,124,255,.2)`,padding:'14px 16px 14px'}}>
          {/* Header label row */}
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
            <span style={{width:8,height:8,borderRadius:'50%',background:sc.isJumpOff?C.warn:C.accent,display:'inline-block',animation:'pulse-ring 1.5s ease-out infinite',flexShrink:0}}/>
            <span style={{fontSize:10,color:sc.isJumpOff?C.warn:'rgba(147,197,253,.85)',fontWeight:800,letterSpacing:1,textTransform:'uppercase'}}>
              {sc.isJumpOff?'⚡ Jump-Off · ':''}{curAth?'Now Vaulting':'Waiting…'}
            </span>
            {curAth&&attemptNum>0&&(
              <span style={{marginLeft:'auto',fontSize:10,color:'rgba(136,136,170,.6)',fontWeight:600,letterSpacing:.4}}>
                Attempt&nbsp;
                {[...Array(3)].map((_,i)=>(
                  <span key={i} className="vd-attempt-dot" style={{background:i<curMarks.length?(curMarks[i]==='O'?'#4ade80':curMarks[i]==='P'?'#f59e0b':'#f87171'):'rgba(136,136,170,.2)',marginLeft:3}}/>
                ))}
              </span>
            )}
          </div>

          <div style={{display:'flex',alignItems:'stretch',gap:0}}>
            {/* Height block */}
            <div style={{flexShrink:0,paddingRight:20,minWidth:106,display:'flex',flexDirection:'column',justifyContent:'center'}}>
              {curHt?(<>
                <div className="vd-hero-ht">{fmtH(curHt,primaryMetric)}</div>
                <div className="vd-hero-ht-alt">{fmtH(curHt,!primaryMetric)}</div>
              </>):<div style={{fontSize:14,color:C.muted}}>—</div>}
            </div>
            <div style={{width:1,alignSelf:'stretch',background:'rgba(79,124,255,.2)',flexShrink:0,marginRight:18,minHeight:60}}/>

            {/* Athlete block */}
            {curAth?(
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:5,minWidth:0}}>
                  <FlagCell athlete={curAth} size={26}/>
                  <div className="vd-hero-name">
                    {curAth.firstName}&nbsp;<span className="vd-hero-lastname">{curAth.lastName}</span>
                  </div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:7,flexWrap:'wrap'}}>
                  {curPlaceD&&<div style={{display:'inline-flex',alignItems:'center',background:'rgba(251,191,36,.12)',border:'1px solid rgba(251,191,36,.3)',borderRadius:5,padding:'2px 8px',fontSize:9,fontWeight:800,color:'#fbbf24',letterSpacing:.4,flexShrink:0}}>{curTiedD?'T-':''}{plLabel(curPlaceD)}</div>}
                  {curAth.affiliation&&<div style={{fontSize:10.5,color:'rgba(136,136,170,.6)'}}>{curAth.affiliation}</div>}
                  {curAth.pb&&<div style={{fontSize:10,color:'rgba(147,197,253,.6)',flexShrink:0}}>PB <span style={{fontWeight:800,color:'rgba(147,197,253,.85)'}}>{curAth.pb}</span></div>}
                  {curAth.sb&&<div style={{fontSize:10,color:'rgba(74,222,128,.6)',flexShrink:0}}>SB <span style={{fontWeight:800,color:'rgba(74,222,128,.8)'}}>{curAth.sb}</span></div>}
                </div>
                {/* Height chips */}
                {heights.length>0&&(
                  <div style={{display:'flex',gap:4,overflowX:'auto',WebkitOverflowScrolling:'touch',paddingBottom:2}}>
                    {heights.map((h,i)=>{
                      const m=curAth.attempts[i]||[];
                      const isCurH=i===curH;
                      const cleared=hasCleared(m);
                      const missed3=countMisses(m)>=3&&!cleared;
                      const passed=hasPassed(m)&&!cleared&&!missed3;
                      const markStr=m.join('');
                      if(!isCurH&&m.length===0)return null;
                      return(
                        <div key={i} style={{textAlign:'center',padding:'3px 7px',borderRadius:6,flexShrink:0,
                          background:isCurH?'rgba(79,124,255,.25)':cleared?'rgba(74,222,128,.12)':missed3?'rgba(248,113,113,.12)':passed?'rgba(245,158,11,.1)':'rgba(255,255,255,.04)',
                          border:isCurH?'1px solid rgba(79,124,255,.55)':cleared?'1px solid rgba(74,222,128,.25)':missed3?'1px solid rgba(248,113,113,.22)':passed?'1px solid rgba(245,158,11,.22)':'1px solid rgba(255,255,255,.06)',
                          boxShadow:isCurH?'0 0 10px rgba(79,124,255,.15)':'none'}}>
                          <div style={{fontSize:8,fontWeight:700,color:isCurH?'rgba(147,197,253,.8)':cleared?'rgba(74,222,128,.65)':missed3?'rgba(248,113,113,.65)':passed?'rgba(245,158,11,.6)':'rgba(136,136,170,.4)',whiteSpace:'nowrap',letterSpacing:.3}}>{fmtH(h,primaryMetric)}</div>
                          <div style={{fontSize:11,fontWeight:900,color:cleared?'#4ade80':missed3?'#f87171':passed?'#f59e0b':markStr?'#93c5fd':isCurH?'rgba(255,255,255,.3)':'rgba(136,136,170,.2)'}}>{markStr||(isCurH?'…':'—')}</div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            ):<div style={{flex:1,color:C.muted,fontSize:13,display:'flex',alignItems:'center'}}>No active vaulter</div>}
          </div>
        </div>
      )}

      {/* ── ON DECK / IN HOLE ── */}
      {isActive&&onDeckIdx>=0&&(
        <div style={{display:'flex',background:'rgba(10,10,20,.8)',borderBottom:`1px solid rgba(255,255,255,.06)`}}>
          {athletes[onDeckIdx]&&(
            <div className="vd-ondeck" style={{flex:1,padding:'7px 14px',fontSize:11.5,borderRight:`1px solid rgba(255,255,255,.06)`,display:'flex',alignItems:'center',gap:7}}>
              <span style={{background:'rgba(245,158,11,.18)',border:'1px solid rgba(245,158,11,.35)',color:'#f59e0b',fontSize:8,fontWeight:800,letterSpacing:.8,padding:'2px 6px',borderRadius:4,flexShrink:0}}>NEXT</span>
              <span style={{color:'rgba(245,158,11,.9)',fontWeight:700}}><span style={{textTransform:'uppercase',letterSpacing:.3}}>{athletes[onDeckIdx].lastName}</span> {athletes[onDeckIdx].firstName}</span>
            </div>
          )}
          {inHoleIdx>=0&&athletes[inHoleIdx]&&(
            <div className="vd-ondeck" style={{flex:1,padding:'7px 14px',fontSize:11.5,display:'flex',alignItems:'center',gap:7}}>
              <span style={{background:'rgba(136,136,170,.1)',border:'1px solid rgba(136,136,170,.25)',color:'rgba(136,136,170,.7)',fontSize:8,fontWeight:800,letterSpacing:.8,padding:'2px 6px',borderRadius:4,flexShrink:0}}>ON HOLD</span>
              <span style={{color:'rgba(136,136,170,.75)',fontWeight:600}}><span style={{textTransform:'uppercase',letterSpacing:.3}}>{athletes[inHoleIdx].lastName}</span> {athletes[inHoleIdx].firstName}</span>
            </div>
          )}
        </div>
      )}

      {/* ── WINNER HERO (when competition finished) ── */}
      {!isActive&&winners.length>0&&(
        <div style={{background:'linear-gradient(135deg,rgba(251,191,36,.09) 0%,rgba(251,191,36,.04) 100%)',borderBottom:`1px solid rgba(251,191,36,.2)`,padding:'16px 16px 14px'}}>
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:13}}>
            <span style={{fontSize:14}}>🏆</span>
            <span style={{fontSize:10,color:'rgba(251,191,36,.8)',fontWeight:800,letterSpacing:1,textTransform:'uppercase'}}>{winners.length>1?'Co-Champions':'Champion'}</span>
          </div>
          <div style={{display:'flex',alignItems:'stretch',gap:0}}>
            {/* Winning height */}
            <div style={{flexShrink:0,paddingRight:18,minWidth:106,display:'flex',flexDirection:'column',justifyContent:'center'}}>
              {winnerBestH?(
                <>
                  <div className="vd-hero-ht" style={{color:'#fbbf24'}}>{fmtH(winnerBestH,primaryMetric)}</div>
                  <div className="vd-hero-ht-alt" style={{color:'rgba(251,191,36,.4)'}}>{fmtH(winnerBestH,!primaryMetric)}</div>
                </>
              ):<div style={{fontSize:14,color:C.muted}}>NH</div>}
            </div>
            <div style={{width:1,alignSelf:'stretch',background:'rgba(251,191,36,.25)',flexShrink:0,marginRight:18,minHeight:60}}/>
            {/* Winner(s) */}
            <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:10}}>
              {winners.map(w=>(
                <div key={w.id}>
                  <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:3,minWidth:0}}>
                    <FlagCell athlete={w} size={26}/>
                    <div className="vd-hero-name">
                      {w.firstName}&nbsp;<span className="vd-hero-lastname">{w.lastName}</span>
                    </div>
                  </div>
                  <div style={{display:'flex',gap:8,fontSize:10.5,flexWrap:'wrap'}}>
                    {w.affiliation&&<span style={{color:'rgba(136,136,170,.6)'}}>{w.affiliation}</span>}
                    {w.pb&&<span style={{color:'rgba(147,197,253,.6)'}}>PB <span style={{fontWeight:800,color:'rgba(147,197,253,.85)'}}>{w.pb}</span></span>}
                    {w.sb&&<span style={{color:'rgba(74,222,128,.6)'}}>SB <span style={{fontWeight:800,color:'rgba(74,222,128,.8)'}}>{w.sb}</span></span>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ── RESULTS TABLE (rolling sort when active) ── */}
      <div style={{paddingBottom:0}}>
        <ResultsTable athletes={athletes} ranked={ranked} heights={heights} curH={curH} curA={isActive?curA:-1} primaryMetric={primaryMetric} isActive={isActive}/>
      </div>
      </>}

      {/* ── LEADERBOARD VIEW ── */}
      {dispSubTab==='leaderboard'&&(
        <div style={{padding:'10px 12px 30px'}}>
          {ranked.length===0&&<div style={{padding:40,textAlign:'center',color:C.muted,fontSize:13}}>No results yet — competition hasn't started.</div>}
          {ranked.map((ath,rowI)=>{
            const isCV=ath.id===curAth?.id;
            const bestIdx=highestClearedIdx(ath,heights.length);
            const bestH=bestIdx>=0?heights[bestIdx]:null;
            const pl=ath.placement;
            const tied=ath.tied;
            const medal=pl===1?'🥇':pl===2?'🥈':pl===3?'🥉':null;
            const plStr=pl?(tied?`T-${plLabel(pl)}`:plLabel(pl)):ath.status==='dns'?'DNS':'NH';
            const plColor=pl===1?'#fbbf24':pl===2?'rgba(209,213,219,.8)':pl===3?'#f97316':C.muted;
            const chipHeights=heights.map((h,i)=>({h,i,m:ath.attempts[i]||[]})).filter(({m,i})=>m.length>0||(isCV&&i===curH));
            return(
              <div key={ath.id} className="vd-lb-card" style={{
                background:isCV?'rgba(79,124,255,.1)':pl===1?'rgba(251,191,36,.05)':C.card,
                border:`1px solid ${isCV?'rgba(79,124,255,.45)':pl===1?'rgba(251,191,36,.2)':C.border}`,
                boxShadow:isCV?'0 0 18px rgba(79,124,255,.12)':pl===1?'0 2px 12px rgba(251,191,36,.06)':'none'
              }}>
                {/* Top row */}
                <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px 0'}}>
                  {/* Place / medal */}
                  <div style={{flexShrink:0,width:32,textAlign:'center'}}>
                    {medal
                      ?<span style={{fontSize:22,lineHeight:1}}>{medal}</span>
                      :<span style={{fontSize:13,fontWeight:800,color:plColor,fontVariantNumeric:'tabular-nums'}}>{plStr}</span>
                    }
                  </div>
                  <FlagCell athlete={ath} size={22}/>
                  {/* Name */}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:800,fontSize:14,color:isCV?'#ffffff':C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:5}}>
                      <span>{ath.firstName} <span style={{textTransform:'uppercase',letterSpacing:.2}}>{ath.lastName}</span></span>
                      {isCV&&<span style={{fontSize:8,fontWeight:800,color:C.accent,background:`${C.accent}22`,borderRadius:4,padding:'1px 5px',flexShrink:0,letterSpacing:.6,border:`1px solid ${C.accent}44`}}>NOW</span>}
                    </div>
                    {ath.affiliation&&<div style={{fontSize:9.5,color:'rgba(136,136,170,.5)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ath.affiliation}</div>}
                  </div>
                  {/* Best height */}
                  <div style={{flexShrink:0,textAlign:'right'}}>
                    {bestH?(
                      <>
                        <div style={{fontSize:16,fontWeight:900,color:pl===1?'#fbbf24':C.success,letterSpacing:-.5,lineHeight:1}}>{fmtH(bestH,primaryMetric)}</div>
                        <div style={{fontSize:9,color:'rgba(136,136,170,.45)',marginTop:1}}>{fmtH(bestH,!primaryMetric)}</div>
                      </>
                    ):<span style={{fontSize:11,color:'rgba(136,136,170,.4)'}}>{ath.status==='dns'?'DNS':'NH'}</span>}
                  </div>
                </div>
                {/* Height chips */}
                {chipHeights.length>0&&(
                  <div style={{display:'flex',gap:3,padding:'7px 12px 10px',overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
                    {chipHeights.map(({h,i,m})=>{
                      const cleared=hasCleared(m);
                      const miss3=countMisses(m)>=3&&!cleared;
                      const pas=hasPassed(m)&&!cleared&&!miss3;
                      const isCurH=isCV&&i===curH;
                      const markStr=m.join('');
                      return(
                        <div key={i} style={{textAlign:'center',padding:'3px 6px',borderRadius:5,flexShrink:0,
                          background:isCurH?'rgba(79,124,255,.2)':cleared?'rgba(74,222,128,.1)':miss3?'rgba(248,113,113,.1)':pas?'rgba(245,158,11,.1)':'rgba(255,255,255,.03)',
                          border:isCurH?'1px solid rgba(79,124,255,.45)':cleared?'1px solid rgba(74,222,128,.2)':miss3?'1px solid rgba(248,113,113,.2)':pas?'1px solid rgba(245,158,11,.22)':'1px solid rgba(255,255,255,.06)'}}>
                          <div style={{fontSize:7.5,fontWeight:700,whiteSpace:'nowrap',letterSpacing:.2,color:isCurH?'rgba(147,197,253,.75)':cleared?'rgba(74,222,128,.65)':miss3?'rgba(248,113,113,.65)':pas?'rgba(245,158,11,.6)':'rgba(136,136,170,.35)'}}>{fmtH(h,primaryMetric)}</div>
                          <div style={{fontSize:10.5,fontWeight:900,color:cleared?'#4ade80':miss3?'#f87171':pas?'#f59e0b':markStr?'#93c5fd':isCurH?'rgba(255,255,255,.3)':'rgba(136,136,170,.18)'}}>{markStr||(isCurH?'…':'—')}</div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── HISTORY SCREEN ───────────────────────────────────────────────────────────
function HistoryScreen({saved,onResume,onReview,onDelete,primaryMetric}){
  if(!saved.length)return<div style={{padding:40,textAlign:'center',color:C.muted,fontSize:14}}>No saved competitions</div>;
  return(
    <div style={{padding:14,paddingBottom:30}}>
      <div style={{fontSize:11,color:C.muted,marginBottom:14,textTransform:'uppercase',letterSpacing:1,fontWeight:700}}>All Competitions ({saved.length})</div>
      <div style={{display:'grid',gap:10}}>
        {[...saved].reverse().map(comp=>{
          const{athletes=[],heights=[],info={},compStatus,sc}=comp;
          const c=sc||comp;
          const cAthletes=c.athletes||athletes;
          const cHeights=c.heights||heights;
          const cInfo=c.info||info;
          const ranked=calcPlacements(cAthletes,cHeights);
          const top3=ranked.filter(r=>r.placement&&r.placement<=3).slice(0,3);
          const isActive=c.compStatus==='active'||compStatus==='active';
          return(
            <div key={comp.id||comp.compId} style={{background:C.surface,borderRadius:14,padding:'14px 16px',border:`1px solid ${isActive?C.accent:C.border}`}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:10}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:15}}>{cInfo.name||'Unnamed Meet'}</div>
                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>
                    {[cInfo.date,cInfo.venue,RULEBOOKS.find(r=>r.key===c.rulebook)?.label].filter(Boolean).join(' · ')}
                  </div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2}}>{cAthletes.length} athletes · {cHeights.length} heights</div>
                </div>
                {isActive&&<span style={{fontSize:9,background:`${C.accent}22`,color:C.accent,borderRadius:6,padding:'2px 8px',fontWeight:700,border:`1px solid ${C.accent}55`}}>LIVE</span>}
              </div>
              {top3.length>0&&(
                <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
                  {top3.map((a,i)=>{
                    const best=highestClearedIdx(a,cHeights.length);
                    return(
                      <div key={a.id} style={{display:'flex',alignItems:'center',gap:6,background:C.card,borderRadius:8,padding:'5px 10px',border:`1px solid ${C.border}`}}>
                        <span style={{fontSize:14}}>{i===0?'🥇':i===1?'🥈':'🥉'}</span>
                        <FlagCell athlete={a} size={16}/>
                        <span style={{fontSize:12,fontWeight:700}}>{a.firstName} {a.lastName}</span>
                        {best>=0&&<span style={{fontSize:11,color:C.success}}>{fmtH(cHeights[best],primaryMetric)}</span>}
                      </div>
                    );
                  })}
                </div>
              )}
              {c.compId&&(()=>{
                const base=`${window.location.origin}${window.location.pathname}`;
                const dispUrl=`${base}#/display/${c.compId}`;
                const scoreUrl=c.scorerToken?`${base}#/score/${c.compId}/${c.scorerToken}`:null;
                return(
                  <div style={{marginBottom:10,display:'flex',flexDirection:'column',gap:4}}>
                    {[{label:'📺 Display',url:dispUrl},{label:'📊 Scorer',url:scoreUrl}].filter(r=>r.url).map(r=>(
                      <div key={r.label} style={{display:'flex',alignItems:'center',gap:6}}>
                        <span style={{fontSize:9,color:C.muted,width:54,flexShrink:0}}>{r.label}</span>
                        <span style={{fontSize:9,color:C.muted,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontFamily:'monospace',background:C.card,padding:'2px 6px',borderRadius:4,border:`1px solid ${C.border}`}}>{r.url}</span>
                        <button onClick={()=>navigator.clipboard.writeText(r.url).catch(()=>{})} style={{...btn(C.card,'2px 8px',9),border:`1px solid ${C.border}`,flexShrink:0}}>Copy</button>
                      </div>
                    ))}
                  </div>
                );
              })()}
              <div style={{display:'flex',gap:8}}>
                {isActive&&<button onClick={()=>onResume(comp)} style={btn(C.accent,'7px 14px',13)}>Resume</button>}
                <button onClick={()=>onReview(comp)} style={{...btn(C.card,'7px 14px',13),border:`1px solid ${C.border}`}}>Review</button>
                <button onClick={()=>onDelete(comp.id||comp.compId)} style={{...btn('#7f1d1d','7px 14px',13),marginLeft:'auto'}}>Delete</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── RULES TAB ────────────────────────────────────────────────────────────────
function RulesTab(){
  const[activeRB,setActiveRB]=useState('WA');
  const[activeCat,setActiveCat]=useState(null);
  const[search,setSearch]=useState('');
  const rbData=RULES_DATA[activeRB];
  const q=search.trim().toLowerCase();
  // Flatten with category info
  const allSections=useMemo(()=>rbData.categories.flatMap(cat=>
    cat.sections.map(s=>({...s,category:cat.name,catIcon:cat.icon}))
  ),[activeRB]);
  const filtered=useMemo(()=>allSections.filter(s=>{
    if(activeCat&&s.category!==activeCat)return false;
    if(q.length>=2)return s.title.toLowerCase().includes(q)||s.text.toLowerCase().includes(q)||s.rule.toLowerCase().includes(q)||s.category.toLowerCase().includes(q);
    return true;
  }),[allSections,activeCat,q]);
  return(
    <div style={{padding:14,maxWidth:640,margin:'0 auto',paddingBottom:40}}>
      {/* Rulebook selector */}
      <div style={{display:'flex',gap:2,marginBottom:12,background:C.surface,borderRadius:10,padding:3,border:`1px solid ${C.border}`}}>
        {RULEBOOKS.map(r=>(
          <button key={r.key} onClick={()=>{setActiveRB(r.key);setActiveCat(null);setSearch('');}}
            style={{...btn(activeRB===r.key?C.accent:C.surface,'7px 0',12),flex:1,borderRadius:8,border:'none'}}>
            {r.key}
          </button>
        ))}
      </div>
      {/* Category filter pills */}
      <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:10}}>
        <button onClick={()=>setActiveCat(null)}
          style={{...btn(activeCat===null?C.accent:C.card,'4px 10px',11),border:`1px solid ${activeCat===null?C.accent:C.border}`}}>
          All ({allSections.length})
        </button>
        {rbData.categories.map(cat=>{
          const cnt=cat.sections.length;
          const active=activeCat===cat.name;
          return(
            <button key={cat.name} onClick={()=>setActiveCat(active?null:cat.name)}
              style={{...btn(active?C.accent:C.card,'4px 10px',11),border:`1px solid ${active?C.accent:C.border}`}}>
              {cat.icon} {cat.name.replace('Equipment — ','')} ({cnt})
            </button>
          );
        })}
      </div>
      {/* Search */}
      <div style={{position:'relative',marginBottom:10}}>
        <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:14,pointerEvents:'none'}}>🔍</span>

// ─── EDIT OVERLAY ──────────────────────────────────────────────────────────────
function EditOverlay({sc,updSc,onClose}){
  const{athletes,heights,rulebook,editingId}=sc;
  const setEditingId=id=>updSc({editingId:id});
  const updAthlete=(id,ch)=>updSc({athletes:athletes.map(a=>a.id===id?{...a,...ch}:a)});
  const delAthlete=id=>updSc({athletes:athletes.filter(a=>a.id!==id)});
  const moveAthlete=(id,dir)=>{
    const idx=athletes.findIndex(a=>a.id===id);
    const nIdx=idx+dir;
    if(nIdx<0||nIdx>=athletes.length)return;
    const next=[...athletes];[next[idx],next[nIdx]]=[next[nIdx],next[idx]];
    updSc({athletes:next});
  };
  const reorder=(from,to)=>{
    const next=[...athletes];
    const[moved]=next.splice(from,1);next.splice(to,0,moved);
    updSc({athletes:next});
  };
  const setOrder=(id,n)=>updSc({athletes:athletes.map(a=>a.id===id?{...a,order:n}:a)});
  const addAthlete=()=>{const a=mkAthlete(athletes.length+1);updSc({athletes:[...athletes,a]});};
  // Height editing — CRITICAL: pass array directly, not functional updater
  const setHeights=h=>updSc({heights:h});
  const updateHeight=(i,v)=>{const cm=Math.round(parseFloat(v)*100);if(!isNaN(cm))updSc({heights:heights.map((h,j)=>j===i?cm:h)});};
  const primaryMetric=rulebook!=='NFHS';
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.85)',zIndex:500,display:'flex',flexDirection:'column'}}>
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'12px 16px',display:'flex',alignItems:'center',gap:10}}>
        <div style={{fontWeight:800,fontSize:16,flex:1}}>Edit Competition</div>
        <button onClick={onClose} style={btn(C.accent,'7px 16px',13)}>Done</button>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:14,paddingBottom:30}}>
        <div style={sec}>
          <div style={secTit}>Athletes</div>
          <div style={{fontSize:11,color:C.muted,marginBottom:8}}>Edit inline. ▼ for advanced options. Drag ☰ to reorder.</div>
          <AthleteList athletes={athletes} editingId={editingId} setEditingId={setEditingId} updAthlete={updAthlete} delAthlete={delAthlete} moveAthlete={moveAthlete} reorder={reorder} setOrder={setOrder} rulebook={rulebook}/>
          <button onClick={addAthlete} style={{...btn(C.success,'8px 16px',13),marginTop:10}}>+ Add Athlete</button>
        </div>
        <div style={sec}>
          <div style={secTit}>Heights</div>
          <HeightEditor heights={heights} setHeights={setHeights} updateHeight={updateHeight} primaryMetric={primaryMetric}/>
        </div>
      </div>
    </div>
  );
}

// ─── LIVE DASHBOARD ───────────────────────────────────────────────────────────
function LiveDashboard({savedComps,sc,onResumeComp,onDeleteComp,primaryMetric,liveCompKey,setLiveCompKey,liveSubTab,setLiveSubTab,athletes,ranked,heights,curH,setCurH,curA,setCurA,recordMark,undoMark,live,onDeck,inHole,compStatus,info,rulebook,isJumpOff,startJumpOff,onEnd,onEditSetup,onRestart,updSc}){
  const[confirmDeleteId,setConfirmDeleteId]=useState(null);
  const activeSaved=savedComps.filter(comp=>{
    const c=comp.sc||comp;
    const cId=c.compId||comp.compId;
    const isAct=(c.compStatus==='active'||comp.compStatus==='active');
    return isAct&&cId!==sc?.compId;
  });
  const currentIsActive=sc&&(sc.compStatus==='active'||sc.compStatus==='complete-pending');

  // ── Drilled into a specific competition ────────────────────────────────────
  if(liveCompKey&&sc){
    return(
      <div style={{display:'flex',flexDirection:'column',minHeight:'100%'}}>
        {/* Back bar + sub-tab switcher */}
        <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'8px 14px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          <button onClick={()=>setLiveCompKey(null)} style={{...btn(C.card,'5px 10px',11),border:`1px solid ${C.border}`}}>← Live</button>

          <span style={{fontWeight:800,fontSize:14,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{sc.info?.name||'Competition'}</span>
          <div style={{display:'flex',gap:2,background:C.card,borderRadius:8,padding:2,border:`1px solid ${C.border}`,flexShrink:0}}>
            <button onClick={()=>setLiveSubTab('score')} style={{...btn(liveSubTab==='score'?C.accent:C.card,'4px 10px',11),borderRadius:6,border:'none'}}>📊 Score</button>
            <button onClick={()=>setLiveSubTab('display')} style={{...btn(liveSubTab==='display'?C.accent:C.card,'4px 10px',11),borderRadius:6,border:'none'}}>📺 Display</button>
          </div>
        </div>
        {liveSubTab==='score'&&(
          <ScoringScreen athletes={athletes} ranked={ranked} heights={heights} curH={curH} setCurH={setCurH} curA={curA} setCurA={setCurA} primaryMetric={primaryMetric} recordMark={recordMark} undoMark={undoMark} live={live} onDeck={onDeck} inHole={inHole} compStatus={compStatus} info={info} rulebook={rulebook} isJumpOff={isJumpOff} startJumpOff={startJumpOff} onEnd={onEnd} onEditSetup={onEditSetup} onRestart={onRestart}/>
        )}

          <DisplayScreen sc={sc} primaryMetric={primaryMetric} updSc={updSc}/>

    );
  }

  // ── Competition list ───────────────────────────────────────────────────────
  const activeList=[
    ...(currentIsActive?[{_cur:true,compId:sc.compId,sc}]:[]),
    ...activeSaved,
  ];

  if(!activeList.length)return(
    <div style={{padding:40,textAlign:'center',color:C.muted,display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
      <div style={{fontSize:40}}>📡</div>
      <div style={{fontWeight:700,fontSize:16,color:C.text}}>No Live Competitions</div>
      <div style={{fontSize:13,lineHeight:1.6,maxWidth:280,color:C.muted}}>Start a new competition in the Setup tab.</div>
    </div>
  );

  return(
    <div style={{padding:14,paddingBottom:30}}>
      <div style={{fontSize:11,color:C.muted,marginBottom:14,textTransform:'uppercase',letterSpacing:1,fontWeight:700}}>
        Live Now · {activeList.length} {activeList.length===1?'Competition':'Competitions'}
      </div>
      <div style={{display:'grid',gap:10}}>
        {activeList.map(comp=>{
          const c=comp.sc||comp;
          const cAthletes=c.athletes||[];
          const cHeights=c.heights||[];
          const cInfo=c.info||{};
          const cRulebook=c.rulebook;
          const cCompId=comp.compId||(c.compId);
          const cCurH=c.curH||0;
          const curHCm=cHeights[cCurH];
          const cRanked=calcPlacements(cAthletes,cHeights);
          const top3=cRanked.filter(r=>r.placement&&r.placement<=3).slice(0,3);
          const openComp=(subTab)=>{if(!comp._cur)onResumeComp(comp);setLiveCompKey(cCompId);setLiveSubTab(subTab);};
          return(
            <div key={cCompId} style={{background:C.surface,borderRadius:14,padding:'14px 16px',border:`1px solid ${C.accent}44`}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:top3.length?10:8}}>
                <div style={{flex:1}}>

                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>
                    {[cInfo.date,cInfo.venue,RULEBOOKS.find(r=>r.key===cRulebook)?.label].filter(Boolean).join(' · ')}

                  <div style={{fontSize:11,color:C.muted,marginTop:3}}>
                    {cAthletes.length} athletes{curHCm?` · Bar: ${fmtH(curHCm,primaryMetric)}`:''}

                <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
                  {top3.map((a,i)=>{

                    return(
                      <div key={a.id} style={{display:'flex',alignItems:'center',gap:6,background:C.card,borderRadius:8,padding:'5px 10px',border:`1px solid ${C.border}`}}>

                  <button onClick={()=>setConfirmDeleteId(null)} style={{...btn(C.card,'5px 12px',12),border:`1px solid ${C.border}`}}>Cancel</button>
                  <button onClick={()=>{onDeleteComp(cCompId,!!comp._cur);setConfirmDeleteId(null);}} style={btn(C.danger,'5px 12px',12)}>Yes, abandon</button>
                </div>
              ):(
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  <button onClick={()=>openComp('score')} style={btn(C.accent,'7px 14px',13)}>📊 Score</button>
                  <button onClick={()=>openComp('display')} style={{...btn(C.card,'7px 14px',13),border:`1px solid ${C.border}`}}>📺 Display</button>
                  <div style={{flex:1}}/>
                  <button onClick={()=>setConfirmDeleteId(cCompId)} style={{...btn(C.card,'7px 10px',12),border:`1px solid ${C.danger}44`,color:C.danger}} title="Abandon this competition">🗑</button>
                </div>
              )}
              {cCompId&&(()=>{
                const base=`${window.location.origin}${window.location.pathname}`;
                const dispUrl=`${base}#/display/${cCompId}`;
                const scoreUrl=c.scorerToken?`${base}#/score/${cCompId}/${c.scorerToken}`:null;
                return(
                  <div style={{borderTop:`1px solid ${C.border}`,paddingTop:8,display:'flex',flexDirection:'column',gap:4}}>
                    {[{label:'📺 Display',url:dispUrl},{label:'📊 Scorer',url:scoreUrl}].filter(r=>r.url).map(r=>(
                      <div key={r.label} style={{display:'flex',alignItems:'center',gap:6}}>
                        <span style={{fontSize:9,color:C.muted,width:54,flexShrink:0}}>{r.label}</span>
                        <span style={{fontSize:9,color:C.muted,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontFamily:'monospace',background:C.card,padding:'2px 6px',borderRadius:4,border:`1px solid ${C.border}`}}>{r.url}</span>
                        <button onClick={e=>{e.stopPropagation();navigator.clipboard.writeText(r.url).catch(()=>{});}} style={{...btn(C.card,'2px 8px',9),border:`1px solid ${C.border}`,flexShrink:0}}>Copy</button>
                      </div>
                    ))}
                  </div>
                );
              })()}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── LOGIN SCREEN ─────────────────────────────────────────────────────────────
function LoginScreen(){
  const[email,setEmail]=useState('');
  const[pw,setPw]=useState('');
  const[mode,setMode]=useState('login');
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState('');
  const[isErr,setIsErr]=useState(false);
  const submit=async()=>{
    if(!email.trim()||!pw)return;
    setLoading(true);setMsg('');setIsErr(false);
    try{
      if(mode==='login'){
        const{error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
        if(error)throw error;
      }else{
        const{data,error}=await sb.auth.signUp({email:email.trim(),password:pw});
        if(error)throw error;
        if(!data.session){setMsg('Check your email to confirm your account, then sign in.');setMode('login');setLoading(false);return;}
      }
    }catch(e){setMsg(e.message||'Authentication failed');setIsErr(true);}
    setLoading(false);
  };
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:24,background:C.bg}}>
      <div style={{fontWeight:900,fontSize:28,letterSpacing:-.5,marginBottom:6}}><span style={{color:C.accent}}>Vault</span>Desk</div>
      <div style={{fontSize:12,color:C.muted,marginBottom:32,letterSpacing:.5}}>ADMIN PORTAL</div>
      <div style={{background:C.surface,borderRadius:14,border:`1px solid ${C.border}`,padding:28,width:'100%',maxWidth:340,display:'flex',flexDirection:'column',gap:14}}>
        <div style={{fontSize:13,fontWeight:700,textAlign:'center',marginBottom:2}}>{mode==='login'?'Sign In':'Create Admin Account'}</div>
        <input type="email" placeholder="Email address" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} style={{...inp,width:'100%'}}/>
        <input type="password" placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} style={{...inp,width:'100%'}}/>
        {msg&&<div style={{fontSize:12,color:isErr?C.danger:C.success,textAlign:'center',lineHeight:1.4}}>{msg}</div>}
        <button onClick={submit} disabled={loading} style={{...btn(C.accent,'11px',14),opacity:loading?.6:1}}>
          {loading?'…':mode==='login'?'Sign In':'Create Account'}
        </button>
        <button onClick={()=>{setMode(m=>m==='login'?'register':'login');setMsg('');}} style={{...btn('transparent','6px',11),color:C.muted,border:'none',textDecoration:'underline'}}>
          {mode==='login'?'New here? Create an account →':'Already have an account? Sign in →'}
        </button>
      </div>
    </div>
  );
}

        );

  );
}

              <span style={{fontWeight:700,fontSize:14,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.name||'Untitled'}</span>

              {confirmDel===c.slug?(

                <button onClick={()=>doDelete(c.slug)} style={btn(C.danger,'3px 8px',11)}>Yes</button>
