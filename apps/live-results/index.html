const getFlagUrl=code=>{if(!code)return null;const u=code.toUpperCase().trim();const iso=IOC_ISO[u]||(u.length===2?u.toLowerCase():null);return iso?`https://flagcdn.com/24x18/${iso}.png`:null};
const resolveCountry=input=>{if(!input)return null;const u=input.toUpperCase().trim();if(IOC_ISO[u])return u;const lower=input.toLowerCase().trim();if(COUNTRY_NAMES[lower])return COUNTRY_NAMES[lower];const match=Object.keys(COUNTRY_NAMES).find(k=>k.startsWith(lower));return match?COUNTRY_NAMES[match]:null};
const getCountrySuggestions=q=>{if(!q||q.length<2)return[];const lower=q.toLowerCase().trim();const upper=q.toUpperCase().trim();const results=[];Object.keys(IOC_ISO).filter(k=>k.startsWith(upper)).slice(0,3).forEach(k=>results.push({code:k,label:k}));Object.keys(COUNTRY_NAMES).filter(k=>k.startsWith(lower)&&!results.find(r=>r.code===COUNTRY_NAMES[k])).slice(0,5).forEach(k=>results.push({code:COUNTRY_NAMES[k],label:k}));return results.slice(0,6)};
const parsePaste=text=>{const r={};const pb=text.match(/(?:PB|PR|Personal\s+(?:Best|Record))[:\s]+([0-9]+[''\-.][0-9]*(?:\s*[0-9]+\/[0-9]+)?(?:m|in)?)/i);const sb=text.match(/(?:SB|Season(?:al)?\s+(?:Best|Record))[:\s]+([0-9]+[''\-.][0-9]*(?:\s*[0-9]+\/[0-9]+)?(?:m|in)?)/i);const cc=text.match(/\b([A-Z]{3})\b/g);if(pb)r.pb=pb[1].trim();if(sb)r.sb=sb[1].trim();if(cc){const k=cc.find(c=>IOC_ISO[c]);if(k)r.country=k;}return r};
const mToFtIn=m=>{const ti=m*39.3701,ft=Math.floor(ti/12),raw=ti%12;const q=Math.round(raw*4)/4,whole=Math.floor(q),frac=q-whole;return`${ft}'${whole}${frac===0?'':frac===.25?'¼':frac===.5?'½':'¾'}"`};
const fmtH=(cm,metric)=>{if(!cm&&cm!==0)return'';return metric?`${(cm/100).toFixed(2)}m`:mToFtIn(cm/100)};

// parseHeight: accepts "5.00" (meters), "11-6" or "11'6" (feet-inches), or "500" (cm>=100)
const parseHeight=str=>{
  if(!str)return NaN;
  str=String(str).trim();
  const ftIn=str.match(/^(\d+)[-' ]\s*(\d+)/);
  if(ftIn)return Math.round((parseInt(ftIn[1])*12+parseInt(ftIn[2]))*2.54);
  const n=parseFloat(str);
  if(!isNaN(n)&&n>=100)return Math.round(n); // assume cm
  if(!isNaN(n)&&n<20)return Math.round(n*100); // assume meters
  return NaN;
};

const hasCleared=m=>Array.isArray(m)&&m.includes('O');
const hasRetired=m=>Array.isArray(m)&&m.includes('R');
const hasPassed=m=>Array.isArray(m)&&m.includes('P');
const countMisses=m=>Array.isArray(m)?m.filter(x=>x==='X'||x==='R').length:0;
const TERMINAL=['dns','retired','nh'];
const isDone=(marks,status)=>TERMINAL.includes(status)||hasCleared(marks)||marks.length>=3||hasRetired(marks)||hasPassed(marks);
const isNH=marks=>marks.length>=3&&!hasCleared(marks);

const highestClearedIdx=(a,n)=>{for(let i=n-1;i>=0;i--)if(hasCleared(a.attempts[i]))return i;return-1};
const totalMisses=(a,n)=>{let t=0;for(let i=0;i<n;i++)t+=countMisses(a.attempts[i]||[]);return t};

const calcPlacements=(athletes,heights)=>{
  const n=heights.length;
  const dns=athletes.filter(a=>a.status==='dns');
  const out=athletes.filter(a=>a.status!=='dns'&&highestClearedIdx(a,n)<0);
  const withH=athletes.filter(a=>highestClearedIdx(a,n)>=0);
  const sorted=[...withH].sort((a,b)=>{
    const ai=highestClearedIdx(a,n),bi=highestClearedIdx(b,n);
    if(bi!==ai)return bi-ai;
    const am=countMisses(a.attempts[ai]||[]),bm=countMisses(b.attempts[bi]||[]);
    if(am!==bm)return am-bm;
    return totalMisses(a,n)-totalMisses(b,n);
  });
  const result=[];let place=1;
  for(let i=0;i<sorted.length;i++){
    let p=place;
    if(i>0){
      const pr=sorted[i-1],cr=sorted[i];
      const pi=highestClearedIdx(pr,n),ci=highestClearedIdx(cr,n);
      if(pi===ci&&countMisses(pr.attempts[pi]||[])===countMisses(cr.attempts[ci]||[])&&totalMisses(pr,n)===totalMisses(cr,n))p=result[i-1].placement;
    }
    result.push({...sorted[i],placement:p});
    place=Math.max(place,i+2);
  }
  for(let i=0;i<result.length;i++)result[i].tied=result.some((r,j)=>j!==i&&r.placement===result[i].placement);
  return[...result,...out.map(a=>({...a,placement:null,tied:false})),...dns.map(a=>({...a,placement:null,tied:false}))];
};

const nextVaulter=(athletes,hIdx,fromIdx)=>{const n=athletes.length;for(let s=1;s<=n;s++){const idx=(fromIdx+s)%n;if(!isDone(athletes[idx].attempts[hIdx]||[],athletes[idx].status))return idx;}return-1};
const firstEligible=(athletes,hIdx)=>{for(let i=0;i<athletes.length;i++)if(!isDone(athletes[i].attempts[hIdx]||[],athletes[i].status))return i;return-1};

// genHeights — maxH=6 by default (expandable to 10 in editor)
const genHeights=(startStr,incStr,maxH=6)=>{
  const startCm=parseHeight(startStr);
  if(isNaN(startCm))return[];
  const rules=[];
  for(const part of incStr.split(',').map(s=>s.trim())){
    const m=part.match(/(\d+(?:\.\d+)?)\s*cm(?:\s*[x×]\s*(\d+))?/i);
    if(m)rules.push({cm:parseFloat(m[1]),count:m[2]?parseInt(m[2]):99});
  }
  const hs=[startCm];let cur=startCm;
  for(const{cm,count}of rules){for(let i=0;i<count;i++){cur+=cm;hs.push(cur);if(hs.length>=maxH)return hs;}}
  return hs;
};
const parseManual=str=>str.split(/[,\s]+/).map(s=>parseHeight(s)).filter(n=>!isNaN(n)).slice(0,10);

const parseAthleteCSV=text=>{
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return[];
  const first=lines[0].toLowerCase();
  const hasHeader=first.includes('name')||first.includes('first')||first.includes('last')||first.includes('country');
  const dataLines=hasHeader?lines.slice(1):lines;
  return dataLines.map(line=>{
    const cols=line.split(/[,\t;]/).map(c=>c.trim().replace(/^["']|["']$/g,''));
    if(cols.length>=2){
      let idx=0;if(!isNaN(cols[0]))idx=1;
      const firstName=cols[idx]||'';const lastName=cols[idx+1]||'';
      const country=cols.find(c=>IOC_ISO[c.toUpperCase()])?cols.find(c=>IOC_ISO[c.toUpperCase()]).toUpperCase():'';
      const affiliation=cols[idx+2]&&!IOC_ISO[cols[idx+2].toUpperCase()]?cols[idx+2]:'';
      const heightCols=cols.filter(c=>/^\d+[\.''-]/.test(c)&&c!==firstName&&c!==lastName);
      let pb='',sb='';
      if(heightCols.length===1){sb=heightCols[0];}
      else if(heightCols.length>=2){
        const sorted=[...heightCols].sort((a,b)=>{const pa=parseHeight(a),pb_=parseHeight(b);return(isNaN(pa)?0:pa)-(isNaN(pb_)?0:pb_);});
        sb=sorted[0];pb=sorted[sorted.length-1];
      }
      return{firstName,lastName,country,affiliation,pb,sb};
    }
    return null;
  }).filter(Boolean);
};

const buildResultsCSV=(athletes,heights,ranked,info,primaryMetric)=>{
  const n=heights.length;
  const headers=['Order','Place','First','Last','Country','Affiliation','PB','SB','Best',...heights.map((h,i)=>`H${i+1} ${fmtH(h,primaryMetric)}`)];
  const rows=[...ranked].sort((a,b)=>{
    if(a.placement&&b.placement)return a.placement-b.placement;
    if(a.placement)return-1;if(b.placement)return 1;
    return(a.order||0)-(b.order||0);
  }).map(ath=>{
    const best=highestClearedIdx(ath,n);
    const pl=ath.placement?(ath.tied?ath.placement+'=':ath.placement):(ath.status==='dns'?'DNS':'NH');
    return[ath.order,pl,ath.firstName,ath.lastName,ath.country,ath.affiliation,ath.pb,ath.sb,
      best>=0?fmtH(heights[best],primaryMetric):'',
      ...heights.map((_,hi)=>(ath.attempts[hi]||[]).join('')||'')];
  });
  const q=v=>`"${String(v||'').replace(/"/g,'""')}"`;
  return[headers,...rows].map(r=>r.map(q).join(',')).join('\n');
};

  return(
    <div style={{display:'flex',flexDirection:'column',gap:1,...style}}>

function CountryInput({value,onChange,compact=false}){
  const[sugg,setSugg]=useState([]);
  const[open,setOpen]=useState(false);
  const handleChange=e=>{const v=e.target.value;onChange(v);setSugg(getCountrySuggestions(v));setOpen(true);};
  const pick=code=>{onChange(code);setSugg([]);setOpen(false);};
  const handleBlur=()=>setTimeout(()=>setOpen(false),150);
  const style=compact?{...inp,padding:'6px 8px',fontSize:13}:inp;
  return(
    <div style={{position:'relative'}}>
      <input style={style} placeholder={compact?"Country (USA)":"Country — IOC code (USA) or name (Sweden)"} value={value} onChange={handleChange} onFocus={()=>value.length>=2&&setOpen(true)} onBlur={handleBlur}/>

              <FlagCell athlete={{country:s.code}} size={18}/>

          ))}

      )}

  );
}

// ─── INCREMENT STEP BUILDER (Advanced mode) ───────────────────────────────────
function IncStepBuilder({incStr,setIncStr,primaryMetric=true}){
  // Metric: 4 standard options matching the simple picker
  const CM_STEPS=[5,10,15,20];
  // Imperial step options (stored as cm internally, displayed as inches)
  const IMP_STEPS=[
    {cm:7.62,l:'3"'},{cm:10.16,l:'4"'},{cm:15.24,l:'6"'},
    {cm:20.32,l:'8"'},{cm:22.86,l:'9"'},{cm:30.48,l:'12"'},
  ];
  const PRESETS_M=[
    {label:'Standard',str:'10cm x3, 5cm x3, 2cm'},
    {label:'Collegiate',str:'10cm x2, 5cm x3, 2cm'},
    {label:'HS Indoor',str:'10cm x3, 5cm'},
    {label:'5cm Flat',str:'5cm'},
  ];
  const PRESETS_I=[
    {label:'HS Standard',str:'15.24cm x3, 7.62cm x3'},
    {label:'HS Indoor',str:'15.24cm x3, 7.62cm'},
    {label:'3" Flat',str:'7.62cm'},
    {label:'6" Flat',str:'15.24cm'},
  ];
  const PRESETS=primaryMetric?PRESETS_M:PRESETS_I;
  const toSteps=s=>{const r=[];for(const p of(s||'').split(',').map(x=>x.trim())){const m=p.match(/(\d+(?:\.\d+)?)\s*cm(?:\s*[x×]\s*(\d+))?/i);if(m)r.push({cm:parseFloat(m[1]),count:m[2]?parseInt(m[2]):null});}return r.length?r:[{cm:primaryMetric?10:7.62,count:3}]};
  const toStr=steps=>steps.map(s=>`${s.cm}cm${s.count?' x'+s.count:''}`).join(', ');
  const[steps,setSteps]=useState(()=>toSteps(incStr));
  const[manualEntry,setManualEntry]=useState('');
  // Per-step Other input values
  const[stepOtherVals,setStepOtherVals]=useState(()=>steps.map(()=>''));
  const update=ns=>{setSteps(ns);setIncStr(toStr(ns));};
  const addStep=()=>{update([...steps,{cm:primaryMetric?5:7.62,count:null}]);setStepOtherVals(v=>[...v,'']);};
  const removeStep=i=>{update(steps.filter((_,j)=>j!==i));setStepOtherVals(v=>v.filter((_,j)=>j!==i));};
  const setCm=(i,v)=>update(steps.map((s,j)=>j===i?{...s,cm:v}:s));
  const setCount=(i,v)=>update(steps.map((s,j)=>j===i?{...s,count:v}:s));
  const applyStepOther=(i)=>{
    const raw=stepOtherVals[i];if(!raw)return;
    const v=parseFloat(raw);if(isNaN(v)||v<=0)return;
    // inches if value < 36 and imperial mode, otherwise cm
    const cm=(!primaryMetric&&v<36)?parseFloat((v*2.54).toFixed(2)):v;
    setCm(i,cm);
    setStepOtherVals(vals=>vals.map((x,j)=>j===i?'':x));
  };
  // Display label for a cm value — inches when imperial mode
  const getStepLabel=cm=>{
    if(!primaryMetric){
      const match=IMP_STEPS.find(o=>Math.abs(o.cm-cm)<0.1);
      if(match)return match.l;
      return`${parseFloat((cm/2.54).toFixed(2))}"`;
    }
    return`${cm}cm`;
  };
  // Manual entry: convert inch notation → cm ("3" x3" → "7.62cm x3")
  const parseIncEntry=str=>str.replace(/(\d+(?:\.\d+)?)\s*["'']/g,(_,n)=>`${parseFloat((parseFloat(n)*2.54).toFixed(2))}cm`);
  const applyManual=()=>{
    if(!manualEntry.trim())return;
    const converted=parseIncEntry(manualEntry.trim());
    const ns=toSteps(converted);
    if(ns.length)update(ns);
    setManualEntry('');
  };
  const stepOpts=primaryMetric?CM_STEPS.map(c=>({cm:c})):IMP_STEPS;
  return(
    <div>
      <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:10}}>
        {PRESETS.map(p=>(
          <button key={p.label} onClick={()=>{setIncStr(p.str);setSteps(toSteps(p.str));}}
            style={{...btn(C.card,'5px 11px',11),border:`1px solid ${C.border}`}}>{p.label}</button>
        ))}
      </div>
      <div style={{display:'grid',gap:6}}>
        {steps.map((s,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:6,background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:'8px 10px',flexWrap:'wrap'}}>
            <span style={{fontSize:11,color:C.muted,width:18,flexShrink:0}}>#{i+1}</span>
            <div style={{display:'flex',gap:3,flexWrap:'wrap',flex:1,alignItems:'center'}}>
              <span style={{fontSize:11,color:C.muted,marginRight:2}}>Inc:</span>
              {stepOpts.map(o=>(
                <button key={o.cm} onClick={()=>setCm(i,o.cm)}
                  style={{...btn(Math.abs(s.cm-o.cm)<0.1?C.accent:C.surface,'3px 8px',11),border:`1px solid ${Math.abs(s.cm-o.cm)<0.1?C.accent:C.border}`,minWidth:34}}>
                  {getStepLabel(o.cm)}
                </button>
              ))}
              <input style={{...inp,padding:'3px 7px',fontSize:11,width:68}}
                placeholder={primaryMetric?'Other cm':'Other in'}
                value={stepOtherVals[i]||''} onChange={e=>setStepOtherVals(v=>v.map((x,j)=>j===i?e.target.value:x))}
                onBlur={()=>applyStepOther(i)} onKeyDown={e=>{if(e.key==='Enter')applyStepOther(i);}}/>
            </div>
            <div style={{display:'flex',gap:3,alignItems:'center',flexShrink:0}}>
              <span style={{fontSize:11,color:C.muted,marginRight:2}}>×</span>
              {[1,2,3,4,5,null].map(c=>(
                <button key={String(c)} onClick={()=>setCount(i,c)}
                  style={{...btn(s.count===c?C.accent:C.surface,'3px 7px',11),border:`1px solid ${s.count===c?C.accent:C.border}`}}>
                  {c===null?'∞':c}
                </button>
              ))}
            </div>
            {steps.length>1&&<button onClick={()=>removeStep(i)} style={{...btn('#7f1d1d','3px 8px',11),flexShrink:0}}>×</button>}
          </div>
        ))}
      </div>
      {/* Manual entry + Add Step */}
      <div style={{display:'flex',gap:6,alignItems:'center',marginTop:8}}>
        <input style={{...inp,padding:'6px 10px',fontSize:12,flex:1}}
          placeholder={primaryMetric?'Type e.g. 5cm x3, 2cm':'Type e.g. 3" x3, 6" x2'}
          value={manualEntry} onChange={e=>setManualEntry(e.target.value)}
          onBlur={applyManual} onKeyDown={e=>{if(e.key==='Enter')applyManual();}}/>
        <button onClick={addStep} style={{...btn(C.card,'6px 12px',12),border:`1px solid ${C.border}`,flexShrink:0}}>+ Step</button>
      </div>
      <div style={{marginTop:5}}>
        <span style={{fontSize:10,color:C.muted}}>Stored as: {toStr(steps)||'—'}</span>
      </div>
    </div>
  );
}

// ─── SIMPLE INCREMENT PICKER ──────────────────────────────────────────────────
// Both rows always visible; primary row first depends on rulebook (NFHS → imperial first)
function SimpleIncPicker({incStr,setIncStr,primaryMetric}){
  const METRIC_OPTS=[{v:5,l:'5cm'},{v:10,l:'10cm'},{v:15,l:'15cm'},{v:20,l:'20cm'}];
  const IMP_OPTS=[{v:7.62,l:'3"'},{v:15.24,l:'6"'},{v:22.86,l:'9"'},{v:30.48,l:'12"'}];
  const[showAdv,setShowAdv]=useState(false);
  const[other,setOther]=useState('');
  const cmMatch=(incStr||'').match(/^(\d+(?:\.\d+)?)\s*cm$/i);
  const curCm=cmMatch?parseFloat(cmMatch[1]):null;
  const isSelected=v=>curCm!==null&&Math.abs(curCm-v)<0.1;
  const pick=cm=>{setIncStr(`${cm}cm`);setOther('');};
  const applyOther=()=>{
    const v=parseFloat(other);
    if(!isNaN(v)&&v>0){
      // When imperial primary (NFHS), values < 36 assumed inches; otherwise cm
      const cm=(!primaryMetric&&v<36)?v*2.54:v;
      setIncStr(`${parseFloat(cm.toFixed(2))}cm`);
    }
  };
  const rowStyle={display:'flex',gap:5,alignItems:'center',marginBottom:5};
  const lblStyle={fontSize:10,color:C.muted,width:22,flexShrink:0,fontWeight:700};
  // NFHS: imperial row on top; WA/NCAA: metric row on top
  const[topOpts,topLbl,botOpts,botLbl]=primaryMetric
    ?[METRIC_OPTS,'m',IMP_OPTS,'in']
    :[IMP_OPTS,'in',METRIC_OPTS,'m'];
  return(
    <div>
      <div style={rowStyle}>
        <span style={lblStyle}>{topLbl}</span>
        {topOpts.map(o=>(
          <button key={o.v} onClick={()=>pick(o.v)}
            style={{...btn(isSelected(o.v)?C.accent:C.card,'7px 14px',13),border:`1px solid ${isSelected(o.v)?C.accent:C.border}`,minWidth:48}}>
            {o.l}
          </button>
        ))}
      </div>
      <div style={{...rowStyle,marginBottom:8}}>
        <span style={lblStyle}>{botLbl}</span>
        {botOpts.map(o=>(
          <button key={o.v} onClick={()=>pick(o.v)}
            style={{...btn(isSelected(o.v)?C.accent:C.card,'7px 14px',13),border:`1px solid ${isSelected(o.v)?C.accent:C.border}`,minWidth:48}}>
            {o.l}
          </button>
        ))}
        <input style={{...inp,padding:'6px 9px',fontSize:12,flex:1,minWidth:80}}
          placeholder={primaryMetric?'Other (cm)':'Other (in or cm)'}
          value={other} onChange={e=>setOther(e.target.value)}
          onBlur={applyOther}
          onKeyDown={e=>{if(e.key==='Enter')applyOther();}}/>
      </div>
      <div style={{fontSize:10,color:C.muted,marginBottom:6}}>Heights stored in cm · 3"=7.62 · 6"=15.24 · 9"=22.86 · 12"=30.48</div>
      <div>
        <button onClick={()=>setShowAdv(a=>!a)}
          style={{...btn(showAdv?C.card:'#1e2a1e','6px 13px',12),border:`1px solid ${showAdv?C.border:'#22c55e55'}`,color:showAdv?C.muted:C.success}}>
          {showAdv?'↑ Hide Advanced Steps':'⚙ Advanced Stepped Increments'}
        </button>
        {!showAdv&&curCm!==null&&<span style={{fontSize:11,color:C.muted,marginLeft:8}}>({curCm}cm uniform)</span>}
      </div>
      {showAdv&&<div style={{marginTop:10}}><IncStepBuilder incStr={incStr} setIncStr={setIncStr} primaryMetric={primaryMetric}/></div>}
    </div>
  );
}

// ─── HEIGHT INPUT — local edit state to allow mid-value typing ────────────────
function HeightInput({h,idx,updateHeight}){
  const[val,setVal]=useState(()=>(h/100).toFixed(2));
  const[editing,setEditing]=useState(false);
  useEffect(()=>{if(!editing)setVal((h/100).toFixed(2));},[h,editing]);
  const commit=()=>{setEditing(false);updateHeight(idx,val);};
  return(
    <input type="text" value={val}
      onChange={e=>{setVal(e.target.value);setEditing(true);}}
      onFocus={()=>setEditing(true)}
      onBlur={commit}
      onKeyDown={e=>{if(e.key==='Enter')commit();}}
      style={{...inp,padding:'5px 8px',fontSize:15,width:90,fontWeight:700}}/>
  );
}

// ─── ATHLETE LIST (pointer-capture drag) ─────────────────────────────────────
function AthleteList({athletes,editingId,setEditingId,updAthlete,delAthlete,moveAthlete,reorder,setOrder,rulebook}){
  const[dragIdx,setDragIdx]=useState(null);
  const[overIdx,setOverIdx]=useState(null);
  const containerRef=useRef(null);
  const dragStateRef=useRef({active:false,from:-1,to:-1});

  const findRowAt=clientY=>{
    const rows=containerRef.current?.querySelectorAll('[data-row-idx]');
    if(!rows)return -1;
    for(const row of rows){const r=row.getBoundingClientRect();if(clientY>=r.top&&clientY<=r.bottom)return parseInt(row.dataset.rowIdx);}
    return -1;
  };
  const onHandlePointerDown=(e,idx)=>{
    e.preventDefault();
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}
    dragStateRef.current={active:true,from:idx,to:idx};
    setDragIdx(idx);
  };
  const onHandlePointerMove=e=>{
    if(!dragStateRef.current.active)return;
    const found=findRowAt(e.clientY);
    if(found!==-1&&found!==dragStateRef.current.to){dragStateRef.current.to=found;setOverIdx(found);}
  };
  const onHandlePointerUp=e=>{
    const{active,from,to}=dragStateRef.current;
    dragStateRef.current={active:false,from:-1,to:-1};
    if(active&&from!==-1&&to!==-1&&from!==to)reorder(from,to);
    setDragIdx(null);setOverIdx(null);
  };

  return(
    <div ref={containerRef} style={{display:'grid',gap:6}}>
      {athletes.map((a,i)=>(
        <div key={a.id} data-row-idx={i}
          draggable onContextMenu={e=>e.preventDefault()}
          onDragStart={e=>{setDragIdx(i);e.dataTransfer.effectAllowed='move';}}
          onDragOver={e=>{e.preventDefault();setOverIdx(i);}}
          onDrop={e=>{e.preventDefault();if(dragIdx!==null&&dragIdx!==i)reorder(dragIdx,i);setDragIdx(null);setOverIdx(null);}}
          onDragEnd={()=>{setDragIdx(null);setOverIdx(null);}}
          className={overIdx===i&&dragIdx!==i?'vd-drag-over':dragIdx===i?'vd-dragging':''}>
          <AthleteRow athlete={a} index={i} total={athletes.length} rulebook={rulebook}
            isEditing={editingId===a.id}
            onEdit={()=>setEditingId(editingId===a.id?null:a.id)}
            onUpdate={ch=>updAthlete(a.id,ch)}
            onDelete={()=>delAthlete(a.id)}
            onUp={()=>moveAthlete(a.id,-1)}
            onDown={()=>moveAthlete(a.id,1)}
            onSetOrder={n=>setOrder(a.id,n)}
            onHandlePointerDown={e=>onHandlePointerDown(e,i)}
            onHandlePointerMove={onHandlePointerMove}
            onHandlePointerUp={onHandlePointerUp}
          />
        </div>
      ))}
    </div>
  );
}

            <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>onUpdate({logoUrl:ev.target.result});r.readAsDataURL(f);}}/>

// ─── SAVE RESULTS DIALOG ──────────────────────────────────────────────────────
function SaveResultsDialog({athletes,heights,ranked,info,primaryMetric,onClose}){
  const[saving,setSaving]=useState(false);
  const[saved,setSaved]=useState(false);
  const doSave=async()=>{
    setSaving(true);
    const csv=buildResultsCSV(athletes,heights,ranked,info,primaryMetric);
    const name=(info.name||'results').replace(/[^a-z0-9]/gi,'_');
    const filename=`${name}_${info.date||'results'}.csv`;
    const blob=new Blob([csv],{type:'text/csv'});
    try{
      if(window.showSaveFilePicker){
        const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'CSV File',accept:{'text/csv':['.csv']}}]});
        const w=await handle.createWritable();await w.write(blob);await w.close();setSaved(true);
      }else throw new Error('fallback');
    }catch(err){
      if(err.name!=='AbortError'){
        const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);setSaved(true);
      }
    }
    setSaving(false);
  };
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:700,display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={onClose}>
      <div style={{background:C.surface,borderRadius:16,padding:24,width:'100%',maxWidth:400,border:`1px solid ${C.border}`}} onClick={e=>e.stopPropagation()}>
        <div style={{fontWeight:800,fontSize:17,marginBottom:8}}>Save Official Results</div>
        <div style={{fontSize:13,color:C.muted,marginBottom:20,lineHeight:1.6}}>Saves a CSV with final results, placements, and all attempts.</div>
        {saved
          ?<div style={{background:`${C.success}22`,borderRadius:10,padding:'12px 16px',marginBottom:16,border:`1px solid ${C.success}44`,fontSize:14,color:C.success,fontWeight:700}}>Results saved successfully</div>
          :<button onClick={doSave} disabled={saving} style={{...btn(C.success,'12px 20px',15),width:'100%',marginBottom:12,opacity:saving?.6:1}}>{saving?'Saving...':'Download Results CSV'}</button>
        }
        <button onClick={onClose} style={{...btn(C.card,'10px 20px',14),width:'100%',border:`1px solid ${C.border}`}}>{saved?'Close':'Cancel'}</button>
      </div>
    </div>
  );
}

// ─── RESULTS TABLE ────────────────────────────────────────────────────────────
function ResultsTable({athletes,ranked,heights,curH,curA,primaryMetric,setCurA,setCurH,compact=false,isActive=true}){
  const n=heights.length;
  if(!n)return null;
  const placementOf=useMemo(()=>{const map={};ranked.forEach(r=>{map[r.id]={pl:r.placement,tied:r.tied};});return map;},[ranked]);
  const displayAthletes=useMemo(()=>{
    if(!isActive)return[...ranked];
    const getSort=a=>{const marks=a.attempts[curH]||[];const done=isDone(marks,a.status);return[a.status==='dns'?3:a.status==='nh'?2:done?1:0,a.order];};
    return[...athletes].sort((a,b)=>{const[ag,ao]=getSort(a);const[bg,bo]=getSort(b);if(ag!==bg)return ag-bg;return ao-bo;});
  },[athletes,ranked,curH,isActive]);
  const getCellContent=(ath,hIdx)=>{
    const m=ath.attempts[hIdx]||[];
    if(ath.status==='dns')return{text:'- -',color:C.muted,bg:'transparent'};
    if(!m.length)return{text:'',color:C.muted,bg:'transparent'};
    const text=m.join('');
    if(hasCleared(m))return{text,color:'#4ade80',bg:C.cleared};
    if(m.length>=3&&!hasCleared(m))return{text,color:'#f87171',bg:C.missed};
    return{text,color:hasPassed(m)?'#60a5fa':C.muted,bg:'transparent'};
  };
  const bestResult=ath=>{const idx=highestClearedIdx(ath,n);return idx>=0?heights[idx]:null};
  return(
    <div style={{overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
      <table style={{borderCollapse:'collapse',fontSize:compact?11:12,width:'100%',minWidth:Math.max(360,280+n*52)+'px'}}>
        <thead>
          <tr style={{background:C.surface,borderBottom:`2px solid ${C.border}`}}>
            <th style={{position:'sticky',left:0,background:C.surface,padding:'7px 5px',textAlign:'center',color:C.muted,width:30,fontSize:9,fontWeight:800,letterSpacing:.5,zIndex:10}}>#</th>
            <th style={{position:'sticky',left:30,background:C.surface,padding:'7px 6px',textAlign:'center',color:C.muted,width:36,fontSize:9,fontWeight:800,letterSpacing:.5,zIndex:10}}>PL</th>
            <th style={{position:'sticky',left:66,background:C.surface,padding:'7px 10px',textAlign:'left',color:C.muted,minWidth:155,fontSize:9,fontWeight:800,letterSpacing:.5,zIndex:10}}>ATHLETE</th>
            <th style={{position:'sticky',left:221,background:C.surface,padding:'7px 5px',textAlign:'center',color:C.muted,width:60,fontSize:9,fontWeight:800,letterSpacing:.5,zIndex:10}}>BEST</th>
            {heights.map((h,i)=>(
              <th key={i} style={{padding:'7px 4px',textAlign:'center',minWidth:52,color:i===curH&&isActive?C.accent:C.muted,fontWeight:i===curH&&isActive?800:600,fontSize:9,letterSpacing:.3,background:i===curH&&isActive?`${C.accent}18`:C.surface}}>
                <div>{fmtH(h,primaryMetric)}</div>
                <div style={{fontSize:8,color:C.muted,marginTop:1,opacity:.7}}>{fmtH(h,!primaryMetric)}</div>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {displayAthletes.map((ath,rowIdx)=>{
            const origIdx=athletes.findIndex(a=>a.id===ath.id);
            const isCur=isActive&&origIdx===curA;
            const plInfo=placementOf[ath.id]||{pl:null,tied:false};
            const best=bestResult(ath);
            const isOut=TERMINAL.includes(ath.status);
            const rowBg=isCur?`${C.accent}12`:rowIdx%2===0?'transparent':`${C.surface}60`;
            const isDoneHere=isDone(ath.attempts[curH]||[],ath.status);
            return(
              <tr key={ath.id} style={{background:rowBg,borderBottom:`1px solid ${C.border}`,borderLeft:isCur?`3px solid ${C.accent}`:'3px solid transparent'}}>
                <td style={{position:'sticky',left:0,background:rowBg,padding:'7px 5px',textAlign:'center',fontWeight:700,fontSize:12,color:isDoneHere?C.muted:C.text}}>{ath.order}</td>
                <td style={{position:'sticky',left:30,background:rowBg,padding:'7px 6px',textAlign:'center',fontWeight:800,fontSize:compact?13:14}}>
                  {plInfo.pl===1?'🥇':plInfo.pl===2?'🥈':plInfo.pl===3?'🥉':plInfo.pl
                    ?<span style={{color:C.muted,fontSize:11}}>{plInfo.pl}{plInfo.tied?'=':''}</span>
                    :<span style={{fontSize:9,color:C.muted}}>{ath.status==='dns'?'DNS':best?'':'NH'}</span>}
                </td>
                <td style={{position:'sticky',left:66,background:rowBg,padding:'7px 10px',minWidth:155}}>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <FlagCell athlete={ath} size={18}/>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:isCur?800:600,fontSize:13,color:isCur?C.accent:isOut?C.muted:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:130,textDecoration:ath.status==='dns'?'line-through':'none'}}>
                        {isCur&&<span style={{fontSize:9,marginRight:3}}>▶</span>}
                        {ath.firstName} {ath.lastName}
                      </div>
                      <div style={{fontSize:9,color:C.muted,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:130}}>
                        {ath.affiliation&&<span>{ath.affiliation}</span>}
                        {(ath.pb||ath.sb)&&<span style={{marginLeft:ath.affiliation?4:0}}>
                          {ath.pb&&<span style={{color:C.accent}}>PB {ath.pb}</span>}
                          {ath.pb&&ath.sb&&<span style={{color:C.muted}}> · </span>}
                          {ath.sb&&<span style={{color:C.success}}>SB {ath.sb}</span>}
                        </span>}
                        {ath.status==='retired'&&<span style={{color:C.warn}}> RET</span>}
                      </div>
                    </div>
                  </div>
                </td>
                <td style={{position:'sticky',left:221,background:rowBg,padding:'7px 5px',textAlign:'center',width:60}}>
                  {best?<DualH cm={best} primaryMetric={primaryMetric} pSize={11} sSize={9} style={{alignItems:'center'}}/>
                       :<span style={{fontSize:9,color:C.muted}}>{ath.status==='dns'?'DNS':isOut&&!best?'NH':''}</span>}
                </td>
                {heights.map((h,hIdx)=>{
                  const{text,color,bg}=getCellContent(ath,hIdx);
                  const isCurCell=isActive&&hIdx===curH&&origIdx===curA;
                  const clickable=ath.status!=='dns'&&ath.status!=='nh';
                  return(
                    <td key={hIdx}
                      onClick={()=>{if(setCurH)setCurH(hIdx);if(clickable&&isActive&&setCurA)setCurA(origIdx);}}
                      style={{padding:'7px 4px',textAlign:'center',fontWeight:700,fontSize:11,letterSpacing:.3,color,background:isCurCell?bg||`${C.accent}0d`:bg,cursor:clickable&&isActive&&setCurA?'pointer':'default',outline:isCurCell?`2px inset ${C.accent}55`:'none'}}>
                      {text}
                    </td>
                  );
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

          <span style={{flex:2,minWidth:60,fontSize:10,color:C.muted,fontWeight:700}}>Last</span>
          <span style={{width:40,fontSize:10,color:C.muted,fontWeight:700,textAlign:'center',flexShrink:0}}>Nat.</span>
          <span style={{width:52,fontSize:10,color:C.accent,fontWeight:700,textAlign:'center',flexShrink:0}}>PB</span>
          <span style={{width:52,fontSize:10,color:C.success,fontWeight:700,textAlign:'center',flexShrink:0}}>SB</span>
          <span style={{fontSize:10,color:C.muted,fontWeight:700,padding:'0 8px',flexShrink:0}}>Edit</span>
          <span style={{fontSize:10,color:C.muted,width:36,textAlign:'center',flexShrink:0}}>↑↓</span>
          <span style={{fontSize:10,color:C.muted,width:20,textAlign:'center',flexShrink:0}}>☰</span>
          <span style={{fontSize:10,color:C.muted,width:20,textAlign:'center',flexShrink:0}}>✕</span>
        </div>
        <AthleteList athletes={athletes} editingId={editingId} setEditingId={setEditingId} updAthlete={updAthlete} delAthlete={delAthlete} moveAthlete={moveAthlete} reorder={reorder} setOrder={setOrder} rulebook={rulebook}/>
        {!athletes.length&&<div style={{textAlign:'center',padding:20,color:C.muted,fontSize:14}}>No athletes — tap + Add</div>}

      <button onClick={startComp}
        style={{...btn(ready?C.success:'#2a2a2a'),width:'100%',padding:15,fontSize:16,borderRadius:14,opacity:ready?1:.45}}>

}

// ─── SCORING SCREEN ───────────────────────────────────────────────────────────
function ScoringScreen({athletes,ranked,heights,curH,setCurH,curA,setCurA,primaryMetric,recordMark,undoMark,live,onDeck,inHole,compStatus,info,rulebook,startJumpOff,onEnd,onEditSetup}){
  const isActive=compStatus==='active';
  const rbCfg=RULEBOOK_CFG[rulebook]||RULEBOOK_CFG.WA;
  const tiedFirst=ranked.filter(r=>r.placement===1&&r.tied);
  const hasFirstTie=tiedFirst.length>=2;
  const showJumpOffBanner=!isActive&&hasFirstTie;
  const curAth=athletes[curA];
  const meetOver=useMemo(()=>{
    if(!isActive||!heights.length)return false;
    for(let h=curH;h<heights.length;h++){if(firstEligible(athletes,h)!==-1)return false;}
    return true;
  },[athletes,heights,curH,isActive]);
  const curHt=heights[curH];
  const curMarks=curAth?(curAth.attempts[curH]||[]):[];
  const attemptNum=curMarks.length+1;
  const alreadyDone=curAth?isDone(curMarks,curAth.status):true;

  const MARKS=[
    {mark:'O',bg:C.success,symbol:'✓',label:'Clear'},
    {mark:'X',bg:C.danger,symbol:'✗',label:'Miss'},
    {mark:'P',bg:'#2563eb',symbol:'P',label:'Pass'},
    {mark:'R',bg:C.warn,symbol:'R',label:'Retire'},
    {mark:'DNS',bg:'#374151',symbol:'—',label:'DNS'},
  ];

  return(
    <div style={{paddingBottom:20}}>
      {/* COMPETITION HEADER */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'8px 14px'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
          <div style={{minWidth:0}}>
            {info.name&&<div style={{fontWeight:800,fontSize:14,color:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{info.name}</div>}
            <div style={{fontSize:10,color:C.muted,marginTop:1,display:'flex',gap:6,flexWrap:'wrap'}}>
              {info.date&&<span>{info.date}</span>}
              {info.startTime&&<span>· {info.startTime}</span>}
              {info.venue&&<span>· {info.venue}</span>}
              {rulebook&&<span>· {RULEBOOKS.find(r=>r.key===rulebook)?.label}</span>}
              {info.gender&&<span>· {info.gender==='M'?"Men's":info.gender==='W'?"Women's":'Mixed'}</span>}
              <span style={{display:'inline-flex',alignItems:'center',gap:3}}>
                · <span className={isActive?'live-dot':''} style={{width:5,height:5,borderRadius:'50%',background:isActive?C.success:C.muted,display:'inline-block'}}/>
                {isActive?'LIVE':compStatus==='complete-pending'?'PENDING':'OFFICIAL'}
              </span>
            </div>
          </div>
          <button onClick={onEditSetup} style={{...btn(C.card,'6px 12px',11),border:`1px solid ${C.border}`,flexShrink:0}}>✏ Edit</button>
        </div>
      </div>

      {/* HERO — hybrid A+C: large height left · divider · athlete info right */}
      <div style={{background:'linear-gradient(135deg,#0b1829 0%,#0e1e38 50%,#0d1520 100%)',borderBottom:`1px solid rgba(79,124,255,.2)`,padding:'14px',position:'relative'}}>
        <div style={{display:'flex',alignItems:'center',gap:0}}>
          {/* Left: large height */}
          <div style={{textAlign:'center',flexShrink:0,paddingRight:14,minWidth:95}}>
            {curHt?(
              <>
                <div style={{fontSize:46,fontWeight:900,color:C.text,letterSpacing:-2,lineHeight:1}}>{fmtH(curHt,primaryMetric)}</div>
                <div style={{fontSize:16,color:'rgba(136,136,170,.7)',fontWeight:600,marginTop:3}}>{fmtH(curHt,!primaryMetric)}</div>
              </>
            ):<div style={{fontSize:14,color:C.muted,lineHeight:'62px'}}>—</div>}
          </div>
          {/* Divider */}
          <div style={{width:1,alignSelf:'stretch',background:'rgba(79,124,255,.35)',flexShrink:0,marginRight:14}}/>
          {/* Right: athlete */}
          {isActive&&curAth?(
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:10,color:'rgba(79,124,255,.65)',fontWeight:700,letterSpacing:.8,textTransform:'uppercase',marginBottom:6}}>Now vaulting · Attempt {attemptNum}{curMarks.length>0?` · ${curMarks.join('')}`:''}</div>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                <FlagCell athlete={curAth} size={26}/>
                <span style={{fontWeight:900,fontSize:21,color:C.accent,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',letterSpacing:-.3}}>{curAth.firstName} {curAth.lastName}</span>
              </div>
              {curAth.affiliation&&<div style={{fontSize:11,color:'rgba(136,136,170,.7)',marginBottom:5}}>{curAth.affiliation}</div>}
              {(curAth.pb||curAth.sb)&&(
                <div style={{display:'flex',gap:12,fontSize:13}}>
                  {curAth.pb&&<span style={{color:'rgba(136,136,170,.8)'}}>PB <span style={{color:C.accent,fontWeight:800}}>{curAth.pb}</span></span>}
                  {curAth.sb&&<span style={{color:'rgba(136,136,170,.8)'}}>SB <span style={{color:C.success,fontWeight:800}}>{curAth.sb}</span></span>}
                </div>
              )}
            </div>
          ):<div style={{flex:1,color:C.muted,fontSize:13,paddingTop:8}}>No active vaulter</div>}
        </div>
        {/* Attempt badge — bottom right */}
        {isActive&&curAth&&(
          <div style={{position:'absolute',bottom:10,right:12,background:'rgba(0,0,0,.45)',border:`1px solid rgba(79,124,255,.25)`,borderRadius:8,padding:'4px 10px',textAlign:'center',minWidth:44}}>
            <div style={{fontSize:9,color:'rgba(136,136,170,.7)',fontWeight:700,letterSpacing:.5,textTransform:'uppercase',lineHeight:1,marginBottom:3}}>Att.</div>
            <div style={{fontSize:22,fontWeight:900,color:C.text,lineHeight:1}}>{attemptNum}</div>
          </div>
        )}
      </div>

      {/* ROTATION — On Deck / In Hole (below hero) */}
      {isActive&&live!==null&&(
        <div style={{padding:'7px 14px',background:C.surface,borderBottom:`1px solid ${C.border}`}}>
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
            {onDeck!==null&&athletes[onDeck]&&<div style={{fontSize:11,color:C.warn,background:`${C.warn}10`,borderRadius:7,padding:'3px 9px',border:`1px solid ${C.warn}30`}}>On deck: {athletes[onDeck].firstName} {athletes[onDeck].lastName}</div>}
            {inHole!==null&&athletes[inHole]&&<div style={{fontSize:11,color:C.muted,background:C.card,borderRadius:7,padding:'3px 9px',border:`1px solid ${C.border}`}}>In hole: {athletes[inHole].firstName} {athletes[inHole].lastName}</div>}
          </div>
        </div>
      )}

      {/* JUMP-OFF BANNER */}
      {showJumpOffBanner&&(
        <div style={{margin:'8px 14px 0',background:`${C.warn}15`,borderRadius:12,padding:'12px 14px',border:`1px solid ${C.warn}44`}}>
          <div style={{fontWeight:800,fontSize:14,color:C.warn,marginBottom:4}}>{rbCfg.tieLabel}</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:10}}>{rbCfg.jumpOffNote}</div>
          {rbCfg.jumpOffRequired&&<button onClick={startJumpOff} style={btn(C.warn,'8px 16px',13)}>Start Jump-Off</button>}
        </div>
      )}

      {/* MEET OVER */}
      {meetOver&&(
        <div style={{margin:'8px 14px 0',background:`${C.success}15`,borderRadius:12,padding:'12px 14px',border:`1px solid ${C.success}44`}}>
          <div style={{fontWeight:800,fontSize:14,color:C.success,marginBottom:6}}>Competition Complete</div>
          <button onClick={onEnd} style={btn(C.success,'8px 16px',13)}>Finalize Results</button>
        </div>
      )}

      {/* MARK BUTTONS */}
      {isActive&&(
        <div style={{padding:'10px 14px 0'}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:7}}>
            {MARKS.map(({mark,bg,symbol,label})=>(
              <button key={mark} onClick={()=>recordMark(mark)} disabled={alreadyDone&&mark!=='DNS'}
                style={{...btn(bg,'10px 0',13),borderRadius:12,flexDirection:'column',gap:2,padding:'12px 0',opacity:alreadyDone&&mark!=='DNS'?.35:1,minHeight:60}}>
                <span style={{fontSize:22,lineHeight:1}}>{symbol}</span>
                <span style={{fontSize:9,letterSpacing:.5,fontWeight:700}}>{label}</span>
              </button>
            ))}
          </div>
          <div style={{display:'flex',gap:8,marginTop:8}}>
            <button onClick={undoMark} style={{...btn(C.card,'8px 14px',12),border:`1px solid ${C.border}`,flex:'0 0 auto',minWidth:90}}>↩ Undo</button>
            <button onClick={onEditSetup} style={{...btn(C.card,'8px 14px',12),border:`1px solid ${C.border}`,flex:1,color:C.muted}}>✎ Edit Athlete / Height Fields</button>
          </div>
        </div>
      )}

      {/* RESULTS TABLE */}
      <div style={{padding:'10px 14px 0'}}>
        <ResultsTable athletes={athletes} ranked={ranked} heights={heights} curH={curH} curA={curA} primaryMetric={primaryMetric} setCurA={isActive?setCurA:null} setCurH={isActive?setCurH:null} isActive={isActive}/>
      </div>

      {/* FINALIZE */}
      {isActive&&!meetOver&&(
        <div style={{padding:'10px 14px 0'}}>
          <button onClick={onEnd} style={{...btn(C.card,'9px 16px',13),border:`1px solid ${C.border}`,width:'100%'}}>End Competition / Finalize</button>
        </div>
      )}
    </div>
  );
}

// ─── DISPLAY SCREEN ───────────────────────────────────────────────────────────

  return(
    <div style={{paddingBottom:30}}>

// ─── HISTORY SCREEN ───────────────────────────────────────────────────────────
function HistoryScreen({saved,onResume,onReview,onDelete,primaryMetric}){
  if(!saved.length)return<div style={{padding:40,textAlign:'center',color:C.muted,fontSize:14}}>No saved competitions</div>;
  return(
    <div style={{padding:14,paddingBottom:30}}>
      <div style={{fontSize:11,color:C.muted,marginBottom:14,textTransform:'uppercase',letterSpacing:1,fontWeight:700}}>Saved Competitions ({saved.length})</div>
      <div style={{display:'grid',gap:10}}>
        {[...saved].reverse().map(comp=>{
          const{athletes=[],heights=[],info={},compStatus,sc}=comp;
          const c=sc||comp;
          const cAthletes=c.athletes||athletes;
          const cHeights=c.heights||heights;
          const cInfo=c.info||info;
          const ranked=calcPlacements(cAthletes,cHeights);
          const top3=ranked.filter(r=>r.placement&&r.placement<=3).slice(0,3);
          const isActive=c.compStatus==='active'||compStatus==='active';
          return(
            <div key={comp.id||comp.compId} style={{background:C.surface,borderRadius:14,padding:'14px 16px',border:`1px solid ${isActive?C.accent:C.border}`}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:10}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:15}}>{cInfo.name||'Unnamed Meet'}</div>
                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>
                    {[cInfo.date,cInfo.venue,RULEBOOKS.find(r=>r.key===c.rulebook)?.label].filter(Boolean).join(' · ')}
                  </div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2}}>{cAthletes.length} athletes · {cHeights.length} heights</div>
                </div>
                {isActive&&<span style={{fontSize:9,background:`${C.accent}22`,color:C.accent,borderRadius:6,padding:'2px 8px',fontWeight:700,border:`1px solid ${C.accent}55`}}>LIVE</span>}
              </div>
              {top3.length>0&&(
                <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
                  {top3.map((a,i)=>{
                    const best=highestClearedIdx(a,cHeights.length);
                    return(
                      <div key={a.id} style={{display:'flex',alignItems:'center',gap:6,background:C.card,borderRadius:8,padding:'5px 10px',border:`1px solid ${C.border}`}}>
                        <span style={{fontSize:14}}>{i===0?'🥇':i===1?'🥈':'🥉'}</span>
                        <FlagCell athlete={a} size={16}/>
                        <span style={{fontSize:12,fontWeight:700}}>{a.firstName} {a.lastName}</span>
                        {best>=0&&<span style={{fontSize:11,color:C.success}}>{fmtH(cHeights[best],primaryMetric)}</span>}
                      </div>
                    );
                  })}
                </div>
              )}
              <div style={{display:'flex',gap:8}}>
                {isActive&&<button onClick={()=>onResume(comp)} style={btn(C.accent,'7px 14px',13)}>Resume</button>}
                <button onClick={()=>onReview(comp)} style={{...btn(C.card,'7px 14px',13),border:`1px solid ${C.border}`}}>Review</button>
                <button onClick={()=>onDelete(comp.id||comp.compId)} style={{...btn('#7f1d1d','7px 14px',13),marginLeft:'auto'}}>Delete</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── RULES TAB ────────────────────────────────────────────────────────────────
function RulesTab(){
  const[activeRB,setActiveRB]=useState('WA');
  const[activeCat,setActiveCat]=useState(null);
  const[search,setSearch]=useState('');
  const rbData=RULES_DATA[activeRB];
  const q=search.trim().toLowerCase();
  // Flatten with category info
  const allSections=useMemo(()=>rbData.categories.flatMap(cat=>
    cat.sections.map(s=>({...s,category:cat.name,catIcon:cat.icon}))
  ),[activeRB]);
  const filtered=useMemo(()=>allSections.filter(s=>{
    if(activeCat&&s.category!==activeCat)return false;
    if(q.length>=2)return s.title.toLowerCase().includes(q)||s.text.toLowerCase().includes(q)||s.rule.toLowerCase().includes(q)||s.category.toLowerCase().includes(q);
    return true;
  }),[allSections,activeCat,q]);
  return(
    <div style={{padding:14,maxWidth:640,margin:'0 auto',paddingBottom:40}}>
      {/* Rulebook selector */}
      <div style={{display:'flex',gap:2,marginBottom:12,background:C.surface,borderRadius:10,padding:3,border:`1px solid ${C.border}`}}>
        {RULEBOOKS.map(r=>(
          <button key={r.key} onClick={()=>{setActiveRB(r.key);setActiveCat(null);setSearch('');}}
            style={{...btn(activeRB===r.key?C.accent:C.surface,'7px 0',12),flex:1,borderRadius:8,border:'none'}}>
            {r.key}
          </button>
        ))}
      </div>
      {/* Category filter pills */}
      <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:10}}>
        <button onClick={()=>setActiveCat(null)}
          style={{...btn(activeCat===null?C.accent:C.card,'4px 10px',11),border:`1px solid ${activeCat===null?C.accent:C.border}`}}>
          All ({allSections.length})
        </button>
        {rbData.categories.map(cat=>{
          const cnt=cat.sections.length;
          const active=activeCat===cat.name;
          return(
            <button key={cat.name} onClick={()=>setActiveCat(active?null:cat.name)}
              style={{...btn(active?C.accent:C.card,'4px 10px',11),border:`1px solid ${active?C.accent:C.border}`}}>
              {cat.icon} {cat.name.replace('Equipment — ','')} ({cnt})
            </button>
          );
        })}
      </div>
      {/* Search */}
      <div style={{position:'relative',marginBottom:10}}>
        <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:14,pointerEvents:'none'}}>🔍</span>
        <input style={{...inp,paddingLeft:36}} placeholder="Search rules, equipment, venue..." value={search} onChange={e=>setSearch(e.target.value)}/>
        {search&&<button onClick={()=>setSearch('')} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:16,padding:0}}>✕</button>}
      </div>
      {/* Count */}
      <div style={{fontSize:11,color:C.muted,marginBottom:10}}>
        {filtered.length} rule{filtered.length!==1?'s':''} · {rbData.name}{activeCat?` · ${activeCat}`:''}
      </div>
      {/* Rule cards */}
      <div style={{display:'grid',gap:8}}>
        {filtered.map((s,i)=>(
          <div key={i} style={{background:C.surface,borderRadius:12,padding:'12px 14px',border:`1px solid ${C.border}`}}>
            <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:7}}>
              <div style={{flex:1}}>
                <div style={{fontSize:9,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:.8,marginBottom:3}}>{s.catIcon} {s.category}</div>
                <div style={{fontWeight:700,fontSize:14,color:C.text,lineHeight:1.3}}>{s.title}</div>
              </div>
              <div style={{background:C.card,borderRadius:6,padding:'2px 8px',fontSize:10,fontWeight:700,color:C.accent,flexShrink:0,border:`1px solid ${C.accent}44`,whiteSpace:'nowrap'}}>{s.rule}</div>
            </div>
            <div style={{fontSize:13,color:C.muted,lineHeight:1.7}}>{s.text}</div>
          </div>
        ))}
        {filtered.length===0&&(
          <div style={{textAlign:'center',padding:30,color:C.muted,fontSize:13}}>No rules match your search</div>
        )}
      </div>
      <div style={{marginTop:20,fontSize:10,color:C.muted,lineHeight:1.6,padding:'10px 12px',background:C.surface,borderRadius:8,border:`1px solid ${C.border}`}}>
        Reference only — always consult the current official rulebook for your governing body. Sources: World Athletics Competition Rules 2024 · NCAA Track &amp; Field Rules 2025–2026 · NFHS Track &amp; Field Rules.
      </div>
    </div>
  );
}

// ─── EDIT OVERLAY ──────────────────────────────────────────────────────────────
function EditOverlay({sc,updSc,onClose}){
  const{athletes,heights,rulebook,editingId}=sc;
  const setEditingId=id=>updSc({editingId:id});
  const updAthlete=(id,ch)=>updSc({athletes:athletes.map(a=>a.id===id?{...a,...ch}:a)});
  const delAthlete=id=>updSc({athletes:athletes.filter(a=>a.id!==id)});
  const moveAthlete=(id,dir)=>{
    const idx=athletes.findIndex(a=>a.id===id);
    const nIdx=idx+dir;
    if(nIdx<0||nIdx>=athletes.length)return;
    const next=[...athletes];[next[idx],next[nIdx]]=[next[nIdx],next[idx]];
    updSc({athletes:next});
  };
  const reorder=(from,to)=>{
    const next=[...athletes];
    const[moved]=next.splice(from,1);next.splice(to,0,moved);
    updSc({athletes:next});
  };
  const setOrder=(id,n)=>updSc({athletes:athletes.map(a=>a.id===id?{...a,order:n}:a)});
  const addAthlete=()=>{const a=mkAthlete(athletes.length+1);updSc({athletes:[...athletes,a]});};
  // Height editing — CRITICAL: pass array directly, not functional updater
  const setHeights=h=>updSc({heights:h});
  const updateHeight=(i,v)=>{const cm=Math.round(parseFloat(v)*100);if(!isNaN(cm))updSc({heights:heights.map((h,j)=>j===i?cm:h)});};
  const primaryMetric=rulebook!=='NFHS';
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.85)',zIndex:500,display:'flex',flexDirection:'column'}}>
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'12px 16px',display:'flex',alignItems:'center',gap:10}}>
        <div style={{fontWeight:800,fontSize:16,flex:1}}>Edit Competition</div>
        <button onClick={onClose} style={btn(C.accent,'7px 16px',13)}>Done</button>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:14,paddingBottom:30}}>
        <div style={sec}>
          <div style={secTit}>Athletes</div>
          <div style={{fontSize:11,color:C.muted,marginBottom:8}}>Edit inline. ▼ for advanced options. Drag ☰ to reorder.</div>
          <AthleteList athletes={athletes} editingId={editingId} setEditingId={setEditingId} updAthlete={updAthlete} delAthlete={delAthlete} moveAthlete={moveAthlete} reorder={reorder} setOrder={setOrder} rulebook={rulebook}/>
          <button onClick={addAthlete} style={{...btn(C.success,'8px 16px',13),marginTop:10}}>+ Add Athlete</button>
        </div>
        <div style={sec}>
          <div style={secTit}>Heights</div>
          <HeightEditor heights={heights} setHeights={setHeights} updateHeight={updateHeight} primaryMetric={primaryMetric}/>
        </div>
      </div>
    </div>
  );
}

// ─── VAULT DESK APP ───────────────────────────────────────────────────────────
function VaultDeskApp(){
  const saved_=useMemo(()=>{try{const s=JSON.parse(localStorage.getItem(LS_CUR)||'{}');return s;}catch{return{}};},[]);
  const[screen,setScreen]=useState(saved_.screen||'setup');
  // primaryMetric: true = metric displayed larger, false = imperial displayed larger
  // Auto-set by rulebook (NFHS → imperial, WA/NCAA → metric), can also init from saved state
  const[primaryMetric,setPrimaryMetric]=useState(saved_.primaryMetric!==undefined?saved_.primaryMetric:true);
  const[su,setSu]=useState(()=>{const d=mkSu();const s=saved_.su;if(!s)return d;return{...d,...s,athletes:Array.isArray(s.athletes)&&s.athletes.length?s.athletes:d.athletes,heights:Array.isArray(s.heights)?s.heights:d.heights,info:{...d.info,...(s.info||{})}};});
  const[sc,setSc]=useState(()=>{if(!saved_.sc)return null;const s=saved_.sc;return{...s,athletes:Array.isArray(s.athletes)?s.athletes:[],heights:Array.isArray(s.heights)?s.heights:[]};});
  const[showEdit,setShowEdit]=useState(false);
  const[showImport,setShowImport]=useState(false);
  const[showSave,setShowSave]=useState(false);
  const[savedComps,setSavedComps]=useState(loadSaved);
  const suRef=useRef(su);const scRef=useRef(sc);
  useEffect(()=>{suRef.current=su;},[su]);
  useEffect(()=>{scRef.current=sc;},[sc]);

  // Auto-set primaryMetric when rulebook changes
  useEffect(()=>{setPrimaryMetric(su.rulebook!=='NFHS');},[su.rulebook]);

  const updSu=useCallback(patch=>setSu(p=>({...p,...patch})),[]);
  const updSc=useCallback(patch=>setSc(p=>p?{...p,...patch}:p),[]);

  useEffect(()=>{saveCurrent({screen,primaryMetric,su,sc});},[screen,primaryMetric,su,sc]);

  // Setup helpers
  const setInfo=useCallback(fn=>updSu({info:fn(suRef.current.info)}),[]);
  const setRulebook=useCallback(rb=>{updSu({rulebook:rb});setPrimaryMetric(rb!=='NFHS');},[]);
  const setStartH=useCallback(v=>updSu({startH:v}),[]);
  const setIncStr=useCallback(v=>updSu({incStr:v}),[]);
  const setManualH=useCallback(v=>updSu({manualH:v}),[]);
  const setDirEmail=useCallback(v=>updSu({dirEmail:v}),[]);
  const doGenHeights=useCallback(()=>{
    const s=suRef.current;
    if(s.manualH.trim()){updSu({heights:parseManual(s.manualH)});return;}
    const hs=genHeights(s.startH,s.incStr,6); // cap at 6 for initial generation
    if(hs.length)updSu({heights:hs});
  },[]);
  // Height editing — CRITICAL: setHeights receives array, not functional updater
  const setHeights=useCallback(h=>updSu({heights:h}),[]);
  const updateHeight=useCallback((i,v)=>{const cm=Math.round(parseFloat(v)*100);if(!isNaN(cm))setSu(p=>({...p,heights:p.heights.map((h,j)=>j===i?cm:h)}));},[]);
  const addAthlete=useCallback(()=>{const a=mkAthlete(suRef.current.athletes.length+1);updSu({athletes:[...suRef.current.athletes,a]});},[]);
  const updAthlete=useCallback((id,ch)=>updSu({athletes:suRef.current.athletes.map(a=>a.id===id?{...a,...ch}:a)}),[]);
  const delAthlete=useCallback(id=>updSu({athletes:suRef.current.athletes.filter(a=>a.id!==id)}),[]);
  const moveAthlete=useCallback((id,dir)=>{const arr=[...suRef.current.athletes];const idx=arr.findIndex(a=>a.id===id);const nIdx=idx+dir;if(nIdx<0||nIdx>=arr.length)return;[arr[idx],arr[nIdx]]=[arr[nIdx],arr[idx]];updSu({athletes:arr});},[]);
  const reorder=useCallback((from,to)=>{const arr=[...suRef.current.athletes];const[m]=arr.splice(from,1);arr.splice(to,0,m);updSu({athletes:arr});},[]);
  const setOrder=useCallback((id,n)=>updSu({athletes:suRef.current.athletes.map(a=>a.id===id?{...a,order:n}:a)}),[]);
  const setEditingId=useCallback(id=>updSu({editingId:id}),[]);

  // Start competition
  const startComp=useCallback(()=>{
    const s=suRef.current;
    const newSc={
      ...s,compStatus:'active',metric:primaryMetric,
      curH:0,curA:firstEligible(s.athletes,0),
      compId:s.compId||`c_${Date.now().toString(36)}`,
    };
    setSc(newSc);updSu(mkSu());setScreen('scoring');
  },[primaryMetric]);

  // Mark recording
  const recordMark=useCallback(mark=>{
    const c=scRef.current;if(!c||c.compStatus!=='active')return;
    const{athletes,heights,curH,curA}=c;
    if(curA<0||curA>=athletes.length)return;
    const ath=athletes[curA];
    if(mark==='DNS'){updSc({athletes:athletes.map((a,i)=>i===curA?{...a,status:'dns',attempts:a.attempts}:a)});const nA=nextVaulter(athletes,curH,curA);updSc({curA:nA});return;}
    const newMarks=[...(ath.attempts[curH]||[]),mark];
    const newAthletes=athletes.map((a,i)=>{
      if(i!==curA)return a;
      const newAtt=[...a.attempts];newAtt[curH]=newMarks;
      let status=a.status;
      if(mark==='R')status='retired';
      // NH only if 3 misses at this height AND zero clears across all heights
      if(isNH(newMarks)&&!newAtt.some(hasCleared))status='nh';
      return{...a,attempts:newAtt,status};
    });
    updSc({athletes:newAthletes});
    // Always advance rotation after any mark (X included) — nextVaulter skips done athletes
    const nA=nextVaulter(newAthletes,curH,curA);
    if(nA!==-1){updSc({curA:nA});return;}
    // No one left at this height — advance height
    let nH=curH+1;
    while(nH<heights.length&&firstEligible(newAthletes,nH)===-1)nH++;
    if(nH<heights.length)updSc({curH:nH,curA:firstEligible(newAthletes,nH)});
    else updSc({curA:-1}); // meet over
  },[]);

  const undoMark=useCallback(()=>{
    const c=scRef.current;if(!c)return;
    const{athletes,curH,curA}=c;
    if(curA<0||curA>=athletes.length)return;
    const ath=athletes[curA];const marks=[...(ath.attempts[curH]||[])];
    if(!marks.length)return;marks.pop();
    const newAthletes=athletes.map((a,i)=>{if(i!==curA)return a;const newAtt=[...a.attempts];newAtt[curH]=marks;return{...a,attempts:newAtt,status:marks.length===0||!marks.includes('R')?'competing':a.status};});
    updSc({athletes:newAthletes});
  },[]);

  const startJumpOff=useCallback(()=>{
    const c=scRef.current;if(!c)return;
    const{athletes,heights}=c;
    const lastH=heights[heights.length-1]||50000;
    const jumpOffH=lastH+5;
    const newHeights=[...heights,jumpOffH];
    const resetAthletes=athletes.map(a=>({...a,status:a.status==='retired'||a.status==='dns'?a.status:'competing'}));
    updSc({heights:newHeights,curH:newHeights.length-1,curA:firstEligible(resetAthletes,newHeights.length-1),athletes:resetAthletes,compStatus:'active'});
  },[]);

  const endCompetition=useCallback(()=>updSc({compStatus:'complete-pending'}),[]);
  const verifyOfficial=useCallback(()=>{
    const c=scRef.current;if(!c)return;
    const snap={...c,compStatus:'official',savedAt:new Date().toISOString()};
    const all=loadSaved();
    const filtered=all.filter(s=>(s.id||s.compId)!==(c.compId));
    saveAll([...filtered,snap]);setSavedComps(loadSaved());
    updSc({compStatus:'official'});
    setShowSave(true);
  },[]);

  const setCurH=useCallback(i=>updSc({curH:i,curA:firstEligible(scRef.current?.athletes||[],i)}),[]);
  const setCurA=useCallback(i=>updSc({curA:i}),[]);
  const onImport=useCallback(rows=>{const newAthletes=rows.map((r,i)=>({...mkAthlete(suRef.current.athletes.length+i+1),...r}));updSu({athletes:[...suRef.current.athletes,...newAthletes]});setShowImport(false);},[]);

  const sc_ranked=sc?calcPlacements(sc.athletes||[],sc.heights||[]):[];
  const live=sc?sc.curA:-1;
  const onDeck=sc&&sc.compStatus==='active'?nextVaulter(sc.athletes||[],sc.curH||0,live):-1;
  const inHole=sc&&sc.compStatus==='active'&&onDeck!==-1?nextVaulter(sc.athletes||[],sc.curH||0,onDeck):-1;

  const TABS=[
    {id:'setup',label:'Setup',icon:'⚙️'},
    {id:'scoring',label:'Score',icon:'📊'},
    {id:'display',label:'Display',icon:'📺'},
    {id:'rules',label:'Rules',icon:'📋'},
    {id:'history',label:'History',icon:'🕐'},
  ];

  return(
    <div style={{maxWidth:700,margin:'0 auto',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      {/* HEADER */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'10px 14px',display:'flex',alignItems:'center',gap:10,position:'sticky',top:0,zIndex:100}}>
        <div style={{fontWeight:900,fontSize:17,letterSpacing:-.5,flex:1}}>
          <span style={{color:C.accent}}>Vault</span>Desk
        </div>
        {sc&&sc.compStatus==='complete-pending'&&<button onClick={verifyOfficial} style={btn(C.success,'6px 12px',12)}>Verify Official</button>}
      </div>

      {/* TOP NAV */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,display:'flex'}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setScreen(t.id)}
            style={{...btn(C.surface,'8px 0',10),flex:1,borderRadius:0,border:'none',flexDirection:'column',gap:2,padding:'7px 0',borderBottom:screen===t.id?`2px solid ${C.accent}`:'2px solid transparent',color:screen===t.id?C.accent:C.muted}}>
            <span style={{fontSize:16}}>{t.icon}</span>
            <span style={{fontSize:9,letterSpacing:.3,fontWeight:700}}>{t.label}</span>
          </button>
        ))}
      </div>

      {/* ACTIVE COMP BANNER (in setup, if a comp is scoring) */}
      {screen==='setup'&&sc&&sc.compStatus==='active'&&(
        <div style={{background:`${C.accent}18`,borderBottom:`1px solid ${C.accent}44`,padding:'8px 14px',display:'flex',alignItems:'center',gap:10}}>
          <span className="live-dot" style={{width:6,height:6,borderRadius:'50%',background:C.accent,display:'inline-block',flexShrink:0}}/>
          <span style={{fontSize:13,fontWeight:700,color:C.accent,flex:1}}>Scoring: {sc.info?.name||'Competition'}</span>
          <button onClick={()=>setScreen('scoring')} style={btn(C.accent,'5px 12px',12)}>Resume →</button>
        </div>
      )}

      {/* CONTENT */}
      <div style={{flex:1,overflowY:'auto'}}>
        {screen==='setup'&&(
          <SetupScreen
            info={su.info} setInfo={setInfo}
            rulebook={su.rulebook} setRulebook={setRulebook}
            athletes={su.athletes} addAthlete={addAthlete}
            updAthlete={updAthlete} delAthlete={delAthlete}
            moveAthlete={moveAthlete} reorder={reorder} setOrder={setOrder}
            editingId={su.editingId} setEditingId={setEditingId}
            startH={su.startH} setStartH={setStartH}
            incStr={su.incStr} setIncStr={setIncStr}
            manualH={su.manualH} setManualH={setManualH}
            doGenHeights={doGenHeights}
            heights={su.heights} setHeights={setHeights} updateHeight={updateHeight}
            primaryMetric={primaryMetric}
            startComp={startComp}
            dirEmail={su.dirEmail} setDirEmail={setDirEmail}
            onImport={()=>setShowImport(true)}
          />
        )}
        {screen==='scoring'&&sc&&(
          <ScoringScreen
            athletes={sc.athletes} ranked={sc_ranked} heights={sc.heights}
            curH={sc.curH} setCurH={setCurH} curA={sc.curA} setCurA={setCurA}
            primaryMetric={primaryMetric}
            recordMark={recordMark} undoMark={undoMark}
            live={live} onDeck={onDeck} inHole={inHole}
            compStatus={sc.compStatus} info={sc.info} rulebook={sc.rulebook}
            startJumpOff={startJumpOff} onEnd={endCompetition}
            onEditSetup={()=>setShowEdit(true)}
          />
        )}
        {screen==='scoring'&&!sc&&<div style={{padding:40,textAlign:'center',color:C.muted}}>No active competition. Set up a competition in the Setup tab.</div>}
        {screen==='display'&&<DisplayScreen sc={sc} primaryMetric={primaryMetric}/>}
        {screen==='rules'&&<RulesTab/>}
        {screen==='history'&&(
          <HistoryScreen
            saved={savedComps}
            primaryMetric={primaryMetric}
            onResume={comp=>{setSc({...comp,...(comp.sc||{})});setScreen('scoring');}}
            onReview={comp=>{setSc({...comp,...(comp.sc||{})});setScreen('display');}}
            onDelete={id=>{deleteComp(id);setSavedComps(loadSaved());}}
          />
        )}
      </div>

      {/* MODALS */}
      {showEdit&&sc&&<EditOverlay sc={sc} updSc={updSc} onClose={()=>setShowEdit(false)}/>}
      {showImport&&<ImportDialog onImport={onImport} onClose={()=>setShowImport(false)}/>}
      {showSave&&sc&&<SaveResultsDialog athletes={sc.athletes} heights={sc.heights} ranked={sc_ranked} info={sc.info} primaryMetric={primaryMetric} onClose={()=>setShowSave(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<VaultDeskApp/>);
</script>
</body>
</html>
